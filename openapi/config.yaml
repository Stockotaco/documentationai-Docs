openapi: "3.0.0"
info:
  version: 1.0.0
  title: Client Config
  description: >
    Tenant configuration served to the SDK at the edge — tags, tag templates,
    snippets, and transformers — as a REST surface on `/client/v1/config`.


    Reads accept an agency key (`ak_`, bind a location with `location_id` or
    the `X-Location-Id` header) or a location secret key (`sk_`); **writes
    require an agency key**. Every write rebuilds the location's edge config
    (the `CFG` KV entry) inline and reports the outcome in a `kv_sync` response
    field — a write that lands in the database but never reaches the edge is
    the failure mode this surface exists to prevent, so a failed sync is
    visible to the caller instead of silent.
servers:
  - url: https://mythic-analytics.gulp.workers.dev
security:
  - BearerAuth: []
paths:
  /client/v1/config/tags:
    get:
      summary: List tag assignments
      operationId: listConfigTags
      description: >-
        Every tag assignment for this location, each with a `template` summary
        of the template it points at.
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Tag assignments
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Tag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      summary: Assign a tag
      operationId: createConfigTag
      description: >
        Assign a tag to this location. `tag_id` is required; `enabled` defaults
        to `true` and `params` to `{}`. Agency key (`ak_`) required. Rebuilds
        the edge config — check `kv_sync`.
      parameters:
        - $ref: "#/components/parameters/LocationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag_id]
              properties:
                tag_id:
                  type: string
                  format: uuid
                  description: >-
                    Id of a tag template from `GET /client/v1/config/tag-templates`:
                    Mythic's catalog or this location's own. Another location's
                    template returns `404 template_not_found`.
                  example: 3f1c2a9e-8d4b-4e7a-9c1f-2b6d8e0a5c47
                enabled: { type: boolean, default: true }
                params:
                  type: object
                  description: Template parameters for this assignment.
                  example: { pixel_id: "1234567890" }
                trigger_rules:
                  $ref: "#/components/schemas/TriggerRules"
      responses:
        "201":
          description: Tag assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/TagAssignment" }
                  kv_sync: { $ref: "#/components/schemas/KvSync" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AgencyRequired" }
        "404": { $ref: "#/components/responses/TemplateNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /client/v1/config/tags/{tagId}:
    patch:
      summary: Update a tag assignment
      operationId: updateConfigTag
      description: >
        Partial update — only the fields you pass change. Accepts `enabled`,
        `params`, `trigger_rules`. Agency key (`ak_`) required. Rebuilds the
        edge config — check `kv_sync`.
      parameters:
        - $ref: "#/components/parameters/TagId"
        - $ref: "#/components/parameters/LocationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                params: { type: object }
                trigger_rules:
                  $ref: "#/components/schemas/TriggerRules"
      responses:
        "200":
          description: Tag assignment updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/TagAssignment" }
                  kv_sync: { $ref: "#/components/schemas/KvSync" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AgencyRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      summary: Remove a tag assignment
      operationId: deleteConfigTag
      description: >
        Remove the tag assignment from this location. The tag stops being
        served to the SDK once the edge config rebuilds. Agency key (`ak_`)
        required.
      parameters:
        - $ref: "#/components/parameters/TagId"
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Tag assignment removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  kv_sync: { $ref: "#/components/schemas/KvSync" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AgencyRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /client/v1/config/tag-templates:
    get:
      summary: List tag templates
      operationId: listConfigTagTemplates
      description: >-
        Every template this location can assign: Mythic's catalog
        (`owner: mythic`, read-only) plus the location's own
        (`owner: location`), sorted by name.
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Tag templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TagTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      summary: Create a tag template
      operationId: createConfigTagTemplate
      description: >-
        Create a template owned by this location. Only this location can see,
        edit, delete or assign it. It does nothing until assigned with
        `POST /client/v1/config/tags`, so there is no edge rebuild and no
        `kv_sync`. Agency key (`ak_`) or an `mcp_` key with `tags:write`
        required.
      parameters:
        - $ref: "#/components/parameters/LocationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagTemplateCreate" }
      responses:
        "201":
          description: Template created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/TagTemplate" }
        "400": { $ref: "#/components/responses/TemplateBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AgencyRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /client/v1/config/tag-templates/{id}:
    get:
      summary: Get a tag template
      operationId: getConfigTagTemplate
      description: One template, including its `src` or `code`. Another location's template returns `404`.
      parameters:
        - $ref: "#/components/parameters/TagTemplateId"
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Tag template
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/TagTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    patch:
      summary: Update a tag template
      operationId: updateConfigTagTemplate
      description: >-
        Partial update of one of this location's own templates. The type rule
        is checked on the stored row after the change, so switching `type`
        needs the matching `src` or `code` in the same request. When the
        template is assigned, the edge config is rebuilt and `kv_sync` reports
        it; otherwise `kv_sync` is `not_assigned`. Agency key (`ak_`) required.
      parameters:
        - $ref: "#/components/parameters/TagTemplateId"
        - $ref: "#/components/parameters/LocationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagTemplateUpdate" }
      responses:
        "200":
          description: Template updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/TagTemplate" }
                  kv_sync:
                    type: string
                    example: synced
                    description: "`synced`, `failed: <reason>`, or `not_assigned` when no assignment uses the template."
        "400": { $ref: "#/components/responses/TemplateBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/TemplateForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      summary: Delete a tag template
      operationId: deleteConfigTagTemplate
      description: >-
        Delete one of this location's own templates. Refused with
        `409 template_in_use` while it is assigned: remove the assignment with
        `DELETE /client/v1/config/tags/{tagId}` first, so a delete never removes
        a live tag from the site. Agency key (`ak_`) required.
      parameters:
        - $ref: "#/components/parameters/TagTemplateId"
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Template deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/TemplateForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`template_in_use` — the template is assigned to this location."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /client/v1/config/workspace:
    get:
      summary: Get the workspace status
      operationId: getConfigWorkspace
      description: >-
        Publishing mode, the latest version, and `changes`: every tag, snippet
        and transformer added, removed or modified since that version. In
        immediate mode with no version recorded yet, `changes` is empty.
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Workspace status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      mode: { $ref: "#/components/schemas/PublishMode" }
                      latest_version:
                        allOf:
                          - $ref: "#/components/schemas/TagConfigVersion"
                        nullable: true
                      has_unpublished_changes: { type: boolean }
                      changes:
                        type: array
                        items: { $ref: "#/components/schemas/ConfigChange" }
                      counts: { $ref: "#/components/schemas/ConfigCounts" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /client/v1/config/publish-mode:
    put:
      summary: Set the publishing mode
      operationId: setConfigPublishMode
      description: >-
        `immediate`: writes go live and record a version automatically.
        `draft`: writes stay in the workspace until `POST /publish`. Switching
        to `draft` records the current config as a version first; switching to
        `immediate` publishes the workspace, drafts included. Agency key (`ak_`)
        required.
      parameters:
        - $ref: "#/components/parameters/LocationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { $ref: "#/components/schemas/PublishMode" }
      responses:
        "200":
          description: Mode set
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      mode: { $ref: "#/components/schemas/PublishMode" }
                      changed: { type: boolean }
                      version: { type: integer, nullable: true }
                      version_created: { type: boolean }
                  kv_sync: { $ref: "#/components/schemas/KvSync" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AgencyRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /client/v1/config/publish:
    post:
      summary: Publish the workspace
      operationId: publishConfig
      description: >-
        Record the workspace (tags, snippets, transformers) as a new version and
        make it live, in either mode. Returns `201` with the new version, or
        `200` with `created: false` when nothing changed since the latest
        version. If the version cannot be recorded, nothing goes live
        (`500 publish_failed`). Agency key (`ak_`) required.
      parameters:
        - $ref: "#/components/parameters/LocationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200, example: Add Hotjar }
                notes: { type: string, maxLength: 2000 }
      responses:
        "200": { $ref: "#/components/responses/Published" }
        "201": { $ref: "#/components/responses/Published" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AgencyRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500":
          description: "`publish_failed` — the version was not recorded and nothing went live."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /client/v1/config/versions:
    get:
      summary: List versions
      operationId: listConfigVersions
      description: >-
        Version history, newest first. Only the 3 most recent versions are
        kept; version numbers keep counting up, so a number is never reused.
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: before
          in: query
          required: false
          description: Return versions older than this number. Pass the previous page's `next_before`.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TagConfigVersion" }
                  retention:
                    type: integer
                    example: 3
                    description: How many of the most recent versions are kept. Older ones are deleted.
                  next_before: { type: integer, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /client/v1/config/versions/{version}:
    get:
      summary: Get a version
      operationId: getConfigVersion
      description: >-
        One version, with `changes` from the previous version, the full
        `snapshot` (disabled rows included) and the `layer` the SDK runs from it.
      parameters:
        - $ref: "#/components/parameters/VersionNumber"
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    allOf:
                      - $ref: "#/components/schemas/TagConfigVersion"
                      - type: object
                        properties:
                          counts: { $ref: "#/components/schemas/ConfigCounts" }
                          changes:
                            type: array
                            nullable: true
                            description: Changes from the previous version. `null` when the previous version was deleted by the 3-version cap.
                            items: { $ref: "#/components/schemas/ConfigChange" }
                          previous_pruned:
                            type: boolean
                            description: True when the previous version no longer exists.
                          snapshot:
                            type: object
                            description: "The workspace at this version: `tags` (each with its `template`), `snippets`, `transformers`."
                          layer:
                            type: object
                            description: "What the SDK runs from this version: enabled `tags`, `snippets`, `transformers`."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /client/v1/config/versions/{version}/restore:
    post:
      summary: Restore a version
      operationId: restoreConfigVersion
      description: >-
        Roll back: rewrite the workspace to this version in one transaction and
        publish it as a new version (`source: restore`). The managed Meta and
        Google tags are not touched. A location's own deleted templates are
        recreated; assignments whose Mythic catalog template no longer exists
        are listed in `skipped_tags`. In draft mode, `publish: false` loads the
        version into the workspace without going live. Agency key (`ak_`)
        required.
      parameters:
        - $ref: "#/components/parameters/VersionNumber"
        - $ref: "#/components/parameters/LocationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                publish: { type: boolean, default: true }
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      restored_from: { type: integer, example: 4 }
                      published: { type: boolean }
                      version: { type: integer, description: "The new version, when published." }
                      created: { type: boolean }
                      skipped_tags:
                        type: array
                        items:
                          type: object
                          properties:
                            tag_id: { type: string, format: uuid }
                            reason: { type: string, enum: [catalog_template_missing, template_not_owned] }
                  kv_sync: { $ref: "#/components/schemas/KvSync" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AgencyRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /client/v1/config/live:
    get:
      summary: Get the live config
      operationId: getConfigLive
      description: >-
        The tags, snippets and transformers the SDK is served right now, which
        version that is, and `in_sync`: whether it matches what should be live
        (the latest version in draft mode, the workspace in immediate mode).
        `in_sync: false` means a rebuild failed or was skipped.
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Live config
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      mode: { $ref: "#/components/schemas/PublishMode" }
                      served_version: { type: integer, nullable: true }
                      latest_version: { type: integer, nullable: true }
                      in_sync: { type: boolean }
                      cfg_updated_at: { type: string, format: date-time, nullable: true }
                      tags: { type: array, items: { type: object } }
                      snippets: { type: array, items: { type: object } }
                      transformers: { type: array, items: { type: object } }
                      managed_tags: { type: array, items: { type: object } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /client/v1/config/firings:
    get:
      summary: List tag firings
      operationId: listConfigFirings
      description: >-
        Firing totals for every tag and snippet in the workspace, from the
        `$tags_fired` property the SDK (3.33+) adds to events. A tag that never
        fired is listed with zeros; a firing of a removed tag or snippet is
        listed with `in_workspace: false`. Sorted by `fires`.
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - $ref: "#/components/parameters/FiringDateFrom"
        - $ref: "#/components/parameters/FiringDateTo"
      responses:
        "200":
          description: Firing totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/FiringSummary" }
                  window: { $ref: "#/components/schemas/FiringWindow" }
        "400": { $ref: "#/components/responses/FiringBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/FiringQueryFailed" }
  /client/v1/config/firings/{kind}/{id}:
    get:
      summary: Get where a tag fired
      operationId: getConfigFiringBreakdown
      description: >-
        Where one tag or snippet fired, grouped by page (host + path), by
        trigger (`page_load` or the event whose trigger rule matched) or by
        day. Each row names its group under the `by` value: `page`,
        `trigger` or `day`.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [tag, snippet] }
        - name: id
          in: path
          required: true
          description: The tag's template id (its `tag_id`) or the snippet id.
          schema: { type: string, format: uuid }
        - name: by
          in: query
          required: false
          schema: { type: string, enum: [page, trigger, day], default: page }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - $ref: "#/components/parameters/LocationId"
        - $ref: "#/components/parameters/FiringDateFrom"
        - $ref: "#/components/parameters/FiringDateTo"
      responses:
        "200":
          description: Breakdown
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        page: { type: string, example: shop.example.com/checkout, description: "Present for by=page." }
                        trigger: { type: string, example: $autocapture, description: "Present for by=trigger." }
                        day: { type: string, example: "2026-09-24", description: "Present for by=day." }
                        fires: { type: integer }
                        sessions: { type: integer }
                        first_fired: { type: string, format: date-time }
                        last_fired: { type: string, format: date-time }
                  kind: { type: string, enum: [tag, snippet] }
                  id: { type: string, format: uuid }
                  by: { type: string, enum: [page, trigger, day] }
                  window: { $ref: "#/components/schemas/FiringWindow" }
        "400": { $ref: "#/components/responses/FiringBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/FiringQueryFailed" }
  /client/v1/config/snippets:
    get:
      summary: List snippets
      operationId: listConfigSnippets
      description: >
        Every custom code snippet for this location. The list omits the `code`
        body — fetch a single snippet to read it.
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Snippets (without `code`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SnippetSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      summary: Create a snippet
      operationId: createConfigSnippet
      description: >
        Create a custom code snippet injected by the SDK. `code` is required.
        Agency key (`ak_`) required. Rebuilds the edge config — check
        `kv_sync`.
      parameters:
        - $ref: "#/components/parameters/LocationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: JavaScript executed by the SDK on matching pages.
                  example: "console.log('hello from mythic');"
                description:
                  type: string
                  example: Debug logger
                enabled: { type: boolean, default: true }
                trigger_rules:
                  $ref: "#/components/schemas/TriggerRules"
      responses:
        "201":
          description: Snippet created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Snippet" }
                  kv_sync: { $ref: "#/components/schemas/KvSync" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AgencyRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /client/v1/config/snippets/{id}:
    get:
      summary: Retrieve a snippet
      operationId: getConfigSnippet
      description: One snippet by id, including its `code` body.
      parameters:
        - $ref: "#/components/parameters/SnippetId"
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: The snippet
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Snippet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    patch:
      summary: Update a snippet
      operationId: updateConfigSnippet
      description: >
        Partial update — only the fields you pass change. Accepts `code`,
        `description`, `enabled`, `trigger_rules`. Agency key (`ak_`)
        required. Rebuilds the edge config — check `kv_sync`.
      parameters:
        - $ref: "#/components/parameters/SnippetId"
        - $ref: "#/components/parameters/LocationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                description: { type: string }
                enabled: { type: boolean }
                trigger_rules:
                  $ref: "#/components/schemas/TriggerRules"
      responses:
        "200":
          description: Snippet updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Snippet" }
                  kv_sync: { $ref: "#/components/schemas/KvSync" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AgencyRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      summary: Delete a snippet
      operationId: deleteConfigSnippet
      description: >
        Permanently delete a snippet. It stops being served to the SDK once
        the edge config rebuilds. Agency key (`ak_`) required.
      parameters:
        - $ref: "#/components/parameters/SnippetId"
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Snippet deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  kv_sync: { $ref: "#/components/schemas/KvSync" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AgencyRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /client/v1/config/transformers:
    get:
      summary: List transformers
      operationId: listConfigTransformers
      description: >
        Every event transformer for this location, ordered by `priority`
        ascending (the order they run at ingestion). The list omits the
        `config` body — fetch a single transformer to read it.
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Transformers (without `config`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TransformerSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      summary: Create a transformer
      operationId: createConfigTransformer
      description: >
        Create an event transformer applied by the SDK to every captured event
        before it is sent. `name`, a valid `type` (`map` or `code`), and a
        complete `config` for that type are required (`map` needs `from` and
        `as`; `code` needs a non-empty `code`); `priority` defaults to `50` and
        `enabled` to `true`. Agency key (`ak_`) required. Rebuilds the edge
        config — check `kv_sync`.
      parameters:
        - $ref: "#/components/parameters/LocationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, config]
              properties:
                name:
                  type: string
                  example: Add page title
                type:
                  type: string
                  enum: [map, code]
                  description: >-
                    `map` evaluates `config.from` (a JavaScript expression) and
                    stores the result at `config.as` in the event properties;
                    `code` runs `config.code` with `(data, mythic)` — mutate
                    `data` and return it, or `return null` to drop the event.
                config:
                  type: object
                  description: Type-specific transformer configuration.
                  example: { from: "document.title", as: "page_title" }
                priority:
                  type: integer
                  default: 50
                  description: Lower runs first.
                enabled: { type: boolean, default: true }
      responses:
        "201":
          description: Transformer created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Transformer" }
                  kv_sync: { $ref: "#/components/schemas/KvSync" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AgencyRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /client/v1/config/transformers/{id}:
    get:
      summary: Retrieve a transformer
      operationId: getConfigTransformer
      description: One transformer by id, including its `config` body.
      parameters:
        - $ref: "#/components/parameters/TransformerId"
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: The transformer
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Transformer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    patch:
      summary: Update a transformer
      operationId: updateConfigTransformer
      description: >
        Partial update — only the fields you pass change. Accepts `name`,
        `type` (`map` or `code`), `config`, `priority`, `enabled`. A `config`
        you pass replaces the stored one wholesale and must be complete for the
        resulting type. Agency key (`ak_`) required. Rebuilds the edge config —
        check `kv_sync`.
      parameters:
        - $ref: "#/components/parameters/TransformerId"
        - $ref: "#/components/parameters/LocationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                type:
                  type: string
                  enum: [map, code]
                config: { type: object }
                priority: { type: integer }
                enabled: { type: boolean }
      responses:
        "200":
          description: Transformer updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Transformer" }
                  kv_sync: { $ref: "#/components/schemas/KvSync" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AgencyRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      summary: Delete a transformer
      operationId: deleteConfigTransformer
      description: >
        Permanently delete a transformer. The SDK stops applying it once the
        edge config rebuilds. Agency key (`ak_`) required.
      parameters:
        - $ref: "#/components/parameters/TransformerId"
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Transformer deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  kv_sync: { $ref: "#/components/schemas/KvSync" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AgencyRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        Agency key (`ak_`) or location secret key (`sk_`). Writes require an
        agency key. Keys are server-side credentials — this surface serves no
        CORS headers on purpose.
        Scoped keys (`mcp_`) are accepted too and need the `tags`, `snippets` or `transformers` family the route belongs to. See [Using an mcp_ key over HTTP](/mcp/authentication).
  parameters:
    LocationId:
      name: location_id
      in: query
      required: false
      description: >-
        Location to scope to. Required for `ak_` keys (or send the
        `X-Location-Id` header); ignored for `sk_`.
      schema: { type: string }
    TagId:
      name: tagId
      in: path
      required: true
      description: The tag template id of the assignment.
      schema: { type: string, format: uuid }
      example: 3f1c2a9e-8d4b-4e7a-9c1f-2b6d8e0a5c47
    FiringDateFrom:
      name: date_from
      in: query
      required: false
      description: ISO date or timestamp. Default 30 days before `date_to`. The window is at most 365 days.
      schema: { type: string }
    FiringDateTo:
      name: date_to
      in: query
      required: false
      description: ISO date or timestamp. Default now.
      schema: { type: string }
    VersionNumber:
      name: version
      in: path
      required: true
      description: Version number (1, 2, 3...).
      schema: { type: integer, minimum: 1 }
    TagTemplateId:
      name: id
      in: path
      required: true
      description: Tag template UUID.
      schema: { type: string, format: uuid }
    SnippetId:
      name: id
      in: path
      required: true
      description: Snippet UUID.
      schema: { type: string, format: uuid }
    TransformerId:
      name: id
      in: path
      required: true
      description: Transformer UUID.
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: >-
        `bad_json` (body is not JSON), `missing_field` (a required field is
        absent), `bad_type` (transformer `type` is not `map` or `code`),
        `bad_config` (an incomplete type-specific transformer config),
        `bad_priority` (priority outside 1–100 or not an integer), or
        `nothing_to_update` (a PATCH with no recognized fields).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid key, or an `ak_` key with no location bound.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    FiringBadRequest:
      description: "`bad_date` (unparseable or reversed window, or over 365 days), `bad_by` or `bad_limit`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    FiringQueryFailed:
      description: "`query_failed` — the analytics query failed."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Published:
      description: "`201` a new version was recorded and is live. `200` nothing changed (`created: false`)."
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: true }
              data:
                type: object
                properties:
                  version: { type: integer, example: 5 }
                  created: { type: boolean }
                  mode: { $ref: "#/components/schemas/PublishMode" }
              kv_sync: { $ref: "#/components/schemas/KvSync" }
    TemplateBadRequest:
      description: >-
        `bad_json`, `bad_body`, `missing_field` (`name`/`type` on create, `src`
        for a `url` template, `code` for an `inline` one), `unknown_field`
        (`id`, `tenant_key` and other non-writable fields), `bad_name`,
        `bad_type` (not `url` or `inline`), `bad_src` (not an absolute `https`
        URL), `bad_code` (over 64 KB), `bad_description`, `bad_trigger_rules`,
        or `nothing_to_update`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TemplateForbidden:
      description: "`agency_required` (an `sk_` key) or `template_read_only` (a Mythic catalog template)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TemplateNotFound:
      description: "`template_not_found` — the template id is not Mythic's catalog or this location's own."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AgencyRequired:
      description: "`agency_required` — writes need an agency key (`ak_`), not a location secret key."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`not_found` — no such row for this location."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: "`rate_limited` — 120 requests/min per location. Retry after the `Retry-After` header."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    KvSync:
      type: string
      example: synced
      description: >-
        Outcome of the inline edge-config rebuild that follows every write.
        `synced` means the location's `CFG` KV entry was rebuilt from database
        truth and the SDK will pick the change up; `failed: <reason>` means
        the database write landed but the edge is still serving the previous
        config — retry the write (any successful write re-syncs everything)
        or rebuild via the admin API. `draft` means the location is in draft
        mode and the write changed the workspace only; it goes live with
        `POST /client/v1/config/publish`. This field exists because tenant-config
        KV sync is not trigger-driven; a write the SDK never sees is the
        failure mode, so a failed sync is reported instead of silent.
    FiringWindow:
      type: object
      properties:
        date_from: { type: string, format: date-time }
        date_to: { type: string, format: date-time }
    FiringSummary:
      type: object
      properties:
        kind: { type: string, enum: [tag, snippet] }
        id: { type: string, description: "The tag's template id or the snippet id." }
        name: { type: string, nullable: true, description: "Template name, or the snippet's description." }
        type: { type: string, nullable: true, enum: [url, inline, meta_pixel, google_tag] }
        enabled: { type: boolean }
        in_workspace: { type: boolean, description: "False for firings of a tag or snippet that has been removed." }
        fires: { type: integer }
        sessions: { type: integer }
        pages: { type: integer, description: Distinct host + path pairs. }
        triggers: { type: integer, description: Distinct triggers. }
        first_fired: { type: string, format: date-time, nullable: true }
        last_fired: { type: string, format: date-time, nullable: true }
    PublishMode:
      type: string
      enum: [immediate, draft]
    TagConfigVersion:
      type: object
      properties:
        version: { type: integer, example: 5 }
        source:
          type: string
          enum: [auto, publish, restore, mode_change]
          description: "`auto` = recorded by a write in immediate mode."
        name: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        created_by:
          type: string
          nullable: true
          description: "`agency`, `mcp:<key prefix>`, `admin`, or null for an internal rebuild."
        restored_from: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
    ConfigChange:
      type: object
      properties:
        kind: { type: string, enum: [tag, snippet, transformer] }
        id: { type: string }
        name: { type: string, nullable: true }
        change: { type: string, enum: [added, removed, modified] }
        fields:
          type: array
          items: { type: string }
          description: "Fields that differ, for `modified`. A template edit shows as `template`."
    ConfigCounts:
      type: object
      properties:
        tags: { type: object, properties: { total: { type: integer }, enabled: { type: integer } } }
        snippets: { type: object, properties: { total: { type: integer }, enabled: { type: integer } } }
        transformers: { type: object, properties: { total: { type: integer }, enabled: { type: integer } } }
    TriggerRules:
      type: object
      nullable: true
      description: >-
        Optional page/condition rules controlling where the tag or snippet
        fires. Omitted or `null` means everywhere.
      example:
        version: 1
        operator: AND
        rules:
          - { type: url_pattern, operator: contains, value: /checkout }
    TagAssignment:
      type: object
      properties:
        tenant_key:
          type: string
          description: The location this assignment belongs to.
          example: loc_abc123
        tag_id: { type: string, format: uuid, example: 3f1c2a9e-8d4b-4e7a-9c1f-2b6d8e0a5c47 }
        enabled: { type: boolean, example: true }
        params:
          type: object
          example: {}
        trigger_rules:
          $ref: "#/components/schemas/TriggerRules"
    Tag:
      allOf:
        - $ref: "#/components/schemas/TagAssignment"
        - type: object
          properties:
            template:
              type: object
              nullable: true
              description: Summary of the assigned template. Returned by the list route.
              properties:
                id: { type: string, format: uuid }
                name: { type: string, example: Hotjar }
                type: { type: string, enum: [url, inline, meta_pixel, google_tag] }
                owner: { type: string, enum: [mythic, location] }
                managed: { type: boolean, example: false }
    TagTemplate:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner:
          type: string
          enum: [mythic, location]
          description: "`mythic` = Mythic's catalog, read-only. `location` = this location's own."
        managed:
          type: boolean
          description: True for `meta_pixel` / `google_tag`, which are connected through the Platform Integrations API.
        name: { type: string, example: Hotjar }
        type: { type: string, enum: [url, inline, meta_pixel, google_tag] }
        src:
          type: string
          nullable: true
          example: https://static.hotjar.com/c/hotjar-1234567.js?sv=6
        code: { type: string, nullable: true }
        description: { type: string, nullable: true }
        trigger_rules:
          $ref: "#/components/schemas/TriggerRules"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true }
    TagTemplateCreate:
      type: object
      required: [name, type]
      description: "`url` requires `src`. `inline` requires `code`."
      properties:
        name: { type: string, maxLength: 200, example: Hotjar }
        type: { type: string, enum: [url, inline] }
        src:
          type: string
          description: Absolute `https` URL, loaded as an async script.
          example: https://static.hotjar.com/c/hotjar-1234567.js?sv=6
        code:
          type: string
          maxLength: 65536
          description: JavaScript run as a `<script>` body. Not HTML.
        description: { type: string, maxLength: 2000 }
        trigger_rules:
          $ref: "#/components/schemas/TriggerRules"
    TagTemplateUpdate:
      type: object
      description: Any subset of the create fields. `src`, `code`, `description` and `trigger_rules` accept `null`.
      properties:
        name: { type: string, maxLength: 200 }
        type: { type: string, enum: [url, inline] }
        src: { type: string, nullable: true }
        code: { type: string, nullable: true, maxLength: 65536 }
        description: { type: string, nullable: true, maxLength: 2000 }
        trigger_rules:
          $ref: "#/components/schemas/TriggerRules"
    SnippetSummary:
      type: object
      description: List shape — `code` is omitted.
      properties:
        id: { type: string, format: uuid }
        tenant_key: { type: string, example: loc_abc123 }
        description: { type: string, nullable: true, example: Debug logger }
        enabled: { type: boolean, example: true }
        trigger_rules:
          $ref: "#/components/schemas/TriggerRules"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Snippet:
      allOf:
        - $ref: "#/components/schemas/SnippetSummary"
        - type: object
          properties:
            code:
              type: string
              example: "console.log('hello from mythic');"
    TransformerSummary:
      type: object
      description: List shape — `config` is omitted.
      properties:
        id: { type: string, format: uuid }
        tenant_key: { type: string, example: loc_abc123 }
        name: { type: string, example: Normalize order value }
        type:
          type: string
          enum: [map, code]
        priority: { type: integer, example: 50 }
        enabled: { type: boolean, example: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Transformer:
      allOf:
        - $ref: "#/components/schemas/TransformerSummary"
        - type: object
          properties:
            config:
              type: object
              description: >-
                `map`: `{ from, as }` — a JS expression and the event property
                its result is stored as. `code`: `{ code }` — JS run with
                `(data, mythic)` per event; mutate `data` and return it, or
                `return null` to drop the event.
              example: { from: "document.title", as: "page_title" }
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: agency_required }
            message: { type: string }
