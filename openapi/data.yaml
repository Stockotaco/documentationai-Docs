openapi: "3.0.0"
info:
  version: 1.0.0
  title: Data
  description: >
    Read-only event analytics and BigQuery export status for agencies.
    Event endpoints are location-scoped; export is agency-wide. Served from
    Mythic Analytics. Person profiles and the identity graph live in the
    People API.
servers:
  - url: https://mythic-analytics.gulp.workers.dev/client/v1/data
security:
  - BearerAuth: []
paths:
  /properties:
    get:
      summary: Property discovery
      operationId: getPropertyCatalog
      description: >
        Every event-property and person-property key observed for the location,
        with an inferred value type, a masked sample value, occurrence and
        distinct-entity counts, and first/last-seen timestamps. Built for
        destination field mapping (`property_mapping`, `custom_data_mapping`,
        webhook `profile.` tokens, Google Ads `value_property`) so those fields
        can be chosen from real data instead of typed blind.


        **When to use it.** Call this before creating a destination: mappings
        match on exact key names, and a key that does not exist fails quietly —
        the delivery succeeds with the field absent rather than raising a
        validation error. Filter `value_type=number` when picking a conversion
        value, since a value that is really the string `"$19.99"` instead of
        `19.99` is the common cause of a conversion recorded as zero. Use
        `entities` to tell a broken mapping from a field few visitors fill in,
        and `order_by=first_seen` / `seen_since` to spot keys that recently
        started or stopped arriving after a site or form change. It is also the
        discovery surface to build a field picker on.


        Backed by a pre-aggregated catalog — one row per key rather than per
        event — so cost does not scale with event volume. For `scope=event`,
        nested objects are exploded one level deep and returned as dot-paths
        (`form_data.email`); `scope=person` returns top-level keys only.


        Sample values are masked at ingestion: emails, phone-shaped values and
        known identity keys are stored as `[email]`, `[phone]` or `[redacted]`,
        and objects/arrays are not sampled at all (`sample_value: null`).
        Non-identifying values are returned verbatim.
      parameters:
        - $ref: "#/components/parameters/LocationIdHeader"
        - $ref: "#/components/parameters/LocationIdQuery"
        - name: scope
          in: query
          description: Restrict to event properties or person properties. Omit for both.
          schema:
            type: string
            enum: [event, person]
        - name: event
          in: query
          description: Restrict `scope=event` rows to a single event name.
          schema: { type: string }
        - name: search
          in: query
          description: Case-insensitive substring match on the property key.
          schema: { type: string }
        - name: value_type
          in: query
          description: Filter by inferred value type. Use `number` to find value fields.
          schema:
            type: string
            enum: [string, number, boolean, object, array, "null"]
        - name: min_occurrences
          in: query
          description: Drop keys seen fewer than N times.
          schema: { type: integer, minimum: 0 }
        - name: seen_since
          in: query
          description: Only keys seen at or after this datetime — hides fields that no longer arrive.
          schema: { type: string, format: date-time }
        - name: order_by
          in: query
          description: Result ordering.
          schema:
            type: string
            enum: [occurrences, key, last_seen, first_seen]
            default: occurrences
        - name: limit
          in: query
          schema: { type: integer, default: 500, minimum: 1, maximum: 1000 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        "200":
          description: Observed property keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  rows: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        scope:
                          type: string
                          enum: [event, person]
                        event:
                          type: string
                          nullable: true
                          description: Event name for `scope=event`; null for person properties.
                        key:
                          type: string
                          description: Property key. Dot-path for nested keys.
                        value_type:
                          type: string
                          description: Inferred type of the most recent value.
                        sample_value:
                          type: string
                          nullable: true
                          description: >
                            Masked example of the most recent value. Null for
                            objects/arrays, which are never sampled.
                        occurrences:
                          type: integer
                          description: Times the key has been seen.
                        entities:
                          type: integer
                          description: >
                            Distinct **event-level ids** that carried the key,
                            not merged people. One person spread across several
                            ids counts more than once, and the catalog only sees
                            keys that arrived on events — so a field the profile
                            learned another way (a CRM webhook path, a backfill)
                            can report far fewer entities than the number of
                            people who actually have it. Use it to judge whether
                            a field is widely used or long-tail; do not use it as
                            a count of customers.
                        first_seen: { type: string, format: date-time }
                        last_seen: { type: string, format: date-time }
        "400":
          $ref: "#/components/responses/LocationRequired"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /events/summary:
    get:
      summary: Event summary
      operationId: getEventsSummary
      description: Aggregated event counts by type for the location over an optional date range.
      parameters:
        - $ref: "#/components/parameters/LocationIdHeader"
        - $ref: "#/components/parameters/LocationIdQuery"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: Event summary rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RowsResponse"
        "400":
          $ref: "#/components/responses/LocationRequired"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /events/daily:
    get:
      summary: Daily events
      operationId: getEventsDaily
      description: Per-day event counts for the location over an optional date range, optionally filtered to one event type.
      parameters:
        - $ref: "#/components/parameters/LocationIdHeader"
        - $ref: "#/components/parameters/LocationIdQuery"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - name: event_type
          in: query
          description: Filter to a single event type.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Daily event rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RowsResponse"
        "400":
          $ref: "#/components/responses/LocationRequired"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /events/trend:
    get:
      summary: Event trend
      operationId: getEventsTrend
      description: >
        Event volume trend for the location. Provide an explicit
        `start_date`/`end_date`, or use `days` to derive a rolling window
        ending today.
      parameters:
        - $ref: "#/components/parameters/LocationIdHeader"
        - $ref: "#/components/parameters/LocationIdQuery"
        - name: start_date
          in: query
          description: Window start date (`YYYY-MM-DD`). Defaults to `days` before today.
          required: false
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          description: Window end date (`YYYY-MM-DD`).
          required: false
          schema:
            type: string
            format: date
        - name: days
          in: query
          description: Rolling window size in days, used when `start_date` is omitted. Default `14`, min `1`, max `365`.
          required: false
          schema:
            type: integer
            default: 14
            minimum: 1
            maximum: 365
      responses:
        "200":
          description: Event trend rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RowsResponse"
        "400":
          $ref: "#/components/responses/LocationRequired"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /events/breakdown:
    get:
      summary: Traffic breakdown by dimension
      operationId: getEventsBreakdown
      description: >
        True pageview volume broken down by a single dimension — the source for
        Top Pages, Devices, Geo, and Sources reports. Reads raw events (not
        Core Web Vitals samples), so counts are honest traffic. Each row is
        `{ value, pageviews, unique_users, unique_sessions }`, ordered by
        `pageviews` descending. `value` is an empty string when the dimension
        is not set on an event. `pageviews` always counts `$pageview` events
        regardless of `event_type`.


        **Segment scoping**: pass `segment_id` (a segment created via the
        Segments API) to count only traffic from that segment's members — e.g.
        top pages read by customers, or by paid-search visitors:


        `GET /client/v1/data/events/breakdown?dimension=page&segment_id=9f4e...`
      parameters:
        - $ref: "#/components/parameters/LocationIdHeader"
        - $ref: "#/components/parameters/LocationIdQuery"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - name: dimension
          in: query
          required: false
          description: Dimension to group by. Defaults to `page`.
          schema:
            type: string
            default: page
            enum:
              - page
              - page_url
              - referrer
              - referring_domain
              - device
              - browser
              - os
              - country
              - utm_source
              - utm_medium
              - utm_campaign
              - utm_content
              - utm_term
        - name: event_type
          in: query
          required: false
          description: Filter to a single event type. Default counts all events.
          schema:
            type: string
        - $ref: "#/components/parameters/SegmentId"
        - name: limit
          in: query
          required: false
          description: Max rows. Default `50`, min `1`, max `1000`.
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Breakdown rows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RowsResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/BreakdownRow"
        "400":
          description: Unknown `dimension` (`invalid_dimension`), or no location bound (`location_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/SegmentNotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /query:
    post:
      summary: Explore query (trend or funnel)
      operationId: exploreQuery
      description: >
        Self-serve analytics over the event stream in one call. A typed spec —
        no raw SQL — is validated, compiled server-side to ClickHouse SQL over
        a wide, typed events table, and scoped to your location by the
        compiler. Sub-second at current scale: a 30-day trend broken down by a
        property reads tens of megabytes where the same question over raw JSON
        properties did not finish.


        **Trend** (`kind: trend`): 1–5 `series`, each an `event` (or `null` for
        any event) × `math` (`total`, `dau`, `unique_sessions`, `sum`, `avg`,
        `min`, `max`, `median`, `p90`, `p95`, `p99`; numeric maths need
        `math_property`), bucketed by `interval` (`hour|day|week|month`) or
        returned as one number per series when `interval` is omitted. Optional
        `breakdown` by any property (top-N by the first series; the rest fold
        into `"$$other"`) and `compare: previous_period` (the immediately
        preceding window of equal length, aligned by bucket index).


        **Funnel** (`kind: funnel`): 2–10 ordered `steps`, a conversion
        `window` (default 7 days, capped at the range), optional `breakdown`
        taken from the first step. Sequential: other events may occur between
        steps. Per-step `users`, `conversion_from_first`,
        `conversion_from_previous`.


        **Properties**: typed names resolve to columns — `$current_url`,
        `$pathname`, `$referring_domain`, `utm_source`, `utm_medium`,
        `utm_campaign`, `$device_type`, `$browser`, `$os`, `$geo_country`,
        `$geo_city`, `$experiment_arm`, plus `event`, `distinct_id`,
        `session_id`, `user_id`. Any other name is a custom event property
        (scalar, ≤200 chars; nested objects and `meta_*` blobs are not
        queryable). `utm_*` and `$referring_domain` are session-entry values
        with an event-level fallback. Discover keys with `GET /properties` and
        values with `GET /query/values`.


        **Semantics**: buckets are UTC and zero-filled; presets resolve to
        `[today-N, today]` inclusive; unique counts are `uniq()` (approximate)
        on `distinct_id`, not resolved persons. Excluded events:
        `$replay_summary`, `$replay_started`, `$heatmap`, `$web_vital_*`,
        `$set`, `$set_once`, `$identify` (each has its own surface).


        **Limits** (`400 invalid_spec`, every problem listed in
        `error.details`): unknown keys rejected, ≤5 series, 2–10 steps, ≤20
        filters in total, range ≤366 days, `hour` only for ranges ≤31 days,
        `in` lists ≤100 values, breakdown limit ≤50. Rate limit 30 requests /
        10 s per location. Cached 120 s when the range touches today, 6 h
        otherwise (`meta.cached`).
      parameters:
        - $ref: "#/components/parameters/LocationIdHeader"
        - $ref: "#/components/parameters/LocationIdQuery"
        - name: debug
          in: query
          required: false
          description: "`1` adds the compiled SQL to `meta.sql` (agency keys only)."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExploreSpec"
            examples:
              trend:
                summary: Daily pageview users by source, mobile only, vs previous month
                value:
                  kind: trend
                  date_range: { preset: "30d" }
                  interval: day
                  series:
                    - { event: "$pageview", math: dau }
                  breakdown: { property: utm_source, limit: 5 }
                  compare: previous_period
                  filters:
                    - { property: "$device_type", op: eq, value: mobile }
              revenue:
                summary: Weekly revenue and orders as two series
                value:
                  kind: trend
                  date_range: { from: "2026-07-01", to: "2026-08-31" }
                  interval: week
                  series:
                    - { event: transaction_completed, math: sum, math_property: amount, label: Revenue }
                    - { event: transaction_completed, math: total, label: Orders }
              funnel:
                summary: Pricing page → signup → purchase within 3 days, by experiment arm
                value:
                  kind: funnel
                  date_range: { preset: "14d" }
                  steps:
                    - { event: "$pageview", filters: [{ property: "$pathname", op: contains, value: "/pricing" }] }
                    - { event: signup }
                    - { event: order_completed }
                  window: { value: 3, unit: day }
                  breakdown: { property: "$experiment_arm" }
      responses:
        "200":
          description: Shaped result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    description: >
                      Trend: `buckets[]` (ISO, UTC), `previous_buckets[]` with
                      compare, `breakdown_values[]` with breakdown, and
                      `series[]` — one entry per spec series × breakdown value
                      with `label`, `math`, `event`, `breakdown_value?`,
                      `data[]` + `total` (or `value` without interval) and
                      `previous[]` / `previous_value` with compare. Funnel:
                      `steps[]` and `breakdown[] { value, steps[] }`. Always
                      `meta { from, to, interval?, previous?, window_seconds?,
                      sql_ms, rows_read, bytes_read, cached, sql? }`.
              examples:
                trend:
                  value:
                    success: true
                    data:
                      kind: trend
                      buckets: ["2026-08-30", "2026-08-31", "2026-09-01"]
                      breakdown_values: ["google", "", "$$other"]
                      series:
                        - { label: "$pageview · dau", math: dau, event: "$pageview", breakdown_value: google, data: [412, 388, 97], total: 897, previous: [390, 401, 120] }
                      meta: { from: "2026-08-30", to: "2026-09-01", interval: day, previous: { from: "2026-08-27", to: "2026-08-29" }, sql_ms: 212, rows_read: 778534, bytes_read: 36060000, cached: false }
                funnel:
                  value:
                    success: true
                    data:
                      kind: funnel
                      steps:
                        - { step: 1, label: "$pageview", event: "$pageview", users: 1180, conversion_from_first: 1, conversion_from_previous: 1 }
                        - { step: 2, label: signup, event: signup, users: 143, conversion_from_first: 0.1212, conversion_from_previous: 0.1212 }
                        - { step: 3, label: order_completed, event: order_completed, users: 31, conversion_from_first: 0.0263, conversion_from_previous: 0.2168 }
                      meta: { from: "2026-08-18", to: "2026-09-01", window_seconds: 259200, sql_ms: 340, rows_read: 51200, bytes_read: 2100000, cached: false }
        "400":
          description: "`invalid_spec` — `error.details` lists every problem; `invalid_json`; `payload_too_large` (>64 KB)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited (30 / 10 s per location).
        "502":
          description: Upstream query failed (message from the query engine).

  /query/values:
    get:
      summary: Property values (picker)
      operationId: explorePropertyValues
      description: >
        Top values of one event property with counts over the last `days`
        (default 30), for filter and breakdown pickers. Accepts the same
        property names as `/query` — typed (`utm_source`, `$device_type`,
        `$geo_country`, `$pathname`, …) or any custom event property key.
        Optional `event` narrowing and case-insensitive `search`. Cached
        5 minutes.
      parameters:
        - $ref: "#/components/parameters/LocationIdHeader"
        - $ref: "#/components/parameters/LocationIdQuery"
        - name: property
          in: query
          required: true
          schema:
            type: string
            maxLength: 64
        - name: event
          in: query
          required: false
          description: Only values seen on this event.
          schema:
            type: string
        - name: search
          in: query
          required: false
          description: Case-insensitive substring match.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: "Default `20`, max `100`."
          schema:
            type: integer
        - name: days
          in: query
          required: false
          description: "Default `30`, max `366`."
          schema:
            type: integer
      responses:
        "200":
          description: Values with counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      property: { type: string }
                      days: { type: integer }
                      cached: { type: boolean }
                      values:
                        type: array
                        items:
                          type: object
                          properties:
                            value: { type: string }
                            count: { type: integer }
        "400":
          description: "`property_required` or `invalid_property` (unsafe name)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions:
    get:
      summary: Session list
      operationId: getSessions
      description: >
        One row per session, most recent first — the backbone of attribution
        reporting. Attribution fields (all UTMs, click IDs, referrer, landing
        page) come from the session's entry properties. `engaged` is derived:
        a session is engaged if it has more than one pageview, lasted at least
        10 seconds, or fired a non-pageview event; `bounce` is the inverse.
        Empty string on a filter means "no value set". Not yet returned:
        `is_new_visitor` and `converted`/goal fields.


        **Segment scoping**: pass `segment_id` (a segment created via the
        Segments API) to list only sessions by that segment's members —
        composable with every other filter:


        `GET /client/v1/data/sessions?segment_id=9f4e...&engaged=1&device_type=mobile`


        The segment decides *which people* qualify (evaluated live at query
        time); the date window decides *which of their sessions* are returned —
        a qualifying person contributes all their in-window sessions, including
        ones unrelated to how they qualified. See the `segment_id` parameter
        for attribution-scope and identity-graph details.


        **Person scoping (profile views)**: pass `person_id` (canonical id
        from the People API) or `distinct_id` (any raw identity value) to list
        one person's sessions — resolved through the identity graph, so
        anonymous pre-identification sessions are included:


        `GET /client/v1/data/sessions?person_id=019f69bc-...&date_from=2026-01-01`
      parameters:
        - $ref: "#/components/parameters/LocationIdHeader"
        - $ref: "#/components/parameters/LocationIdQuery"
        - name: session_id
          in: query
          required: false
          description: >
            Return just this one session (exact match). Useful for looking up a
            single session's attribution — e.g. alongside its replay. When set,
            other filters and the date window are effectively moot.
          schema:
            type: string
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/FilterUtmSource"
        - $ref: "#/components/parameters/FilterUtmMedium"
        - $ref: "#/components/parameters/FilterUtmCampaign"
        - $ref: "#/components/parameters/FilterDeviceType"
        - $ref: "#/components/parameters/FilterBrowser"
        - $ref: "#/components/parameters/FilterOs"
        - $ref: "#/components/parameters/FilterCountry"
        - $ref: "#/components/parameters/FilterLandingPage"
        - $ref: "#/components/parameters/FilterEngaged"
        - $ref: "#/components/parameters/FilterBounce"
        - $ref: "#/components/parameters/FilterIsIdentified"
        - $ref: "#/components/parameters/FilterPersonId"
        - $ref: "#/components/parameters/FilterDistinctId"
        - name: min_duration
          in: query
          required: false
          description: Minimum session duration in seconds.
          schema:
            type: integer
        - $ref: "#/components/parameters/SegmentId"
        - name: limit
          in: query
          required: false
          description: Max rows. Default `100`, min `1`, max `1000`.
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
        - name: offset
          in: query
          required: false
          description: Row offset for pagination.
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Session rows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RowsResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/SessionRow"
        "400":
          $ref: "#/components/responses/LocationRequired"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SegmentNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /sessions/breakdown:
    get:
      summary: Session group-by aggregates
      operationId: getSessionsBreakdown
      description: >
        Session aggregates grouped by one dimension: session count, engaged
        count/rate, bounce rate, average duration and pages per group. Accepts
        the same filters as `/sessions`, so you can group a filtered set.
        Ordered by `session_count` descending. Single dimension only —
        comma-list multi-dimension group-by is not yet supported.


        **Segment scoping**: pass `segment_id` to aggregate only the segment's
        members' sessions — e.g. which campaigns drive engaged sessions from
        identified customers:


        `GET /client/v1/data/sessions/breakdown?group_by=utm_campaign&segment_id=9f4e...`
      parameters:
        - $ref: "#/components/parameters/LocationIdHeader"
        - $ref: "#/components/parameters/LocationIdQuery"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/FilterUtmSource"
        - $ref: "#/components/parameters/FilterUtmMedium"
        - $ref: "#/components/parameters/FilterUtmCampaign"
        - $ref: "#/components/parameters/FilterDeviceType"
        - $ref: "#/components/parameters/FilterBrowser"
        - $ref: "#/components/parameters/FilterOs"
        - $ref: "#/components/parameters/FilterCountry"
        - $ref: "#/components/parameters/FilterLandingPage"
        - $ref: "#/components/parameters/FilterEngaged"
        - $ref: "#/components/parameters/FilterBounce"
        - $ref: "#/components/parameters/FilterIsIdentified"
        - $ref: "#/components/parameters/FilterPersonId"
        - $ref: "#/components/parameters/FilterDistinctId"
        - name: min_duration
          in: query
          required: false
          description: Minimum session duration in seconds.
          schema:
            type: integer
        - $ref: "#/components/parameters/SegmentId"
        - name: group_by
          in: query
          required: true
          description: Dimension to group by.
          schema:
            type: string
            enum:
              - utm_source
              - utm_medium
              - utm_campaign
              - utm_content
              - utm_term
              - device_type
              - browser
              - os
              - country
              - landing_page
              - exit_page
              - referring_domain
              - engaged
              - bounce
              - is_identified
        - name: limit
          in: query
          required: false
          description: Max groups. Default `50`, min `1`, max `1000`.
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Grouped session rows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RowsResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/SessionBreakdownRow"
        "400":
          description: Missing or unknown `group_by` (`invalid_group_by`), or no location bound (`location_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/SegmentNotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /exceptions/digest:
    get:
      summary: Error-tracking weekly digest
      operationId: getExceptionDigest
      description: >
        Everything needed for a "weekly digest" error-tracking email in one
        call. Returns a `summary` block with the current window's totals and the
        week-over-week `change_pct` versus the equal-length window immediately
        before it — `total_exceptions`, `total_sessions`, and
        `crash_free_sessions` (the fraction of sessions with no `$exception`, as
        a 0–1 rate). `daily_exceptions` is the current window's per-day counts,
        **zero-filled** across every day in the range so the bar chart always
        has one bar per day. `top_issues` are this window's issues sorted by
        occurrences; `new_issues` are issues **first seen in this window** —
        i.e. not seen in the `new_lookback_days` before it — also sorted by
        occurrences. Both lists carry the same fields as `GET
        /exceptions/issues` rows.


        **Time window**: defaults to the last 7 full UTC days; pass
        `date_from`/`date_to` (YYYY-MM-DD) to override. **Segment scoping**:
        pass `segment_id` / `exclude_segment_id` to scope the whole digest.
      parameters:
        - $ref: "#/components/parameters/LocationIdHeader"
        - $ref: "#/components/parameters/LocationIdQuery"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - name: top_limit
          in: query
          required: false
          description: Max top-issue rows. Default `5`, min `1`, max `25`.
          schema: { type: integer, default: 5, minimum: 1, maximum: 25 }
        - name: new_limit
          in: query
          required: false
          description: Max new-issue rows. Default `5`, min `1`, max `25`.
          schema: { type: integer, default: 5, minimum: 1, maximum: 25 }
        - name: new_lookback_days
          in: query
          required: false
          description: >
            How far back (before `date_from`) an issue must be absent to count
            as "new this window". Default `90`, min `1`, max `365`.
          schema: { type: integer, default: 90, minimum: 1, maximum: 365 }
        - $ref: "#/components/parameters/SegmentId"
        - $ref: "#/components/parameters/ExcludeSegmentId"
      responses:
        "200":
          description: Digest payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      range:
                        type: object
                        properties:
                          date_from: { type: string, example: "2026-07-13" }
                          date_to: { type: string, example: "2026-07-19" }
                      summary:
                        type: object
                        properties:
                          total_exceptions: { $ref: "#/components/schemas/DigestMetric" }
                          total_sessions: { $ref: "#/components/schemas/DigestMetric" }
                          crash_free_sessions: { $ref: "#/components/schemas/DigestMetric" }
                      daily_exceptions:
                        type: array
                        items:
                          type: object
                          properties:
                            date: { type: string, example: "2026-07-17" }
                            count: { type: integer }
                      top_issues:
                        type: array
                        items:
                          $ref: "#/components/schemas/ExceptionIssue"
                      new_issues:
                        type: array
                        items:
                          $ref: "#/components/schemas/ExceptionIssue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SegmentNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /exceptions/issues:
    get:
      summary: Grouped exception issues
      operationId: getExceptionIssues
      description: >
        The error-tracking issue list. `$exception` events (uncaught JS errors
        and unhandled promise rejections captured by the SDK) are grouped into
        issues by a **stable server-side fingerprint**: `issue_id` = `v1:` +
        md5(exception_type + normalized message, with digits stripped so
        per-instance values collapse). The `v1:` prefix versions the grouping
        algorithm — a future change ships as `v2:`, a clean migration rather
        than a silent remint of your saved state. The fingerprint deliberately **excludes
        the stack trace**, so minified frame names churning across deploys can
        never mint a new id — persist your own resolve/ignore state against
        `issue_id` and it stays put.


        Each row carries `occurrences` / `sessions` / `users`, `first_seen` /
        `last_seen`, a `culprit` (top in-app stack frame, for the list
        subtitle), and a `volume_series` bucketed to the window (hourly for
        short ranges, else daily) for the sparkline.


        **Time window**: `date_from`/`date_to`, or `hours_back` for a window
        ending now. **Segment scoping**: pass `segment_id` to count only errors
        from that segment's members.
      parameters:
        - $ref: "#/components/parameters/LocationIdHeader"
        - $ref: "#/components/parameters/LocationIdQuery"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - name: hours_back
          in: query
          required: false
          description: Alternative to `date_from` — window of the last N hours ending now.
          schema: { type: integer }
        - name: search
          in: query
          required: false
          description: Substring match over exception type and message.
          schema: { type: string }
        - name: sort_by
          in: query
          required: false
          description: Sort column. Default `last_seen`.
          schema:
            type: string
            default: last_seen
            enum: [last_seen, occurrences, sessions, users]
        - name: order
          in: query
          required: false
          schema:
            type: string
            default: desc
            enum: [asc, desc]
        - $ref: "#/components/parameters/SegmentId"
        - $ref: "#/components/parameters/ExcludeSegmentId"
        - name: limit
          in: query
          required: false
          description: Max rows. Default `50`, min `1`, max `200`.
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          required: false
          description: Row offset for pagination.
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Issue rows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RowsResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ExceptionIssue"
        "400":
          $ref: "#/components/responses/LocationRequired"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SegmentNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /exceptions/issues/{id}:
    get:
      summary: Single exception issue
      operationId: getExceptionIssue
      description: >
        The detail-header view: the same aggregates and `volume_series` as a
        list row, fetched by the stable `issue_id`. Returns `404`
        (`issue_not_found`) when no occurrences match the id in the window.
      parameters:
        - $ref: "#/components/parameters/LocationIdHeader"
        - $ref: "#/components/parameters/LocationIdQuery"
        - name: id
          in: path
          required: true
          description: The stable `issue_id` from the issue list.
          schema: { type: string }
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - name: hours_back
          in: query
          required: false
          schema: { type: integer }
        - $ref: "#/components/parameters/SegmentId"
        - $ref: "#/components/parameters/ExcludeSegmentId"
      responses:
        "200":
          description: Issue
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: "#/components/schemas/ExceptionIssue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown issue for this location and date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /exceptions/issues/{id}/occurrences:
    get:
      summary: Occurrences of one exception issue
      operationId: getExceptionOccurrences
      description: >
        Paginated raw `$exception` events belonging to the issue, most recent
        first — powers the occurrence list and the stack-trace / session panels
        of the detail view. Each row carries `browser` / `os` / `url`, a
        `session_id` for deep-linking to the session replay, and
        worker-parsed `stack_frames` (the original string is kept in
        `stack_raw`).
      parameters:
        - $ref: "#/components/parameters/LocationIdHeader"
        - $ref: "#/components/parameters/LocationIdQuery"
        - name: id
          in: path
          required: true
          description: The stable `issue_id` from the issue list.
          schema: { type: string }
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - name: hours_back
          in: query
          required: false
          schema: { type: integer }
        - name: limit
          in: query
          required: false
          description: Max rows. Default `50`, min `1`, max `200`.
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0 }
        - $ref: "#/components/parameters/SegmentId"
        - $ref: "#/components/parameters/ExcludeSegmentId"
      responses:
        "200":
          description: Occurrence rows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RowsResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ExceptionOccurrence"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /export:
    get:
      summary: BigQuery export status
      operationId: getExport
      description: >
        Resolve the BigQuery export dataset coordinates. Two grains:


        **Per-location** (recommended): pass a `location_id` with an agency
        (`ak_`) key, or use a location secret (`sk_`) key, to resolve that
        client's IAM-isolated dataset `mythic-data.client_<location_id>`
        (`grain: "location"`). A per-client reader service account is granted
        READER on this dataset only.


        **Agency-wide**: an `ak_` key with no location returns the agency
        dataset `mythic-data.agency_<id>` spanning all linked locations
        (`grain: "agency"`).


        Resolve coordinates here rather than hand-computing dataset names.
      parameters:
        - $ref: "#/components/parameters/LocationIdQuery"
        - $ref: "#/components/parameters/LocationIdHeader"
      responses:
        "200":
          description: BigQuery export dataset status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Agency-wide mode requires an agency (`ak_`) key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No BigQuery export provisioned for the agency/location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /export/schema:
    get:
      summary: Export semantic catalog
      operationId: getExportSchema
      description: >
        The export's semantic catalog — the single source of truth for building
        an insight/breakdown picker. Static and identical for every caller; no
        bound location required. Versioned and **additive-only** (columns and
        tables are only added, never renamed or removed without a version bump).


        Per column: `name`, `type`, `filterable`, `groupable`, `aggregatable`,
        `group` (entity-only: `event` | `person` | `session`), `label`.
        Per table: `source` and `shape` (`event` = row-per-event; `metric` =
        row-per-period/entity).


        This describes the export views only — not the `hello-conversions`
        insights catalog, whose column set differs.
      responses:
        "200":
          description: Export catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportSchemaResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /explain/coverage:
    get:
      summary: Explainability coverage gate
      operationId: getExplainCoverage
      description: >
        Ask this BEFORE you analyse why a funnel step loses people. It answers
        one question — is there enough data here to support a conclusion — and
        returns no analysis of its own. The response is shaped to be handed to
        an AI agent verbatim.


        It exists because the dangerous case is not a bad number, it is a number
        that should never have been computed. On a real paid landing page with
        4,225 non-bot sessions over 14 days, **zero** fired the conversion
        event: the page carries no form, and its step is a click-through to
        another page. A conversion rate there reads 0.00% and invites "rewrite
        this page", which is wrong. So `outcome_event_never_fires` is its own
        verdict, kept distinct from a genuinely low rate.


        Each evidence arm is reported `available` only when BOTH sides of its
        contrast hold at least `min_arm_n` sessions, and every available arm
        carries a `confound` field. Treat that field as load-bearing. On that
        same page the 190 sessions that threw a JavaScript error bounced *less*
        than clean ones (80.1% vs 88.1%) and reached the next step three times
        more often — you have to engage with a page to trigger an error, so the
        arm measures exposure, not harm. Read causally it claims errors improve
        conversion.


        Counts are page-scoped AND order-scoped. An exception thrown two pages
        later is evidence about that step, not this one; and "advanced" requires a
        page *after* this one, not just a second page somewhere in the session —
        17 of 521 sessions on the reference page saw their other page only before
        it, an error worth 3% on a landing page and approaching 100% mid-funnel.
        Bots are excluded: unfiltered, that page reads 4,834 sessions instead of
        4,225, a 12.6% inflation landing entirely in the denominator.


        Finally, `available` does not mean `powered`. Each available arm reports
        `mde_pp` — the smallest effect it could detect — and the top-level
        `caveat` fires when every arm with coverage carries a confound.
      parameters:
        - $ref: "#/components/parameters/LocationIdHeader"
        - $ref: "#/components/parameters/LocationIdQuery"
        - name: page
          in: query
          required: true
          description: >
            Pathname of the page, for example `/pricing`. A full URL is accepted
            and reduced to its pathname.
          schema:
            type: string
            example: /pricing
        - name: outcome_event
          in: query
          required: false
          description: >
            The event that counts as advancing past this step. Omit it and
            "advanced" means the session saw a second page — the correct model
            for a bridge or advertorial page that carries no form.
          schema:
            type: string
            example: form_submitted
        - name: days
          in: query
          required: false
          description: Lookback window in days.
          schema:
            type: integer
            default: 14
            minimum: 1
            maximum: 90
      responses:
        "200":
          description: Coverage verdict
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      page:
                        type: string
                      window_days:
                        type: integer
                      answerable:
                        type: boolean
                        description: >
                          True only when the outcome splits the population into
                          two usable arms AND at least one evidence source has
                          coverage.
                      caveat:
                        type: string
                        description: >
                          Present when `answerable` is true but every available
                          arm carries a confound — a contrast can be computed and
                          still not be read causally.
                        enum: [only_confounded_arms_available]
                      caveat_note:
                        type: string
                      reason:
                        type: string
                        description: Present only when `answerable` is false. Root cause, not symptom.
                        enum:
                          - too_few_sessions
                          - outcome_event_never_fires
                          - too_few_positive_outcomes
                          - too_few_negative_outcomes
                          - no_evidence_arm_has_coverage
                      hint:
                        type: string
                        description: Accompanies `outcome_event_never_fires`. States what the number is NOT.
                      outcome:
                        type: object
                        properties:
                          kind:
                            type: string
                            enum: [event, page_transition]
                          note:
                            type: string
                            description: Present on `page_transition` — states what "advanced" was taken to mean.
                          event:
                            type: string
                            nullable: true
                          n_positive:
                            type: integer
                          n_total:
                            type: integer
                      arms:
                        type: array
                        description: >
                          Always all three, available or not, so you can tell
                          "checked and unavailable" from "not checked".
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              enum: [error_outcome, field_abandon, scroll_contrast]
                            available:
                              type: boolean
                            n:
                              type: integer
                              description: Sessions on the positive side of this arm, page-scoped.
                            mde_pp:
                              type: number
                              nullable: true
                              description: >
                                Available arms only. The smallest difference in
                                outcome rate this arm could detect, in percentage
                                points, at 80% power. Compare it to the effect you
                                care about — at the bare `min_arm_n` threshold it
                                exceeds 30pp, which almost no real conversion
                                effect reaches.
                            confound:
                              type: string
                              nullable: true
                              description: >
                                `exposure` for error_outcome because erroring
                                requires engaging; `reverse_causality` for
                                scroll_contrast because intent drives depth;
                                null for field_abandon, the one arm with no
                                confound.
                              enum: [exposure, reverse_causality]
                            confound_note:
                              type: string
                            reason:
                              type: string
                              description: Present when the arm is unavailable.
                              enum:
                                - too_few_error_sessions
                                - too_few_clean_sessions
                                - no_form_on_page
                                - single_field_form
                                - too_few_form_sessions
                                - too_few_scroll_sessions
                                - scroll_coverage_too_low
                            coverage:
                              type: number
                              description: scroll_contrast only. Scroll sessions as a share of page sessions.
                            form_field_count:
                              type: integer
                            hint:
                              type: string
                      thresholds:
                        type: object
                        description: Travels with the response so you need not infer what it was judged against.
                        properties:
                          min_arm_n:
                            type: integer
                            example: 30
                          min_scroll_coverage:
                            type: number
                            example: 0.05
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >
        Agency key (`ak_`) or location secret key (`sk_`) as a bearer token.
        Format: `Bearer ak_...` or `Bearer sk_...`.
  parameters:
    LocationIdHeader:
      name: X-Location-Id
      in: header
      required: false
      description: >
        Location to scope the request to. Required for agency (`ak_`) keys on
        the event routes. Ignored for secret (`sk_`) keys, which resolve their
        own location, and not used by `/export`.
      schema:
        type: string
    LocationIdQuery:
      name: location_id
      in: query
      required: false
      description: >
        Alternative to the `X-Location-Id` header for agency (`ak_`) keys.
        Ignored for secret (`sk_`) keys.
      schema:
        type: string
    DateFrom:
      name: date_from
      in: query
      required: false
      description: Start date (`YYYY-MM-DD`).
      schema:
        type: string
        format: date
    DateTo:
      name: date_to
      in: query
      required: false
      description: End date (`YYYY-MM-DD`).
      schema:
        type: string
        format: date
    FilterUtmSource:
      name: utm_source
      in: query
      required: false
      description: Filter to sessions with this UTM source. Empty string = "no value set".
      schema:
        type: string
    FilterUtmMedium:
      name: utm_medium
      in: query
      required: false
      description: Filter to sessions with this UTM medium.
      schema:
        type: string
    FilterUtmCampaign:
      name: utm_campaign
      in: query
      required: false
      description: Filter to sessions with this UTM campaign.
      schema:
        type: string
    FilterDeviceType:
      name: device_type
      in: query
      required: false
      description: Filter to sessions on this device type.
      schema:
        type: string
    FilterBrowser:
      name: browser
      in: query
      required: false
      description: Filter to sessions on this browser.
      schema:
        type: string
    FilterOs:
      name: os
      in: query
      required: false
      description: Filter to sessions on this operating system.
      schema:
        type: string
    FilterCountry:
      name: country
      in: query
      required: false
      description: Filter to sessions from this country (ISO code).
      schema:
        type: string
    FilterLandingPage:
      name: landing_page
      in: query
      required: false
      description: >
        Filter to sessions whose entry path matches. Case-insensitive and
        trailing-slash-insensitive (`/About/` matches `/about`). Query params
        never apply — the path is captured without them.
      schema:
        type: string
    FilterEngaged:
      name: engaged
      in: query
      required: false
      description: Filter by engagement (`1`/`0`, or `true`/`false`).
      schema:
        type: boolean
    FilterBounce:
      name: bounce
      in: query
      required: false
      description: Filter by bounce (`1`/`0`, or `true`/`false`).
      schema:
        type: boolean
    FilterIsIdentified:
      name: is_identified
      in: query
      required: false
      description: Filter to identified (`1`) or anonymous (`0`) sessions.
      schema:
        type: boolean
    FilterPersonId:
      name: person_id
      in: query
      required: false
      description: >
        Scope to one person's sessions: the canonical person id from the
        People API (`GET /people`, `GET /people/{personId}`). Matches every
        session whose visitor id belongs to that person in the identity graph
        (anonymous ids, user ids, emails), so pre-identification sessions are
        included. Powers per-person Sessions/Recordings tabs on a profile
        view. Composable with all other filters and the date window; widen
        `date_from` for history older than the 30-day default.
      schema:
        type: string
    FilterDistinctId:
      name: distinct_id
      in: query
      required: false
      description: >
        Scope to one person's sessions by any raw identity value (anonymous
        id, user id, or email). Resolved through the identity graph to the
        owning person's full identity set — same resolution as
        `GET /people/{personId}` — so it returns the same rows as `person_id`
        for the same person. A value not in the graph (a never-identified
        visitor) falls back to an exact `distinct_id` match. If `person_id`
        is also given, both conditions must match (AND) — pass one or the
        other.
      schema:
        type: string
    SegmentId:
      name: segment_id
      in: query
      required: false
      description: >
        Scope results to members of a saved segment (created via the Segments
        API). Two independent time filters apply: the segment decides WHICH
        PEOPLE qualify (a live definition, evaluated at query time — not
        stored membership), and `date_from`/`date_to` decides WHICH OF THEIR
        ROWS are returned. A person who qualifies today contributes all their
        sessions/events inside the date window — including ones unrelated to
        how they qualified; there is no "only rows from while they were a
        member". For `first`/`last` attribution scopes membership runs through
        the identity graph (a row counts when its `distinct_id` maps to a
        matching person); a segment with `attribution: "session"` instead
        matches visitors directly against the sessions store ("ever had a
        session that arrived via X"), with no identity-graph dependency.
        Composable with all other filters. Unknown or foreign id →
        `404 segment_not_found`.
      schema:
        type: string
        format: uuid
    ExcludeSegmentId:
      name: exclude_segment_id
      in: query
      required: false
      description: >
        Scope results OUT — exclude rows from members of a saved segment
        (the inverse of `segment_id`, evaluated the same live way). Fully
        composable with `segment_id`: scope to one segment and exclude another
        simultaneously. The primary use is stripping your own QA/test traffic —
        which is often anonymous, so a rule-based segment (email domain, known
        ids) catches it with no SDK changes on the client's site. Unknown or
        foreign id → `404 exclude_segment_not_found`.
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Missing, malformed, or invalid key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: >
        Access denied — location not linked to the agency
        (`location_not_linked`) or the location has HIPAA mode enabled
        (`hipaa_restricted`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    LocationRequired:
      description: An agency key called an event route without binding a location
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SegmentNotFound:
      description: "`segment_id` does not exist for this location (`segment_not_found`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: >
        Rate limit exceeded (120 requests per 10 seconds, per location).
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
        X-RateLimit-Limit:
          description: Request ceiling for the window.
          schema:
            type: integer
        X-RateLimit-Remaining:
          description: Requests remaining in the current window.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UpstreamError:
      description: An upstream data service failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotConfigured:
      description: The analytics service is not configured for this deployment
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ExploreFilter:
      type: object
      required: [property, op]
      properties:
        property:
          type: string
          maxLength: 64
          description: "Typed name (`$current_url`, `utm_source`, `$device_type`, …), core column (`event`, `distinct_id`, `session_id`, `user_id`) or any custom event property key."
        op:
          type: string
          enum: [eq, neq, in, not_in, contains, not_contains, regex, is_set, is_not_set, gt, gte, lt, lte]
        value:
          description: "string for eq/neq/contains/not_contains/regex; string[] (≤100) for in/not_in; number for gt/gte/lt/lte; omitted for is_set/is_not_set."
          oneOf:
            - type: string
              maxLength: 500
            - type: number
            - type: array
              items:
                type: string
              maxItems: 100
    ExploreSpec:
      type: object
      required: [kind, date_range]
      description: >
        Typed query grammar. Unknown keys are rejected (fail closed). At most 20
        filters in total across the spec; date range ≤366 days; `hour` interval
        only for ranges ≤31 days. Presets resolve to `[today-N, today]` UTC
        inclusive.
      properties:
        kind:
          type: string
          enum: [trend, funnel]
        date_range:
          oneOf:
            - type: object
              required: [preset]
              properties:
                preset:
                  type: string
                  enum: [24h, 7d, 14d, 30d, 90d, 365d]
            - type: object
              required: [from, to]
              properties:
                from:
                  type: string
                  format: date
                to:
                  type: string
                  format: date
                  description: Inclusive.
        interval:
          type: string
          enum: [hour, day, week, month]
          description: "Trend only. Omit for one number per series."
        series:
          type: array
          minItems: 1
          maxItems: 5
          description: Trend only.
          items:
            type: object
            required: [event, math]
            properties:
              event:
                type: string
                nullable: true
                description: "Event name, or `null` for any event."
              math:
                type: string
                enum: [total, dau, unique_sessions, sum, avg, min, max, median, p90, p95, p99]
              math_property:
                type: string
                description: "Required for sum/avg/min/max/median/pNN — the numeric property to aggregate."
              filters:
                type: array
                items:
                  $ref: "#/components/schemas/ExploreFilter"
              label:
                type: string
                maxLength: 100
        breakdown:
          type: object
          required: [property]
          properties:
            property:
              type: string
              maxLength: 64
            limit:
              type: integer
              minimum: 1
              maximum: 50
              default: 10
              description: "Remaining values fold into `$$other`."
        compare:
          type: string
          enum: [previous_period]
          description: Trend only.
        steps:
          type: array
          minItems: 2
          maxItems: 10
          description: "Funnel only. Ordered; other events may occur between steps."
          items:
            type: object
            required: [event]
            properties:
              event:
                type: string
              filters:
                type: array
                items:
                  $ref: "#/components/schemas/ExploreFilter"
              label:
                type: string
                maxLength: 100
        window:
          type: object
          description: "Funnel only. Default 7 days, capped at the range length."
          properties:
            value:
              type: integer
              minimum: 1
            unit:
              type: string
              enum: [minute, hour, day]
        filters:
          type: array
          description: Applied to every series / step.
          items:
            $ref: "#/components/schemas/ExploreFilter"
    RowsResponse:
      type: object
      description: Generic Tinybird result envelope for analytics rows.
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        rows:
          type: integer
          description: Number of rows returned.
    BreakdownRow:
      type: object
      description: One dimension value with its traffic counts.
      properties:
        value:
          type: string
          description: The dimension value (e.g. `/pricing`). Empty string when unset.
          example: /pricing
        pageviews:
          type: integer
          example: 1240
        unique_users:
          type: integer
          example: 830
        unique_sessions:
          type: integer
          example: 910
    DigestMetric:
      type: object
      description: >
        A digest summary metric: the current window value, the previous
        equal-length window value, and the relative % change (null when the
        previous value is 0). Counts are integers; `crash_free_sessions` is a
        0–1 rate.
      properties:
        current: { type: number, example: 473 }
        previous: { type: number, example: 119, nullable: true }
        change_pct: { type: integer, nullable: true, example: 297 }
    ExceptionIssue:
      type: object
      description: >
        One grouped exception issue. `issue_id` is stable across requests and
        deploys — persist resolve/ignore state against it.
      properties:
        issue_id:
          type: string
          description: >
            Stable, versioned fingerprint — `v1:` + md5(exception_type +
            normalized message). Stable across requests and deploys; persist
            resolve/ignore state against it. The version prefix means any
            future change to the grouping algorithm ships as `v2:` — a clean
            migration, never a silent remint of your saved state.
          example: v1:1d908dc6145bd8dc7982aff9366b5042
        exception_type:
          type: string
          example: TypeError
        message:
          type: string
          example: "Cannot read properties of null (reading 'addEventListener')"
        culprit:
          type: string
          nullable: true
          description: Top in-app stack frame ("function in file"), for the list subtitle.
          example: "handler in app.js"
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        occurrences: { type: integer, example: 366 }
        sessions: { type: integer, example: 204 }
        users: { type: integer, example: 183 }
        volume_series:
          type: array
          description: Counts bucketed (hourly or daily) across the window, for the sparkline.
          items:
            type: object
            properties:
              bucket: { type: string, format: date-time }
              count: { type: integer }
    ExceptionOccurrence:
      type: object
      description: One raw `$exception` event belonging to an issue.
      properties:
        event_uuid: { type: string }
        timestamp: { type: string, format: date-time }
        message: { type: string, description: "Emails are redacted to `[email]`." }
        browser: { type: string, example: Chrome }
        os: { type: string, example: Windows }
        url:
          type: string
          description: >
            Query string and fragment are stripped — they routinely carry
            click ids (`fbclid`), UTMs, session tokens, and occasionally PII.
        session_id:
          type: string
          description: Deep-links to the session replay for this occurrence.
        distinct_id:
          type: string
          description: Raw identity value. Canonical person_id resolution is a planned follow-up.
        stack_frames:
          type: array
          description: Stack parsed into frames from the raw error.stack string.
          items:
            type: object
            properties:
              function: { type: string, nullable: true }
              file: { type: string }
              line: { type: integer, nullable: true }
              col: { type: integer, nullable: true }
              in_app:
                type: boolean
                description: False for third-party frames (gtm.js, node_modules, cdn, chunks…).
        stack_raw:
          type: string
          nullable: true
          description: The original error.stack string, with embedded URL query strings stripped and emails redacted.
    SessionRow:
      type: object
      description: One session.
      properties:
        session_id: { type: string }
        distinct_id: { type: string }
        user_id: { type: string, nullable: true }
        is_identified: { type: boolean }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        duration_seconds: { type: integer }
        events: { type: integer }
        pageviews: { type: integer }
        engaged: { type: boolean }
        bounce: { type: boolean }
        landing_page: { type: string }
        landing_url: { type: string }
        exit_page: { type: string }
        referrer: { type: string }
        referring_domain: { type: string }
        has_recording:
          type: boolean
          description: >
            True when a session recording is still retrievable — a
            `$replay_started` within the 30-day retention window. False once the
            recording has aged out (distinct from "never recorded").
        recording_available_until:
          type: string
          format: date-time
          nullable: true
          description: When the recording ages out of retention; null when there is no recording.
        utm_source:
          type: string
          description: >
            The real UTM source when the session is tagged; otherwise derived
            from the referrer (the referring domain for search/referral traffic).
            Blank for untagged direct traffic.
        utm_medium:
          type: string
          description: >
            The real UTM medium when tagged; otherwise derived from the referrer —
            `organic` for known search engines, `ai` for known AI assistants,
            `referral` for any other referring domain. Blank for direct traffic.
        utm_campaign: { type: string }
        utm_content: { type: string }
        utm_term: { type: string }
        utm_id: { type: string }
        gclid: { type: string }
        gbraid: { type: string }
        wbraid: { type: string }
        fbclid: { type: string }
        msclkid: { type: string }
        ttclid: { type: string }
        twclid: { type: string }
        li_fat_id: { type: string }
        oppref: { type: string }
        obref: { type: string }
        epik: { type: string }
        sccid: { type: string }
        device_type: { type: string }
        browser: { type: string }
        os: { type: string }
        country: { type: string }
        city: { type: string }
        timezone: { type: string }
    SessionBreakdownRow:
      type: object
      description: Session aggregates for one group.
      properties:
        value:
          type: string
          description: The group value. For boolean group_by (`engaged`/`bounce`/`is_identified`) this is `"true"`/`"false"`.
          example: google
        session_count:
          type: integer
          example: 1204
        engaged_count:
          type: integer
          example: 812
        engaged_rate:
          type: number
          description: Engaged sessions as a percentage.
          example: 67.4
        bounce_rate:
          type: number
          description: Bounced sessions as a percentage.
          example: 32.6
        avg_duration_seconds:
          type: number
          example: 84.2
        avg_pageviews:
          type: number
          example: 2.7
    ExportResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            dataset:
              type: string
              description: Fully-qualified BigQuery dataset (`mythic-data.<dataset_name>`).
              example: mythic-data.client_acme_retail
            grain:
              type: string
              enum: [location, agency]
              description: Isolation grain of the returned dataset.
            location_id:
              type: string
              nullable: true
              description: Present when `grain` is `location`.
            tables:
              type: array
              items:
                type: string
              description: View ids available in the dataset (see `/export/schema`).
              example: ["events", "person_events", "sessions", "attribution_default", "person_profiles", "identities", "person_merges"]
            location_count:
              type: integer
              description: Number of locations in the dataset. Agency grain only.
            status:
              type: string
              description: Provisioning status of the export dataset.
            provisioned_at:
              type: string
              format: date-time
              nullable: true
            updated_at:
              type: string
              format: date-time
              nullable: true
    ExportSchemaResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            version:
              type: string
              example: "1.0.0"
            stability:
              type: string
              example: additive-only
            partition_filter:
              type: object
              description: Views with an enforced partition filter, mapped to the required timestamp column.
              additionalProperties:
                type: string
              example: { events: event_timestamp, person_events: event_timestamp, sessions: started_at }
            tables:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, example: events }
                  label: { type: string, example: Events }
                  source: { type: string, enum: [mythic-activity, mythic-identity] }
                  shape: { type: string, enum: [event, metric] }
                  freshness: { type: string, enum: [realtime, daily] }
                  columns:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        label: { type: string }
                        type: { type: string }
                        filterable: { type: boolean }
                        groupable: { type: boolean }
                        aggregatable: { type: boolean }
                        group: { type: string, enum: [event, person, session] }
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code.
              example: unauthorized
            message:
              type: string
              description: Human-readable error message.
              example: Missing authorization
