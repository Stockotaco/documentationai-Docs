openapi: "3.0.0"
info:
  version: 1.0.0
  title: Constraint Finder
  description: >
    End-to-end paid-funnel analysis that names the step where a campaign is
    actually constrained. Joins your Airbyte-synced Meta Ads insights
    (impressions, link clicks, spend) to your pixel's on-site behaviour
    (sessions, landing pages) and your conversion events, then reports — per
    campaign, ad set, or ad — whether the bottleneck is the **ad**, the
    **tracking**, the **landing page**, or the **sales** step. Read-only and
    client-scoped: an agency key (`ak_`) must bind a location, a location
    secret key (`sk_`) is scoped to its own location.
servers:
  - url: https://mythic-analytics.gulp.workers.dev
security:
  - BearerAuth: []
paths:
  /client/v1/constraints:
    get:
      summary: Find the constraint in the paid funnel
      operationId: findConstraints
      description: >
        Builds the full funnel per campaign (or ad set / ad) over the requested
        window and returns, for each row, the step whose fix would unlock the
        most conversions.

        The funnel is `impressions → clicks → sessions → [leads] →
        conversions`. Each step is compared against the **pooled rate across
        every row in the account** (not a global benchmark), and the constraint
        is the step with the highest `recoverable_conversions` — the extra
        conversions that closing the gap to that pooled rate would produce,
        after carrying the row's own downstream rates. A campaign already at or
        above the pooled rate on every step returns `constraint: null`: nothing
        to fix, scale it instead.

        Supply `lead_event` to split the on-site step into **landing** (visit →
        lead) and **sales** (lead → conversion). Without it those collapse into
        a single `site` step, because sessions → conversions genuinely cannot
        distinguish a page problem from a closing problem.

        Conversions are credited to sessions — their own when it resolved to a
        campaign, otherwise the person's nearest paid touch within
        `attribution_window_days`. This is effectively last-PAID-touch: an
        organic-session purchase by a person with a paid touch in-window is
        credited to paid. Pass `attribution_window_days=0` for strict
        own-session-only credit.

        Always read `tracking.match_rate` before trusting the rest. It is the
        share of ad-click sessions whose UTMs resolved to a synced Meta row; a
        low value means the `clicks → sessions` step is measuring UTM hygiene
        rather than landing-page quality.
      parameters:
        - name: location_id
          in: query
          description: Location to scope to. Required for `ak_` keys (or send the `X-Location-Id` header); ignored for `sk_`.
          required: false
          schema:
            type: string
        - name: from
          in: query
          description: Window start (`YYYY-MM-DD`). Defaults to 28 days before `to`.
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Window end (`YYYY-MM-DD`), inclusive. Defaults to yesterday.
          required: false
          schema:
            type: string
            format: date
        - name: days
          in: query
          description: >
            Window length in days, inclusive of both ends — the same shorthand
            `/client/v1/data` takes. `days=90` ending yesterday is the usual
            call. Ignored when `from` is given explicitly. Out-of-range values
            are rejected, not clamped.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 28
        - name: group_by
          in: query
          description: >
            Grain of the analysis. `ad` is where creative lives, but it matches
            through `utm_content`, which carries a usable ad identifier on far
            fewer accounts than `utm_id` does — expect a lower `match_rate`.
          required: false
          schema:
            type: string
            enum: [campaign, adset, ad]
            default: campaign
        - name: attribution
          in: query
          description: >
            `session` uses the conversion's own session's campaign when it has
            one, else the person's MOST RECENT paid touch in the window —
            effectively last-paid-touch, closest to what the ad platform itself
            would claim. `first_touch` uses the person's EARLIEST paid touch:
            the campaign that first acquired them, however long ago.
          required: false
          schema:
            type: string
            enum: [session, first_touch]
            default: session
        - name: conversion_event
          in: query
          description: >
            Event name counted as the conversion. Discover this client's real
            event names via `GET /client/v1/data/events/breakdown?dimension=event_name`.

            Pass **`auto`** to let the endpoint choose: it runs the eligibility
            probe first, takes its suggested pairing, and reports the choice under
            `auto_selected` so it is visible rather than magic. That replaces a
            round trip you would otherwise make to `/constraints/events` purely
            to learn which event to ask about. An explicit `lead_event` still
            wins over the suggestion. If nothing in the window can serve as a
            conversion you get a `422 no_usable_conversion_event` rather than an
            analysis of a dead funnel.
          required: false
          schema:
            type: string
            default: transaction_completed
        - name: lead_event
          in: query
          description: >
            Optional mid-funnel event. Supplying it splits the on-site step into
            `landing` and `sales`. Must differ from `conversion_event`.
          required: false
          schema:
            type: string
        - name: min_impressions
          in: query
          description: >
            Rows below this many impressions are excluded from the analysis but
            still counted in the pooled benchmarks — dropping them from the pool
            would inflate the bar the surviving rows are judged against.
          required: false
          schema:
            type: integer
            default: 1000
        - name: campaign
          in: query
          description: >
            Drill into one campaign, matched by campaign id **or** name
            (trimmed, case-insensitive). With `group_by=adset` or `ad` it scopes
            the rows to that campaign's children. Benchmarks stay the
            account-wide pooled rates, so the campaign is still judged against
            the whole account — that comparison is the point of the drilldown.
            If nothing matches, the response carries a `campaign_not_found`
            diagnostic instead of a silent empty list.
          required: false
          schema:
            type: string
        - name: revenue_path
          in: query
          description: >
            JSON path to the conversion's monetary value inside the event's
            properties. `properties_json` *is* the properties object, so the
            path is `$.value`, not `$.properties.value`.
          required: false
          schema:
            type: string
            default: $.value
        - name: table
          in: query
          description: Meta insights table in the client's dataset, if it differs from the platform default.
          required: false
          schema:
            type: string
            default: meta_ads_ads_insights_action_type
        - name: attribution_window_days
          in: query
          description: >
            How long after a campaign touch a conversion may still be credited to
            it. A conversion with no session of its own (all CRM/server-side
            conversions) is credited to the person's nearest campaign touch inside
            this window; touches are looked up back to `from` minus the window, so
            early-window conversions still find the visit that earned them.
            Meta's own default is 7-day click — pass 7 for numbers comparable to
            Ads Manager. Pass 0 for strict own-session credit only (disables
            person crediting; the conservative reading).
          required: false
          schema:
            type: integer
            default: 30
            minimum: 0
            maximum: 365
        - name: include
          in: query
          description: >
            Comma-separated optional sections, all **off by default**:
            `include=creative,audit,events`.

            `creative` adds each row's ad copy, destination and assets. Off by
            default because it is not free: measured on one client it scans
            285.9 MB on every call at every grain, independent of the report
            window (the creatives table sits in a single partition that nothing
            prunes, and one JSON column is 139 MB of it). If you join creative
            yourself, leave it off. Row labels are unaffected — `ad_name` comes
            from ads-insights and `top_landing_page` from sessions.

            `audit` returns the tracking-hygiene report (the same body as
            `/constraints/audit`) under an `audit` key, and `events` returns the
            event inventory (`/constraints/events`) under `event_inventory`.
            These stay separate BigQuery jobs — one request cannot make them one
            scan — but they run **in parallel** with the analysis, so a caller
            that needed all three stops paying three serial round trips and pays
            the slowest one instead.

            A section that fails is reported as `{"unavailable": "<reason>"}`
            inside a 200; the analysis itself is never failed by it. An unknown
            name is a `400` rather than a silent omission.
          required: false
          schema:
            type: string
            example: audit,events
        - name: resolve_identities
          in: query
          description: >
            Identity stitching — resolve people through the central identity
            snapshots (merge tombstones collapsed) rather than the raw
            `distinct_id`. **On by default**, and you almost never want it off.

            A CRM/server-side conversion arrives with no session of its own, so
            credit can only reach a campaign through the person; the conversion's
            `distinct_id` is a CRM contact id that shares nothing with the
            browsing device's id until the snapshot maps both onto one person.
            Measured on one client over 30 days (273 conversions): the raw
            `distinct_id` could credit 10% of conversions to a paid touch,
            canonical persons credited 81%.

            Pass `false` (or `0`) to opt out — useful only to reproduce a figure
            from before this was the default. `conversion_attribution.identity_resolution`
            reports how much of the resolution actually worked.
          required: false
          schema:
            type: boolean
            default: true
        - name: benchmark_ad
          in: query
          description: >
            Target rate for the `impressions -> clicks` step, replacing the
            account's pooled rate. A rate between 0 and 1 — a 2% CTR target is
            `0.02`. Values above 1 are rejected, not interpreted as percentages.
          required: false
          schema:
            type: number
            format: double
            minimum: 0
            exclusiveMinimum: true
            maximum: 1
        - name: benchmark_tracking
          in: query
          description: Target rate for the `clicks -> sessions` step. Rate between 0 and 1.
          required: false
          schema:
            type: number
            format: double
            minimum: 0
            exclusiveMinimum: true
            maximum: 1
        - name: benchmark_landing
          in: query
          description: >
            Target rate for the `sessions -> leads` step. Rate between 0 and 1.
            Requires `lead_event`; without it this step does not exist and the
            request is rejected.
          required: false
          schema:
            type: number
            format: double
            minimum: 0
            exclusiveMinimum: true
            maximum: 1
        - name: benchmark_sales
          in: query
          description: >
            Target rate for the `leads -> conversions` step. Rate between 0 and 1.
            Requires `lead_event`.
          required: false
          schema:
            type: number
            format: double
            minimum: 0
            exclusiveMinimum: true
            maximum: 1
        - name: benchmark_site
          in: query
          description: >
            Target rate for the combined `sessions -> conversions` step. Rate
            between 0 and 1. Only valid WITHOUT `lead_event`, which splits this
            step into `landing` and `sales`.
          required: false
          schema:
            type: number
            format: double
            minimum: 0
            exclusiveMinimum: true
            maximum: 1
      responses:
        "200":
          description: Funnel and constraint per row, plus the benchmarks and tracking diagnostics they rest on.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      window:
                        type: object
                        properties:
                          from: { type: string, format: date }
                          to: { type: string, format: date }
                      grain: { type: string, enum: [campaign, adset, ad] }
                      campaign:
                        type: string
                        description: Echo of the `campaign` drilldown filter. Absent when no filter was passed.
                      attribution: { type: string, enum: [session, first_touch] }
                      conversion_event: { type: string }
                      lead_event: { type: string, nullable: true }
                      steps:
                        type: array
                        description: The funnel steps in order, and the metric each divides.
                        items:
                          type: object
                          properties:
                            step: { type: string, enum: [ad, tracking, landing, sales, site] }
                            from: { type: string }
                            to: { type: string }
                      benchmarks:
                        type: object
                        description: >
                          The **account-level** rate per step: a request override where
                          supplied, else your stored account default, else the account's
                          own pooled rate. A campaign with a stored target of its own is
                          NOT judged against this — read that row's own `benchmarks`.
                        additionalProperties: { type: number, nullable: true }
                      benchmark_sources:
                        type: object
                        description: >
                          Where each account-level benchmark came from. Lets a caller
                          comparing two runs tell whether a verdict moved because
                          performance changed or because the target did.
                        additionalProperties: { type: string, enum: [override, stored_default, pooled] }
                      pooled_rates:
                        type: object
                        description: >
                          What the account actually does, per step — reported even where
                          a target replaced it. A target far above the pooled rate makes
                          every campaign report the same constraint.
                        additionalProperties: { type: number, nullable: true }
                      stored_benchmarks:
                        type: object
                        description: >
                          The stored targets in play, and what they did. Present whenever
                          the stored targets could be read (an empty `default` and
                          `campaigns` simply means none are set).
                        properties:
                          default:
                            type: object
                            additionalProperties: { type: number }
                          default_notes:
                            type: object
                            additionalProperties: { type: string }
                          campaigns:
                            type: array
                            items:
                              type: object
                              properties:
                                campaign: { type: string }
                                benchmarks:
                                  type: object
                                  additionalProperties: { type: number }
                                notes:
                                  type: object
                                  additionalProperties: { type: string }
                                matched_rows:
                                  type: integer
                                  description: >
                                    How many rows this scope was applied to. **0 means the
                                    target hit nothing** in this window — a renamed
                                    campaign, a typo, or no spend. Otherwise a stale
                                    target is silently dead weight.
                          not_applicable_steps:
                            type: array
                            description: >
                              Stored steps this funnel shape has no slot for — a `site`
                              target while `lead_event` splits the funnel into
                              landing + sales. Legal and expected; reported so it is
                              distinguishable from a target being ignored. Present only
                              when non-empty.
                            items: { type: string }
                          not_applicable_reason: { type: string }
                      stored_benchmarks_unavailable:
                        type: string
                        description: >
                          Present only if the stored targets could not be read. The
                          analysis is still valid — every step was judged against the
                          pooled rate or a request param — but your stored targets were
                          NOT applied. Never silently omitted.
                      tracking:
                        type: object
                        description: The credibility of everything else in the response.
                        properties:
                          matched_sessions: { type: integer }
                          unmatched_sessions:
                            type: integer
                            description: Sessions arriving on an ad click whose UTMs resolved to no synced Meta row.
                          match_rate: { type: number, nullable: true }
                          joined_by_id:
                            type: integer
                            description: Sessions matched on a Meta id (exact, survives renames).
                          joined_by_url_param:
                            type: integer
                            description: >
                              Sessions matched because the grain's id was in the landing URL's
                              query string (`ad_id=`, `adset_id=`, `campaign_id=`) rather than
                              a UTM. On accounts whose tag template points `utm_content` at
                              the ad SET name, this is the difference between an ad-grain
                              funnel and an empty one.
                          grain_resolvable:
                            type: boolean
                            description: >
                              False when no row with clicks resolved any session at this
                              grain — the session-dependent steps are unknown here, not zero.
                              Pairs with the `grain_unresolvable` diagnostic.
                          joined_by_name:
                            type: integer
                            description: >
                              Sessions matched on campaign name (breaks when a campaign
                              is renamed mid-window). Names arrive percent-encoded from
                              the URL and are compared with escapes and punctuation
                              removed, so `GPM+%7C+Brand` matches `GPM | Brand`.
                          click_to_session_rate: { type: number, nullable: true }
                          unexpanded_macro:
                            type: object
                            description: >
                              Present only when some sessions carry an ad-platform
                              macro that was never substituted — `{{campaign.name}}`
                              passed through verbatim, or a misspelling like
                              `{campaignname}` that Meta does not recognise. These
                              clicks can never be attributed, and no matching can
                              repair them: the fix is in the ad's URL tags. Absent
                              when there is nothing to report.
                            properties:
                              sessions: { type: integer }
                              sample:
                                type: string
                                description: One of the literals found, so the tag can be located.
                              message: { type: string }
                      conversion_attribution:
                        type: object
                        description: >
                          How every conversion in the window was credited. On a
                          CRM-fed client `credited_via_person` is usually the
                          majority — those conversions carry no session at all.
                        properties:
                          window_days: { type: integer }
                          identity: { type: string, enum: [distinct_id, canonical_person] }
                          total_conversions_in_window:
                            type: integer
                            nullable: true
                            description: "`null` when the window had no ad rows or campaign traffic at all — unknown, not zero."
                          credited_via_session:
                            type: integer
                            nullable: true
                            description: Credited to their own campaign-resolved session.
                          credited_via_person:
                            type: integer
                            nullable: true
                            description: Credited to the person's nearest campaign touch in the window (touches searched back to `from` minus the window).
                          uncredited:
                            type: integer
                            nullable: true
                            description: No campaign touch for that person within the attribution window — raise `attribution_window_days` if the sales cycle is longer.
                          credited_coverage:
                            type: number
                            nullable: true
                            description: >
                              `(credited_via_session + credited_via_person) / total`. The
                              share of the truth the landing/sales/site steps can see. Below
                              0.5 the response carries a `low_conversion_coverage` warning
                              and those steps' verdicts are marked `confidence: low`.
                          identity_resolution:
                            type: object
                            nullable: true
                            description: >
                              How well identity stitching worked — the ceiling on everything
                              else here. A conversion that never resolved to a canonical
                              person could not be credited at all, so a low
                              `conversions_resolved_rate` is the first thing to check when
                              attribution looks worse than expected (it usually means the
                              identity snapshot export has stalled).
                            properties:
                              enabled: { type: boolean }
                              conversions_resolved_to_person: { type: integer }
                              conversions_resolved_rate: { type: number, nullable: true }
                              distinct_converting_persons:
                                type: integer
                                description: Distinct canonical people behind this window's conversions.
                      diagnostic:
                        type: object
                        description: >
                          Present ONLY when nothing could be credited (or the
                          `campaign` filter matched nothing). Without it the
                          response would be `constraint: null` on every row, which is
                          indistinguishable from a healthy account.
                        properties:
                          code: { type: string, enum: [no_campaign_data, no_conversion_events, no_conversions_attributed, campaign_not_found, grain_unresolvable] }
                          message: { type: string }
                      audit:
                        type: object
                        description: >
                          Present only with `include=audit` — the same body as
                          `/constraints/audit`, or `{unavailable}` if that section failed.
                      event_inventory:
                        type: object
                        description: >
                          Present only with `include=events` — the same body as
                          `/constraints/events`, or `{unavailable}` if that section failed.
                      auto_selected:
                        type: object
                        description: >
                          Present only with `conversion_event=auto` — what it chose and out
                          of how many candidates. Note `chosen_from` is nested here, not a
                          top-level field. If you read this, you do not need
                          `include=events` as well: the choice is already reported.
                        properties:
                          conversion_event: { type: string }
                          lead_event: { type: string, nullable: true }
                          revenue_path: { type: string }
                          chosen_from:
                            type: integer
                            description: How many events were inventoried before picking.
                        example:
                          conversion_event: transaction_completed
                          lead_event: input_captured
                          revenue_path: $.meta_amount
                          chosen_from: 20
                      warning:
                        type: object
                        description: >
                          Present when the data is usable but partial —
                          `low_conversion_coverage` means under half of this window's
                          conversions could be credited to any campaign touch, so the
                          conversion-denominated steps see only that share. Row order is
                          deliberately NOT changed by this: a ranking that shifted silently
                          with coverage could not be compared across runs.
                        properties:
                          code: { type: string, enum: [low_conversion_coverage] }
                          message: { type: string }
                      excluded_low_volume: { type: integer }
                      min_impressions: { type: integer }
                      rows:
                        type: array
                        description: Ordered by opportunity — largest `recoverable_conversions` first, which is not spend order.
                        items:
                          type: object
                          description: >
                            Keyed by grain — `campaign_id`/`campaign_name` at the default
                            grain, `adset_id`/`adset_name` or `ad_id`/`ad_name` otherwise
                            (those rows also carry the parent `campaign_id` and
                            `campaign_name`, which is what the `campaign` filter matches).
                          properties:
                            campaign_id: { type: string, nullable: true }
                            campaign_name: { type: string, nullable: true }
                            impressions: { type: integer }
                            clicks:
                              type: integer
                              description: Outbound link clicks, not total clicks — likes and comments are not traffic.
                            spend: { type: number }
                            sessions: { type: integer }
                            lead_sessions: { type: integer }
                            converting_sessions: { type: integer }
                            conversions: { type: integer }
                            revenue: { type: number }
                            top_landing_page: { type: string, nullable: true }
                            cpa: { type: number, nullable: true }
                            roas:
                              type: number
                              nullable: true
                              description: revenue ÷ spend, no currency conversion — spend is in the ad account's currency, revenue in your events'.
                            funnel:
                              type: object
                              description: Rate per step, keyed `<from>_to_<to>`. `null` where the denominator is zero.
                              additionalProperties: { type: number, nullable: true }
                            benchmarks:
                              type: object
                              description: >
                                The bar **this row** was judged against, per step. Differs
                                from the account-level `benchmarks` when the row's campaign
                                has a stored target of its own. Always present, even when
                                identical.
                              additionalProperties: { type: number, nullable: true }
                            benchmark_sources:
                              type: object
                              description: >
                                Where each of this row's benchmarks came from:
                                `override` (request param), `stored_campaign` (a target
                                stored for this campaign), `stored_default` (your account
                                default), or `pooled` (the account's measured rate).
                              additionalProperties:
                                type: string
                                enum: [override, stored_campaign, stored_default, pooled]
                            creative:
                              type: object
                              description: >
                                What the ad actually SAYS and where it POINTS — always
                                present, and never a bare `null`. When the copy cannot be
                                read the object carries `unavailable` plus a `reason_code`
                                instead, because a consumer must be able to tell "this ad
                                says X" from "we could not read this ad, and here is why".

                                At `group_by=ad` the creative is exact. At coarser grains it
                                is the **most-delivered** ad's creative and
                                `is_representative` is `true`.
                              properties:
                                is_representative:
                                  type: boolean
                                  description: True at adset/campaign grain — this is the most-delivered ad's creative standing in for a row with many ads.
                                headline: { type: string, nullable: true }
                                body: { type: string, nullable: true }
                                description: { type: string, nullable: true }
                                call_to_action:
                                  type: string
                                  nullable: true
                                  description: Meta's CTA enum, e.g. `LEARN_MORE`, `SIGN_UP`.
                                destination_url:
                                  type: string
                                  nullable: true
                                  description: >
                                    The bare link as Meta stores it. **It does not carry the
                                    UTMs** — Meta keeps those in `url_tags` and appends them at
                                    click time, so this alone looks untagged even on a
                                    correctly tagged ad.
                                effective_destination_url:
                                  type: string
                                  nullable: true
                                  description: >
                                    `destination_url` + `url_tags`, i.e. what the visitor's
                                    browser actually requests (macros still unexpanded). The
                                    field to compare against a landing page.
                                display_url: { type: string, nullable: true }
                                url_tags:
                                  type: string
                                  nullable: true
                                  description: >
                                    The ad's tracking-parameter template, verbatim, with macros
                                    unexpanded — e.g.
                                    `utm_content={{adset.name}}&ad_id={{ad.id}}`. The only field
                                    that says whether an ad is tagged at all, independently of
                                    whether any session ever arrived from it. Read it when a
                                    grain is unmeasurable: it shows exactly which key is missing.
                                image_url: { type: string, nullable: true }
                                video_id: { type: string, nullable: true }
                                format:
                                  type: string
                                  enum: [image, video, carousel, unknown]
                                  description: Derived from the assets present, not from Meta's internal `object_type` (which is `SHARE` for anything link-based, carousels included).
                                asset_count: { type: integer }
                                assets:
                                  type: array
                                  description: Carousel cards, in order. Present only for carousels.
                                  items:
                                    type: object
                                    properties:
                                      headline: { type: string, nullable: true }
                                      body: { type: string, nullable: true }
                                      image_url: { type: string, nullable: true }
                                      link: { type: string, nullable: true }
                                unavailable:
                                  type: string
                                  description: Human-readable reason the copy could not be read. Present instead of the content fields.
                                reason_code:
                                  type: string
                                  enum: [creative_not_synced, no_creative_on_ad, creative_empty]
                                  description: >
                                    `creative_not_synced` — the Meta Ad Creatives streams are not
                                    synced for this ad account (a fixable Airbyte setting, and by
                                    far the most common cause; it is per ad ACCOUNT, not per ad).
                                    `no_creative_on_ad` — the ad carries no creative reference
                                    (deleted or draft). `creative_empty` — a creative row exists
                                    but holds no readable copy, destination or asset.
                            converting_persons:
                              type: integer
                              description: Distinct canonical people who converted through this row.
                            person_ids:
                              type: array
                              description: >
                                A capped sample (10) of those people's canonical ids. They
                                address `GET /client/v1/data/persons/{id}` directly, so a
                                constraint verdict drills straight through to the profiles
                                behind it. `converting_persons` carries the true count.
                              items: { type: string }
                            measurable:
                              type: object
                              description: >
                                Per step, whether this row could be judged on it at all.
                                `false` means **unknown, not zero** — render it as "can't
                                measure", never as a failure. Every step after `ad` divides a
                                session count, so a row whose grain resolved no sessions is
                                unmeasurable on all of them. A step marked `false` is never
                                reported as the constraint.
                              additionalProperties: { type: boolean }
                            status:
                              type: string
                              enum: [constrained, healthy, unmeasurable]
                              description: >
                                Explicit, so a null constraint reads as "healthy — scale it",
                                never as missing data. `unmeasurable` is the third case: this
                                row got clicks but the grain resolved no sessions, so nothing
                                downstream could be judged.
                            constraint:
                              type: object
                              nullable: true
                              description: The binding step, or `null` when the row is at/above benchmark everywhere.
                              properties:
                                step: { type: string, enum: [ad, tracking, landing, sales, site] }
                                diagnosis: { type: string }
                                rate: { type: number }
                                benchmark_rate: { type: number }
                                benchmark_source:
                                  type: string
                                  enum: [override, stored_campaign, stored_default, pooled]
                                  description: >
                                    Which bar produced this verdict, stated at the verdict
                                    itself — otherwise "ad-constrained" can't be checked
                                    without cross-referencing by hand.
                                benchmark_note:
                                  type: string
                                  description: The note stored with that target, if any (e.g. "Q3 client contract"). Present only for stored benchmarks that carry one.
                                confidence:
                                  type: string
                                  enum: [low]
                                  description: >
                                    Present when this step's numerator is credited conversions
                                    and under half of them could be credited at all. The
                                    verdict is directionally real but built on partial data.
                                confidence_reason: { type: string }
                                rate_vs_benchmark:
                                  type: number
                                  nullable: true
                                  description: Own rate ÷ benchmark. `0.4` means "at 40% of the account's normal rate".
                                recoverable_conversions: { type: number }
                      summary:
                        type: object
                        properties:
                          primary_constraint:
                            type: object
                            nullable: true
                            description: The step constraining the most conversions account-wide.
                            properties:
                              step: { type: string }
                              diagnosis: { type: string }
                              recoverable_conversions: { type: number }
                              entities: { type: integer }
                              spend: { type: number }
                          by_step:
                            type: array
                            items: { type: object }
        "400":
          description: >
            Invalid parameter, or the generated query failed the tenant-scope
            guard. Also `ads_table_unsupported`: the `?table=` you named exists
            but is not shaped like Meta ads-insights. Google Ads tables sit in
            the same dataset and look like the obvious equivalent, but this
            funnel reads Meta only.
        "401":
          description: Missing or invalid key.
        "422":
          description: Result truncated — narrow the window or use a coarser `group_by`.
        "424":
          description: >
            No Meta ads-insights table in this client's dataset, or the client
            has no BigQuery event dataset yet.
        "429":
          description: Rate limited (20 requests per minute per location — each request is a BigQuery scan).
  /client/v1/constraints/audit:
    get:
      summary: Which campaigns are measurable, and where the untracked clicks went
      operationId: getConstraintAudit
      description: >
        Tracking hygiene, per campaign. `GET /client/v1/constraints` reports one
        `match_rate` for the account — enough to know a problem exists, not
        enough to fix it. This takes that number apart: a verdict per campaign,
        plus the ad clicks that reached no campaign at all, bucketed by cause.


        Causes call for different repairs, which is why they are separated
        rather than summed: `no_utm` (the ad has no URL tags), `unexpanded_macro`
        (the tag holds a literal the platform never substituted), and
        `unknown_campaign` (the UTM names something outside the synced rows —
        a deleted campaign, a hand-written UTM, or a different ad account).


        Uses the same window, grain and join as the analysis, so the two agree
        by construction. No conversion, lead or benchmark inputs — nothing here
        depends on them. Unlike the analysis, there is **no volume floor**: a
        small campaign with broken tags is precisely what this should surface.


        Meta only for now.
      tags: [Constraints]
      security:
        - AgencyKey: []
        - LocationKey: []
      parameters:
        - name: location_id
          in: query
          description: Location to scope to. Required for `ak_` keys (or send the `X-Location-Id` header); ignored for `sk_`.
          required: false
          schema:
            type: string
        - name: from
          in: query
          description: Window start (`YYYY-MM-DD`). Defaults to 28 days before `to`.
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Window end (`YYYY-MM-DD`), inclusive. Defaults to yesterday.
          required: false
          schema:
            type: string
            format: date
        - name: days
          in: query
          description: Window length in days, inclusive of both ends. Ignored when `from` is given.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 28
        - name: group_by
          in: query
          description: Grain to audit. `adset`/`ad` key off `utm_content` and are expected to look far worse than `campaign`.
          required: false
          schema:
            type: string
            enum: [campaign, adset, ad]
            default: campaign
        - name: attribution
          in: query
          required: false
          schema:
            type: string
            enum: [session, first_touch]
            default: session
        - name: table
          in: query
          description: Override the Meta ads-insights table name.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Per-campaign verdicts and the untracked-click breakdown.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      window:
                        type: object
                        properties:
                          from: { type: string, format: date }
                          to: { type: string, format: date }
                      grain: { type: string }
                      attribution: { type: string }
                      totals:
                        type: object
                        properties:
                          campaigns: { type: integer }
                          spend: { type: number }
                          flagged:
                            type: integer
                            description: Campaigns with a tracking fault. Excludes `no_clicks`, which is not one.
                          flagged_spend:
                            type: number
                            description: >
                              Spend whose effect cannot be measured. This is the number
                              that justifies the fix.
                          matched_sessions: { type: integer }
                          untracked_sessions: { type: integer }
                          match_rate:
                            type: number
                            nullable: true
                            description: Same definition as `tracking.match_rate` on the analysis endpoint.
                      campaigns:
                        type: array
                        items:
                          type: object
                          properties:
                            campaign_id: { type: string }
                            campaign_name: { type: string }
                            impressions: { type: integer }
                            clicks: { type: integer }
                            spend: { type: number }
                            sessions: { type: integer }
                            sessions_by_id: { type: integer }
                            sessions_by_name: { type: integer }
                            click_to_session_rate: { type: number, nullable: true }
                            verdict:
                              type: string
                              enum: [ok, no_clicks, no_sessions, low_tracking, name_only]
                              description: >
                                `no_sessions` — clicks produced no tracked visit at all.
                                `low_tracking` — under 10% of clicks arrived.
                                `name_only` — matched entirely on campaign name, so it
                                breaks the next time the campaign is renamed.
                                `no_clicks` — no delivery, so nothing to track yet; not
                                a fault and not counted in `flagged`.
                            issue: { type: string, nullable: true }
                            fix:
                              type: string
                              nullable: true
                              description: >
                                What to change. For `no_sessions` this deliberately names
                                two possibilities: an on-platform objective (lead form,
                                engagement, messaging) never sends a visit, so zero
                                sessions is the correct reading for it. Telling the two
                                apart needs the campaign objective, which the
                                ads-insights table does not carry.
                      untracked_sessions:
                        type: object
                        description: Ad clicks that reached no campaign. An empty list is a real, good answer.
                        properties:
                          total: { type: integer }
                          by_cause:
                            type: array
                            description: Largest bucket first.
                            items:
                              type: object
                              properties:
                                cause:
                                  type: string
                                  enum: [no_utm, unexpanded_macro, unknown_campaign]
                                sessions: { type: integer }
                                sample:
                                  type: string
                                  nullable: true
                                  description: A representative value, so the offending tag can be located.
                                top_landing_page: { type: string, nullable: true }
                                fix: { type: string, nullable: true }
        "400":
          description: Invalid parameter, or `ads_table_unsupported` — the `?table=` named is not a Meta ads-insights table.
        "401":
          description: Missing or invalid key.
        "424":
          description: No Meta ads-insights table in this client's dataset.
        "429":
          description: Rate limited (20 requests per minute per location — each request is a BigQuery scan).
  /client/v1/constraints/events:
    get:
      summary: Which events can serve as the lead / conversion step
      operationId: listConstraintEvents
      description: >
        Inventories every non-system event in the window with its volume, its
        **session coverage**, and which JSON paths carry a monetary value — then
        suggests a `conversion_event` / `lead_event` / `revenue_path` you can pass
        straight to the main endpoint.

        Session coverage is why this exists. The funnel is session-grained, so an
        event's coverage is a ceiling on what the analysis can see. Server-side
        conversions (CRM/webhook over Pub/Sub) never touch the browser and carry
        no `session_id`: choosing one would yield a funnel with zero conversions
        that the constraint logic then attributes to the landing page. Neither
        `/client/v1/data/events/breakdown` nor `/client/v1/data/properties`
        reports coverage, which is the gap this fills.

        Reads only the events view — it does not require a synced Meta table.
      parameters:
        - name: location_id
          in: query
          description: Location to scope to. Required for `ak_` keys (or send the `X-Location-Id` header).
          required: false
          schema:
            type: string
        - name: from
          in: query
          description: Window start (`YYYY-MM-DD`). Defaults to 28 days before `to`.
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Window end (`YYYY-MM-DD`), inclusive. Defaults to yesterday.
          required: false
          schema:
            type: string
            format: date
        - name: days
          in: query
          description: >
            Window length in days, inclusive of both ends — the same shorthand
            `/client/v1/data` takes. `days=90` ending yesterday is the usual
            call. Ignored when `from` is given explicitly. Out-of-range values
            are rejected, not clamped.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 28
      responses:
        "200":
          description: Per-event verdicts and a suggested pairing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      window:
                        type: object
                        properties:
                          from: { type: string, format: date }
                          to: { type: string, format: date }
                      suggested:
                        type: object
                        nullable: true
                        description: >
                          A usable pairing, or `null` when no event is usable. Prefers
                          the conversion event the analysis itself defaults to, so the
                          two endpoints never recommend different funnels. The lead
                          event is always session-bearing: the landing step is measured
                          per session, so a session-less event would report zero there
                          and blame the page.
                        properties:
                          conversion_event: { type: string }
                          revenue_path: { type: string, nullable: true }
                          lead_event:
                            type: string
                            nullable: true
                            description: >
                              A session-bearing event strictly more common than the
                              conversion event, or `null`.
                          note:
                            type: string
                            description: Present only when there is no obvious lead step.
                      events:
                        type: array
                        items:
                          type: object
                          properties:
                            event_name: { type: string }
                            total_events: { type: integer }
                            sessions:
                              type: integer
                              description: Distinct sessions carrying at least one of these events.
                            session_coverage:
                              type: number
                              nullable: true
                              description: >
                                Share of these events carrying a session_id. Zero is
                                normal and not disqualifying — see `usable`.
                            person_coverage:
                              type: number
                              nullable: true
                              description: >
                                Share carrying a person. A session-less event is still
                                creditable through the person's nearest paid touch, so
                                this is what decides usability on a CRM-fed client.
                            credited_via:
                              type: string
                              nullable: true
                              enum: [session, person]
                              description: How this event would reach a campaign, or `null` if it cannot.
                            revenue_paths:
                              type: array
                              description: JSON paths that actually hold a castable number for this event.
                              items: { type: string }
                            suggested_revenue_path: { type: string, nullable: true }
                            usable:
                              type: boolean
                              description: >
                                Whether this event can be credited to a campaign at all.
                                `true` for a session-less CRM event that carries a
                                person — those are credited to that person's nearest
                                paid touch within `attribution_window_days`, and on a
                                CRM-fed client they are the only revenue events there
                                are. `false` only when neither a session nor a person
                                is present.
                            suggested_role: { type: string, enum: [conversion, lead] }
                            warning:
                              type: string
                              description: >
                                Present when credit will come via person rather than
                                session, when session coverage is below 50%, or when
                                the event cannot be credited at all.
        "401":
          description: Missing or invalid key.
        "424":
          description: This client has no BigQuery event dataset yet.
        "429":
          description: Rate limited (20 requests per minute per location).
  /client/v1/constraints/options:
    get:
      summary: Discover the available knobs
      operationId: getConstraintOptions
      description: The valid `group_by` and `attribution` values plus every default, so a consumer never has to guess an enum.
      responses:
        "200":
          description: Enumerated options and defaults.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      group_by:
                        type: array
                        items: { type: string }
                      attribution:
                        type: array
                        items: { type: string }
                      benchmark_params:
                        type: array
                        description: Every accepted `benchmark_<step>` parameter name.
                        items: { type: string }
                      revenue_paths_probed:
                        type: array
                        description: JSON paths the events probe checks for a monetary value.
                        items: { type: string }
                      defaults: { type: object }
                      hints: { type: object }

  /client/v1/constraints/benchmarks:
    get:
      summary: List stored benchmark targets
      operationId: listConstraintBenchmarks
      description: >
        The standing targets on file for this location: an account-wide default
        scope, plus one entry per campaign. These are applied automatically by
        the analysis endpoint — you never pass them on the request.

        Every response restates `precedence`, the order the analysis resolves a
        step's benchmark in: a `benchmark_<step>` query param beats a stored
        campaign target, which beats the stored account default, which beats the
        account's own pooled rate.
      parameters:
        - name: location_id
          in: query
          description: Location to scope to. Required for `ak_` keys (or send the `X-Location-Id` header); ignored for `sk_`.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The stored state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/BenchmarkState" }
    put:
      summary: Set the benchmark targets for one scope
      operationId: setConstraintBenchmarks
      description: >
        Store targets for the account (omit `campaign`) or for a single campaign
        (`campaign` = its Meta id or name, matched case-insensitively against
        both). Requires an agency key (`ak_`) — `sk_` keys are read-only.

        **This REPLACES the scope.** The body is the complete set of targets for
        it, so a step you previously stored and now omit is cleared and falls
        back to the next source in `precedence`. The response echoes the
        resulting state so the replacement is never invisible.

        Rates are fractions between 0 and 1 — a 2% CTR target is `0.02`. A value
        above 1 is rejected rather than interpreted.

        Prefer keying by campaign **id**: a name-keyed target stops matching when
        the campaign is renamed. The analysis reports `matched_rows: 0` for a
        target that hit nothing, which is how you spot one that has gone stale.
      parameters:
        - name: location_id
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [benchmarks]
              properties:
                campaign:
                  type: string
                  description: Campaign id or name. Omit (or send null) for the account-wide default scope.
                benchmarks:
                  type: object
                  description: >
                    Step → rate. Valid steps are `ad`, `tracking`, `landing`,
                    `sales`, `site`. Unlike the query params, a stored scope may
                    hold both `site` and `landing`/`sales` targets — which apply
                    depends on whether the analysis request passes `lead_event`,
                    and the analysis reports any that sat out.
                  additionalProperties:
                    type: number
                    minimum: 0
                    exclusiveMinimum: true
                    maximum: 1
                  example: { ad: 0.02, landing: 0.1 }
                note:
                  type: string
                  maxLength: 500
                  description: Where the target came from (client contract, category median). Surfaced next to the verdict it produced, so a benchmark is always traceable.
            example:
              campaign: "120210000000000000"
              benchmarks: { ad: 0.02, landing: 0.1 }
              note: "Q3 client contract"
      responses:
        "200":
          description: Saved, with the resulting state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    allOf:
                      - $ref: "#/components/schemas/BenchmarkState"
                      - type: object
                        properties:
                          saved:
                            type: object
                            properties:
                              scope: { type: string, description: "`account_default` or the campaign key." }
                              campaign: { type: string, nullable: true }
                              benchmarks: { type: object, additionalProperties: { type: number } }
                          note: { type: string, description: Reminder that PUT replaces the scope. }
        "400":
          description: A rate outside 0–1, an unknown step, an empty `benchmarks`, or a blank `campaign`.
        "403":
          description: Writes require an agency key (`ak_`).
    delete:
      summary: Clear a scope, or one step of it
      operationId: deleteConstraintBenchmarks
      description: >
        Clears the account default (no `campaign`) or one campaign's scope.
        Narrow it to a single step with `step=`. Never clears more than the one
        scope named. Requires an agency key (`ak_`).
      parameters:
        - name: campaign
          in: query
          description: Campaign scope to clear. Omit to clear the account-wide default — symmetric with PUT.
          required: false
          schema:
            type: string
        - name: step
          in: query
          description: Clear only this step. Omit to clear every step in the scope.
          required: false
          schema:
            type: string
            enum: [ad, tracking, landing, sales, site]
        - name: location_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Cleared, with the resulting state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    allOf:
                      - $ref: "#/components/schemas/BenchmarkState"
                      - type: object
                        properties:
                          cleared:
                            type: object
                            properties:
                              scope: { type: string }
                              campaign: { type: string, nullable: true }
                              # Block style, not flow: an unquoted comma inside a
                              # `{ ... }` mapping starts a NEW key, so
                              # "description: The step cleared, or `all`." parsed
                              # as a description plus a junk key and failed
                              # validation for the whole spec.
                              step:
                                type: string
                                description: "The step cleared, or `all`."
                              removed:
                                type: integer
                                description: How many stored targets were removed.
        "403":
          description: Writes require an agency key (`ak_`).
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        Agency key (`ak_`) or location secret key (`sk_`).
        Scoped keys (`mcp_`) are accepted too and need `constraints:read` or `constraints:write`. See [Using an mcp_ key over HTTP](/mcp/authentication).
  schemas:
    BenchmarkState:
      type: object
      description: The stored benchmark targets for a location, returned by every /benchmarks call.
      properties:
        default:
          type: object
          description: Account-wide targets, step → rate. Applies to any campaign without one of its own.
          additionalProperties: { type: number }
          example: { ad: 0.015 }
        default_notes:
          type: object
          description: Present only where a note was stored.
          additionalProperties: { type: string }
        campaigns:
          type: array
          description: One entry per campaign scope on file.
          items:
            type: object
            properties:
              campaign:
                type: string
                description: The id or name this scope is keyed on. Ids survive a rename; names do not.
              benchmarks:
                type: object
                additionalProperties: { type: number }
              notes:
                type: object
                additionalProperties: { type: string }
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Most recent write across every scope.
        precedence:
          type: array
          description: The resolution order, highest first — restated on every response because it is the rule most easily got wrong.
          items: { type: string }
        valid_steps:
          type: array
          items: { type: string, enum: [ad, tracking, landing, sales, site] }
