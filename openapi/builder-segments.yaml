openapi: "3.0.0"
info:
  version: 1.0.0
  title: Segments
  description: >-
    Reusable audience definitions over resolved people. A segment is a named set
    of person-attribute filters and/or event conditions ("did Purchase in the
    last 90 days", "visited /pricing in the last 30 days") scoped to a single
    client location.


    Attribute-only segments are computed at read time, so they always reflect
    the current person graph. Segments with `events` are materialized: the
    first read computes membership and later reads are served from that run
    until it is 15 minutes old, when the next read returns the existing run and
    recomputes in the background. `count` and `members` responses carry
    `computed_at` and `stale` for these segments, and the segment row carries a
    `membership` object with the run status.
servers:
  - url: https://mythic-analytics.gulp.workers.dev/builder
security:
  - BearerAuth: []
paths:
  /segments:
    get:
      summary: List segments
      operationId: listSegments
      description: >
        List segments for the resolved location, newest-updated first. Readable
        with an agency key (`ak_`) or a viewer key (`sk_`). Agency keys must pass
        `?location_id=`.
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Segments for the location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentListResponse"
        "401":
          description: Authorization key missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Create or update segment
      operationId: saveSegment
      description: >
        Create a new segment, or update an existing one when an `id` is included
        in the body. Requires an agency key (`ak_`) and `?location_id=`. The
        `definition` is validated against the filter whitelist; unknown filters
        or bad types are rejected. Returns the saved row.
      parameters:
        - $ref: "#/components/parameters/LocationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveSegmentRequest"
      responses:
        "200":
          description: Segment created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentResponse"
        "400":
          description: Missing `?location_id=`, missing `name`, or invalid `definition`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Write access requires an agency key (`ak_`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /segments/{id}:
    get:
      summary: Retrieve segment
      operationId: getSegment
      description: Fetch a single segment by ID. Must belong to the resolved location.
      parameters:
        - $ref: "#/components/parameters/SegmentId"
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: The segment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentResponse"
        "404":
          description: Segment not found for this location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: Update segment
      operationId: patchSegment
      description: >
        Partially update a segment (`name`, `description`, `is_favorite`,
        `definition`). A patched `definition` is re-validated. Requires an agency
        key (`ak_`).
      parameters:
        - $ref: "#/components/parameters/SegmentId"
        - $ref: "#/components/parameters/LocationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchSegmentRequest"
      responses:
        "200":
          description: Segment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid `definition`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Write access requires an agency key (`ak_`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete segment
      operationId: deleteSegment
      description: Permanently delete a segment scoped to the resolved location. Requires an agency key (`ak_`).
      parameters:
        - $ref: "#/components/parameters/SegmentId"
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Segment deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          description: Write access requires an agency key (`ak_`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /segments/{id}/count:
    get:
      summary: Count segment members
      operationId: countSegmentMembers
      description: >
        Number of people matching the segment. Readable with either key type.
        Attribute-only segments are computed live against the person graph.
        Segments with `events` are served from the materialized run and the
        response says when it was computed.
      parameters:
        - $ref: "#/components/parameters/SegmentId"
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Member count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 128
                  computed_at:
                    type: string
                    format: date-time
                    description: Segments with `events` only. When the served membership run was computed.
                  stale:
                    type: boolean
                    description: Segments with `events` only. `true` when the run is older than 15 minutes and a recompute was started in the background.
        "404":
          description: Segment not found for this location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            `segment_too_large`: the event conditions match more than 500,000
            identities. Narrow the definition with `within_days` or filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /segments/{id}/members:
    get:
      summary: List segment members
      operationId: listSegmentMembers
      description: >
        People matching the segment, newest activity first, paginated with
        `limit`/`offset`. Readable with either key type. For segments with
        `events` the response also carries `computed_at` and `stale` (see
        count).
      parameters:
        - $ref: "#/components/parameters/SegmentId"
        - $ref: "#/components/parameters/LocationId"
        - name: limit
          in: query
          required: false
          description: Max members to return (1–1000).
          schema:
            type: integer
            default: 50
            maximum: 1000
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Matching people
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentMembersResponse"
        "404":
          description: Segment not found for this location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        Builder key as a bearer token. Use an agency key for full CRUD
        (`Bearer ak_...`) or a viewer key for read-only access (`Bearer sk_...`).
        Scoped keys (`mcp_`) are accepted too and need `segments:read` or `segments:write`. See [Using an mcp_ key over HTTP](/mcp/authentication).
  parameters:
    SegmentId:
      name: id
      in: path
      required: true
      description: Segment UUID.
      schema:
        type: string
        format: uuid
    LocationId:
      name: location_id
      in: query
      required: false
      description: >-
        Client location to scope the request to. Required when authenticating
        with an agency key (`ak_`). Ignored for viewer keys (`sk_`).
      schema:
        type: string
        example: acme-retail
  schemas:
    SegmentDefinition:
      type: object
      description: >-
        Person-attribute filters plus an optional `events` list of event
        conditions. Everything present combines with AND. Any subset may be
        used; at least one filter or condition is required. Unknown keys are
        rejected.


        Examples: `{ "events": [{ "event": "Purchase" }] }` = people who have
        ever done Purchase. `{ "events": [{ "event": "$pageview", "within_days":
        30, "filters": [{ "property": "$pathname", "op": "eq", "value": "/xyz" }]
        }] }` = people who visited /xyz in the last 30 days.


        The `attribution` field picks which touch the attribution filters
        (`channel`, `utm_source`, `utm_medium`, `utm_campaign`, `country`, `device_type`)
        match against — `last` (default), `first`, or `session`. Example:
        `{ "utm_source": "fb", "attribution": "session" }` = "everyone who
        ever had a session that arrived via fb".
      properties:
        events:
          type: array
          maxItems: 5
          description: >-
            Event conditions; every condition must hold. A person matches a
            condition when any identity of theirs has at least `min_count`
            events named `event` inside the last `within_days` days whose
            properties pass `filters`. Segments with event conditions are
            materialized (see the API description). The attribute filters of
            such a segment are evaluated at the same time as the events, not
            live.
          items:
            $ref: "#/components/schemas/SegmentEventCondition"
        attribution:
          type: string
          enum: [first, last, session]
          default: last
          description: >-
            Touch the attribution filters match against. `last` (default):
            the person's most recent touch. `first`: their first-ever touch.
            `session`: the person had ANY session whose entry matches — with
            this scope only `utm_source`, `utm_medium`, `utm_campaign`,
            `country`, and `device_type` may be used (other filters are person-level and are
            rejected rather than half-applied). In the Data API's `segment_id`
            scoping, `session` matches visitors directly against the sessions
            store, so it does not depend on identity-graph coverage.
        search:
          type: string
          description: Case-insensitive substring match on name, email, or company.
          example: acme
        has_email:
          type: boolean
          description: Only people with a known email.
        channel:
          type: string
          description: Acquisition channel (exact), per `attribution` scope (first/last only).
          example: organic
        utm_source:
          type: string
          description: utm_source (exact), per `attribution` scope.
          example: google
        utm_medium:
          type: string
          description: utm_medium (exact), per `attribution` scope.
          example: cpc
        utm_campaign:
          type: string
          description: utm_campaign (exact), per `attribution` scope.
        country:
          type: string
          description: Geo country code (exact), per `attribution` scope.
          example: US
        device_type:
          type: string
          description: Device type (exact), per `attribution` scope.
          example: mobile
        min_sessions:
          type: integer
          description: Minimum lifetime session count.
          example: 3
        min_identities:
          type: integer
          description: Minimum number of merged identities.
          example: 2
        active_within_days:
          type: integer
          description: Last seen within the last N days.
          example: 30
        inactive_days:
          type: integer
          description: Last seen more than N days ago (dormant).
          example: 90
        first_seen_within_days:
          type: integer
          description: First seen within the last N days (new people).
          example: 7
    SegmentEventCondition:
      type: object
      required: [event]
      properties:
        event:
          type: string
          maxLength: 128
          description: Event name. `$pageview` for page visits; custom events as sent to the SDK or ingest API.
          example: Purchase
        within_days:
          type: integer
          minimum: 1
          maximum: 730
          description: Only events in the last N days count. Omit for all history.
          example: 30
        min_count:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
          description: The person must have at least N matching events (counted per identity).
        filters:
          type: array
          maxItems: 20
          description: >-
            Event property predicates, all must pass. Same shape as the explore
            query filters: `property` is a typed name (`$pathname`,
            `$current_url`, `$referring_domain`, `utm_source`, `utm_medium`,
            `utm_campaign`, `$device_type`, `$browser`, `$os`, `$geo_country`,
            `$geo_city`) or any custom event property key.
          items:
            type: object
            required: [property, op]
            properties:
              property:
                type: string
                example: $pathname
              op:
                type: string
                enum: [eq, neq, in, not_in, contains, not_contains, regex, is_set, is_not_set, gt, gte, lt, lte]
              value:
                description: string for eq/neq/contains/not_contains/regex; string[] for in/not_in; number for gt/gte/lt/lte; omitted for is_set/is_not_set.
                oneOf:
                  - type: string
                  - type: number
                  - type: array
                    items:
                      type: string
    SegmentMembership:
      type: object
      nullable: true
      description: >-
        Materialized run status. `null` for attribute-only segments.
      properties:
        status:
          type: string
          enum: [pending, ready, too_large, error]
          description: >-
            `pending` until the first compute finishes (it starts right after
            save), `ready` when a run is published, `too_large` when the
            conditions match more than 500,000 identities, `error` when the
            last compute failed (see `error`; the next read retries).
        computed_at:
          type: string
          format: date-time
          nullable: true
        rows:
          type: integer
          nullable: true
          description: Identity rows in the published run (one per identity of each member person).
        error:
          type: string
          nullable: true
    Segment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Active organic (30d)
        description:
          type: string
          nullable: true
        definition:
          $ref: "#/components/schemas/SegmentDefinition"
        membership:
          $ref: "#/components/schemas/SegmentMembership"
        is_favorite:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SegmentMember:
      type: object
      description: >
        A person matching the segment. Same column set as a
        `GET /client/v1/data/people` list row (the two are served by
        sibling pipes and kept in sync), except session-store timestamps are
        exposed as `first_seen`/`last_seen` here rather than
        `first_seen_at`/`last_seen_at`.
      properties:
        id:
          type: string
        location_id:
          type: string
        identity_count:
          type: integer
        session_count:
          type: integer
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        display_name:
          type: string
        email:
          type: string
        user_id:
          type: string
          description: The person's first user_id-type identity (empty if anonymous).
        company:
          type: string
        avatar:
          type: string
        first_channel:
          type: string
        last_channel:
          type: string
        last_utm_source:
          type: string
        last_utm_medium:
          type: string
        last_utm_campaign:
          type: string
        last_geo_country_name:
          type: string
        first_geo_country:
          type: string
        last_device_type:
          type: string
        first_landing_page:
          type: string
        last_landing_page:
          type: string
        updated_at:
          type: string
          description: When this person's profile last changed, UTC.
    SaveSegmentRequest:
      type: object
      required:
        - name
        - definition
      properties:
        id:
          type: string
          format: uuid
          description: Include to update an existing segment; omit to create.
        name:
          type: string
          example: Active organic (30d)
        description:
          type: string
        definition:
          $ref: "#/components/schemas/SegmentDefinition"
        is_favorite:
          type: boolean
    PatchSegmentRequest:
      type: object
      description: At least one field. A patched `definition` is re-validated.
      properties:
        name:
          type: string
        description:
          type: string
        is_favorite:
          type: boolean
        definition:
          $ref: "#/components/schemas/SegmentDefinition"
    SegmentResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Segment"
    SegmentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Segment"
    SegmentMembersResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SegmentMember"
        rows:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        computed_at:
          type: string
          format: date-time
          description: Segments with `events` only. When the served membership run was computed.
        stale:
          type: boolean
          description: Segments with `events` only. `true` when a recompute was started in the background.
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "unknown filter: foo"
        code:
          type: string
          description: Present on membership failures, e.g. `segment_too_large`, `membership_refresh_failed`.
