openapi: "3.0.0"
info:
  version: 1.0.0
  title: Creatives
  description: >
    A client's own Meta ads and creatives. After each Airbyte sync Mythic reads
    the client's ads, creatives, videos and images from its Airbyte data (no
    live Meta API calls), copies the media, transcribes videos and reads each
    creative with the same analysis competitor ads get (hook, offer, tags,
    E.P.I.C.), so the two compare 1:1. Sold on the Pro plan.


    Reads accept an agency key (`ak_`, bind a location with `location_id` or the
    `X-Location-Id` header), a location secret key (`sk_`) or an `mcp_` key with
    `creative_analysis:read`. A manual sync needs an agency key or
    `creative_analysis:write`.
servers:
  - url: https://mythic-analytics.gulp.workers.dev
security:
  - BearerAuth: []
paths:
  /client/v1/creatives:
    get:
      summary: List creatives
      operationId: listCreatives
      description: >-
        The client's Meta ads that are active or had spend in the last 90 days,
        highest 90-day spend first, with their creative, analysis headline and a
        signed thumbnail URL (about an hour). Ads no longer covered are left out
        unless include_gone=true or status=gone.
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - { name: account_id, in: query, schema: { type: string, pattern: "^[0-9]+$" } }
        - { name: campaign_id, in: query, schema: { type: string, pattern: "^[0-9]+$" } }
        - { name: adset_id, in: query, schema: { type: string, pattern: "^[0-9]+$" } }
        - { name: status, in: query, description: "Meta effective_status such as ACTIVE or PAUSED, or gone.", schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [image, video, carousel, dynamic, unknown] } }
        - { name: has_video, in: query, schema: { type: boolean } }
        - { name: tag, in: query, description: "An analysis tag as family.tag, e.g. offer.guarantee.", schema: { type: string } }
        - { name: epic, in: query, description: "in_order: only creatives whose copy or transcript reads all four E.P.I.C. stages in order.", schema: { type: string, enum: [in_order] } }
        - { name: since, in: query, description: "Ads created on or after this ISO date.", schema: { type: string } }
        - { name: include_gone, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, description: "next_cursor from the previous page.", schema: { type: string } }
      responses:
        "200":
          description: Creatives
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { type: array, items: { $ref: "#/components/schemas/Creative" } }
                  next_cursor: { type: string, nullable: true }
                  spend_error: { type: string, description: "Set when 30-day spend could not be read; spend_30d is then null." }
                  meta:
                    type: object
                    properties:
                      spend_error: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
  /client/v1/creatives/{ad_id}:
    get:
      summary: Get a creative
      operationId: getCreative
      description: One ad with its full creative, analysis, transcript and signed media URLs.
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - { name: ad_id, in: path, required: true, description: The Meta ad id., schema: { type: string, pattern: "^[0-9]+$" } }
        - { name: include, in: query, description: "raw: also return the stored source row (bounded).", schema: { type: string, enum: [raw] } }
      responses:
        "200":
          description: Creative
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/CreativeDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /client/v1/creatives/intelligence:
    get:
      summary: Creative readiness and coverage
      operationId: getCreativeIntelligence
      description: >-
        Exact aggregates over all stored non-gone own ads, without PostgREST page
        sampling. Complete describes the stored population, not upstream Meta
        completeness. Includes source/sync freshness, stage counts and ratios,
        active/spending analysis gaps, and bounded account/campaign distributions
        for hook type, angle, offer and format. Up to 10 cohorts by ad count are
        listed, reduced further to keep the coherent response within 10000 JSON
        characters. cohorts_total and cohorts_truncated disclose omissions.
        Dimension rows may also be omitted, keeping at least one per family and
        every unclassified row. dimensions_total and dimensions_truncated disclose
        this, while shares retain the complete cohort denominator.
        Spend is a rolling 90-day source snapshot in raw account units, never
        cross-account money or proof of success. Outcome performance is explicitly
        unavailable without verified objective, currency and attribution joins.
        Read-only, creative_analysis:read and creative_analysis entitlement. No
        competitor entitlement, model call, live Meta request or ad mutation.
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Complete stored-population counts and bounded coverage cohorts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/CreativeIntelligence" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /client/v1/creatives/summary:
    get:
      summary: Summary
      operationId: getCreativesSummary
      description: >-
        What the client runs, overall and per ad account, in the same shape as
        the competitor ads summary (overall has the same fields), counted per
        ad. Days running counts from the ad's creation.
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - { name: account_id, in: query, schema: { type: string, pattern: "^[0-9]+$" } }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      as_of: { type: string, format: date-time }
                      overall: { $ref: "#/components/schemas/SummaryStats" }
                      accounts:
                        type: array
                        items:
                          allOf:
                            - type: object
                              properties:
                                account_id: { type: string }
                            - $ref: "#/components/schemas/SummaryStats"
                      truncated: { type: boolean, description: More than 5000 ads; the summary covers the newest 5000. }
                      tag_families: { type: object, additionalProperties: { type: array, items: { type: string } } }
                      text_fields: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
  /client/v1/creatives/sync:
    get:
      summary: Sync status
      operationId: getCreativesSync
      description: Where the client's Meta ads are read from, the last sync and a read still in progress.
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/SyncStatus" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
    post:
      summary: Sync now
      operationId: syncCreatives
      description: >-
        Run one pass reading the client's Meta ads from its Airbyte data now
        (about 3,000 ads; complete is false when more passes follow on the
        5-minute schedule). Media copies, transcripts and analysis follow in
        the background. At most once every 10 minutes and 10 times per 24 hours
        per client; syncs also run after every Airbyte sync (daily for legacy
        datasets).
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Synced
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [ok, partial, in_progress, skipped] }
                      complete: { type: boolean, nullable: true, description: "False when the read continues on the next pass." }
                      counts: { type: object, nullable: true, description: "read, received, inserted, updated, changed, gone, rejected, bytes, queries, pages, ms." }
                      reason: { type: string, nullable: true }
                      sync: { $ref: "#/components/schemas/SyncStatus" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /client/v1/creatives/decisions:
    get:
      summary: Scale / Test / Kill decisions
      operationId: getCreativeDecisions
      description: >-
        Scale / Test / Kill for every Meta ad with spend in the window, with
        CPMr x CPA quadrants and optional pooled attribute groups. Zones come
        from a Gamma-Poisson model (Jeffreys prior) of conversions per unit of
        spend: scale when P(CPA < target) >= confidence, kill when
        P(CPA > target) >= confidence, else test. They describe observed cost
        per conversion, not causality. Ads whose conversions are unknown are
        `unclassifiable` with a reason; ads in another currency or objective
        are listed in `population.omitted`. CPMr uses Meta's daily reach summed
        over the window (`reach_summed_daily`), which overcounts repeat reach.
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - name: conversion
          in: query
          required: true
          description: "`meta:<action_type>` (Meta's count), `mythic:event:<event>` or `mythic:deals` (Mythic attribution; needs the Data API, refused for HIPAA locations)."
          schema: { type: string, example: "meta:lead" }
        - { name: from, in: query, schema: { type: string, format: date }, description: "Default: 29 days before `to`. At most 366 days." }
        - { name: to, in: query, schema: { type: string, format: date }, description: "Default: today (UTC)." }
        - name: window
          in: query
          description: "Meta conversions only. Attribution window, default `7d_click`. `value` is each ad set's own setting and answers 422 when the ads use several."
          schema: { type: string, enum: [7d_click, 1d_click, 28d_click, 1d_view, 1d_ev, value] }
        - { name: model, in: query, description: "Mythic conversions only. Default `last`; `linear` gives fractional counts.", schema: { type: string, enum: [last, first, linear] } }
        - { name: pipeline, in: query, description: "`mythic:deals` only: one pipeline by exact name.", schema: { type: string } }
        - { name: account_id, in: query, schema: { type: string, pattern: "^(act_)?[0-9]+$" } }
        - { name: objective, in: query, description: "Meta objective to compare within. Default: the top-spend objective.", schema: { type: string, example: OUTCOME_LEADS } }
        - { name: target_cpa, in: query, description: "What-if target for every ad, in the account currency. Never saved.", schema: { type: number, exclusiveMinimum: true, minimum: 0 } }
        - { name: confidence, in: query, schema: { type: number, minimum: 0.5, maximum: 0.995, default: 0.9 } }
        - { name: group_by, in: query, schema: { type: string, enum: [hook_type, angle, offer, format, campaign] } }
        - { name: new_customers, in: query, description: "Not supported: `true` answers 422 `new_customers_unsupported`.", schema: { type: boolean } }
      responses:
        "200":
          description: Decisions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Decisions" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /client/v1/creatives/decisions/targets:
    get:
      summary: Get target CPAs
      operationId: getCreativeCpaTargets
      description: Saved target CPAs for one conversion.
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - { name: conversion, in: query, required: true, schema: { type: string, example: "meta:lead" } }
      responses:
        "200":
          description: Targets
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/CpaTargets" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      summary: Set target CPAs
      operationId: setCreativeCpaTargets
      description: >-
        Replace every saved target of one conversion in one transaction. Needs
        an agency key or `creative_analysis:write`.
      parameters:
        - $ref: "#/components/parameters/LocationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversion, currency]
              properties:
                conversion: { type: string, example: "meta:lead" }
                currency: { type: string, pattern: "^[A-Z]{3}$", example: USD }
                client_target_cpa: { type: number, nullable: true, example: 40 }
                campaigns: { type: object, additionalProperties: { type: number }, example: { "120212345678901234": 60 } }
      responses:
        "200":
          description: The saved targets
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/CpaTargets" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        Agency key (`ak_`), location secret key (`sk_`, reads only) or a scoped `mcp_` key with
        `creative_analysis:read` or `creative_analysis:write`. See [Using an mcp_ key over HTTP](/mcp/authentication).
  parameters:
    LocationId:
      name: location_id
      in: query
      required: false
      description: Location to scope to. Required for `ak_` keys or send `X-Location-Id`. Ignored for `sk_`.
      schema: { type: string }
  responses:
    Error:
      description: "Error. The code names the cause, e.g. `feature_not_in_plan`, `agency_required`, `not_found`, `sync_throttled`, `sync_in_progress`, `no_meta_source`, `pipeline_disabled`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    CpaTargets:
      type: object
      properties:
        conversion: { type: string }
        client: { type: number, nullable: true }
        campaigns: { type: object, additionalProperties: { type: number } }
        currency: { type: string, nullable: true }
    Decision:
      type: object
      properties:
        zone: { type: string, enum: [scale, test, kill, unclassifiable] }
        reason: { type: string, nullable: true, enum: [no_spend, invalid_target, missing_outcomes, invalid_conversions, null] }
        band: { type: string, nullable: true, enum: [converting, no_conversions, null] }
        cpa: { type: number, nullable: true }
        p_cpa_below_target: { type: number, nullable: true }
        p_cpa_above_target: { type: number, nullable: true }
        cpa_interval: { type: array, nullable: true, items: { type: number }, description: Central posterior interval of the CPA at the confidence. }
        target_cpa: { type: number, nullable: true }
        target_source: { type: string, nullable: true, enum: [request, campaign, client, spend_weighted, null] }
    DecisionPoint:
      allOf:
        - $ref: "#/components/schemas/Decision"
        - type: object
          properties:
            ad_id: { type: string }
            ad_name: { type: string, nullable: true }
            account_id: { type: string }
            campaign_id: { type: string }
            campaign_name: { type: string, nullable: true }
            adset_id: { type: string }
            adset_name: { type: string, nullable: true }
            currency: { type: string, nullable: true }
            objective: { type: string, nullable: true }
            attribution_settings: { type: array, items: { type: string } }
            first_date: { type: string, format: date }
            last_date: { type: string, format: date }
            days_with_spend: { type: integer }
            spend: { type: number }
            impressions: { type: integer }
            reach_summed_daily: { type: integer, nullable: true, description: "Meta's daily reach summed over the window. Not unique reach." }
            reach_missing_days: { type: integer, nullable: true }
            cpmr: { type: number, nullable: true, description: "Spend per 1,000 reach_summed_daily." }
            conversions: { type: number, nullable: true, description: Null when unknown (never a guessed zero). Fractional with linear attribution. }
            outcome_missing: { type: string, nullable: true, enum: [not_in_actions_copy, not_in_attribution, attribution_row_cap, attribution_sampled, attribution_unavailable, null] }
            quadrant: { type: object, nullable: true, properties: { cpmr: { type: string, enum: [low, high] }, cpa: { type: string, enum: [low, high] } } }
            format: { type: string, nullable: true }
            tags: { type: object, nullable: true, additionalProperties: { type: array, items: { type: string } } }
            analysis_status: { type: string }
    Decisions:
      type: object
      properties:
        window: { type: object, properties: { from: { type: string }, to: { type: string }, days: { type: integer } } }
        conversion: { type: object, description: "source, key, and action_type + window (meta) or event/deals + model + attribution coverage (mythic)." }
        confidence: { type: number }
        currency: { type: string, nullable: true }
        objective: { type: string, nullable: true }
        targets: { type: object, properties: { client: { type: number, nullable: true }, campaigns: { type: object }, currency: { type: string, nullable: true }, override: { type: number, nullable: true }, applied: { type: boolean } } }
        population:
          type: object
          properties:
            ads_with_spend: { type: integer }
            spend: { type: number }
            decided_ads: { type: integer }
            zones: { type: object, properties: { scale: { type: integer }, test: { type: integer }, kill: { type: integer }, unclassifiable: { type: integer } } }
            unclassifiable_by_reason: { type: object, additionalProperties: { type: object, properties: { ads: { type: integer }, spend: { type: number } } } }
            omitted_by_reason: { type: object, additionalProperties: { type: object, properties: { ads: { type: integer }, spend: { type: number } } } }
            omitted: { type: array, items: { type: object, properties: { ad_id: { type: string }, reason: { type: string, enum: [other_currency, mixed_currency, other_objective] }, spend: { type: number } } } }
            currencies: { type: array, items: { type: object } }
            objectives: { type: array, items: { type: object } }
            ads_without_actions_copy: { type: integer }
        medians: { type: object, properties: { by_account: { type: object, additionalProperties: { type: object, properties: { cpmr: { type: number, nullable: true }, cpa: { type: number, nullable: true }, cpa_infinite: { type: boolean }, ads: { type: integer } } } } } }
        points: { type: array, items: { $ref: "#/components/schemas/DecisionPoint" } }
        groups:
          type: object
          nullable: true
          properties:
            by: { type: string }
            overlapping: { type: boolean }
            note: { type: string }
            items: { type: array, items: { allOf: [ { $ref: "#/components/schemas/Decision" }, { type: object, properties: { value: { type: string }, label: { type: string, nullable: true }, ad_ids: { type: array, items: { type: string } }, ads: { type: integer }, spend: { type: number }, conversions: { type: number }, excluded_missing_outcomes: { type: integer }, untargeted_ads: { type: integer } } } ] } }
            without_value: { type: object, properties: { ads: { type: integer }, spend: { type: number }, not_analyzed: { type: integer } } }
        group_values: { type: object, nullable: true, additionalProperties: { type: array, items: { type: string } }, description: "ad_id -> pool values, so a chart can re-pool on a target drag." }
        curves:
          type: array
          items:
            type: object
            properties:
              target_cpa: { type: number }
              zero_conversion_kill_spend: { type: number }
              points: { type: array, items: { type: object, properties: { spend: { type: number }, scale_max_cpa: { type: number, nullable: true }, kill_min_cpa: { type: number, nullable: true }, scale_min_conversions: { type: number, nullable: true }, kill_max_conversions: { type: number, nullable: true }, killable: { type: boolean }, kill_only_without_conversions: { type: boolean } } } }
        available_action_types: { type: array, items: { type: object, properties: { action_type: { type: string }, count: { type: number } } } }
        notes: { type: object, additionalProperties: { type: string } }
    CreativeIntelligence:
      type: object
      required: [as_of, complete, totals, performance, readiness, cohorts_total, cohorts_truncated, cohorts, limitations]
      properties:
        as_of: { type: string, format: date-time }
        complete: { type: boolean, description: "Counts cover every stored non-gone row, not all upstream ads.", example: true }
        population: { type: string }
        totals:
          type: object
          description: "Exact ads, active_ads, spending_ads, spend_unknown_ads, analyzed_ads, missing_creatives, active_analysis_gaps, spending_analysis_gaps, oldest_seen_at, newest_seen_at and analysis_ad_coverage. No cross-account spend sum."
          additionalProperties: true
        performance:
          type: object
          properties:
            status: { type: string, enum: [unavailable] }
            reason: { type: string }
            missing: { type: array, items: { type: string } }
            rules: { type: array, items: { type: string } }
        readiness:
          type: object
          description: "pipeline_enabled, stages, checks, sync, airbyte and queue_policy. Each stage has eligible_ads, states (with ratios), failed_ads, failed_ratio, old_pending_ads and age_basis. Transcript denominator is eligible ads, not unique videos. Queue investigation threshold is 48 hours; media enqueue age is unavailable. Unknown is not healthy."
          properties:
            pipeline_enabled: { type: boolean }
            stages: { type: array, items: { type: object, additionalProperties: true } }
            checks:
              type: array
              items:
                type: object
                properties:
                  code: { type: string }
                  status: { type: string, enum: [open, healthy, unknown] }
                additionalProperties: true
            sync: { type: object, nullable: true, additionalProperties: true }
            airbyte: { type: object, additionalProperties: true, description: "Location Meta connection counts and freshness timestamps; freshness verdict unknown without connection schedules. Raw error strings and credentials are not returned." }
            queue_policy: { type: string }
        cohorts_total: { type: integer }
        cohorts_truncated: { type: boolean }
        cohort_order: { type: string }
        cohorts:
          type: array
          maxItems: 10
          items:
            type: object
            description: "One account/campaign, currency and objective null. Contains ads/active_ads, known-spend counts, raw source spend, analysis ad/spend coverage and dimensions. dimensions_total and dimensions_truncated disclose omitted dimension rows, ordered by ad count. Each dimension has family, label, ads, spend_known_ads, spend_90d_raw, example_ad_ids, ad_share and spend_share. Ratios are rounded to six decimals and always retain whole-cohort denominators. Multi-label shares overlap. No cross-cohort comparison of success."
            additionalProperties: true
        limitations: { type: array, items: { type: string } }
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
    SyncStatus:
      type: object
      properties:
        source_kind: { type: string, nullable: true, enum: [managed, legacy] }
        source_project: { type: string, nullable: true }
        source_dataset: { type: string, nullable: true }
        source_synced_at: { type: string, format: date-time, nullable: true, description: The Airbyte sync the last own-ads sync consumed (managed datasets). }
        status: { type: string, nullable: true, enum: [ok, partial, in_progress, failed, skipped] }
        error: { type: string, nullable: true }
        last_synced_at: { type: string, format: date-time, nullable: true }
        last_attempt_at: { type: string, format: date-time, nullable: true }
        last_counts: { type: object, nullable: true, description: "The last pass: read, inserted, updated, changed, gone, rejected, bytes, queries, pages, complete, ms." }
        consecutive_failures: { type: integer }
        syncing: { type: boolean }
        traversal:
          type: object
          nullable: true
          description: "A read still in progress (large datasets are read in passes about 5 minutes apart)."
          properties:
            started_at: { type: string, format: date-time }
            rows: { type: integer, description: Ads stored so far. }
        pipeline_enabled: { type: boolean }
    Creative:
      type: object
      properties:
        id: { type: string, format: uuid }
        ad_id: { type: string }
        account_id: { type: string, nullable: true }
        campaign_id: { type: string, nullable: true }
        adset_id: { type: string, nullable: true }
        ad_name: { type: string, nullable: true }
        adset_name: { type: string, nullable: true }
        campaign_name: { type: string, nullable: true }
        effective_status: { type: string, nullable: true, example: ACTIVE }
        gone: { type: boolean, description: "No longer active and no spend in 90 days at the latest complete sync." }
        gone_at: { type: string, format: date-time, nullable: true }
        ad_created_at: { type: string, format: date-time, nullable: true }
        creative_id: { type: string, nullable: true }
        creative_found: { type: boolean, description: "False when the creative is in neither Airbyte creative stream." }
        display_format: { type: string, enum: [image, video, carousel, dynamic, unknown] }
        title: { type: string, nullable: true }
        body: { type: string, nullable: true }
        link_description: { type: string, nullable: true }
        cta_type: { type: string, nullable: true, example: LEARN_MORE }
        cta_text: { type: string, nullable: true, example: Learn More }
        link_url: { type: string, nullable: true }
        has_video: { type: boolean }
        video_id: { type: string, nullable: true }
        video_duration_s: { type: number, nullable: true }
        spend_90d: { type: number, nullable: true, description: From the latest sync. }
        impressions_90d: { type: integer, nullable: true }
        last_spend_date: { type: string, format: date, nullable: true }
        spend_30d: { type: number, nullable: true, description: "From Mythic's ad spend copy; null when it could not be read (see spend_error)." }
        impressions_30d: { type: integer, nullable: true }
        media_status: { type: string, enum: [pending, done, partial, failed, none] }
        analysis_status: { type: string, enum: [pending, done, failed] }
        hook: { type: string, nullable: true }
        hook_start_s: { type: number, nullable: true }
        hook_end_s: { type: number, nullable: true }
        tags: { type: object, nullable: true, additionalProperties: { type: array, items: { type: string } } }
        epic:
          type: object
          nullable: true
          properties:
            all_stages_in_order: { type: boolean, nullable: true }
            rules_met: { type: integer, nullable: true }
            rules_total: { type: integer, nullable: true }
        thumbnail_url: { type: string, nullable: true, description: "Signed, valid for about an hour." }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
    CreativeDetail:
      allOf:
        - $ref: "#/components/schemas/Creative"
        - type: object
          properties:
            carousel_cards: { type: array, nullable: true, items: { type: object } }
            asset_feed: { type: object, nullable: true, description: "Dynamic creative variants: titles, bodies, descriptions, link_urls, call_to_action_types, video_ids, image_hashes." }
            media:
              type: array
              items:
                type: object
                properties:
                  slot: { type: string, example: "image:0" }
                  kind: { type: string, enum: [image, video, video_preview] }
                  quality: { type: string, enum: [hd, image, video_picture, thumbnail, video], description: "Source of the stored copy, best first; thumbnail is a last resort." }
                  width: { type: integer, nullable: true }
                  height: { type: integer, nullable: true }
                  copied_at: { type: string, format: date-time }
                  last_error: { type: string, description: "A later upgrade attempt failed; this copy was kept." }
                  key: { type: string }
                  bytes: { type: integer, nullable: true }
                  content_type: { type: string, nullable: true }
                  url: { type: string, nullable: true, description: "Signed, valid for about an hour." }
                  skipped: { type: string }
                  error: { type: string }
            analysis: { type: object, nullable: true, description: "Same shape as a competitor ad's analysis: fields, hook_start_s, hook_end_s, tags, probabilities, epic, taxonomy_version." }
            analysis_model: { type: string, nullable: true }
            analysis_input_tokens: { type: integer, nullable: true }
            analysis_cost_usd: { type: number, nullable: true }
            analyzed_at: { type: string, format: date-time, nullable: true }
            transcript:
              type: object
              nullable: true
              properties:
                status: { type: string }
                text: { type: string, nullable: true }
                sentences: { type: array, nullable: true, items: { type: object, properties: { start: { type: number }, end: { type: number }, text: { type: string } } } }
                duration_s: { type: number, nullable: true }
                language: { type: string, nullable: true }
                error: { type: string, nullable: true }
                completed_at: { type: string, format: date-time, nullable: true }
            spend_error: { type: string }
            raw: { type: object, description: Only with include=raw. }
    TagShare:
      type: object
      properties:
        tag: { type: string }
        ads: { type: integer }
        share: { type: number, nullable: true }
    SummaryStats:
      type: object
      properties:
        ads: { type: integer }
