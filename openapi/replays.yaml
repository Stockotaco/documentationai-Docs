openapi: "3.0.0"
info:
  version: 1.0.0
  title: Session Replays
  description: >
    Read recorded browser sessions (rrweb) for a location. Capture is enabled
    per client via server config — nothing records until turned on. Recordings
    expire after 30 days. Served from Mythic Analytics. HIPAA-mode locations
    are not served.


    **Build your own replays page** — Mythic's own admin replays UI is built
    entirely on this API plus the open-source `rrweb-player`; the full recipe:

    1. Enable/tune recording once per client: `PATCH /api/v1/clients/:id` with
    `{"session_replay": {"enabled": true, "sampleRate": 1, "minDurationMs": 10000}}`
    (served to the SDK via remote config on the next page load).

    2. List recordings: `GET /replays` — identity, URL, browser/device,
    duration, activity counters per row.

    3. Play one: `GET /replays/{sessionId}` → feed `data.events` straight into
    `rrweb-player`. If `data.tracks` has more than one entry, the visitor had
    tabs open at the same time: play one track at a time with
    `?window_id=<that track's ids, comma-separated>`. Console and network entries ride along in the same stream
    (rrweb Plugin/Custom events) if you want DevTools-style tabs. Version
    note: streams are recorded with rrweb 2.1.0 — pin `rrweb-player` to
    exactly `2.0.0-alpha.20` (the stable 2.0.x/2.1.x ESM builds ship without
    the replay engine and crash on load); a custom player on `@rrweb/replay`
    2.1.0 works.

    4. Attribution sidebar: `GET /sessions?session_id={id}` (Data API) — one
    row with source/medium/campaign, click IDs, device, geo.

    5. New vs returning (optional): `GET /people/{distinctId}/summary` —
    `metrics.session_count > 1` means returning.

    For feeding a model instead of a human, use
    `GET /replays/{sessionId}/timeline`.
servers:
  - url: https://mythic-analytics.gulp.workers.dev/client/v1/data
security:
  - BearerAuth: []
paths:
  /replays:
    get:
      summary: List session replays
      operationId: listReplays
      description: >
        List recorded sessions for the location, newest-first, within the
        30-day retention window. Each row carries the session's full entry
        attribution (UTMs, landing page, referrer, device, geo — the same
        fields as `GET /sessions` in the Data API) plus identity, duration,
        and activity counters derived from the recording.


        **Filtering**: accepts the same filters as `GET /sessions` —
        `utm_source`, `utm_medium`, `utm_campaign`, `landing_page`,
        `experiment_arm`, `device_type`, `browser`, `os`, `country`, `date_from`/`date_to`,
        `engaged`, `bounce`, `is_identified`, `min_duration` — plus
        `segment_id` to scope to a saved segment's members:


        `GET /client/v1/data/replays?utm_source=Facebook&landing_page=/pricing`


        `GET /client/v1/data/replays?segment_id=9f4e...&device_type=mobile`


        **Recordings tab (person scoping)**: pass `person_id` (canonical id
        from the People API) or `distinct_id` (any raw identity value) to
        list one person's recordings, resolved through the identity graph —
        no more fetching the recent list and filtering client-side:


        `GET /client/v1/data/replays?person_id=019f69bc-...`
      parameters:
        - $ref: "#/components/parameters/LocationIdHeader"
        - $ref: "#/components/parameters/LocationIdQuery"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/FilterUtmSource"
        - $ref: "#/components/parameters/FilterUtmMedium"
        - $ref: "#/components/parameters/FilterUtmCampaign"
        - $ref: "#/components/parameters/FilterDeviceType"
        - $ref: "#/components/parameters/FilterBrowser"
        - $ref: "#/components/parameters/FilterOs"
        - $ref: "#/components/parameters/FilterCountry"
        - $ref: "#/components/parameters/FilterLandingPage"
        - $ref: "#/components/parameters/FilterExperimentArm"
        - $ref: "#/components/parameters/FilterEngaged"
        - $ref: "#/components/parameters/FilterBounce"
        - $ref: "#/components/parameters/FilterIsIdentified"
        - $ref: "#/components/parameters/FilterPersonId"
        - $ref: "#/components/parameters/FilterDistinctId"
        - name: min_duration
          in: query
          required: false
          description: Minimum session duration in seconds.
          schema:
            type: integer
        - $ref: "#/components/parameters/SegmentId"
        - name: limit
          in: query
          required: false
          description: Max sessions to return (1–1000).
          schema:
            type: integer
            default: 100
            maximum: 1000
        - name: offset
          in: query
          required: false
          description: Row offset for pagination.
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayListResponse"
        "400":
          $ref: "#/components/responses/LocationRequired"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown `segment_id` for this location (`segment_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /replays/{sessionId}:
    get:
      summary: Get a session recording
      operationId: getReplay
      description: >
        Return the full rrweb event stream for one session (DOM + console +
        network), concatenated in order. Feed `data.events` straight into an
        rrweb player such as `rrweb-player` — pinned to exactly
        `2.0.0-alpha.20` (streams are rrweb 2.1.0; the stable 2.0.x/2.1.x
        rrweb-player ESM builds ship without the replay engine and crash on
        load).


        **Tabs.** A session can span several page loads (`windows`), and a
        visitor with two tabs open records two windows at the same time. An
        rrweb player has one frame, so two overlapping windows played together
        corrupt each other: one tab's DOM changes land on the other tab's page.
        `tracks` groups window ids that never overlap and can share a player.
        One track (the usual case) means `data.events` plays as-is. More than
        one means `overlapping: true`: fetch and play each track separately
        with `?window_id=`.
      parameters:
        - $ref: "#/components/parameters/LocationIdHeader"
        - $ref: "#/components/parameters/LocationIdQuery"
        - name: sessionId
          in: path
          required: true
          description: The session id from the list endpoint.
          schema:
            type: string
        - name: window_id
          in: query
          required: false
          description: >
            Comma-separated window ids (from `tracks` or `windows`). Returns
            only those windows' events. Omit for the whole session.
          schema:
            type: string
      responses:
        "200":
          description: Recording events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayEventsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No recording exists for that session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /replays/{sessionId}/timeline:
    get:
      summary: Get a session timeline (LLM-ready)
      operationId: getReplayTimeline
      description: >
        Return a compact, chronological timeline of the session — the
        AI-summarization view, NOT the raw rrweb stream. Turns the event stream
        into an ordered sequence of meaningful steps (page journey, dwell time,
        form submissions, field inputs, identify, and custom events). Replay
        heartbeat/start markers, engagement pings, web vitals and Replay Vision
        `$recording_observed` events (answers about the visit, not steps of it)
        are dropped.
        Contains no PII — form and input values are excluded, only field
        metadata. `sessionId` must be a UUIDv7 (all recording session ids are).
        Feed `data` to a model to summarize what the visitor did and where they
        dropped off.


        With `include=logs`, each log row keeps its absolute time (`t` with
        milliseconds, and `timestamp`). Inside the timeline (from its first to
        its last event) it also carries `seconds_from_start`, measured from the
        same origin as the events, and `in_recording: true`. A log before the
        first or after the last event is still listed, with
        `in_recording: false` and no `seconds_from_start`: it is never clamped
        onto the session's first or last moment. Event times come from the
        visitor's browser, log times from your server, so a skewed server clock
        shifts its log rows.
      parameters:
        - $ref: "#/components/parameters/LocationIdHeader"
        - $ref: "#/components/parameters/LocationIdQuery"
        - name: sessionId
          in: path
          required: true
          description: The session id from the list endpoint.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Max timeline rows (1–2000).
          schema:
            type: integer
            default: 500
            maximum: 2000
        - name: include
          in: query
          required: false
          description: >
            `logs` merges the session's server log records into `data` (rows
            with `event: log`; up to 500, and never past 2000 rows in total).
            They are added only when the key may read logs (`logs:read` for an
            `mcp_` key), the plan includes Logs and the location is not HIPAA.
            Otherwise the timeline is returned without them and `meta.logs`
            says why. Without `include` the response is unchanged.
          schema:
            type: string
            enum: [logs]
        - name: log_levels
          in: query
          required: false
          description: "With `include=logs`: comma list of levels to merge, e.g. `warn,error,fatal`. Default all."
          schema:
            type: string
      responses:
        "200":
          description: Session timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayTimelineResponse"
        "400":
          description: "`invalid_session_id`, `invalid_include` or `invalid_level` (a bad `log_levels`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /replays/{sessionId}/logs:
    get:
      summary: List a session's logs
      operationId: getReplayLogs
      description: >
        Server log records (sent over OTLP to `POST /i/v1/logs`) whose
        `session_id` is this session: what your backend logged for the
        visitor's requests, when it forwards the browser's Mythic session id
        (see [Link logs to people and sessions](/logs/otlp-ingestion#link-logs-to-people-and-sessions)).
        Works for any session id, recorded or not. Oldest first by default,
        keyset-paged with `next_cursor`.


        The search window is the session id's embedded time minus 24 hours to
        plus 48 hours (`meta.from`/`meta.to`). The id is minted from the
        visitor's clock, so this is where to look, not the session's start.


        Needs the **Logs** feature in the plan (`402 feature_not_in_plan`) and,
        for a scoped `mcp_` key, BOTH `replays:read` and `logs:read`. HIPAA
        locations are refused (`403 hipaa_restricted`); a location whose
        configuration cannot be read answers `503 privacy_unknown`, retryable.
        Shares the logs read budget (120 requests per minute per location)
        with `/client/v1/logs`.
      parameters:
        - $ref: "#/components/parameters/LocationIdHeader"
        - $ref: "#/components/parameters/LocationIdQuery"
        - name: sessionId
          in: path
          required: true
          description: The session id (UUIDv7).
          schema:
            type: string
        - name: levels
          in: query
          required: false
          description: "Comma list of levels, e.g. `warn,error,fatal`."
          schema: { type: string }
        - name: services
          in: query
          required: false
          description: Comma list of service names, at most 20.
          schema: { type: string }
        - name: q
          in: query
          required: false
          description: Case-insensitive body search, at most 5 terms (all must match).
          schema: { type: string }
        - name: attr
          in: query
          required: false
          description: Repeatable attribute filter, `key=value` or a bare `key`. At most 5.
          style: form
          explode: true
          schema: { type: array, items: { type: string } }
        - name: trace_id
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
        - name: order
          in: query
          required: false
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: cursor
          in: query
          required: false
          description: "`next_cursor` from the previous page."
          schema: { type: string }
        - name: body_max_bytes
          in: query
          required: false
          schema: { type: integer, minimum: 64, maximum: 32768, default: 2048 }
      responses:
        "200":
          description: A page of the session's log records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionLogsResponse"
        "400":
          description: >
            `invalid_session_id` (not a UUIDv7), another invalid parameter, or
            `param_not_allowed` for `from`, `to`, `range`, `session_id`,
            `distinct_id` and `distinct_ids` (the session fixes them).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: "`feature_not_in_plan`: the plan does not include Logs."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "`insufficient_scope`, `hipaa_restricted` or `location_not_linked`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: "`query_failed`: the log store did not answer."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: "`privacy_unknown`: the location's configuration could not be read. Retry."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >
        Agency key (`ak_`) or location secret key (`sk_`) as a bearer token.
        Format: `Bearer ak_...` or `Bearer sk_...`.
        Scoped keys (`mcp_`) are accepted too and need `replays:read`; the
        session logs route, and `include=logs` on the timeline, also need
        `logs:read`. See [Using an mcp_ key over HTTP](/mcp/authentication).
  parameters:
    LocationIdHeader:
      name: X-Location-Id
      in: header
      required: false
      description: >
        Location to scope the request to. Required for agency (`ak_`) keys.
        Ignored for secret (`sk_`) keys, which resolve their own location.
      schema:
        type: string
    LocationIdQuery:
      name: location_id
      in: query
      required: false
      description: >
        Alternative to the `X-Location-Id` header for agency (`ak_`) keys.
        Ignored for secret (`sk_`) keys.
      schema:
        type: string
    DateFrom:
      name: date_from
      in: query
      required: false
      description: Start date (`YYYY-MM-DD`), on session start time.
      schema:
        type: string
        format: date
    DateTo:
      name: date_to
      in: query
      required: false
      description: End date (`YYYY-MM-DD`).
      schema:
        type: string
        format: date
    FilterUtmSource:
      name: utm_source
      in: query
      required: false
      description: Filter to sessions with this UTM source. Empty string = "no value set".
      schema:
        type: string
    FilterUtmMedium:
      name: utm_medium
      in: query
      required: false
      description: Filter to sessions with this UTM medium.
      schema:
        type: string
    FilterUtmCampaign:
      name: utm_campaign
      in: query
      required: false
      description: Filter to sessions with this UTM campaign.
      schema:
        type: string
    FilterDeviceType:
      name: device_type
      in: query
      required: false
      description: Filter to sessions on this device type.
      schema:
        type: string
    FilterBrowser:
      name: browser
      in: query
      required: false
      description: Filter to sessions on this browser.
      schema:
        type: string
    FilterOs:
      name: os
      in: query
      required: false
      description: Filter to sessions on this operating system.
      schema:
        type: string
    FilterCountry:
      name: country
      in: query
      required: false
      description: Filter to sessions from this country (ISO code).
      schema:
        type: string
    FilterLandingPage:
      name: landing_page
      in: query
      required: false
      description: >
        Filter to sessions whose entry path matches. Case-insensitive and
        trailing-slash-insensitive (`/About/` matches `/about`). Query params
        never apply — the path is captured without them.
      schema:
        type: string
    FilterExperimentArm:
      name: experiment_arm
      in: query
      required: false
      description: >
        Filter to sessions in one A/B arm (exact match). The value is the
        raw arm label exactly as stored from the `$experiments` event
        property; its shape depends on the testing tool (for example
        `posthog:pricing-test:variant-b` for PostHog, or
        `experimentId:variationId` for Convert). A session's arm is the
        alphabetically-first non-empty `$experiments` entry of its earliest
        event that carries one. Not supported by `/data/sessions/breakdown`.
      schema:
        type: string
        example: "posthog:pricing-test:variant-b"
    FilterEngaged:
      name: engaged
      in: query
      required: false
      description: Filter by engagement (`1`/`0`, or `true`/`false`).
      schema:
        type: boolean
    FilterBounce:
      name: bounce
      in: query
      required: false
      description: Filter by bounce (`1`/`0`, or `true`/`false`).
      schema:
        type: boolean
    FilterIsIdentified:
      name: is_identified
      in: query
      required: false
      description: Filter to identified (`1`) or anonymous (`0`) sessions.
      schema:
        type: boolean
    FilterPersonId:
      name: person_id
      in: query
      required: false
      description: >
        Scope to one person's recordings: the canonical person id from the
        People API. Matches every recorded session whose visitor id belongs
        to that person in the identity graph (anonymous ids, user ids,
        emails), so pre-identification recordings are included. Powers a
        profile view's Recordings tab. Composable with all other filters and
        the date window.
      schema:
        type: string
    FilterDistinctId:
      name: distinct_id
      in: query
      required: false
      description: >
        Scope to one person's recordings by any raw identity value (anonymous
        id, user id, or email), resolved through the identity graph to the
        owning person's full identity set. A value not in the graph (a
        never-identified visitor) falls back to an exact `distinct_id` match.
        Pass either this or `person_id`, not both (they AND together).
      schema:
        type: string
    SegmentId:
      name: segment_id
      in: query
      required: false
      description: >
        Scope results to members of a saved segment (created via the Segments
        API). The segment decides WHICH PEOPLE qualify (a live definition,
        evaluated at query time); the date window decides which of their
        recorded sessions are returned. Composable with all other filters.
        Unknown or foreign id → `404 segment_not_found`.
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Missing, malformed, or invalid key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: >
        Access denied — location not linked to the agency
        (`location_not_linked`) or the location has HIPAA mode enabled
        (`hipaa_restricted`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    LocationRequired:
      description: An agency key called the route without binding a location
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Rate limit exceeded (120 requests per 10 seconds, per location).
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ReplaySession:
      type: object
      description: >
        A recorded session row: the full session record from `GET /sessions`
        (entry attribution — all UTMs, click IDs, landing/exit page, referrer,
        device, geo — plus `duration_seconds`, `events`, `pageviews`,
        `engaged`, `bounce`, `is_identified`) with replay activity counters
        merged on top. Only replay-specific fields are listed here; see the
        Data API `SessionRow` schema for the rest.
      additionalProperties: true
      properties:
        session_id:
          type: string
          description: Stable session identifier; use it to fetch the recording.
        started_at:
          type: string
          nullable: true
          description: Session start time.
        person_id:
          type: string
          nullable: true
          description: >
            Legacy identity value (the session's `user_id`, falling back to
            `distinct_id`) — NOT the canonical person id from the People API.
            To filter recordings by this value, pass it as `distinct_id`; the
            `person_id` query filter expects a People API id.
        distinct_id:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
          description: Legacy alias of `landing_url`.
        landing_page:
          type: string
          nullable: true
          description: Entry path of the session.
        utm_source:
          type: string
          nullable: true
        utm_medium:
          type: string
          nullable: true
        utm_campaign:
          type: string
          nullable: true
        browser:
          type: string
          nullable: true
        device_type:
          type: string
          nullable: true
        duration_ms:
          type: integer
          nullable: true
          description: Recorded duration from the replay summary (absent if the tab closed before the summary flushed).
        clicks:
          type: integer
        keypresses:
          type: integer
        console_errors:
          type: integer
        network_count:
          type: integer
    ReplayListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/ReplaySession"
        cursor:
          type: string
          nullable: true
          description: Reserved; currently always `null` (no pagination beyond the cap).
    ReplayEventsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            session_id:
              type: string
            events:
              type: array
              description: rrweb `eventWithTime` objects, in playback order.
              items:
                type: object
                additionalProperties: true
            windows:
              type: array
              description: One entry per page load in the returned events, earliest first.
              items:
                type: object
                properties:
                  window_id: { type: string }
                  started_at: { type: integer, description: Epoch ms of the window's first event. }
                  ended_at: { type: integer, description: Epoch ms of the window's last event. }
                  event_count: { type: integer }
                  href: { type: string, nullable: true, description: Page the window opened on. Null when its first block was lost. }
                  width: { type: integer, nullable: true, description: Viewport width at the start of the window. }
                  height: { type: integer, nullable: true }
            tracks:
              type: array
              description: >
                Window ids grouped into sets that never overlap in time, earliest
                first. Each set plays correctly in one player.
              items:
                type: array
                items: { type: string }
              example: [["0f4954dc-..."], ["e3a27165-..."]]
            overlapping:
              type: boolean
              description: True when `tracks` has more than one entry (tabs recorded at the same time).
    TimelineEvent:
      type: object
      properties:
        t:
          type: string
          description: "Event timestamp (UTC), `YYYY-MM-DD HH:MM:SS`; log rows add milliseconds."
        seconds_from_start:
          type: number
          description: >
            Seconds elapsed since the first event in the session (whole seconds
            for events, 0.1 s for log rows). Absent on a log row outside the
            timeline (`in_recording: false`).
        timestamp:
          type: string
          format: date-time
          description: Log rows only. The record's absolute time.
        in_recording:
          type: boolean
          description: Log rows only. True when the log falls between the first and last event.
        level:
          type: string
          description: Log rows only.
        service:
          type: string
          description: Log rows only.
        uuid:
          type: string
          description: Log rows only. The log record id (`GET /client/v1/logs/records/{uuid}` has the full body).
        trace_id:
          type: string
          nullable: true
          description: Log rows only.
        event:
          type: string
          example: $pageview
          description: Event type ($pageview, $pageleave, form_submitted, input_captured, $identify, custom_event), or `log` for a merged server log record.
        path:
          type: string
          description: URL path the event occurred on.
        detail:
          type: string
          description: >
            Compact, human-readable summary of the event (no PII). For a log
            row, `<level> <service>: <body>` with the body cut to 200 bytes;
            log bodies are your server's own text and are not scrubbed.
    ReplayTimelineResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        rows:
          type: integer
        truncated:
          type: boolean
          description: >
            True when the row cap was hit; the most-recent rows (the session
            outcome) are kept and earlier rows dropped.
        data:
          type: array
          items:
            $ref: "#/components/schemas/TimelineEvent"
        meta:
          type: object
          description: Present only with `include=logs`.
          properties:
            logs:
              type: string
              enum: [ok, forbidden, not_entitled, unavailable]
              description: >
                `ok`: merged. `forbidden`: the key lacks `logs:read`.
                `not_entitled`: the plan has no Logs. `unavailable`: HIPAA,
                unreadable configuration, the logs read budget, or a failed log
                read. Only `ok` carries log rows.
            logs_count: { type: integer }
            logs_truncated: { type: boolean, description: More logs exist than were merged. }
    SessionLogsResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            session_id: { type: string }
            records:
              type: array
              description: Log records, the same shape as `GET /client/v1/logs` returns.
              items:
                type: object
                properties:
                  uuid: { type: string }
                  timestamp: { type: string, format: date-time }
                  received_at: { type: string, format: date-time }
                  level: { type: string, enum: [trace, debug, info, warn, error, fatal] }
                  service: { type: string }
                  body: { type: string }
                  body_truncated: { type: boolean }
                  attributes: { type: object, additionalProperties: true }
                  resource_attributes: { type: object, additionalProperties: true }
                  trace_id: { type: string, nullable: true }
                  distinct_id: { type: string, nullable: true }
                  session_id: { type: string }
                  pattern_id: { type: string }
            next_cursor: { type: string, nullable: true }
            meta:
              type: object
              properties:
                from: { type: string, format: date-time, description: Scan window start (id time - 24 h). }
                to: { type: string, format: date-time, description: Scan window end (id time + 48 h). }
                order: { type: string }
                limit: { type: integer }
                truncated: { type: boolean }
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: replay_not_found
            message:
              type: string
              example: No recording for that session
