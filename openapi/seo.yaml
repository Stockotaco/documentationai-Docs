openapi: "3.0.3"
info:
  title: SEO Reports API
  version: 1.0.0
  description: >
    Finalized Search Console web search and organic landing-page reports for one
    location. Requires the airbyte plan feature and seo:read for scoped keys.
    Landing pages additionally require data_api and sessions:read plus events:read.
servers:
  - url: https://mythic-analytics.gulp.workers.dev
security:
  - BearerAuth: []
paths:
  /client/v1/seo/status:
    get:
      operationId: getSearchConsoleConnection
      summary: Get Search Console connection readiness
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Report, including empty results if Search Console is not ready.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: "#/components/schemas/Status"
        "400": { description: Invalid parameters or missing location binding. }
        "401": { description: Missing or invalid API key. }
        "402": { description: The effective location plan does not include the required feature. }
        "403": { description: "Outside the key's roster or scopes, or HIPAA location." }
        "429": { description: Rate limited. }
        "502": { description: Could not read a required upstream service. }
        "503": { description: Analytics or privacy configuration unavailable. }
  /client/v1/seo/overview:
    get:
      operationId: getSeoOverview
      summary: Get SEO totals for a location
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Days"
        - $ref: "#/components/parameters/Compare"
        - $ref: "#/components/parameters/QueryContains"
        - $ref: "#/components/parameters/PageContains"
        - $ref: "#/components/parameters/Country"
        - $ref: "#/components/parameters/Device"
      responses:
        "200":
          description: Report, including empty results if Search Console is not ready.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: "#/components/schemas/Overview"
        "400": { description: Invalid parameters or missing location binding. }
        "401": { description: Missing or invalid API key. }
        "402": { description: The effective location plan does not include the required feature. }
        "403": { description: "Outside the key's roster or scopes, or HIPAA location." }
        "429": { description: Rate limited. }
        "502": { description: Could not read a required upstream service. }
        "503": { description: Analytics or privacy configuration unavailable. }
  /client/v1/seo/trend:
    get:
      operationId: getSeoTrend
      summary: Get daily SEO metrics
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Days"
        - $ref: "#/components/parameters/Compare"
        - $ref: "#/components/parameters/QueryContains"
        - $ref: "#/components/parameters/PageContains"
        - $ref: "#/components/parameters/Country"
        - $ref: "#/components/parameters/Device"
      responses:
        "200":
          description: Report, including empty results if Search Console is not ready.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: "#/components/schemas/Trend"
        "400": { description: Invalid parameters or missing location binding. }
        "401": { description: Missing or invalid API key. }
        "402": { description: The effective location plan does not include the required feature. }
        "403": { description: "Outside the key's roster or scopes, or HIPAA location." }
        "429": { description: Rate limited. }
        "502": { description: Could not read a required upstream service. }
        "503": { description: Analytics or privacy configuration unavailable. }
  /client/v1/seo/queries:
    get:
      operationId: getSeoQueries
      summary: Rank Search Console queries
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Days"
        - $ref: "#/components/parameters/Compare"
        - $ref: "#/components/parameters/QueryContains"
        - $ref: "#/components/parameters/PageContains"
        - $ref: "#/components/parameters/Country"
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Publication"
        - $ref: "#/components/parameters/Format"
        - $ref: "#/components/parameters/PageEquals"
      responses:
        "200":
          description: Report, including empty results if Search Console is not ready.
          headers:
            X-SEO-Status:
              description: Report status (CSV only).
              schema: { type: string, enum: [not_connected, pipeline_disabled, copy_disabled, syncing, ok] }
            X-SEO-Coverage-Partial:
              description: Whether either requested period has partial coverage (CSV only).
              schema: { type: boolean }
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: "#/components/schemas/Queries"
            text/csv:
              schema: { type: string }
              description: The requested page of rows with a header. Comparison columns are prefixed previous_ when compare is true.
        "400": { description: Invalid parameters or missing location binding. }
        "401": { description: Missing or invalid API key. }
        "402": { description: The effective location plan does not include the required feature. }
        "403": { description: "Outside the key's roster or scopes, or HIPAA location." }
        "409": { description: The publication changed. Restart pagination from offset zero without the old token. }
        "429": { description: Rate limited. }
        "502": { description: Could not read a required upstream service. }
        "503": { description: Analytics or privacy configuration unavailable. }
  /client/v1/seo/pages:
    get:
      operationId: getSeoPages
      summary: Rank Search Console pages
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Days"
        - $ref: "#/components/parameters/Compare"
        - $ref: "#/components/parameters/QueryContains"
        - $ref: "#/components/parameters/PageContains"
        - $ref: "#/components/parameters/Country"
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Publication"
        - $ref: "#/components/parameters/Format"
        - $ref: "#/components/parameters/QueryEquals"
      responses:
        "200":
          description: Report, including empty results if Search Console is not ready.
          headers:
            X-SEO-Status:
              description: Report status (CSV only).
              schema: { type: string, enum: [not_connected, pipeline_disabled, copy_disabled, syncing, ok] }
            X-SEO-Coverage-Partial:
              description: Whether either requested period has partial coverage (CSV only).
              schema: { type: boolean }
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: "#/components/schemas/Pages"
            text/csv:
              schema: { type: string }
              description: The requested page of rows with a header. Comparison columns are prefixed previous_ when compare is true.
        "400": { description: Invalid parameters or missing location binding. }
        "401": { description: Missing or invalid API key. }
        "402": { description: The effective location plan does not include the required feature. }
        "403": { description: "Outside the key's roster or scopes, or HIPAA location." }
        "409": { description: The publication changed. Restart pagination from offset zero without the old token. }
        "429": { description: Rate limited. }
        "502": { description: Could not read a required upstream service. }
        "503": { description: Analytics or privacy configuration unavailable. }
  /client/v1/seo/landing-pages:
    get:
      operationId: getSeoLandingPages
      summary: Get organic landing-page performance
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Days"
        - $ref: "#/components/parameters/Compare"
        - $ref: "#/components/parameters/QueryContains"
        - $ref: "#/components/parameters/PageContains"
        - $ref: "#/components/parameters/Country"
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Publication"
        - $ref: "#/components/parameters/Format"
        - $ref: "#/components/parameters/ConversionEvent"
      responses:
        "200":
          description: Report, including empty results if Search Console is not ready.
          headers:
            X-SEO-Status:
              description: Report status (CSV only).
              schema: { type: string, enum: [not_connected, pipeline_disabled, copy_disabled, syncing, ok] }
            X-SEO-Coverage-Partial:
              description: Whether either requested period has partial coverage (CSV only).
              schema: { type: boolean }
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: "#/components/schemas/LandingPages"
            text/csv:
              schema: { type: string }
              description: The requested page of rows with a header. Comparison columns are prefixed previous_ when compare is true.
        "400": { description: Invalid parameters or missing location binding. }
        "401": { description: Missing or invalid API key. }
        "402": { description: The effective location plan does not include the required feature. }
        "403": { description: "Outside the key's roster or scopes, or HIPAA location." }
        "409": { description: The publication changed. Restart pagination from offset zero without the old token. }
        "429": { description: Rate limited. }
        "502": { description: Could not read a required upstream service. }
        "503": { description: Analytics or privacy configuration unavailable. }
  /client/v1/seo/breakdown:
    get:
      operationId: getSeoBreakdown
      summary: Rank SEO metrics by device or country
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Days"
        - $ref: "#/components/parameters/Compare"
        - $ref: "#/components/parameters/QueryContains"
        - $ref: "#/components/parameters/PageContains"
        - $ref: "#/components/parameters/Country"
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Publication"
        - $ref: "#/components/parameters/Format"
        - $ref: "#/components/parameters/Dimension"
      responses:
        "200":
          description: Report, including empty results if Search Console is not ready.
          headers:
            X-SEO-Status:
              description: Report status (CSV only).
              schema: { type: string, enum: [not_connected, pipeline_disabled, copy_disabled, syncing, ok] }
            X-SEO-Coverage-Partial:
              description: Whether either requested period has partial coverage (CSV only).
              schema: { type: boolean }
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: "#/components/schemas/Breakdown"
            text/csv:
              schema: { type: string }
              description: The requested page of rows with a header. Comparison columns are prefixed previous_ when compare is true.
        "400": { description: Invalid parameters or missing location binding. }
        "401": { description: Missing or invalid API key. }
        "402": { description: The effective location plan does not include the required feature. }
        "403": { description: "Outside the key's roster or scopes, or HIPAA location." }
        "409": { description: The publication changed. Restart pagination from offset zero without the old token. }
        "429": { description: Rate limited. }
        "502": { description: Could not read a required upstream service. }
        "503": { description: Analytics or privacy configuration unavailable. }
  /client/v1/seo/brand:
    get:
      operationId: getSeoBrandSplit
      summary: Split branded, non-branded and anonymized search
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Days"
        - $ref: "#/components/parameters/Compare"
        - $ref: "#/components/parameters/BrandTerms"
      responses:
        "200":
          description: Report, including empty results if Search Console is not ready.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: "#/components/schemas/Brand"
        "400": { description: Invalid parameters or missing location binding. }
        "401": { description: Missing or invalid API key. }
        "402": { description: The effective location plan does not include the required feature. }
        "403": { description: "Outside the key's roster or scopes, or HIPAA location." }
        "429": { description: Rate limited. }
        "502": { description: Could not read a required upstream service. }
        "503": { description: Analytics or privacy configuration unavailable. }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    LocationId:
      name: location_id
      in: query
      description: Bind the client for an agency key. Also accepted as X-Location-Id.
      schema: { type: string }
    From:
      name: from
      in: query
      description: Inclusive start date. Send either from or days.
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      description: Inclusive end date. Defaults to three days before today.
      schema: { type: string, format: date }
    Days:
      name: days
      in: query
      description: Lookback window ending at to. Do not send with from.
      schema: { type: integer, minimum: 1, maximum: 366, default: 28 }
    Compare:
      name: compare
      in: query
      description: Compare to the immediately preceding equal-length period.
      schema: { type: boolean, default: false }
    QueryContains:
      name: query_contains
      in: query
      description: Case-insensitive literal search-query substring.
      schema: { type: string, minLength: 1, maxLength: 200 }
    PageContains:
      name: page_contains
      in: query
      description: Case-insensitive literal Search Console URL substring.
      schema: { type: string, minLength: 1, maxLength: 200 }
    Country:
      name: country
      in: query
      description: ISO 3166-1 alpha-3 Search Console country code.
      schema: { type: string, pattern: '^[A-Za-z]{3}$', example: usa }
    Device:
      name: device
      in: query
      description: Case-insensitive Search Console device, desktop, mobile, or tablet.
      schema: { type: string, pattern: '^([Dd][Ee][Ss][Kk][Tt][Oo][Pp]|[Mm][Oo][Bb][Ii][Ll][Ee]|[Tt][Aa][Bb][Ll][Ee][Tt])$', example: MOBILE }
    Sort:
      name: sort
      in: query
      description: Current period metric. Position sorts ascending, other metrics descending.
      schema: { type: string, enum: [clicks, impressions, ctr, position], default: clicks }
    Limit:
      name: limit
      in: query
      description: Maximum number of ranked current-period rows.
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    Offset:
      name: offset
      in: query
      description: Number of ranked rows to skip. Use next_offset from the previous response.
      schema: { type: integer, minimum: 0, maximum: 9007199254740991, default: 0 }
    Publication:
      name: publication
      in: query
      description: Token returned by the previous ranked response. Resend with the same report parameters when paging. Pins Search Console rows only, not onsite metrics.
      schema: { type: string, pattern: '^[a-f0-9]{64}$' }
    Format:
      name: format
      in: query
      description: Set to csv for text/csv. Omit for JSON including pagination and coverage.
      schema: { type: string, enum: [csv] }
    PageEquals:
      name: page_equals
      in: query
      description: Exact GSC page URL, case-sensitive. No URL normalization.
      schema: { type: string, format: uri, minLength: 1, maxLength: 2048 }
    QueryEquals:
      name: query_equals
      in: query
      description: Exact GSC search query, case-sensitive.
      schema: { type: string, minLength: 1, maxLength: 2048 }
    Dimension:
      name: dimension
      in: query
      required: true
      schema: { type: string, enum: [device, country] }
    BrandTerms:
      name: brand_terms
      in: query
      required: true
      description: Comma-separated list of 1–20 query substrings (1–200 characters each), matched case-insensitively.
      schema: { type: string, minLength: 1, maxLength: 4019, example: "acme,acme tools" }
    ConversionEvent:
      name: conversion_event
      in: query
      description: Exact Mythic event to count in Organic Search sessions. Omit for null conversions.
      schema: { type: string, minLength: 1, maxLength: 128 }
  schemas:
    Status:
      type: object
      required: [status, property, synced_at]
      properties:
        status: { type: string, enum: [not_connected, pipeline_disabled, copy_disabled, syncing, ok] }
        property: { type: string, nullable: true, example: "sc-domain:example.com" }
        synced_at:
          type: string
          format: date-time
          nullable: true
          description: Last completed copy of the requested grain, or the oldest latest copy across all grains for the status route.
    Range:
      type: object
      nullable: true
      required: [from, to]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
    Report:
      allOf:
        - $ref: "#/components/schemas/Status"
        - type: object
          required: [range, previous_range, grain, cached, coverage]
          properties:
            range: { $ref: "#/components/schemas/Range" }
            previous_range: { $ref: "#/components/schemas/Range" }
            grain: { type: string, enum: [gsc_date, gsc_query, gsc_page, gsc_country, gsc_device, gsc_detail, gsc_site_report, gsc_page_report] }
            cached: { type: boolean }
            coverage: { $ref: "#/components/schemas/Coverage" }
    Coverage:
      type: object
      required: [current, previous]
      properties:
        current: { $ref: "#/components/schemas/PeriodCoverage" }
        previous: { $ref: "#/components/schemas/PeriodCoverage" }
    PeriodCoverage:
      type: object
      nullable: true
      description: Calendar days with published data in the report grain, before filters. Null for a comparison that was not requested.
      required: [first_date, last_date, days_covered, days_requested, partial]
      properties:
        first_date: { type: string, format: date, nullable: true }
        last_date: { type: string, format: date, nullable: true }
        days_covered: { type: integer, minimum: 0 }
        days_requested: { type: integer, minimum: 1 }
        partial: { type: boolean, description: Values are based on fewer days than requested. }
    Pagination:
      type: object
      required: [total_rows, next_offset, publication]
      properties:
        publication: { type: string, nullable: true, pattern: '^[a-f0-9]{64}$', description: Search Console publication token. Null when the report is not ready. }
        total_rows: { type: integer, minimum: 0, description: Number of current-period rows before pagination. }
        next_offset: { type: integer, nullable: true, minimum: 0, description: Null on the last or an out-of-range page. }
    Metrics:
      type: object
      nullable: true
      required: [clicks, impressions, ctr, position]
      properties:
        clicks: { type: integer, format: int64, minimum: 0 }
        impressions: { type: integer, format: int64, minimum: 0 }
        ctr: { type: number, nullable: true, description: "Clicks divided by impressions, not a percentage." }
        position: { type: number, nullable: true, description: Impression-weighted search position. }
    TrendComparison:
      type: object
      nullable: true
      required: [date, clicks, impressions, ctr, position]
      properties:
        date: { type: string, format: date }
        clicks: { type: integer, format: int64, minimum: 0 }
        impressions: { type: integer, format: int64, minimum: 0 }
        ctr: { type: number, nullable: true, description: "Clicks divided by impressions, not a percentage." }
        position: { type: number, nullable: true, description: Impression-weighted search position. }
    TrendRow:
      type: object
      required: [date, metrics, previous]
      properties:
        date: { type: string, format: date }
        metrics: { $ref: "#/components/schemas/Metrics" }
        previous: { $ref: "#/components/schemas/TrendComparison" }
    Onsite:
      type: object
      nullable: true
      required: [sessions, conversions, lcp_p75_ms, inp_p75_ms, cls_p75]
      properties:
        sessions: { type: integer, format: int64 }
        conversions: { type: integer, format: int64, nullable: true }
        lcp_p75_ms: { type: number, nullable: true }
        inp_p75_ms: { type: number, nullable: true }
        cls_p75: { type: number, nullable: true }
    Overview:
      allOf:
        - $ref: "#/components/schemas/Report"
        - type: object
          required: [metrics, previous]
          properties:
            metrics: { $ref: "#/components/schemas/Metrics" }
            previous: { $ref: "#/components/schemas/Metrics" }
    Trend:
      allOf:
        - $ref: "#/components/schemas/Report"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items: { $ref: "#/components/schemas/TrendRow" }
    QueryRow:
      type: object
      required: [query, clicks, impressions, ctr, position, previous]
      properties:
        query: { type: string }
        clicks: { type: integer, format: int64, minimum: 0 }
        impressions: { type: integer, format: int64, minimum: 0 }
        ctr: { type: number, nullable: true, description: "Clicks divided by impressions, not a percentage." }
        position: { type: number, nullable: true, description: Impression-weighted search position. }
        previous: { $ref: "#/components/schemas/Metrics" }
    Queries:
      allOf:
        - $ref: "#/components/schemas/Report"
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items: { $ref: "#/components/schemas/QueryRow" }
    PageRow:
      type: object
      required: [page_normalized, page, clicks, impressions, ctr, position, previous]
      properties:
        page: { type: string, description: Original Search Console URL. }
        page_normalized: { type: string, description: "Join key after removing query string, fragment and one trailing slash. Different pages can share this key." }
        clicks: { type: integer, format: int64, minimum: 0 }
        impressions: { type: integer, format: int64, minimum: 0 }
        ctr: { type: number, nullable: true, description: "Clicks divided by impressions, not a percentage." }
        position: { type: number, nullable: true, description: Impression-weighted search position. }
        previous: { $ref: "#/components/schemas/Metrics" }
    Pages:
      allOf:
        - $ref: "#/components/schemas/Report"
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items: { $ref: "#/components/schemas/PageRow" }
    LandingPageRow:
      type: object
      required: [page_normalized, page, clicks, impressions, ctr, position, previous, match, onsite, onsite_previous]
      properties:
        page: { type: string, description: Original Search Console URL. }
        page_normalized: { type: string, description: "Join key after removing query string, fragment and one trailing slash. Different pages can share this key." }
        clicks: { type: integer, format: int64, minimum: 0 }
        impressions: { type: integer, format: int64, minimum: 0 }
        ctr: { type: number, nullable: true, description: "Clicks divided by impressions, not a percentage." }
        position: { type: number, nullable: true, description: Impression-weighted search position. }
        previous: { $ref: "#/components/schemas/Metrics" }
        match: { type: string, enum: [matched, none] }
        onsite: { $ref: "#/components/schemas/Onsite" }
        onsite_previous: { $ref: "#/components/schemas/Onsite" }
    LandingPages:
      allOf:
        - $ref: "#/components/schemas/Report"
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [rows, conversion_event]
          properties:
            conversion_event: { type: string, nullable: true }
            rows:
              type: array
              items: { $ref: "#/components/schemas/LandingPageRow" }
    Breakdown:
      allOf:
        - $ref: "#/components/schemas/Report"
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [dimension, rows]
          properties:
            dimension: { type: string, enum: [device, country] }
            rows:
              type: array
              items:
                type: object
                required: [value, clicks, impressions, ctr, position, previous]
                properties:
                  value: { type: string }
                  clicks: { type: integer, format: int64, minimum: 0 }
                  impressions: { type: integer, format: int64, minimum: 0 }
                  ctr: { type: number, nullable: true }
                  position: { type: number, nullable: true }
                  previous: { $ref: "#/components/schemas/Metrics" }
    Brand:
      allOf:
        - $ref: "#/components/schemas/Report"
        - type: object
          required: [brand_terms, branded, non_branded, anonymized, query_coverage]
          properties:
            query_coverage: { $ref: '#/components/schemas/Coverage' }
            brand_terms:
              type: array
              items: { type: string }
            branded: { $ref: "#/components/schemas/BrandGroup" }
            non_branded: { $ref: "#/components/schemas/BrandGroup" }
            anonymized:
              type: object
              required: [metrics, previous]
              properties:
                metrics: { $ref: "#/components/schemas/Residual" }
                previous: { $ref: "#/components/schemas/Residual" }
    BrandGroup:
      type: object
      required: [metrics, previous]
      properties:
        metrics: { $ref: "#/components/schemas/Metrics" }
        previous: { $ref: "#/components/schemas/Metrics" }
    Residual:
      type: object
      nullable: true
      description: Traffic not in visible queries (anonymized or truncated by Google). Property minus visible query totals over dates published by both grains. Null when not comparable or either difference is negative.
      required: [clicks, impressions, ctr, position]
      properties:
        clicks: { type: integer, format: int64, minimum: 0 }
        impressions: { type: integer, format: int64, minimum: 0 }
        ctr: { type: number, nullable: true }
        position: { type: number, nullable: true, description: Always null for the residual. }
