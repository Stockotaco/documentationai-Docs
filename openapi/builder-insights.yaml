openapi: "3.0.0"
info:
  version: 2.0.0
  title: Insights
  description: >-
    Create, list, retrieve, update, and delete saved insights. An insight is a
    saved **explore spec** (`config.query` — the same object `POST
    /client/v1/data/query` takes) plus a visualization type, scoped to a single
    client location. It runs on the Tinybird explore engine; there is no SQL
    anywhere in an insight.
servers:
  - url: https://mythic-analytics.gulp.workers.dev/builder
security:
  - BearerAuth: []
paths:
  /insights:
    get:
      summary: List insights
      operationId: listInsights
      description: >
        List insights for the resolved location, ordered by `updated_at`
        descending. Readable with an agency key (`ak_`) or a viewer key
        (`sk_`). Agency keys must pass `?location_id=`.
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Insights for the location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightListResponse"
        "400":
          description: Missing `?location_id=` when using an agency key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authorization key missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Create or update insight
      operationId: saveInsight
      description: >
        Create a new insight, or update an existing one when an `id` is
        included in the body. Requires an agency key (`ak_`) and
        `?location_id=`. On update, the insight must belong to the resolved
        location. Returns the saved row.


        The body is **validated on write**: `config.query` must be a valid
        explore spec and its `kind` must match `insight_type` (`funnel` ⇔
        `funnel`; every other type draws a `trend`). A bad config is a `400`
        here, never a `500` on the first run.
      parameters:
        - $ref: "#/components/parameters/LocationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveInsightRequest"
      responses:
        "200":
          description: Insight created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightResponse"
        "400":
          description: >-
            Missing `?location_id=`, or the config is invalid — `error` is
            `invalid config` and `details[]` lists what failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "403":
          description: Write access requires an agency key (`ak_`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /insights/preview:
    post:
      summary: Preview an unsaved config
      operationId: previewInsight
      description: >
        Run an insight `config` in-memory and return the same payload as the
        saved-insight runner — **without persisting anything**. Use it for a
        builder's live "Run" on a draft. Requires an agency key (`ak_`) and
        `?location_id=`. Charges the query rate-limit allowance. Identical
        drafts are served from a 120-second cache so keystroke-driven previews
        are free to repeat.
      parameters:
        - $ref: "#/components/parameters/LocationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewInsightRequest"
      responses:
        "200":
          description: >-
            Query result for the draft — the explore response (`series` +
            `buckets` for a trend, `steps` for a funnel) with `meta`, the echoed
            `config`, the compiled `sql`, and `cached`. Documented under the
            Queries group (`POST /insights/{id}/query`).
          content:
            application/json:
              schema:
                type: object
        "400":
          description: >-
            Missing `insight_type`/`config`, an invalid spec, or a query error.
            The `error` field carries the message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Preview requires an agency key (`ak_`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Query rate limit exceeded for this location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /insights/validate:
    post:
      summary: Validate a config (no query)
      operationId: validateInsight
      description: >
        Shape check for an insight `config` — **no query runs**. Applies the
        same rules as the write path: `config.query` must be a valid explore
        spec (unknown keys, limits, date ranges, maths, filters) and its
        `kind` must match `insight_type`. Requires an agency key (`ak_`) and
        `?location_id=`. Use it on every edit; run `/insights/preview` when you
        also need data.
      parameters:
        - $ref: "#/components/parameters/LocationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateInsightRequest"
      responses:
        "200":
          description: 'The config is valid (`{ "ok": true }`)'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateInsightResponse"
        "400":
          description: >-
            The config is invalid (`{ "ok": false, "errors": [...] }`), or
            `insight_type`/`config` was missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateInsightResponse"
        "403":
          description: Requires an agency key (`ak_`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /insights/{id}:
    get:
      summary: Get insight
      operationId: getInsight
      description: >
        Fetch a single insight by id. The insight must belong to the resolved
        location. Returns the full row including `config`.
      parameters:
        - $ref: "#/components/parameters/InsightId"
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: The insight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightDetailResponse"
        "404":
          description: Insight not found for this location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: Patch insight metadata
      operationId: patchInsight
      description: >
        Update `tags`, `is_favorite`, `name`, or `description` without
        touching the config. Requires an agency key (`ak_`). Use `POST
        /insights` with an `id` to change the config itself.
      parameters:
        - $ref: "#/components/parameters/InsightId"
        - $ref: "#/components/parameters/LocationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchInsightRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: No patchable field in the body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Write access requires an agency key (`ak_`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete insight
      operationId: deleteInsight
      description: >
        Delete an insight. Also removes it from every dashboard it is on.
        Requires an agency key (`ak_`).
      parameters:
        - $ref: "#/components/parameters/InsightId"
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          description: Write access requires an agency key (`ak_`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        Builder key as a bearer token. Use an agency key (`Bearer ak_...`) for
        writes, or a viewer key (`Bearer sk_...`) for reads. Scoped keys
        (`mcp_`) with `insights:read`/`insights:write` are accepted too.
  parameters:
    InsightId:
      name: id
      in: path
      required: true
      description: Insight UUID
      schema:
        type: string
        format: uuid
    LocationId:
      name: location_id
      in: query
      required: false
      description: >-
        Client location to scope the request to. Required when authenticating
        with an agency key (`ak_`). Ignored for viewer keys (`sk_`).
      schema:
        type: string
        example: acme-retail
  schemas:
    InsightType:
      type: string
      description: >-
        Visualization only. `funnel` draws a `kind: funnel` spec; the others
        draw a `kind: trend` spec (`line`/`table` want an `interval`,
        `number`/`bar`/`pie` usually don't).
      enum: [number, line, bar, pie, table, funnel]
    InsightConfig:
      type: object
      required:
        - query
      description: >-
        `query` is an explore spec — the same object `POST /client/v1/data/query`
        takes; the full grammar is on the [Explore queries](/data-api/explore)
        page and a per-type walkthrough on the
        [Insight config reference](/builder-api/insight-config). Any other key
        is stored verbatim as display settings and never read by the runner.
      properties:
        query:
          type: object
          description: Explore spec (`kind`, `date_range`, `series`/`steps`, `interval`, `breakdown`, `compare`, `filters`, `window`).
      additionalProperties: true
      example:
        query:
          kind: trend
          date_range:
            preset: 30d
          interval: day
          series:
            - event: $pageview
              math: dau
              label: Visitors
          compare: previous_period
    Insight:
      type: object
      properties:
        id:
          type: string
          format: uuid
        location_id:
          type: string
          example: acme-retail
        data_connection_id:
          type: string
          format: uuid
          nullable: true
        created_by:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          example: Daily visitors
        description:
          type: string
          nullable: true
        insight_type:
          $ref: "#/components/schemas/InsightType"
        config:
          $ref: "#/components/schemas/InsightConfig"
        visualization:
          type: object
        is_embeddable:
          type: boolean
          example: false
        embed_token:
          type: string
          description: Token used for public embedding via `POST /public/query`.
          example: 9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c
        tags:
          type: array
          items:
            type: string
          example: [funnel, paid]
        canvas_id:
          type: string
          format: uuid
          nullable: true
          description: Set when the insight was generated from a canvas.
        is_favorite:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    InsightSummary:
      type: object
      description: Fields returned by the list endpoint.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        insight_type:
          $ref: "#/components/schemas/InsightType"
        tags:
          type: array
          items:
            type: string
        canvas_id:
          type: string
          format: uuid
          nullable: true
        is_favorite:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SaveInsightRequest:
      type: object
      required:
        - name
        - insight_type
        - config
      properties:
        id:
          type: string
          format: uuid
          description: Include to update an existing insight; omit to create.
        name:
          type: string
          example: Daily visitors
        description:
          type: string
          example: Unique visitors per day, last 30 days vs the 30 before
        insight_type:
          $ref: "#/components/schemas/InsightType"
        config:
          $ref: "#/components/schemas/InsightConfig"
    PreviewInsightRequest:
      type: object
      required:
        - insight_type
        - config
      properties:
        insight_type:
          $ref: "#/components/schemas/InsightType"
        config:
          $ref: "#/components/schemas/InsightConfig"
        dateRange:
          type: object
          description: >-
            Optional override of `config.query.date_range`, e.g.
            `{ "preset": "7d" }` or `{ "preset": "custom", "from": "2026-08-01",
            "to": "2026-08-31" }`. Presets: `24h`, `7d`, `14d`, `30d`, `90d`,
            `365d`, `custom`.
        granularity:
          type: string
          enum: [hour, day, week, month]
          description: Optional override of `config.query.interval` (trends only).
    ValidateInsightRequest:
      type: object
      required:
        - insight_type
        - config
      properties:
        insight_type:
          $ref: "#/components/schemas/InsightType"
        config:
          $ref: "#/components/schemas/InsightConfig"
    ValidateInsightResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        errors:
          type: array
          description: Present only when `ok` is `false`.
          items:
            type: string
          example:
            - 'insight_type "line" cannot draw a "funnel" query'
    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: invalid config
        details:
          type: array
          items:
            type: string
          example:
            - config.query (explore spec) is required
    PatchInsightRequest:
      type: object
      description: >-
        At least one field is required. Fields outside this set are ignored.
      properties:
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        is_favorite:
          type: boolean
    InsightResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Insight"
    InsightDetailResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Insight"
    InsightListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/InsightSummary"
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Write access requires an agency key (ak_)
