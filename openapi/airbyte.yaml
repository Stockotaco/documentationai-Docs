openapi: "3.0.0"
info:
  version: 1.0.0
  title: Airbyte Sync
  description: >
    Agency self-service management of Airbyte data connections — provision a
    BigQuery destination, create per-client ad-platform sources, trigger and
    schedule syncs, and review sync history and health.
servers:
  - url: https://mythic-analytics.gulp.workers.dev/client/v1/airbyte
security:
  - AgencyKey: []
  - SecretKey: []
paths:
  /platforms:
    get:
      summary: List supported platforms
      operationId: listAirbytePlatforms
      description: >
        Return the catalog of supported source platforms, including their
        required configuration fields and default stream selections. Read-only —
        available to both agency (`ak_`) and secret (`sk_`) keys.
      responses:
        "200":
          description: Supported platforms
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Platform"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /config:
    get:
      summary: Get Airbyte config
      operationId: getAirbyteConfig
      description: >
        Return the calling agency's Airbyte configuration (workspace,
        destination, and BigQuery target). Encrypted GCP credentials are never
        returned; a `has_credentials` boolean indicates whether they are stored.
      responses:
        "200":
          description: Agency config
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Config"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No Airbyte config exists for this agency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: Update OAuth return origins
      operationId: updateAirbyteConfig
      description: >
        Replace the set of origins the OAuth consent flow may redirect the browser
        to. `POST /oauth/initiate` rejects any `return_url` whose origin is not in
        this list, which is what stops the unauthenticated callback from being used
        as an open redirector.


        Origins only — `https://portal.example.com`, no path. A supplied URL is
        normalised to its origin, duplicates are collapsed, and non-http(s) or
        credential-bearing values are rejected. The list starts empty, meaning no
        `return_url` is accepted at all until you set it (the callback then renders
        its own terminal page). Requires an agency key (`ak_`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - oauth_return_origins
              properties:
                oauth_return_origins:
                  type: array
                  items:
                    type: string
                    example: https://portal.example.com
      responses:
        "200":
          description: Stored origins
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      oauth_return_origins:
                        type: array
                        items:
                          type: string
        "400":
          description: "Not an array, or an entry that is not a valid http(s) origin (`code: invalid_origins`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "404":
          description: No Airbyte config exists for this agency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /config/provision:
    post:
      summary: Provision workspace
      operationId: provisionAirbyteWorkspace
      description: >
        Create (or refresh) the agency's Airbyte workspace and a BigQuery
        destination using GCS staging. Idempotent for the workspace — an
        existing workspace is reused. Requires an agency key (`ak_`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionRequest"
      responses:
        "200":
          description: Workspace provisioned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/ProvisionResult"
        "400":
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "404":
          description: Agency not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Encryption key not configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /connections:
    get:
      summary: List connections
      operationId: listAirbyteConnections
      description: List all connections owned by the calling agency, most recent first.
      parameters:
        - name: platform
          in: query
          description: Filter by platform key (e.g. `google_ads`).
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: Filter by connection status.
          required: false
          schema:
            type: string
            enum: ["active", "error", "paused"]
        - name: client_id
          in: query
          description: Filter by client (location) identifier.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Connections
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Connection"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create connection
      operationId: createAirbyteConnection
      description: >
        Create an Airbyte source for a client and wire it to the agency's
        BigQuery destination. The `client_id` must belong to the calling agency
        and the agency workspace must already be provisioned and active.
        Requires an agency key (`ak_`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectionRequest"
      responses:
        "201":
          description: Connection created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Connection"
        "400":
          description: Missing `client_id`, unsupported platform, or workspace not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Write access requires an agency key, or the location is not linked to the agency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /connections/{id}:
    get:
      summary: Retrieve connection
      operationId: getAirbyteConnection
      description: Fetch a single connection owned by the calling agency.
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: Connection details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Connection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ConnectionNotFound"
    put:
      summary: Update connection
      operationId: updateAirbyteConnection
      description: >
        Update a connection's display name, sync frequency, stream selection, or
        status. Changes to name, schedule, and streams are propagated to Airbyte.
        Requires an agency key (`ak_`).
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConnectionRequest"
      responses:
        "200":
          description: Updated connection
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Connection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "404":
          $ref: "#/components/responses/ConnectionNotFound"
    delete:
      summary: Delete connection
      operationId: deleteAirbyteConnection
      description: >
        Delete the connection and its underlying Airbyte source. The remote
        Airbyte connection and source are removed on a best-effort basis before
        the local record is deleted. Requires an agency key (`ak_`).
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: Connection deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "404":
          $ref: "#/components/responses/ConnectionNotFound"
  /oauth/initiate:
    post:
      summary: Start an OAuth connection
      operationId: initiateAirbyteOauth
      description: >
        Begin a provider OAuth handshake for a platform whose catalog entry has
        `supportsOauth: true`. Returns a `consent_url` to redirect the browser to;
        after the user consents the provider redirects back to
        `/oauth/callback/{state}`, which creates the source and connection and
        then bounces to `return_url`.


        No long-lived access or refresh token is ever handled by the caller or
        stored by Mythic — Airbyte holds the tokens and refreshes them. Fields the
        consent flow supplies are flagged `oauth: true` in the platform catalog;
        pass the remaining non-secret fields (account identifiers, Bing's
        `developer_token`) in `source_config`, since they are needed to create the
        source on the callback. Account identifiers are normalised for you — Meta's
        `act_` prefix is stripped and accepted as `account_id` or `account_ids`,
        and dashes are stripped from a Google `customer_id`.


        `meta_ads` and `google_ads` REQUIRE an account identifier here, before
        consent (`missing_account_id` otherwise): absent, the connect fails after
        the user has already authorised, as an opaque catalog-discovery error.


        `return_url` must have an origin the agency registered via
        `PATCH /config` — see `oauth_return_origins`. An unregistered origin is
        rejected with `return_url_not_allowed` at initiation, so it is never
        stored, and the callback can never be used to bounce a browser to an
        arbitrary destination.


        The pending request is held for 15 minutes and the returned `state` is
        single-use. It is also your correlation handle: hold it against the
        connection you are creating, since the connection id does not exist until
        the callback completes. Rate limited to 20 initiations per 10 minutes per
        agency. Requires an agency key (`ak_`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OauthInitiateRequest"
      responses:
        "200":
          description: Consent URL issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/OauthInitiateResult"
        "400":
          description: >
            Rejected before anything is stored. The `code` field carries the
            reason: `missing_fields`, `unsupported_platform`, `no_oauth_support`,
            `missing_account_id`, `invalid_return_url`, `return_url_not_allowed`,
            or `not_provisioned`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Write access requires an agency key, or the location is not linked to the agency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: "More than 20 initiations in 10 minutes for this agency (`code: rate_limited`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /oauth/callback/{state}:
    get:
      summary: OAuth callback (provider redirect)
      operationId: airbyteOauthCallback
      description: >
        Landing endpoint for the provider redirect — not called directly by
        integrators. Exchanges Airbyte's `secret_id` for a source and creates the
        connection.


        Unauthenticated by design: the redirect arrives from a browser and carries
        no API key, so the single-use `state` token in the path is the credential.
        Airbyte replaces the query string on this redirect, which is why `state`
        is a path segment.


        On success, redirects (302) to the `return_url` given at initiation with
        `mythic_oauth=success` and `mythic_connection_id=…` appended; on failure,
        with `mythic_oauth=error` and `mythic_error_code=…`. Parameters are
        namespaced so they cannot collide with your own query string, which is
        preserved.


        `mythic_error_code` is drawn from a closed set you can switch on:
        `state_invalid` (expired, already used, or unreadable), `missing_secret_id`,
        `missing_account_id`, `not_configured`, `not_provisioned`,
        `connection_failed`. Exception messages are never placed in the URL — they
        stay in server logs.


        When no `return_url` was given, this renders a minimal terminal HTML page
        rather than JSON, because the client here is always a browser. Rate limited
        to 20 requests per 10 minutes per IP.
      security: []
      parameters:
        - name: state
          in: path
          required: true
          description: Single-use state token returned by `POST /oauth/initiate`.
          schema:
            type: string
        - name: secret_id
          in: query
          required: true
          description: Credential handle appended by Airbyte after consent.
          schema:
            type: string
      responses:
        "302":
          description: >
            Redirect to `return_url` with `mythic_oauth` and either
            `mythic_connection_id` or `mythic_error_code` appended.
        "200":
          description: >
            Terminal HTML page confirming the connection (only when no
            `return_url` was supplied).
          content:
            text/html:
              schema:
                type: string
        "400":
          description: >
            HTML page naming a closed-set reason code (`missing_secret_id`,
            `state_invalid`), or a redirect when a `return_url` exists.
          content:
            text/html:
              schema:
                type: string
        "429":
          description: More than 20 callbacks in 10 minutes from this IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /connections/{id}/sync:
    post:
      summary: Trigger sync
      operationId: triggerAirbyteSync
      description: >
        Queue an immediate sync job for the connection in Airbyte. Requires an
        agency key (`ak_`).
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: Sync job queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "404":
          $ref: "#/components/responses/ConnectionNotFound"
  /connections/{id}/jobs:
    get:
      summary: List recent jobs
      operationId: listAirbyteJobs
      description: >
        Return recent Airbyte sync jobs for the connection, newest first. Data is
        read live from Airbyte.


        Each job is Airbyte's own record passed through unchanged (see the `Job`
        schema for exact field names). Airbyte's `next`/`previous` paging fields
        are not forwarded.
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
        - name: limit
          in: query
          description: Maximum jobs to return. Default `10`, clamped to `1`–`100`.
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Recent jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    description: Jobs, newest first.
                    items:
                      $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ConnectionNotFound"
  /connections/{id}/schedule:
    patch:
      summary: Update schedule
      operationId: updateAirbyteSchedule
      description: >
        Change the sync frequency for a connection. Cron-based frequencies are
        pushed to Airbyte; `manual` switches the connection to manual triggering.
        Requires an agency key (`ak_`).
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sync_frequency
              properties:
                sync_frequency:
                  $ref: "#/components/schemas/SyncFrequency"
      responses:
        "200":
          description: Schedule updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  sync_frequency:
                    $ref: "#/components/schemas/SyncFrequency"
        "400":
          description: Missing `sync_frequency`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "404":
          $ref: "#/components/responses/ConnectionNotFound"
  /sync-events:
    get:
      summary: List sync events
      operationId: listAirbyteSyncEvents
      description: >
        Return the paginated, immutable sync-event log for the calling agency.
        Each event captures the outcome and record/byte counts of a completed
        sync.
      parameters:
        - name: connection_id
          in: query
          description: Filter by Airbyte connection ID.
          required: false
          schema:
            type: string
        - name: platform
          in: query
          description: Filter by platform key.
          required: false
          schema:
            type: string
        - name: client_id
          in: query
          description: Filter by client (location) identifier.
          required: false
          schema:
            type: string
        - name: success
          in: query
          description: Filter by outcome. Pass `true` or `false`.
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          description: Maximum results per page. Default `50`, clamped to `1`–`500`.
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          description: Number of results to skip. Default `0`.
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated sync events
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SyncEvent"
                  total:
                    type: integer
                    example: 128
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
  /stats:
    get:
      summary: Get sync statistics
      operationId: getAirbyteStats
      description: >
        Return aggregated sync statistics for the calling agency across the last
        24 hours, last 30 days, and all time, plus per-platform and per-client
        breakdowns. Cost is estimated from committed record counts.
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Stats"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /health:
    get:
      summary: Get connection health
      operationId: getAirbyteHealth
      description: >
        Return a health overview for the calling agency's connections, including
        counts, connections in an error state, stale connections (no successful
        sync in 48 hours), and per-connection failure rates.
      responses:
        "200":
          description: Health overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Health"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    AgencyKey:
      type: http
      scheme: bearer
      description: >
        Agency key as bearer token, format `Bearer ak_...`. Grants full
        read-write access scoped to the agency. May also be passed as an `ak`
        query parameter.
    SecretKey:
      type: http
      scheme: bearer
      description: >
        Location secret key as bearer token, format `Bearer sk_...`. Grants
        read-only access; the agency is resolved from the location. Write
        endpoints return `403`. May also be passed as an `sk` query parameter.
  parameters:
    ConnectionId:
      name: id
      in: path
      required: true
      description: Mythic connection record identifier (the local UUID, not the Airbyte connection ID).
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid authorization
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    WriteForbidden:
      description: Write access requires an agency key (`ak_`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConnectionNotFound:
      description: Connection not found or not owned by the calling agency
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Platform:
      type: object
      properties:
        key:
          type: string
          example: google_ads
        label:
          type: string
          example: Google Ads
        supportsOauth:
          type: boolean
          description: >
            Whether this platform can be connected through the OAuth handoff
            (`POST /oauth/initiate`) instead of pasting long-lived credentials
            into `source_config`.
          example: true
        requiredFields:
          type: array
          description: Configuration fields the source requires.
          items:
            type: object
            properties:
              key:
                type: string
                example: customer_id
              label:
                type: string
                example: Customer ID
              placeholder:
                type: string
                example: 123-456-7890
              type:
                type: string
                description: Rendering hint, e.g. `json` or `secret`. Absent for plain text.
                example: secret
              oauth:
                type: boolean
                description: >
                  This field is supplied by the OAuth consent flow. Omit it from
                  `source_config` when connecting via `POST /oauth/initiate`, and
                  do not prompt a user for it. Fields WITHOUT this flag are still
                  required in either flow (account identifiers, and Bing's
                  app-issued `developer_token`).
                example: true
        defaultStreams:
          type: array
          description: Streams selected by default when a connection is created.
          items:
            $ref: "#/components/schemas/Stream"
    Stream:
      type: object
      properties:
        name:
          type: string
          example: campaigns
        syncMode:
          type: string
          description: >
            The mode sent to Airbyte. `incremental_deduped_history` upserts on the
            stream's primary key, so a resync of a daily insights table re-keys its
            rows instead of appending duplicates — every incremental stream uses it.
            `incremental` and `full_refresh` are accepted as legacy aliases of
            `incremental_deduped_history` and `full_refresh_overwrite`; append-only
            incremental is not offered.
          enum:
            - incremental_deduped_history
            - full_refresh_overwrite
            - incremental
            - full_refresh
          example: incremental_deduped_history
        cursorField:
          type: string
          nullable: true
          example: segments.date
        sourceDefinedCursor:
          type: boolean
          nullable: true
          example: true
        primaryKey:
          type: array
          nullable: true
          description: Composite primary key, as an array of column-path arrays.
          items:
            type: array
            items:
              type: string
    Config:
      type: object
      properties:
        id:
          type: string
        agency_id:
          type: string
        workspace_id:
          type: string
          nullable: true
        destination_id:
          type: string
          nullable: true
        bigquery_project_id:
          type: string
          nullable: true
          example: acme-analytics
        bigquery_dataset:
          type: string
          nullable: true
          example: mythic_ads
        staging_bucket_name:
          type: string
          nullable: true
          example: acme-airbyte-staging
        status:
          type: string
          enum: ["provisioning", "active", "error"]
          example: active
        error_message:
          type: string
          nullable: true
        has_credentials:
          type: boolean
          description: Whether encrypted GCP credentials are stored. The credentials themselves are never returned.
          example: true
        oauth_return_origins:
          type: array
          description: >
            Origins the OAuth consent flow may redirect the browser to. Empty means
            no `return_url` is accepted. Set with `PATCH /config`.
          items:
            type: string
            example: https://portal.example.com
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProvisionRequest:
      type: object
      required:
        - bigquery_project_id
        - bigquery_dataset
        - gcp_credentials_json
      properties:
        bigquery_project_id:
          type: string
          description: Destination BigQuery project ID.
          example: acme-analytics
        bigquery_dataset:
          type: string
          description: Destination BigQuery dataset.
          example: mythic_ads
        gcp_credentials_json:
          type: string
          description: >
            GCP service-account credentials JSON, as a string. Encrypted at rest;
            never returned by the API.
        dataset_location:
          type: string
          description: BigQuery dataset location. Defaults to `US`.
          default: US
          example: US
        staging_bucket_name:
          type: string
          description: GCS bucket used for staging loads.
          example: acme-airbyte-staging
        staging_bucket_path:
          type: string
          description: Optional path prefix within the staging bucket.
        hmac_key_access_id:
          type: string
          description: HMAC key access ID for GCS staging. Provide together with the secret.
        hmac_key_secret:
          type: string
          description: HMAC key secret for GCS staging. Provide together with the access ID.
        keep_files_in_gcs_bucket:
          type: string
          description: Airbyte staging-file retention option.
    ProvisionResult:
      type: object
      properties:
        workspace_id:
          type: string
        destination_id:
          type: string
        status:
          type: string
          example: active
    CreateConnectionRequest:
      type: object
      required:
        - client_id
        - platform
      properties:
        client_id:
          type: string
          description: Client (location) identifier. Must belong to the calling agency.
          example: acme-retail
        platform:
          type: string
          description: Platform key from the platforms catalog.
          example: google_ads
        display_name:
          type: string
          description: Human-readable connection name. Defaults to `<platform> - <client_id>`.
          example: Acme — Google Ads
        account_id:
          type: string
          description: >
            Platform account identifier. Falls back to the platform's account-ID
            field within `source_config` if omitted.
          example: 123-456-7890
        source_config:
          type: object
          description: >
            Platform-specific source configuration, matching the platform's
            `requiredFields`. When `secret_id` is supplied, omit the fields flagged
            `oauth: true` — Airbyte injects those credentials.
        secret_id:
          type: string
          description: >
            Credential handle from a completed OAuth handshake, in place of raw
            credentials in `source_config`. Normally you never set this by hand:
            `/oauth/callback/{state}` creates the connection for you. It exists for
            callers that want to run the consent step themselves and create the
            connection later.
        sync_frequency:
          $ref: "#/components/schemas/SyncFrequency"
        streams:
          type: array
          description: >
            Stream selection. Defaults to the platform's `defaultStreams` when
            omitted.
          items:
            $ref: "#/components/schemas/Stream"
    OauthInitiateRequest:
      type: object
      required:
        - client_id
        - platform
      properties:
        client_id:
          type: string
          description: Client (location) identifier. Must belong to the calling agency.
          example: acme-retail
        platform:
          type: string
          description: "Platform key whose catalog entry has `supportsOauth: true`."
          example: meta_ads
        return_url:
          type: string
          description: >
            Absolute http(s) URL to send the browser to once the connection is
            created. Its ORIGIN must be registered in `oauth_return_origins`
            (`PATCH /config`) or the request is rejected with
            `return_url_not_allowed`. `mythic_oauth` plus `mythic_connection_id` or
            `mythic_error_code` are appended; your own query parameters are kept.
            Omit it and the callback renders a terminal HTML page instead.
          example: https://portal.example.com/integrations/acme-retail
        source_config:
          type: object
          description: >
            Non-secret connector fields needed to create the source after consent —
            everything in the platform's `requiredFields` NOT flagged `oauth: true`.
            Account identifiers are normalised, so `{ "account_id": "act_123" }` and
            `{ "account_ids": ["123"] }` are equally acceptable for Meta, and a
            dashed Google `customer_id` is fine. Required for `meta_ads` and
            `google_ads`.
        display_name:
          type: string
          example: Acme — Meta Ads
        account_id:
          type: string
          example: act_123456789
        sync_frequency:
          $ref: "#/components/schemas/SyncFrequency"
        streams:
          type: array
          description: Stream selection. Defaults to the platform's `defaultStreams`.
          items:
            $ref: "#/components/schemas/Stream"
        oauth_input_configuration:
          type: object
          description: >
            Optional provider-specific OAuth inputs passed through to Airbyte
            (`oAuthInputConfiguration`), for connectors that need one to build the
            consent URL.
    OauthInitiateResult:
      type: object
      properties:
        consent_url:
          type: string
          description: Redirect the browser here to obtain user consent.
          example: https://www.facebook.com/v18.0/dialog/oauth?client_id=…
        state:
          type: string
          description: Single-use token identifying this pending connection.
        expires_in:
          type: integer
          description: Seconds the pending request stays valid.
          example: 900
    UpdateConnectionRequest:
      type: object
      properties:
        display_name:
          type: string
          example: Acme — Google Ads (Prod)
        sync_frequency:
          $ref: "#/components/schemas/SyncFrequency"
        streams:
          type: array
          items:
            $ref: "#/components/schemas/Stream"
        status:
          type: string
          enum: ["active", "error", "paused"]
    Connection:
      type: object
      properties:
        id:
          type: string
          description: Mythic connection record ID.
        client_id:
          type: string
          example: acme-retail
        agency_id:
          type: string
        platform:
          type: string
          example: google_ads
        connection_id:
          type: string
          description: Airbyte connection ID.
        source_id:
          type: string
          description: Airbyte source ID.
        display_name:
          type: string
          example: Google Ads - acme-retail
        account_id:
          type: string
          nullable: true
          example: 123-456-7890
        status:
          type: string
          enum: ["active", "error", "paused"]
          example: active
        sync_frequency:
          $ref: "#/components/schemas/SyncFrequency"
        tables_json:
          type: array
          description: Resolved stream selection stored for the connection.
          items:
            type: object
        last_sync_at:
          type: string
          format: date-time
          nullable: true
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    SyncFrequency:
      type: string
      description: >
        Sync cadence. `24h`, `12h`, and `6h` map to cron schedules; `manual`
        disables automatic syncing.
      enum: ["24h", "12h", "6h", "manual"]
      example: 24h
    Job:
      type: object
      description: >
        Airbyte job record, passed through verbatim from Airbyte's public API
        (`GET /v1/jobs`) with no renaming or added fields. These are Airbyte's
        field names — there is no `createdAt`, `updatedAt`, or `endTime`, and no
        per-attempt block (`lastAttempt`) on this payload.
      required: [jobId, status, jobType, startTime, connectionId]
      properties:
        jobId:
          type: integer
          format: int64
          example: 68374749
        status:
          type: string
          description: >
            `succeeded`, `failed`, `cancelled`, and `incomplete` are terminal;
            `pending` and `running` are in flight. Only `succeeded` means a clean
            sync — treat `incomplete` (partial success) as not successful.
          enum: [pending, running, incomplete, failed, succeeded, cancelled]
          example: succeeded
        jobType:
          type: string
          description: >
            Mythic only ever triggers `sync`; `reset` jobs appear if a reset is
            run from the Airbyte UI. Newer Airbyte versions may also report
            `clear` and `refresh`.
          enum: [sync, reset]
          example: sync
        connectionId:
          type: string
          format: uuid
          description: >
            Airbyte's connection UUID — not the Mythic connection `id` used in
            the request path.
          example: 871f879d-9c37-426b-be7b-eeaca16333f3
        startTime:
          type: string
          format: date-time
          description: >
            When the job started, UTC ISO 8601. The only start timestamp on the
            payload.
          example: "2026-01-30T10:14:37Z"
        lastUpdatedAt:
          type: string
          format: date-time
          description: >
            Last state change — the finish time for a terminal job. Omitted
            entirely while a job is still in flight (`pending`/`running`), so use
            `startTime` for ordering and treat this as the finish time only.
          example: "2026-01-30T10:17:22Z"
        duration:
          type: string
          description: >
            ISO 8601 duration. Present on in-flight jobs too, where it is elapsed
            time so far, not the final runtime.
          example: PT2M45S
        bytesSynced:
          type: integer
          format: int64
          description: >
            Bytes synced. `0` on an in-flight job or one that moved nothing.
          example: 307376
        rowsSynced:
          type: integer
          format: int64
          description: >
            Records synced. `0` on an in-flight job or one that moved nothing.
          example: 132
    SyncEvent:
      type: object
      properties:
        id:
          type: string
        client_id:
          type: string
          nullable: true
        agency_id:
          type: string
          nullable: true
        connection_id:
          type: string
        platform:
          type: string
          nullable: true
        job_id:
          type: integer
          nullable: true
        success:
          type: boolean
        error_message:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        duration_seconds:
          type: integer
          nullable: true
        records_emitted:
          type: integer
          example: 15230
        records_committed:
          type: integer
          example: 15230
        bytes_emitted:
          type: integer
        bytes_committed:
          type: integer
        created_at:
          type: string
          format: date-time
    StatsBucket:
      type: object
      properties:
        syncs:
          type: integer
          example: 12
        success_rate:
          type: integer
          description: Percentage of successful syncs (0–100).
          example: 100
        records_synced:
          type: integer
          example: 182760
        bytes_synced:
          type: integer
        estimated_cost_usd:
          type: number
          description: Estimated cost derived from committed record counts.
          example: 2.74
    Stats:
      type: object
      properties:
        last_24h:
          $ref: "#/components/schemas/StatsBucket"
        last_30d:
          $ref: "#/components/schemas/StatsBucket"
        all_time:
          $ref: "#/components/schemas/StatsBucket"
        per_platform:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/StatsBucket"
        per_client:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/StatsBucket"
    Health:
      type: object
      properties:
        total_connections:
          type: integer
          example: 8
        active:
          type: integer
          example: 7
        error_connections:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              client_id:
                type: string
              platform:
                type: string
              error_message:
                type: string
                nullable: true
        stale_connections:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              client_id:
                type: string
              platform:
                type: string
              last_sync_at:
                type: string
                format: date-time
                nullable: true
        failure_rates:
          type: object
          description: Map of Airbyte connection ID to failure-rate percentage.
          additionalProperties:
            type: integer
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Missing authorization
        code:
          type: string
          description: >
            Stable machine-readable reason, present on the OAuth and rate-limit
            paths. Switch on this rather than on `error`, which is prose and may
            change.
          example: return_url_not_allowed
