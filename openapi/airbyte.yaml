openapi: "3.0.0"
info:
  version: 1.0.0
  title: Airbyte Sync
  description: >
    Agency self-service management of Airbyte data connections — provision a
    BigQuery destination, create per-client ad-platform sources, trigger and
    schedule syncs, and review sync history and health.
servers:
  - url: https://mythic-analytics.gulp.workers.dev/client/v1/airbyte
security:
  - AgencyKey: []
  - SecretKey: []
paths:
  /platforms:
    get:
      summary: List supported platforms
      operationId: listAirbytePlatforms
      description: >
        Return the catalog of supported source platforms, including their
        required configuration fields and default stream selections. Read-only —
        available to both agency (`ak_`) and secret (`sk_`) keys.
      responses:
        "200":
          description: Supported platforms
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Platform"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /config:
    get:
      summary: Get Airbyte config
      operationId: getAirbyteConfig
      description: >
        Return the calling agency's Airbyte configuration (workspace,
        destination, and BigQuery target). Encrypted GCP credentials are never
        returned; a `has_credentials` boolean indicates whether they are stored.
      responses:
        "200":
          description: Agency config
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Config"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No Airbyte config exists for this agency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: Update OAuth return origins
      operationId: updateAirbyteConfig
      description: >
        Replace the set of origins the OAuth consent flow may redirect the browser
        to. `POST /oauth/initiate` rejects any `return_url` whose origin is not in
        this list, which is what stops the unauthenticated callback from being used
        as an open redirector.


        Origins only — `https://portal.example.com`, no path. A supplied URL is
        normalised to its origin, duplicates are collapsed, and non-http(s) or
        credential-bearing values are rejected. The list starts empty, meaning no
        `return_url` is accepted at all until you set it (the callback then renders
        its own terminal page). Requires an agency key (`ak_`).


        Works on an agency that has never provisioned: the config row is created
        if it does not exist. That row unlocks nothing on its own —
        `POST /oauth/initiate` still requires an active provisioned workspace —
        it just means you can register return origins before provisioning
        rather than after.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - oauth_return_origins
              properties:
                oauth_return_origins:
                  type: array
                  items:
                    type: string
                    example: https://portal.example.com
      responses:
        "200":
          description: Stored origins
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      oauth_return_origins:
                        type: array
                        items:
                          type: string
        "400":
          description: "Not an array, or an entry that is not a valid http(s) origin (`code: invalid_origins`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
  /config/notifications:
    post:
      summary: Register sync notifications
      operationId: registerAirbyteNotifications
      description: >
        Point your Airbyte workspace's sync notifications at Mythic's receiver,
        so completed syncs appear under `/sync-events`, `/stats`, `/health` and
        each connection's `last_sync`.


        `POST /config/provision` already does this. Call this endpoint for a
        workspace provisioned before notifications existed, for a workspace you
        adopted, or any time you want to confirm the wiring — it is idempotent
        and reports `changed: false` when nothing needed doing.


        Airbyte allows exactly ONE webhook URL per event type. If the workspace
        already posts sync notifications somewhere else, this returns `409
        notifications_conflict` and changes nothing, rather than silently
        replacing an endpoint you may depend on. Send
        `overwrite_notifications: true` to take it over.


        Only the `failure` and `success` events are registered. Email
        preferences and the other four event types are left exactly as you set
        them. Requires an agency key (`ak_`).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                overwrite_notifications:
                  type: boolean
                  default: false
                  description: Replace an existing third-party webhook URL on the failure/success events.
      responses:
        "200":
          description: Notifications registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      workspace_id:
                        type: string
                      notifications:
                        $ref: "#/components/schemas/NotificationRegistration"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "404":
          description: "This agency has no provisioned workspace (`code: not_provisioned`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            The workspace already posts sync notifications to another URL
            (`code: notifications_conflict`). Retry with
            `overwrite_notifications: true` to replace it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /webhooks:
    get:
      summary: List sync-notification subscriptions
      operationId: listAirbyteWebhookSubscriptions
      description: >
        Endpoints of yours that Mythic forwards Airbyte sync notifications to.


        Airbyte allows exactly ONE webhook URL per event type per workspace, and
        Mythic holds it — every figure under `/sync-events`, `/stats`, `/health`
        and each connection's `last_sync` is built from those posts. Rather than
        take the slot from us, subscribe here: our receiver writes its own record
        and then relays the event to each subscription.


        The returned `url` is REDACTED. Every query-string value is replaced with
        `***`, because the credential for these endpoints normally lives in the
        query string. The full URL is stored encrypted and is never readable back
        through the API.
      responses:
        "200":
          description: Subscriptions for this agency
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebhookSubscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Subscribe an endpoint
      operationId: createAirbyteWebhookSubscription
      description: >
        Register an endpoint to receive Airbyte sync notifications. Requires an
        agency key (`ak_`).


        The URL is treated as opaque and stored as a secret: pass your own
        authentication inside it (a query-string token is the usual shape, since
        Airbyte's own notifications are unsigned) and it will be encrypted at
        rest. Must be `https`.


        Idempotent on the URL. Re-posting a URL that already exists updates its
        label and clears its failure state rather than creating a second
        subscription — a duplicate would deliver every notification twice.
        Re-posting is also how you resume a subscription that was parked after
        repeated delivery failures.


        Delivery is best-effort and unordered. The event is already durable in
        `/sync-events`, so there is no redelivery queue here; dedupe on `job_id`
        and order on `finished_at`, never on `delivered_at` or your own receipt
        time. A retried older failure CAN arrive after a newer success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  description: HTTPS endpoint to POST notifications to. Stored encrypted; returned redacted.
                  example: "https://example.com/hooks/airbyte?secret=REPLACE_ME"
                label:
                  type: string
                  nullable: true
                  description: Your own name for this endpoint, shown when listing subscriptions.
      responses:
        "201":
          description: Subscription created or refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/WebhookSubscription"
        "400":
          description: "`url` missing, not a URL, or not `https`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
  /webhooks/{id}:
    delete:
      summary: Remove a subscription
      operationId: deleteAirbyteWebhookSubscription
      description: >
        Stop forwarding sync notifications to this endpoint. Requires an agency
        key (`ak_`).
      parameters:
        - name: id
          in: path
          required: true
          description: Subscription identifier.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Subscription removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      deleted:
                        type: boolean
                      id:
                        type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "404":
          description: >
            No such subscription for this agency (`code: not_found`). Deleting an
            id you do not own reports this rather than success — a false success
            would read as "we stopped delivering there" while delivery continues.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /config/provision:
    post:
      summary: Provision workspace
      operationId: provisionAirbyteWorkspace
      description: >
        Point the agency at an Airbyte workspace and a BigQuery destination,
        either by CREATING them or by ADOPTING ones it already runs. Requires an
        agency key (`ak_`).


        **What repeats safely.** The workspace is reused, never duplicated. A
        destination Mythic created is UPDATED IN PLACE, so re-running provision
        to change dataset, location or loading method repoints the same
        destination instead of leaving the previous one orphaned in Airbyte. A
        destination you ADOPTED is never modified or deleted — it is yours, and
        may serve your own pipelines; a later create-mode provision builds a
        separate Mythic-owned destination rather than rewriting yours. The
        response reports `destination_reused` so you can tell which happened.


        Connections are unaffected either way: they reference the destination by
        id, and updating in place keeps that id.


        **Adopt what you already run.** If the agency already syncs these
        platforms with its own Airbyte, pass `airbyte_workspace_id` +
        `airbyte_destination_id` (plus `airbyte_client_id`/
        `airbyte_client_secret` when that setup is in the agency's own Airbyte
        org). Provisioning a second, independent workspace against the same
        BigQuery dataset produces duplicate rows, two sets of incremental
        cursor state that each believe they own the stream, and two Airbyte
        bills — and nothing errors. In CREATE mode the target dataset is
        checked for existing Airbyte-managed tables and the request is refused
        with `409 dataset_in_use` unless `confirm_shared_dataset: true`.


        **Staging is optional, but all-or-nothing.** Supply
        `staging_bucket_name` + `hmac_key_access_id` + `hmac_key_secret`
        together for GCS staging, or none of them for standard inserts. A
        partial set is rejected with `400 staging_incomplete`.


        Nothing is persisted by a failed provision that had no prior config:
        the row is rolled back, so `GET /config` keeps returning `404
        not_configured` rather than a permanently empty `status: error` config
        you cannot tell apart from a never-provisioned agency. Failures carry
        the underlying reason in the response — you should never have to read
        it back off `GET /config`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionRequest"
      responses:
        "200":
          description: Workspace provisioned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/ProvisionResult"
        "400":
          description: >
            `missing_fields` (BigQuery fields absent in CREATE mode, or an
            Airbyte client id/secret sent without its pair),
            `missing_workspace_id` (`airbyte_destination_id` without
            `airbyte_workspace_id`), `staging_incomplete` (partial GCS staging
            configuration — the message names the missing fields),
            `destination_not_found` or `destination_workspace_mismatch` (the
            adopted destination is not visible to these credentials, or lives
            in another workspace).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "409":
          description: >
            `dataset_in_use` — the target dataset already holds Airbyte-managed
            tables, so a second destination writing there would duplicate rows
            and split cursor state. Adopt the existing destination, choose
            another dataset, or resend with `confirm_shared_dataset: true`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: >
            `provision_failed` — Airbyte rejected the request. The upstream
            reason is included in `error`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Agency not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Encryption key not configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /connections:
    get:
      summary: List connections
      operationId: listAirbyteConnections
      description: List all connections owned by the calling agency, most recent first.
      parameters:
        - name: platform
          in: query
          description: Filter by platform key (e.g. `google_ads`).
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: Filter by connection status.
          required: false
          schema:
            type: string
            enum: ["active", "error", "paused"]
        - name: client_id
          in: query
          description: Filter by client (location) identifier.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Connections
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Connection"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create connection
      operationId: createAirbyteConnection
      description: >
        Create an Airbyte source for a client and wire it to the agency's
        BigQuery destination. The `client_id` must belong to the calling agency
        and the agency workspace must already be provisioned and active.
        Requires an agency key (`ak_`).


        **Streams are reconciled against the source's real catalog.** Omit
        `streams` and you get the platform's defaults, filtered to what this
        source actually offers — a default a connector has since renamed is
        dropped rather than failing your whole connection. Supply `streams`
        yourself and any name the source does not offer is rejected with `400
        unknown_streams`, listing the valid names, because silently dropping a
        stream you asked for would lose data you expect. Stream names are the
        CONNECTOR's, not the ad platform's UI labels — Meta's "Ad sets" is the
        stream `ad_sets`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectionRequest"
      responses:
        "201":
          description: Connection created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Connection"
        "400":
          description: >
            Missing `client_id`, unsupported platform, workspace not active, or
            `unknown_streams` — a supplied stream name is not offered by this
            source; the message lists the valid ones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Write access requires an agency key, or the location is not linked to the agency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /connections/{id}:
    get:
      summary: Retrieve connection
      operationId: getAirbyteConnection
      description: Fetch a single connection owned by the calling agency.
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: Connection details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Connection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ConnectionNotFound"
    put:
      summary: Update connection
      operationId: updateAirbyteConnection
      description: >
        Update a connection's display name, sync frequency, stream selection, or
        status. Changes to name, schedule, and streams are propagated to Airbyte.
        Requires an agency key (`ak_`).
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConnectionRequest"
      responses:
        "200":
          description: Updated connection
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Connection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "404":
          $ref: "#/components/responses/ConnectionNotFound"
    delete:
      summary: Delete connection
      operationId: deleteAirbyteConnection
      description: >
        Delete the connection and its underlying Airbyte source. The remote
        Airbyte connection and source are removed on a best-effort basis before
        the local record is deleted. Requires an agency key (`ak_`).


        THE SOURCE MAY BE SHARED. A weekly companion connection runs off the
        same source as its primary, so the source is deleted only with the LAST
        connection using it — otherwise deleting one half would leave the other
        unable to sync, with nothing to say why. The response reports both
        facts: `source_deleted`, and `siblings_kept` listing connections on this
        source that are still there.
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: Connection deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      source_deleted:
                        type: boolean
                        description: Whether the Airbyte source was removed too, or kept for a sibling connection.
                      siblings_kept:
                        type: array
                        description: Connections still using this source. Empty in the ordinary case.
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            display_name:
                              type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "404":
          $ref: "#/components/responses/ConnectionNotFound"
  /oauth/initiate:
    post:
      summary: Start an OAuth connection
      operationId: initiateAirbyteOauth
      description: >
        Begin a provider OAuth handshake for a platform whose catalog entry has
        `supportsOauth: true` — which means the provider CREDENTIAL comes from
        consent, not that there is nothing to fill in; see `manualFields` for
        what you must still pass. Returns a `consent_url` to redirect the browser to;
        after the user consents the provider redirects back to
        `/oauth/callback/{state}`, which creates the source and connection and
        then bounces to `return_url`.


        No long-lived access or refresh token is ever handled by the caller or
        stored by Mythic — Airbyte holds the tokens and refreshes them. Fields the
        consent flow supplies are flagged `oauth: true` in the platform catalog;
        pass the remaining non-secret fields (account identifiers, Bing's
        `developer_token`) in `source_config`, since they are needed to create the
        source on the callback. Account identifiers are normalised for you — Meta's
        `act_` prefix is stripped and accepted as `account_id` or `account_ids`,
        and dashes are stripped from a Google `customer_id`.


        `meta_ads` and `google_ads` REQUIRE an account identifier here, before
        consent (`missing_account_id` otherwise): absent, the connect fails after
        the user has already authorised, as an opaque catalog-discovery error.


        `return_url` must have an origin the agency registered via
        `PATCH /config` — see `oauth_return_origins`. An unregistered origin is
        rejected with `return_url_not_allowed` at initiation, so it is never
        stored, and the callback can never be used to bounce a browser to an
        arbitrary destination.


        **The request is validated before the provisioning gate.** A malformed
        request gets its own code — `missing_account_id`,
        `return_url_not_allowed`, `unsupported_platform` — whether or not the
        agency has provisioned yet, so you can wire up and verify the consent
        call against an unprovisioned agency and still get an actionable
        reason. `not_provisioned` means the request itself was fine.


        The pending request is held for 15 minutes and the returned `state` is
        single-use. It is also your correlation handle: hold it against the
        connection you are creating, since the connection id does not exist until
        the callback completes. Rate limited to 20 initiations per 10 minutes per
        agency. Requires an agency key (`ak_`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OauthInitiateRequest"
      responses:
        "200":
          description: Consent URL issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/OauthInitiateResult"
        "400":
          description: >
            Rejected before anything is stored. The `code` field carries the
            reason: `missing_fields`, `unsupported_platform`, `no_oauth_support`,
            `missing_account_id`, `invalid_return_url`, `return_url_not_allowed`,
            or `not_provisioned`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Write access requires an agency key, or the location is not linked to the agency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: "More than 20 initiations in 10 minutes for this agency (`code: rate_limited`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /oauth/callback/{state}:
    get:
      summary: OAuth callback (provider redirect)
      operationId: airbyteOauthCallback
      description: >
        Landing endpoint for the provider redirect — not called directly by
        integrators. Exchanges Airbyte's `secret_id` for a source and creates the
        connection.


        Unauthenticated by design: the redirect arrives from a browser and carries
        no API key, so the single-use `state` token in the path is the credential.
        Airbyte replaces the query string on this redirect, which is why `state`
        is a path segment.


        On success, redirects (302) to the `return_url` given at initiation with
        `mythic_oauth=success` and `mythic_connection_id=…` appended; on failure,
        with `mythic_oauth=error` and `mythic_error_code=…`. Parameters are
        namespaced so they cannot collide with your own query string, which is
        preserved.


        `mythic_error_code` is drawn from a closed set you can switch on:
        `state_invalid` (expired, already used, or unreadable), `missing_secret_id`,
        `missing_account_id`, `not_configured`, `not_provisioned`,
        `source_config_rejected` (Airbyte refused the source payload against the
        connector's schema — a Mythic-side bug that consenting again cannot fix,
        so do NOT prompt the user to retry; report it),
        `oauth_secret_expired` (the provider credential Airbyte minted was gone
        by the time the source was created — start the connection again),
        `account_not_accessible` (consent succeeded
        but the account named at initiation is not one that user can reach —
        fix the account id, not the consent), `connection_failed` (anything
        else). Exception messages are never placed in the URL — they stay in
        server logs.


        Because `connection_failed` is a catch-all, a failed callback also
        writes a row to the sync-event log with `error_origin: oauth_callback`
        and the underlying message in `error_message`. Read it at
        `GET /sync-events?client_id=…` — it is the only trail a failed consent
        leaves, since no connection is created.


        When no `return_url` was given, this renders a minimal terminal HTML page
        rather than JSON, because the client here is always a browser. Rate limited
        to 20 requests per 10 minutes per IP.
      security: []
      parameters:
        - name: state
          in: path
          required: true
          description: Single-use state token returned by `POST /oauth/initiate`.
          schema:
            type: string
        - name: secret_id
          in: query
          required: true
          description: Credential handle appended by Airbyte after consent.
          schema:
            type: string
      responses:
        "302":
          description: >
            Redirect to `return_url` with `mythic_oauth` and either
            `mythic_connection_id` or `mythic_error_code` appended.
        "200":
          description: >
            Terminal HTML page confirming the connection (only when no
            `return_url` was supplied).
          content:
            text/html:
              schema:
                type: string
        "400":
          description: >
            HTML page naming a closed-set reason code (`missing_secret_id`,
            `state_invalid`), or a redirect when a `return_url` exists.
          content:
            text/html:
              schema:
                type: string
        "429":
          description: More than 20 callbacks in 10 minutes from this IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /connections/{id}/sync:
    post:
      summary: Trigger sync
      operationId: triggerAirbyteSync
      description: >
        Queue an immediate sync job for the connection in Airbyte. Requires an
        agency key (`ak_`).
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: Sync job queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "404":
          $ref: "#/components/responses/ConnectionNotFound"
  /connections/{id}/jobs:
    get:
      summary: List recent jobs
      operationId: listAirbyteJobs
      description: >
        Return recent Airbyte sync jobs for the connection, newest first. Data is
        read live from Airbyte.


        Each job is Airbyte's own record passed through unchanged (see the `Job`
        schema for exact field names). Airbyte's `next`/`previous` paging fields
        are not forwarded.


        An empty `data` array means this connection has genuinely never run. It
        is never a symptom: an unreachable Airbyte, a rejected token, or a
        malformed upstream response all raise (`401` upstream errors surface as
        a failure, and a 200 without a job array returns `502
        airbyte_unavailable`) rather than being flattened into "no runs". Render
        `[]` as fact and the error as "could not reach the sync provider".


        This is the only endpoint on this surface that reads Airbyte live.
        `GET /connections` and `GET /sync-events` read Mythic's own database, so
        no Airbyte outage can turn them into a false empty either.
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
        - name: limit
          in: query
          description: Maximum jobs to return. Default `10`, clamped to `1`–`100`.
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Recent jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    description: Jobs, newest first.
                    items:
                      $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ConnectionNotFound"
        "502":
          description: >
            `airbyte_unavailable` — Airbyte answered with something that is not
            a job list. Distinct from an empty list, which is a real answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /connections/{id}/schedule:
    patch:
      summary: Update schedule
      operationId: updateAirbyteSchedule
      description: >
        Change the sync frequency, and optionally the hour it runs at, for a
        connection. Scheduled frequencies are pushed to Airbyte; `manual`
        switches the connection to manual triggering. Requires an agency key
        (`ak_`).


        Sending `sync_frequency` alone KEEPS the connection's existing
        `sync_hour_utc` rather than resetting it to the default, so changing
        cadence never silently moves a client's sync to a different time of
        day. The response returns `runs_at_utc`, the concrete hours this
        schedule fires at.
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sync_frequency
              properties:
                sync_frequency:
                  $ref: "#/components/schemas/SyncFrequency"
                sync_hour_utc:
                  $ref: "#/components/schemas/SyncHourUtc"
      responses:
        "200":
          description: Schedule updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  sync_frequency:
                    $ref: "#/components/schemas/SyncFrequency"
                  sync_hour_utc:
                    $ref: "#/components/schemas/SyncHourUtc"
                  runs_at_utc:
                    type: array
                    description: >
                      The hours (UTC) this schedule actually fires at — empty
                      for `manual`. Provided so a caller never has to decode a
                      cron expression to tell a client when their data lands.
                    items:
                      type: integer
                    example: [2, 8, 14, 20]
        "400":
          description: >
            Missing `sync_frequency`, or `invalid_sync_hour` — `sync_hour_utc`
            must be an integer 0-23.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "404":
          $ref: "#/components/responses/ConnectionNotFound"
  /pipelines/{clientId}:
    get:
      summary: Get pipeline
      operationId: getAirbytePipeline
      description: Orchestration config for a client — scope, run hour, and completion webhook.
      parameters:
        - $ref: "#/components/parameters/PipelineClientId"
      responses:
        "200":
          description: Pipeline
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: "#/components/schemas/Pipeline"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "No pipeline for this client (`code: no_pipeline`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Create or update pipeline
      operationId: putAirbytePipeline
      description: >
        Set which connections a run waits for, when it starts, and where the
        completion webhook goes.


        ENABLING TAKES SCHEDULES OVER. Every in-scope connection is set to
        `manual` in Airbyte and its previous schedule stashed, because a run can
        only be a meaningful unit if Mythic is what triggers the syncs. Anything
        DROPPED from scope, or in the pipeline when it is disabled, gets its
        original schedule handed back — a connection left on `manual` with
        nothing triggering it does not error, it simply stops updating. The
        response reports both under `schedule_changes`.


        `connection_ids` must be connections belonging to this client;
        otherwise `400 unknown_connections`. Requires an agency key (`ak_`).
      parameters:
        - $ref: "#/components/parameters/PipelineClientId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                connection_ids:
                  type: array
                  description: >
                    Mythic connection ids a run waits for. Authoritative — never
                    inferred at run time. Use `GET /pipelines/{clientId}/candidates`
                    to populate a picker.
                  items:
                    type: string
                run_hour_utc:
                  type: integer
                  minimum: 0
                  maximum: 23
                  default: 2
                  description: Hour (UTC) the daily run starts.
                webhook_url:
                  type: string
                  description: HTTPS endpoint POSTed once the run completes.
                webhook_secret:
                  type: string
                  description: >
                    Used to HMAC-SHA256 the request body into `X-Mythic-Signature`.
                    Write-only; never returned.
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    allOf:
                      - $ref: "#/components/schemas/Pipeline"
                      - type: object
                        properties:
                          schedule_changes:
                            type: object
                            properties:
                              taken_over: { type: array, items: { type: object } }
                              handed_back: { type: array, items: { type: object } }
                              errors: { type: array, items: { type: object } }
        "400":
          description: "`unknown_connections`, `invalid_sync_hour`, or `invalid_webhook_url`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
  /pipelines/{clientId}/candidates:
    get:
      summary: List scope candidates
      operationId: listAirbytePipelineCandidates
      description: >
        This client's connections, each flagged `in_scope` and `suggested`.


        Discovery proposes; it never decides. Which connections belong to a
        client is not reliably answerable from an Airbyte workspace — real ones
        mix per-connector and per-client namespaces, and a bare-uuid namespace
        can belong to someone else entirely. Use `suggested` to pre-tick boxes,
        and let a human confirm: syncing a neighbour's connection on this
        client's schedule, or omitting a source the consumer needs, both cost
        more than one click.
      parameters:
        - $ref: "#/components/parameters/PipelineClientId"
      responses:
        "200":
          description: Candidates
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        connection_id: { type: string }
                        platform: { type: string }
                        display_name: { type: string, nullable: true }
                        status: { type: string }
                        in_scope: { type: boolean }
                        suggested: { type: boolean }
                        managed_by_pipeline:
                          type: boolean
                          description: Mythic currently owns this connection's schedule.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /pipelines/{clientId}/runs:
    get:
      summary: List runs
      operationId: listAirbytePipelineRuns
      parameters:
        - $ref: "#/components/parameters/PipelineClientId"
        - name: limit
          in: query
          schema: { type: integer, default: 30, maximum: 100 }
      responses:
        "200":
          description: Runs, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PipelineRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Start a run now
      operationId: startAirbytePipelineRun
      description: >
        Trigger every in-scope connection immediately.


        A RUNNING run blocks this with `409 run_in_flight` — it owns live
        Airbyte jobs, and a second run would stack a duplicate sync on each of
        them. A HELD run does not block: a hold is a run parked waiting for a
        person, and that person asking for a fresh run IS the decision, so the
        held run is closed as `skipped` (superseded) and a new one starts.


        Runs are one per client per day, so a same-day rerun returns
        `409 run_exists_today` — retry the failed steps instead. Requires `ak_`.
      parameters:
        - $ref: "#/components/parameters/PipelineClientId"
      responses:
        "200":
          description: Run started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: "#/components/schemas/PipelineRun"
        "400":
          description: "`empty_scope` — the pipeline has no connections"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "409":
          description: "`run_in_flight` or `run_exists_today`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /pipelines/{clientId}/runs/{runId}:
    get:
      summary: Get a run
      operationId: getAirbytePipelineRun
      parameters:
        - $ref: "#/components/parameters/PipelineClientId"
        - name: runId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: "#/components/schemas/PipelineRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFoundRun"
  /pipelines/{clientId}/runs/{runId}/retry:
    post:
      summary: Retry failed steps
      operationId: retryAirbytePipelineRun
      description: >
        Reset the attempt counters on failed steps and reopen the run. The next
        tick triggers them again. Use this when the cause was fixed upstream —
        a re-granted ad account, a restored credential. Requires `ak_`.
      parameters:
        - $ref: "#/components/parameters/PipelineClientId"
        - name: runId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Run reopened
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: "#/components/schemas/PipelineRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "404":
          $ref: "#/components/responses/NotFoundRun"
  /pipelines/{clientId}/runs/{runId}/force:
    post:
      summary: Complete a held run anyway
      operationId: forceAirbytePipelineRun
      description: >
        Close a held run as succeeded despite failed syncs, and fire the
        completion webhook.


        Deliberately a per-run decision and NOT a pipeline setting. The moment
        "partial is acceptable" becomes configuration, nobody looks at a held
        run again and the gate quietly becomes decoration.


        `forced: true` is stamped on the run and travels in the webhook
        permanently, because everything built on this run was built on knowingly
        incomplete data. Requires `ak_`.
      parameters:
        - $ref: "#/components/parameters/PipelineClientId"
        - name: runId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Run closed and webhook attempted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: "#/components/schemas/PipelineRun"
        "400":
          description: "`not_held` — only a held run can be forced"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "404":
          $ref: "#/components/responses/NotFoundRun"
  /pipelines/{clientId}/runs/{runId}/redeliver:
    post:
      summary: Re-send the completion webhook
      operationId: redeliverAirbytePipelineRun
      description: >
        Re-POST the completion payload. Delivery is at-least-once and the
        payload carries the run id, so a receiver that already processed it
        should dedupe rather than reject. Requires `ak_`.
      parameters:
        - $ref: "#/components/parameters/PipelineClientId"
        - name: runId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Delivery attempted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      delivered: { type: boolean }
                      error: { type: string, nullable: true }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "404":
          $ref: "#/components/responses/NotFoundRun"
  /sync-events:
    get:
      summary: List sync events
      operationId: listAirbyteSyncEvents
      description: >
        Return the paginated, immutable sync-event log for the calling agency.
        Each event captures the outcome and record/byte counts of a completed
        sync, as reported by Airbyte when the job finished.


        Rows arrive from two places: sync notifications (live, complete) and
        `POST /connections/{id}/backfill`, which imports history from Airbyte's
        jobs API. Backfilled rows carry fewer fields — the jobs API reports one
        combined row count with no emitted/committed split and no error
        classification. Both are keyed on `(connection_id, job_id)`, so a
        backfill after the fact never duplicates a notification, and a
        re-delivered notification never double-counts.


        This log only exists for workspaces whose Airbyte notifications point at
        Mythic; see `POST /config/notifications`.
      parameters:
        - name: connection_id
          in: query
          description: Filter by Airbyte connection ID.
          required: false
          schema:
            type: string
        - name: platform
          in: query
          description: Filter by platform key.
          required: false
          schema:
            type: string
        - name: client_id
          in: query
          description: Filter by client (location) identifier.
          required: false
          schema:
            type: string
        - name: success
          in: query
          description: Filter by outcome. Pass `true` or `false`.
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          description: Maximum results per page. Default `50`, clamped to `1`–`500`.
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          description: Number of results to skip. Default `0`.
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated sync events
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SyncEvent"
                  total:
                    type: integer
                    example: 128
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
  /stats:
    get:
      summary: Get sync statistics
      operationId: getAirbyteStats
      description: >
        Return aggregated sync statistics for the calling agency across the last
        24 hours, last 30 days, and all time, plus per-platform and per-client
        breakdowns. Cost is estimated from committed record counts.
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Stats"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /health:
    get:
      summary: Get connection health
      operationId: getAirbyteHealth
      description: >
        Return a health overview for the calling agency's connections: counts,
        connections in an error state, stale connections, connections failing
        repeatedly, connections that succeeded while committing nothing, and
        per-connection failure rates.


        Staleness is measured against each connection's OWN cadence, not one
        flat rule: 48 hours for an ordinary connection, and a week plus 48 hours
        for one carrying a `sync_dow`. A weekly connection is more than 48 hours
        old on five days out of seven by design, and a health list that is
        permanently red for a healthy connection just teaches you to skip it —
        the genuinely broken connection is in the same list.


        `needs_attention` is the single number worth putting on a dashboard —
        the count of distinct connections in any of those lists. Everything else
        here is reporting; that one is a work queue.


        All of it derives from Airbyte's sync notifications, so a workspace
        where notifications were never registered reports a perfectly healthy
        zero. Check `notifications_registered_at` on `GET /config`.
      responses:
        "200":
          description: Health overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Health"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    AgencyKey:
      type: http
      scheme: bearer
      description: >
        Agency key as bearer token, format `Bearer ak_...`. Grants full
        read-write access scoped to the agency.
        Agency-wide scoped keys (`mcp_` with no fixed location) are accepted too and need `airbyte:read` or `airbyte:write`; a client-bound `mcp_` key gets `403 agency_key_required`. See [Using an mcp_ key over HTTP](/mcp/authentication).
    SecretKey:
      type: http
      scheme: bearer
      description: >
        Location secret key as bearer token, format `Bearer sk_...`. Grants
        read-only access; the agency is resolved from the location. Write
        endpoints return `403`.
  parameters:
    PipelineClientId:
      name: clientId
      in: path
      required: true
      description: Client (location) identifier the pipeline belongs to.
      schema:
        type: string
    ConnectionId:
      name: id
      in: path
      required: true
      description: Mythic connection record identifier (the local UUID, not the Airbyte connection ID).
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid authorization
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    WriteForbidden:
      description: Write access requires an agency key (`ak_`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundRun:
      description: Run not found, or it belongs to another client
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConnectionNotFound:
      description: Connection not found or not owned by the calling agency
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Platform:
      type: object
      properties:
        key:
          type: string
          example: google_ads
        label:
          type: string
          example: Google Ads
        supportsOauth:
          type: boolean
          description: >
            NO LONG-LIVED TOKEN — not "no inputs". `true` means the provider
            CREDENTIAL is obtained through the OAuth handoff
            (`POST /oauth/initiate`) and held by Airbyte, so you never paste or
            store an access/refresh token. It says nothing about the
            non-credential fields the connector still needs: account
            identifiers and app-issued tokens are supplied in `source_config`
            in BOTH flows. See `manualFields` for exactly which ones. Every
            platform in this catalog is `supportsOauth: true`, and they range
            from `bing_ads` (three manual fields) to `salesforce` (none).
          example: true
        manualFields:
          type: array
          description: >
            Keys the caller must STILL supply in `source_config` after
            consenting — `requiredFields` minus everything flagged `oauth` or
            `optional`. Empty means the consent flow supplies everything. Use
            this rather than inferring inputs from `supportsOauth`. Every key
            here is a real property of the connector's own spec, verified
            against Airbyte's published connector registry.
          items:
            type: string
          example: ["developer_token", "tenant_id"]
        preConsentFields:
          type: array
          description: >
            Subset of `manualFields` that must be known BEFORE the consent
            redirect, because the provider's login URL is built from them —
            `bing_ads.tenant_id` selects the Microsoft tenant,
            `salesforce.is_sandbox` selects the login host. Send them in
            `source_config` on `POST /oauth/initiate`; they are forwarded to the
            provider as OAuth input. Collecting them after the redirect is too
            late.
          items:
            type: string
          example: ["tenant_id"]
        requiredFields:
          type: array
          description: Configuration fields the source requires.
          items:
            type: object
            properties:
              key:
                type: string
                example: customer_id
              label:
                type: string
                example: Customer ID
              placeholder:
                type: string
                example: 123-456-7890
              type:
                type: string
                description: Rendering hint, e.g. `json` or `secret`. Absent for plain text.
                example: secret
              optional:
                type: boolean
                description: >
                  Not required to create a connection. Excluded from
                  `manualFields` so a portal does not render it as mandatory —
                  e.g. `bing_ads.account_names`, a list of
                  `{ name, operator }` predicates that filters which accounts
                  sync; omitted, the connector syncs every account the user can
                  see.
              preConsent:
                type: boolean
                description: >
                  Must be supplied at `POST /oauth/initiate`, not afterwards —
                  the provider's login URL is built from it.
              sourceField:
                type: string
                description: >
                  The connector property this value lands in, when it differs
                  from `key`. `meta_ads.account_id` is a caller-facing alias for
                  the connector's `account_ids`.
              oauth:
                type: boolean
                description: >
                  This field is supplied by the OAuth consent flow. Omit it from
                  `source_config` when connecting via `POST /oauth/initiate`, and
                  do not prompt a user for it. Fields WITHOUT this flag are still
                  required in either flow (account identifiers, and Bing's
                  app-issued `developer_token`).
                example: true
        defaultStreams:
          type: array
          description: Streams selected by default when a connection is created.
          items:
            $ref: "#/components/schemas/Stream"
        weeklyStreams:
          type: array
          description: >
            Streams that get their OWN connection, synced one day a week instead
            of on the primary connection's cadence. Empty for most platforms.


            Non-empty means a single `POST /connections` creates TWO connections
            off one source — the second carries only these streams, is `manual`
            in Airbyte, and is run by the pipeline on `sync_dow`. Meta declares
            `ad_creatives_from_ads` here: a full refresh of every creative on
            every ad, over data that changes weekly at most. Supplying your own
            `streams` array opts out of the split entirely.
          items:
            $ref: "#/components/schemas/Stream"
    Stream:
      type: object
      properties:
        name:
          type: string
          example: campaigns
        syncMode:
          type: string
          description: >
            The mode sent to Airbyte. `incremental_deduped_history` upserts on the
            stream's primary key, so a resync of a daily insights table re-keys its
            rows instead of appending duplicates — every incremental stream uses it.
            `incremental` and `full_refresh` are accepted as legacy aliases of
            `incremental_deduped_history` and `full_refresh_overwrite`; append-only
            incremental is not offered.
          enum:
            - incremental_deduped_history
            - full_refresh_overwrite
            - incremental
            - full_refresh
          example: incremental_deduped_history
        cursorField:
          type: string
          nullable: true
          example: segments.date
        sourceDefinedCursor:
          type: boolean
          nullable: true
          example: true
        primaryKey:
          type: array
          nullable: true
          description: Composite primary key, as an array of column-path arrays.
          items:
            type: array
            items:
              type: string
    Pipeline:
      type: object
      properties:
        id: { type: string }
        client_id: { type: string }
        agency_id: { type: string }
        enabled:
          type: boolean
          description: >
            While enabled, Mythic owns the Airbyte schedule of every in-scope
            connection — they are set to `manual` and triggered by runs.
        connection_ids:
          type: array
          description: The connections a run waits for. Authoritative, never inferred at run time.
          items: { type: string }
        run_hour_utc:
          type: integer
          minimum: 0
          maximum: 23
          description: >
            Hour (UTC) the daily run starts. The check is "this hour or later,
            and no run today", so a worker that was down at the hour still
            starts the run when it recovers rather than skipping the day.
        webhook_url:
          type: string
          nullable: true
        has_webhook_secret:
          type: boolean
          description: Whether a signing secret is stored. The secret itself is never returned.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PipelineRun:
      type: object
      description: >
        One client's syncs for one day. Also the body of the completion webhook,
        under `data`.
      properties:
        run_id: { type: string }
        client_id: { type: string }
        run_date: { type: string, format: date }
        status:
          type: string
          enum: ["running", "held", "succeeded", "failed", "skipped"]
          description: >
            `running` — syncs in flight or waiting to be triggered.

            `held` — at least one sync FAILED and a human has to decide. Resumable:
            it retries every tick and self-heals the moment the sync passes, so it
            is a parking state, not an outcome.

            `succeeded` — the gate opened.

            `failed` — a timeout, or the run wedged with nothing in flight.

            `skipped` — administratively closed (superseded by a manual run, or the
            pipeline was disabled while it was open).
        complete:
          type: boolean
          description: >
            SEPARATE from `status`, and the field to branch on. Succeeded-with-two-skipped
            and succeeded-with-everything are different facts, and only this one
            distinguishes them without parsing prose.
        forced:
          type: boolean
          description: >
            A human closed a held run over its failures. Everything built on this
            run was built on knowingly incomplete data — that is why the flag
            travels downstream permanently rather than living in an audit log.
        held_reason:
          type: string
          nullable: true
          description: Prose naming the connections that failed and why. People read the sentence, not the status.
        triggered_by:
          type: string
          enum: ["schedule", "manual"]
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        totals:
          type: object
          properties:
            total: { type: integer }
            succeeded: { type: integer }
            failed: { type: integer }
            skipped:
              type: integer
              description: >
                Its OWN denominator, not folded into the others: counted as failed
                the run looks worse than it is, counted as succeeded it looks better.
            records_committed: { type: integer }
        connections:
          type: array
          items:
            type: object
            properties:
              connection_id: { type: string }
              name: { type: string, nullable: true }
              platform: { type: string, nullable: true }
              status:
                type: string
                enum: ["pending", "running", "succeeded", "failed", "skipped"]
              reason:
                type: string
                nullable: true
                description: >
                  WHY, specifically. `skipped` alone collapses "disabled on purpose",
                  "inactive in Mythic" and "first-time backfill still running" into
                  one word, and only some of those mean data is missing that
                  should be there.
              job_id: { type: integer, nullable: true }
              records: { type: integer, nullable: true }
              bytes: { type: integer, nullable: true }
              duration_seconds: { type: integer, nullable: true }
              first_time:
                type: boolean
                description: >
                  This connection had never synced when the run started. A first
                  backfill can run for days, so it does not hold the gate — unless
                  it fails.
              last_success_at:
                type: string
                format: date-time
                nullable: true
                description: >
                  "All done" alongside a source that last succeeded nine days ago is
                  a very different message, and a consumer cannot derive that from a
                  run that skipped the connection today.
    Config:
      type: object
      properties:
        id:
          type: string
        agency_id:
          type: string
        workspace_id:
          type: string
          nullable: true
        destination_id:
          type: string
          nullable: true
        bigquery_project_id:
          type: string
          nullable: true
          example: acme-analytics
        bigquery_dataset:
          type: string
          nullable: true
          example: mythic_ads
        staging_bucket_name:
          type: string
          nullable: true
          example: acme-airbyte-staging
        status:
          type: string
          enum: ["provisioning", "active", "error"]
          example: active
        error_message:
          type: string
          nullable: true
        loading_method:
          type: string
          description: >
            How the destination loads into BigQuery. Tracks the destination's
            real configuration, including one adopted from your own Airbyte —
            reprovisioning to standard inserts clears the staging bucket rather
            than leaving a stale one behind.
          enum: ["Standard", "GCS Staging"]
          example: Standard
        has_credentials:
          type: boolean
          description: Whether encrypted GCP credentials are stored. The credentials themselves are never returned.
          example: true
        destination_adopted:
          type: boolean
          description: >
            `true` when `destination_id` was supplied by the agency and is
            managed by them — Mythic never modifies or deletes it. `false` when
            Mythic created it and updates it in place on reprovision.
          example: false
        notifications_registered_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When Mythic last pointed this workspace's Airbyte notifications at
            its sync receiver. `null` means it never has, and this workspace
            produces NO sync history — call `POST /config/notifications`.


            Deliberately a timestamp of our action rather than a boolean
            "notifications are on": the setting can be changed in the Airbyte UI
            afterwards and we would not know. `POST /config/notifications` is
            idempotent, so calling it is the cheap way to be certain.
          example: "2026-07-31T22:10:04Z"
        has_airbyte_credentials:
          type: boolean
          description: >
            `true` when this agency brought its OWN Airbyte application
            credentials at provision time, so every Airbyte call for it —
            token, source, connection, sync, OAuth consent — runs inside the
            agency's own Airbyte org. `false` means Mythic's org. The secret
            itself is never returned.
          example: false
        oauth_return_origins:
          type: array
          description: >
            Origins the OAuth consent flow may redirect the browser to. Empty means
            no `return_url` is accepted. Set with `PATCH /config`.
          items:
            type: string
            example: https://portal.example.com
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProvisionRequest:
      type: object
      description: >
        Two modes. CREATE (the default): supply the BigQuery fields and Mythic
        creates a workspace and a BigQuery destination for you. ADOPT: supply
        `airbyte_workspace_id` + `airbyte_destination_id` (and
        `airbyte_client_id`/`airbyte_client_secret` if that setup lives in your
        own Airbyte org) and Mythic uses what you already run instead of
        building a parallel copy of it. The BigQuery fields are required only
        in CREATE mode — an adopted destination already carries its own target
        and credentials.
      required:
        - bigquery_project_id
        - bigquery_dataset
        - gcp_credentials_json
      properties:
        airbyte_workspace_id:
          type: string
          description: >
            ADOPT: an existing Airbyte workspace to create this agency's sources
            in, instead of creating a new one. Required alongside
            `airbyte_destination_id` — a destination can only be used by sources
            in its own workspace.
          example: 4fed5b02-4acd-4111-95bc-f7d15153b362
        airbyte_destination_id:
          type: string
          description: >
            ADOPT: an existing BigQuery destination every connection writes
            through. This is what prevents two Airbyte workspaces syncing the
            same streams into the same dataset — duplicate rows, split
            incremental cursor state, and double Airbyte cost, none of which
            raises an error anywhere. Verified at provision time: a wrong id, or
            one in a different workspace, is rejected here rather than on the
            first connection. When supplied, `bigquery_project_id`,
            `bigquery_dataset` and `gcp_credentials_json` are not required.
          example: 613f34e2-bcc0-4bc5-ab3f-eeeff4647401
        airbyte_client_id:
          type: string
          description: >
            ADOPT: your own Airbyte application client id. Required when the
            workspace/destination you are adopting lives in YOUR Airbyte org
            rather than Mythic's — Mythic's credentials cannot see it. Must be
            sent with `airbyte_client_secret`. Stored and used for every
            subsequent Airbyte call for this agency.
        airbyte_client_secret:
          type: string
          description: >
            Paired with `airbyte_client_id`. Encrypted at rest; never returned.
        confirm_shared_dataset:
          type: boolean
          description: >
            CREATE mode only. Before creating a destination, Mythic lists the
            target dataset and refuses with `409 dataset_in_use` if it already
            holds Airbyte-managed tables (`_airbyte*`, or tables named like
            streams we would write) — that collision is otherwise completely
            silent. Set `true` to proceed anyway.
          default: false
        bigquery_project_id:
          type: string
          description: Destination BigQuery project ID.
          example: acme-analytics
        bigquery_dataset:
          type: string
          description: Destination BigQuery dataset.
          example: mythic_ads
        gcp_credentials_json:
          type: string
          description: >
            GCP service-account credentials JSON, as a string. Encrypted at rest;
            never returned by the API.
        dataset_location:
          type: string
          description: BigQuery dataset location. Defaults to `US`.
          default: US
          example: US
        staging_bucket_name:
          type: string
          description: >
            GCS bucket for staged loads. ALL-OR-NOTHING: supply this together
            with `hmac_key_access_id` and `hmac_key_secret` to use GCS staging,
            or omit every staging_*/hmac_* field to use standard inserts, which
            need no bucket and no HMAC key. A partial set is rejected with
            `400 staging_incomplete` naming what is missing.
          example: acme-airbyte-staging
        staging_bucket_path:
          type: string
          description: Path prefix within the staging bucket. Defaults to `staging`.
          default: staging
        hmac_key_access_id:
          type: string
          description: >
            GCS HMAC key access ID. This is an interoperability credential
            created FOR a service account (`gcloud storage hmac create
            SA_EMAIL`) — not the service-account key itself. Required for GCS
            staging, together with the secret.
        hmac_key_secret:
          type: string
          description: HMAC key secret. Required for GCS staging, together with the access ID.
        keep_files_in_gcs_bucket:
          type: string
          description: Airbyte staging-file retention option. GCS staging only.
    ProvisionResult:
      type: object
      properties:
        workspace_id:
          type: string
        destination_id:
          type: string
        status:
          type: string
          example: active
        loading_method:
          type: string
          description: The destination's load path — `Standard` or `GCS Staging`.
          enum: ["Standard", "GCS Staging"]
          example: Standard
        destination_reused:
          type: boolean
          description: >
            `true` when this call updated the agency's existing Mythic-owned
            destination in place; `false` when a destination was created (first
            provision, or the stored one was gone). Adopted destinations are
            never modified, so this is always `false` for them.
        adopted:
          type: object
          description: Which parts of this config came from an existing setup rather than being created.
          properties:
            workspace:
              type: boolean
            destination:
              type: boolean
            airbyte_org:
              type: boolean
        notifications:
          allOf:
            - $ref: "#/components/schemas/NotificationRegistration"
          description: >
            Whether the workspace's Airbyte notifications were pointed at
            Mythic's sync receiver, which is what makes any sync history exist
            at all.


            REPORTED, NEVER ASSUMED: registration failing does not fail
            provisioning — a workspace that syncs but reports nothing is
            degraded, not broken — so `registered: false` here is the only
            warning you will get, and the consequence (empty `/sync-events`,
            a permanently healthy-looking `/health`) is silent. Check it, and
            call `POST /config/notifications` if it did not take.


            `reason: "conflict"` means the workspace already posts sync
            notifications elsewhere and Mythic left it alone; reprovision with
            `overwrite_notifications: true` to take it over.
    CreateConnectionRequest:
      type: object
      required:
        - client_id
        - platform
      properties:
        client_id:
          type: string
          description: Client (location) identifier. Must belong to the calling agency.
          example: acme-retail
        platform:
          type: string
          description: Platform key from the platforms catalog.
          example: google_ads
        display_name:
          type: string
          description: Human-readable connection name. Defaults to `<platform> - <client_id>`.
          example: Acme — Google Ads
        account_id:
          type: string
          nullable: true
          description: >
            Platform account identifier. Falls back to the platform's account-ID
            field within `source_config` if omitted. NULL for connectors that
            have no scalar account id — `bing_ads` selects accounts with
            `account_names` predicates, and `tiktok_ads` has no advertiser id in
            its OAuth flow at all. Do not rely on this being populated for every
            platform.
          example: 123-456-7890
        source_config:
          type: object
          description: >
            Platform-specific source configuration, matching the platform's
            `requiredFields`. When `secret_id` is supplied, omit the fields flagged
            `oauth: true` — Airbyte injects those credentials.
        secret_id:
          type: string
          description: >
            Credential handle from a completed OAuth handshake, in place of raw
            credentials in `source_config`. Normally you never set this by hand:
            `/oauth/callback/{state}` creates the connection for you. It exists for
            callers that want to run the consent step themselves and create the
            connection later.
        sync_frequency:
          $ref: "#/components/schemas/SyncFrequency"
        sync_hour_utc:
          $ref: "#/components/schemas/SyncHourUtc"
        streams:
          type: array
          description: >
            Stream selection. Defaults to the platform's `defaultStreams` when
            omitted.
          items:
            $ref: "#/components/schemas/Stream"
    OauthInitiateRequest:
      type: object
      required:
        - client_id
        - platform
      properties:
        client_id:
          type: string
          description: Client (location) identifier. Must belong to the calling agency.
          example: acme-retail
        platform:
          type: string
          description: "Platform key whose catalog entry has `supportsOauth: true`."
          example: meta_ads
        return_url:
          type: string
          description: >
            Absolute http(s) URL to send the browser to once the connection is
            created. Its ORIGIN must be registered in `oauth_return_origins`
            (`PATCH /config`) or the request is rejected with
            `return_url_not_allowed`. `mythic_oauth` plus `mythic_connection_id` or
            `mythic_error_code` are appended; your own query parameters are kept.
            Omit it and the callback renders a terminal HTML page instead.
          example: https://portal.example.com/integrations/acme-retail
        source_config:
          type: object
          description: >
            Non-secret connector fields needed to create the source after consent —
            everything in the platform's `requiredFields` NOT flagged `oauth: true`.
            Account identifiers are normalised, so `{ "account_id": "act_123" }` and
            `{ "account_ids": ["123"] }` are equally acceptable for Meta, and a
            dashed Google `customer_id` is fine. Required for `meta_ads` and
            `google_ads`.
        display_name:
          type: string
          example: Acme — Meta Ads
        account_id:
          type: string
          example: act_123456789
        sync_frequency:
          $ref: "#/components/schemas/SyncFrequency"
        sync_hour_utc:
          $ref: "#/components/schemas/SyncHourUtc"
        streams:
          type: array
          description: Stream selection. Defaults to the platform's `defaultStreams`.
          items:
            $ref: "#/components/schemas/Stream"
        oauth_input_configuration:
          type: object
          description: >
            Optional provider-specific OAuth inputs passed through to Airbyte
            (`oAuthInputConfiguration`), for connectors that need one to build the
            consent URL.
    OauthInitiateResult:
      type: object
      properties:
        consent_url:
          type: string
          description: Redirect the browser here to obtain user consent.
          example: https://www.facebook.com/v18.0/dialog/oauth?client_id=…
        state:
          type: string
          description: Single-use token identifying this pending connection.
        expires_in:
          type: integer
          description: Seconds the pending request stays valid.
          example: 900
    UpdateConnectionRequest:
      type: object
      properties:
        display_name:
          type: string
          example: Acme — Google Ads (Prod)
        sync_frequency:
          $ref: "#/components/schemas/SyncFrequency"
        sync_hour_utc:
          $ref: "#/components/schemas/SyncHourUtc"
        sync_dow:
          $ref: "#/components/schemas/SyncDow"
        streams:
          type: array
          items:
            $ref: "#/components/schemas/Stream"
        status:
          type: string
          enum: ["active", "error", "paused"]
    Connection:
      type: object
      properties:
        id:
          type: string
          description: Mythic connection record ID.
        client_id:
          type: string
          example: acme-retail
        agency_id:
          type: string
        platform:
          type: string
          example: google_ads
        connection_id:
          type: string
          description: Airbyte connection ID.
        source_id:
          type: string
          description: Airbyte source ID.
        display_name:
          type: string
          example: Google Ads - acme-retail
        account_id:
          type: string
          nullable: true
          example: 123-456-7890
        status:
          type: string
          enum: ["active", "error", "paused"]
          example: active
        sync_frequency:
          $ref: "#/components/schemas/SyncFrequency"
        sync_hour_utc:
          $ref: "#/components/schemas/SyncHourUtc"
        sync_dow:
          $ref: "#/components/schemas/SyncDow"
        tables_json:
          type: array
          description: Resolved stream selection stored for the connection.
          items:
            type: object
        companions:
          type: array
          description: >
            Extra connections created alongside this one, present only in the
            response to `POST /connections` (and to an OAuth callback) for a
            platform that declares `weeklyStreams`. Meta creates one: the
            creatives connection, off the SAME source, carrying only the weekly
            streams and run one day a week by the pipeline.


            A caller that ignores this field will not know a second connection
            exists in its workspace. An entry with an `error` key instead of an
            `id` means the companion could not be created — the primary
            connection is live and unaffected, and the weekly streams can be
            added with an explicit `streams` list on a new connection.
          items:
            type: object
        pipeline:
          type: object
          nullable: true
          description: >
            Whether the new connections were added to the client's pipeline
            scope. Present only when companions were created. A weekly companion
            is `manual` in Airbyte by design, so one that is NOT in a pipeline
            has nothing that will ever trigger it.
          properties:
            enrolled:
              type: boolean
            reason:
              type: string
              description: Why not, when `enrolled` is false — usually the client has no pipeline yet.
            pipeline_id:
              type: string
            connection_ids:
              type: array
              items:
                type: string
            pipeline_enabled:
              type: boolean
        last_sync_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When the most recent sync FINISHED, taken from Airbyte's own
            `finishedAt` rather than the time we were notified. For a
            35-minute sync those differ by more than half an hour.
        last_sync:
          allOf:
            - $ref: "#/components/schemas/LastSync"
          nullable: true
          description: >
            The most recent completed sync, or `null` if this connection has
            genuinely never reported one. Null, not a zero-filled record —
            never having synced is not the same as having synced nothing.
        consecutive_failures:
          type: integer
          nullable: true
          description: >
            Failed syncs since the last success, newest-first. `0` means the
            most recent sync succeeded. One red run is a flake; four in a row is
            broken since Tuesday, and only this number tells them apart.


            `null` means it could not be counted — the connection's history sits
            beyond the window this is computed over. `null` rather than `0`,
            because `0` would assert that the last sync passed.
          example: 0
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    SyncHourUtc:
      type: integer
      minimum: 0
      maximum: 23
      nullable: true
      description: >
        Hour of day, UTC, the cadence is anchored to. Defaults to `2` when
        unset. Sub-daily cadences anchor on `hour % interval`, so the hour you
        ask for is always one of the run times and the runs stay evenly spaced
        — `6h` at `8` runs at 02:00, 08:00, 14:00 and 20:00. Ignored when
        `sync_frequency` is `manual`.
      example: 8
    SyncDow:
      type: integer
      minimum: 0
      maximum: 6
      nullable: true
      description: >
        UTC day of week (0 = Sunday) a PIPELINE RUN may include this connection.
        `null`, the default, means every run.


        This is how a connection syncs less often than the run that owns it —
        Meta's weekly creatives companion is created with `0` (Sunday). A run on
        any other day marks the step `skipped` with reason `weekly — only runs
        on Sunday (UTC)`, which never holds the run's gate.


        Read by the pipeline only. A connection on its own Airbyte cron ignores
        it, because the cron already says when it runs. Writable on
        `PUT /connections/{id}`.
      example: 1
    SyncFrequency:
      type: string
      description: >
        Sync cadence. `24h`, `12h` and `6h` schedule automatic syncs at
        `sync_hour_utc`; `manual` disables them, and is the DEFAULT — a
        connection created without this field does not sync on a schedule.
      enum: ["manual", "24h", "12h", "6h"]
      default: manual
      example: manual
    Job:
      type: object
      description: >
        Airbyte job record, passed through verbatim from Airbyte's public API
        (`GET /v1/jobs`) with no renaming or added fields. These are Airbyte's
        field names — there is no `createdAt`, `updatedAt`, or `endTime`, and no
        per-attempt block (`lastAttempt`) on this payload.
      required: [jobId, status, jobType, startTime, connectionId]
      properties:
        jobId:
          type: integer
          format: int64
          example: 68374749
        status:
          type: string
          description: >
            `succeeded`, `failed`, `cancelled`, and `incomplete` are terminal;
            `pending` and `running` are in flight. Only `succeeded` means a clean
            sync — treat `incomplete` (partial success) as not successful.
          enum: [pending, running, incomplete, failed, succeeded, cancelled]
          example: succeeded
        jobType:
          type: string
          description: >
            Mythic only ever triggers `sync`; `reset` jobs appear if a reset is
            run from the Airbyte UI. Newer Airbyte versions may also report
            `clear` and `refresh`.
          enum: [sync, reset]
          example: sync
        connectionId:
          type: string
          format: uuid
          description: >
            Airbyte's connection UUID — not the Mythic connection `id` used in
            the request path.
          example: 871f879d-9c37-426b-be7b-eeaca16333f3
        startTime:
          type: string
          format: date-time
          description: >
            When the job started, UTC ISO 8601. The only start timestamp on the
            payload.
          example: "2026-01-30T10:14:37Z"
        lastUpdatedAt:
          type: string
          format: date-time
          description: >
            Last state change — the finish time for a terminal job. Omitted
            entirely while a job is still in flight (`pending`/`running`), so use
            `startTime` for ordering and treat this as the finish time only.
          example: "2026-01-30T10:17:22Z"
        duration:
          type: string
          description: >
            ISO 8601 duration. Present on in-flight jobs too, where it is elapsed
            time so far, not the final runtime.
          example: PT2M45S
        bytesSynced:
          type: integer
          format: int64
          description: >
            Bytes synced. `0` on an in-flight job or one that moved nothing.
          example: 307376
        rowsSynced:
          type: integer
          format: int64
          description: >
            Records synced. `0` on an in-flight job or one that moved nothing.
          example: 132
    LastSync:
      type: object
      description: The outcome of one completed sync, as reported by Airbyte.
      properties:
        job_id:
          type: integer
          nullable: true
        success:
          type: boolean
          description: Airbyte's own verdict on the job.
        landed:
          type: boolean
          description: >
            `success` AND at least one record committed. READ THIS, not
            `success`, when the question is "did the data arrive".


            A sync can succeed and commit nothing — in one measured week that
            was 7 of 221 real notifications. Every status surface calls that
            green, and a connection can stay green for months while its data
            goes stale. `landed: false` on a successful sync is the cheapest
            signal that something is wrong upstream: a revoked ad-account
            permission, an emptied date range, a paused campaign.
          example: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        duration_seconds:
          type: integer
          nullable: true
          description: >
            Wall-clock `finished_at - started_at`, which includes queue and
            scheduling time. It is not a throughput measure.
        records_committed:
          type: integer
          nullable: true
          description: >
            Rows the destination actually has. This is the number to bill,
            alert and chart on.
        records_emitted:
          type: integer
          nullable: true
          description: >
            Rows the SOURCE produced. Emitted exceeding committed means rows did
            not make it — a failed sync in the observed data emitted 1,485 and
            committed 0.
        records_filtered_out:
          type: integer
          nullable: true
        bytes_committed:
          type: integer
          nullable: true
        error_type:
          type: string
          nullable: true
          description: >
            Airbyte's failure classification. Observed values: `transient_error`,
            `config_error`. Null on success. The full domain is not published, so
            treat this as an open enum.
          example: transient_error
        error_origin:
          type: string
          nullable: true
          description: "Which side failed. Observed values: `source`, `destination`. Null on success."
          example: destination
        error_message:
          type: string
          nullable: true
          description: >
            The upstream reason, verbatim. On a stream-level failure Airbyte
            names the affected streams as PROSE inside this string — there is no
            structured per-stream breakdown in a sync notification.
        log_url:
          type: string
          nullable: true
          description: Direct link to this connection's run in the Airbyte UI.
    WebhookSubscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          nullable: true
        url:
          type: string
          description: >
            REDACTED form of the subscribed URL — origin and path in full, every
            query-string value replaced with `***`. The parameter NAMES are kept
            so you can tell which one carries your secret. The real URL is never
            returned.
          example: "https://example.com/hooks/airbyte?secret=***"
        active:
          type: boolean
          description: >
            Parked subscriptions are `false`. A subscription is parked
            automatically after 20 consecutive delivery failures, so a dead
            endpoint stops costing a request on every sync. POST the URL again to
            resume it.
        last_delivery_at:
          type: string
          format: date-time
          nullable: true
          description: When delivery was last ATTEMPTED — success or failure. Read it with `last_error`.
        last_error:
          type: string
          nullable: true
          description: Why the last attempt failed. `null` after a success.
        consecutive_failures:
          type: integer
          description: Failures since the last success. Resets to 0 on any successful delivery.
        created_at:
          type: string
          format: date-time
    WebhookRelayEvent:
      type: object
      description: >
        The body POSTed to each subscribed endpoint, with header
        `X-Mythic-Event: airbyte.sync.completed`.
      properties:
        type:
          type: string
          example: airbyte.sync.completed
        delivered_at:
          type: string
          format: date-time
          description: Mythic's clock, for diagnostics only. NEVER order events on this.
        agency_id:
          type: string
          format: uuid
        client_id:
          type: string
          nullable: true
          description: The Mythic client this connection syncs for. `null` for a connection Mythic does not manage.
        platform:
          type: string
          nullable: true
          description: Platform key, e.g. `meta_ads`. `null` for a connection Mythic does not manage.
        job_id:
          type: integer
          nullable: true
          description: Airbyte's job id, unmodified. Your dedupe key — the same job can be delivered more than once.
        success:
          type: boolean
          nullable: true
        finished_at:
          type: string
          nullable: true
          description: >
            Airbyte's own event time, unmodified. Your ORDERING key: ignore an
            event older than the one you have already recorded for that
            connection. Relayed delivery is not ordered, so a retried older
            failure can land after a newer success and would otherwise flip a
            healthy connection to failed.
        started_at:
          type: string
          nullable: true
        data:
          type: object
          description: >
            Airbyte's notification payload verbatim — the same object described
            under `/sync-events`. Airbyte's prebuilt Slack `text`/`blocks` are
            dropped.
    NotificationRegistration:
      type: object
      properties:
        registered:
          type: boolean
          description: Whether the workspace now posts sync notifications to Mythic.
        changed:
          type: boolean
          description: "`false` when it was already registered — the call was a no-op."
        url:
          type: string
          description: The receiver Airbyte will post to.
        events:
          type: array
          description: Airbyte notification events registered. Only sync success and failure.
          items:
            type: string
          example: ["failure", "success"]
        replaced:
          type: string
          nullable: true
          description: A third-party webhook URL that was overwritten, when `overwrite_notifications` was set.
        reason:
          type: string
          nullable: true
          description: Why registration did not happen, when `registered` is `false`.
    SyncEvent:
      type: object
      properties:
        id:
          type: string
        client_id:
          type: string
          nullable: true
        agency_id:
          type: string
          nullable: true
        connection_id:
          type: string
          description: >
            The Airbyte connection id for a sync row. For a FAILED OAUTH ATTEMPT
            there is no connection yet, so this carries the sentinel
            `oauth:<platform>:<client_id>` — filterable, and never collides with
            a real (UUID) connection id.
          example: oauth:meta_ads:acme-retail
        platform:
          type: string
          nullable: true
        job_id:
          type: integer
          nullable: true
        success:
          type: boolean
        error_origin:
          type: string
          nullable: true
          description: >
            `oauth_callback` on a row recorded by a failed consent — the only
            trail such an attempt leaves, since no connection is created. Absent
            or null on ordinary sync rows.
          example: oauth_callback
        error_type:
          type: string
          nullable: true
          description: >
            The machine-readable failure code, matching the
            `mythic_error_code` the callback redirected with (e.g.
            `source_config_rejected`). Present on OAuth-failure rows.
        error_message:
          type: string
          nullable: true
          description: >
            The underlying reason, including the upstream Airbyte message. This
            is where the detail lives that the redirect deliberately omits — a
            redirect URL is readable by the landing page and its analytics, so
            only the code travels there.
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        duration_seconds:
          type: integer
          nullable: true
        landed:
          type: boolean
          description: >
            `success` AND at least one record committed. A sync can succeed and
            commit nothing; see `LastSync.landed`.
        records_emitted:
          type: integer
          nullable: true
          description: >
            Rows the source produced. `null` on rows imported by
            `POST /connections/{id}/backfill`, because the Airbyte jobs API
            reports one combined figure and does not split emitted from
            committed — null rather than a copy of `records_committed`, which
            would make a real gap look like zero.
          example: 15230
        records_committed:
          type: integer
          nullable: true
          description: Rows the destination actually has. The number to bill, alert and chart on.
          example: 15230
        records_filtered_out:
          type: integer
          nullable: true
        bytes_emitted:
          type: integer
          nullable: true
        bytes_committed:
          type: integer
          nullable: true
        bytes_filtered_out:
          type: integer
          nullable: true
        log_url:
          type: string
          nullable: true
          description: Direct link to this connection's runs in the Airbyte UI.
        raw_payload:
          type: object
          nullable: true
          description: >
            The notification exactly as Airbyte sent it, or the job object for a
            backfilled row. Kept so a question nobody anticipated can still be
            answered; the promoted columns above are the supported surface.
        created_at:
          type: string
          format: date-time
          description: When Mythic recorded the event. For when the sync finished, use `finished_at`.
    StatsBucket:
      type: object
      properties:
        syncs:
          type: integer
          example: 12
        success_rate:
          type: integer
          description: Percentage of successful syncs (0–100).
          example: 100
        records_synced:
          type: integer
          example: 182760
        bytes_synced:
          type: integer
        estimated_cost_usd:
          type: number
          description: Estimated cost derived from committed record counts.
          example: 2.74
    Stats:
      type: object
      properties:
        last_24h:
          $ref: "#/components/schemas/StatsBucket"
        last_30d:
          $ref: "#/components/schemas/StatsBucket"
        all_time:
          $ref: "#/components/schemas/StatsBucket"
        per_platform:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/StatsBucket"
        per_client:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/StatsBucket"
    Health:
      type: object
      properties:
        total_connections:
          type: integer
          example: 8
        active:
          type: integer
          example: 7
        error_connections:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              client_id:
                type: string
              platform:
                type: string
              error_message:
                type: string
                nullable: true
        stale_connections:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              client_id:
                type: string
              platform:
                type: string
              last_sync_at:
                type: string
                format: date-time
                nullable: true
        failing_connections:
          type: array
          description: >
            Connections whose most recent sync failed, worst streak first.
            Ordering is the feature: it separates a flake from something broken
            for days.
          items:
            type: object
            properties:
              id:
                type: string
              client_id:
                type: string
              platform:
                type: string
              consecutive_failures:
                type: integer
                example: 4
              error_type:
                type: string
                nullable: true
              error_message:
                type: string
                nullable: true
              log_url:
                type: string
                nullable: true
        no_data_connections:
          type: array
          description: >
            Connections whose most recent sync SUCCEEDED and committed zero
            records. Every other field here reports the status, and the status
            says these are fine. They are the ones worth looking at: a green
            connection delivering nothing is how data goes quietly stale.
          items:
            type: object
            properties:
              id:
                type: string
              client_id:
                type: string
              platform:
                type: string
              last_sync_at:
                type: string
                format: date-time
                nullable: true
              records_committed:
                type: integer
                example: 0
        needs_attention:
          type: integer
          description: >
            How many distinct connections appear in any of the lists above
            (error, stale, failing, no-data). If you surface one number from
            this endpoint, surface this one — it is the only one that is a work
            queue rather than a report.
          example: 2
        failure_rates:
          type: object
          description: Map of Airbyte connection ID to failure-rate percentage.
          additionalProperties:
            type: integer
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Missing authorization
        code:
          type: string
          description: >
            Stable machine-readable reason, present on the OAuth and rate-limit
            paths. Switch on this rather than on `error`, which is prose and may
            change.
          example: return_url_not_allowed
