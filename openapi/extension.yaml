openapi: "3.0.0"
info:
  version: 1.0.0
  title: Ads Manager Extension API
  description: >
    Bootstrap routes for the Mythic browser extension, which shows Mythic's own
    per-campaign results (sessions, conversions, revenue, the funnel
    constraint) inside Meta Ads Manager. Four routes on
    `/client/v1/extension`: who the key belongs to plus the client roster with
    ad-platform flags (`/me`), which client syncs the ad account on screen
    (`/resolve`), conversions, revenue and ROAS per campaign, ad set or ad
    (`/performance`), and a write-only problem report (`/issues`).


    Funnel constraint verdicts are **not** served here. The extension reads
    `GET /client/v1/constraints?account_id=<ad account>` with the resolved
    client as `X-Location-Id`, so that route's plan gate, benchmarks and
    20-per-minute limit apply unchanged.


    **Agency-wide keys only.** The agency app mints the extension an `mcp_`
    key with `["extension:read", "constraints:read"]`; an agency key (`ak_`)
    works too. A location secret key (`sk_`) gets `403 agency_key_required`,
    and so does an `mcp_` key bound to one client. Revoke the extension's key
    on the agency Keys page.
servers:
  - url: https://mythic-analytics.gulp.workers.dev
security:
  - BearerAuth: []
paths:
  /client/v1/extension/me:
    get:
      summary: Extension bootstrap
      operationId: getExtensionMe
      description: >
        The agency, the key in use (prefix and name, never the secret), every
        location on the roster with what each has connected for Meta and
        Google, and the extension controls an operator can set.


        `connected` means an active ad-platform connection exists. `synced`
        means Mythic would find its ad tables: a connection whose dataset sits
        in Mythic's warehouse and has synced at least once, or a legacy
        connection that has synced. It is a cheap proxy that never queries
        BigQuery, so a `synced` location can still answer `424
        ads_table_missing` on `/client/v1/constraints`.
      responses:
        "200":
          description: Bootstrap state
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      agency:
                        type: object
                        properties:
                          id: { type: string }
                          name: { type: string, nullable: true }
                      key:
                        type: object
                        properties:
                          type: { type: string, enum: [mcp, agency] }
                          prefix: { type: string, nullable: true, description: "The `mcp_` key's display prefix. `null` for an `ak_` key." }
                          name: { type: string, nullable: true, description: "The key's label. `null` for an `ak_` key." }
                          scopes:
                            type: array
                            items: { type: string }
                            description: "The key's scopes; `[\"*\"]` for an `ak_` key. The results need `constraints:read`."
                      locations:
                        type: array
                        description: Every location linked to the agency, oldest first.
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string, nullable: true }
                            status: { type: string, nullable: true }
                            platforms:
                              type: object
                              properties:
                                meta: { $ref: "#/components/schemas/PlatformFlags" }
                                google: { $ref: "#/components/schemas/PlatformFlags" }
                      roster_size: { type: integer }
                      extension:
                        type: object
                        description: >
                          Operator controls. `min_version` asks older extensions to
                          update before they show data; `notice` is shown in the
                          extension panel. Both `null` when unset.
                        properties:
                          min_version: { type: string, nullable: true, example: "1.2.0" }
                          notice: { type: string, nullable: true }
              example:
                success: true
                data:
                  agency: { id: "6f1c...", name: "Acme Agency" }
                  key: { type: mcp, prefix: "mcp_3fa9", name: "Chrome extension · 2026-10-06", scopes: ["extension:read", "constraints:read"] }
                  locations:
                    - id: "c84d700c-..."
                      name: "Boundless Therapy"
                      status: active
                      platforms:
                        meta: { connected: true, synced: true }
                        google: { connected: false, synced: false }
                  roster_size: 1
                  extension: { min_version: "1.0.0", notice: "Meta is rolling out a new Ads Manager layout this week." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /client/v1/extension/resolve:
    get:
      summary: Resolve an ad account to a client
      operationId: resolveAdAccount
      description: >
        Which of the agency's clients syncs this ad account, from the clients'
        Airbyte ad-platform connections. The id is matched on its digits
        exactly: `act_1234567890` and `1234567890` are the same Meta account,
        `123-456-7890` and `1234567890` the same Google account, and `12` never
        matches `123`. A connection that syncs several accounts matches each of
        them. Only clients on the caller's roster are returned.


        An empty `matches` is a normal answer, not an error: a client connected
        before Mythic recorded account ids has no row to match, and the
        extension then asks the user to pick the client once. Several matches
        mean several clients sync the same account; active connections are
        listed first.
      parameters:
        - name: platform
          in: query
          required: true
          schema:
            type: string
            enum: [meta, google]
        - name: account
          in: query
          required: true
          description: Ad account id as the ad platform shows it.
          schema:
            type: string
            example: act_1234567890
      responses:
        "200":
          description: Matching clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      platform: { type: string, enum: [meta, google] }
                      account: { type: string, description: "The normalised id: digits only." }
                      matches:
                        type: array
                        items:
                          type: object
                          properties:
                            location_id: { type: string }
                            name: { type: string, nullable: true }
                            source: { type: string, enum: [airbyte] }
                            connection_status: { type: string, nullable: true, enum: [active, inactive, error, pending] }
                      roster_size: { type: integer }
              example:
                success: true
                data:
                  platform: meta
                  account: "1234567890"
                  matches:
                    - { location_id: "c84d700c-...", name: "Boundless Therapy", source: airbyte, connection_status: active }
                  roster_size: 12
        "400":
          description: "`invalid_params` — unknown `platform`, or an `account` with no digits."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /client/v1/extension/performance:
    get:
      summary: Conversions, revenue and ROAS per Meta campaign, ad set or ad
      operationId: extensionPerformance
      description: >
        The Meta rows of an explore `attribution` query (see
        `POST /client/v1/data/query`) for one client on the caller's roster:
        every conversion in the window is credited to the person's sessions in
        the 30 days before it, across devices and CRM contact ids, and the
        credit lands on the Meta campaign, ad set or ad in the session's landing
        URL. Spend for the same dates is joined in. The body is the same one
        `/data/query` returns for that spec, plus the `conversion` used, and the
        two share a cache.


        `conversion=auto` (the default) picks the first source with data in the
        window: won CRM deals, then `purchase` (valued by `value`), then GHL
        `order_completed` (valued by `activity_value`), then
        `appointment_booked`, `form_submitted` or `contact_created` (no value,
        for cost per conversion). When none has data the answer is
        `conversion: null` with no rows. A deal counts only if its latest status is
        still won, the same rule attribution applies.
      parameters:
        - { name: location_id, in: query, required: true, description: "A client on the key's roster.", schema: { type: string } }
        - { name: account_id, in: query, description: "Meta ad account; an act_ prefix is accepted. Omit for every account.", schema: { type: string } }
        - { name: from, in: query, description: "YYYY-MM-DD. Default 30 days before today (UTC).", schema: { type: string, format: date } }
        - { name: to, in: query, description: "YYYY-MM-DD inclusive. Default today.", schema: { type: string, format: date } }
        - { name: level, in: query, schema: { type: string, enum: [campaign, adset, ad], default: campaign } }
        - { name: model, in: query, description: "last = last non-Direct touch.", schema: { type: string, enum: [last, first, linear], default: last } }
        - { name: conversion, in: query, description: "auto, deals, or event:<event name>.", schema: { type: string, default: auto } }
        - { name: value_property, in: query, description: "With conversion=event:<name>. The numeric property holding each conversion's value.", schema: { type: string } }
        - { name: pipeline, in: query, description: "With conversion=deals. Exact GHL pipeline name.", schema: { type: string } }
        - { name: timezone, in: query, description: "IANA zone the dates are read in. Default UTC.", schema: { type: string } }
      responses:
        "200":
          description: Attribution rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    description: >
                      `conversion` (the source used, or null), `totals` over
                      every conversion of the client, `filtered` after the Meta
                      and account filter, `sampled`, `rows[]` (one per campaign,
                      ad set or ad with `spend`, `impressions`, `clicks`,
                      `conversions`, `revenue`, `persons`, `cpa`, `roas`,
                      `median_days`, names and `account_id`), and `meta`.
              example:
                success: true
                data:
                  conversion: { conversion: deals }
                  kind: attribution
                  totals: { conversions: 75, revenue: 210258.9, spend: 41200, roas: 5.1, cpa: 549.33, ad_conversions: 3, ad_revenue: 4494, unmatched_ad_conversions: 0, no_touchpoint: 54, mixed_currency: false }
                  filtered: { rows: 2, conversions: 3, revenue: 4494, spend: 41200, roas: 0.11, cpa: 13733.33 }
                  sampled: false
                  rows:
                    - { type: ad, platform: meta_ads, account_id: "1234567890", campaign_id: "120247921827310631", campaign_name: "HV - FF - Creative Testing", currency: USD, spend: 20600, impressions: 812000, clicks: 9100, conversions: 1, revenue: 2497, persons: 1, cpa: 20600, roas: 0.12, median_days: 3.6 }
        "400":
          description: "`invalid_params` — missing `location_id`, bad dates, level, model, account or conversion."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          description: "`feature_not_in_plan` — the client's plan has no Data API."
        "403":
          description: "`location_not_linked` — the client is not on the key's roster; or the key is not agency-wide."
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: "`upstream_error` — the query engine failed."
        "503":
          description: "`entitlements_unavailable` — the client's plan could not be checked; retry."
  /client/v1/extension/issues:
    post:
      summary: Report an extension problem
      operationId: reportExtensionIssue
      description: >
        A problem report from the extension, usually that Meta changed Ads
        Manager's page and the overlay could not attach. Logged for Mythic's
        operators and **never stored**; there is no route to read reports back.
        Strings are clipped to 300 characters. Past 30 reports per agency per
        hour the report is acknowledged with `accepted: false` and dropped
        rather than answered with `429`, so a looping extension goes quiet
        instead of retrying.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [panel_not_mounted, grid_not_found, context_unreadable, exception, api_error]
                version: { type: string, description: Extension version. }
                level: { type: string, enum: [info, warn, error], default: warn }
                path: { type: string, description: The Ads Manager path the problem occurred on. }
                detail:
                  description: Free text, or an object (stringified before clipping).
                  oneOf:
                    - type: string
                    - type: object
      responses:
        "200":
          description: Received
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      accepted: { type: boolean, description: "`false` when the hourly report budget is spent." }
        "400":
          description: "`invalid_json`, or `invalid_params` for an unknown `kind`."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        Agency-wide `mcp_` key holding `extension:read`, or an agency key
        (`ak_`). A location secret key (`sk_`) or a client-bound `mcp_` key gets
        `403 agency_key_required`. See [Using an mcp_ key over HTTP](/mcp/authentication).
  schemas:
    PlatformFlags:
      type: object
      properties:
        connected: { type: boolean, description: An active ad-platform connection exists. }
        synced: { type: boolean, description: "Mythic would find this platform's ad tables (synced at least once)." }
  responses:
    Unauthorized:
      description: Missing or invalid key.
    Forbidden:
      description: >
        `agency_key_required` (location `sk_` key or client-bound `mcp_` key),
        or `insufficient_scope` (an `mcp_` key without `extension:read`).
    RateLimited:
      description: Over 120 requests per minute for the agency on this surface, or the key's own per-minute ceiling.
