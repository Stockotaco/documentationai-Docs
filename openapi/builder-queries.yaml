openapi: "3.0.0"
info:
  version: 3.0.0
  title: Queries
  description: >-
    Run saved insights. An insight is executed **by id** (or by share token) —
    the server validates the stored explore spec, compiles it with the
    tenant's `location_id` injected, runs it on Tinybird, caches the result,
    and rate-limits per location. No endpoint here accepts SQL. The response is
    the same shape as `POST /client/v1/data/query`.
servers:
  - url: https://mythic-analytics.gulp.workers.dev/builder
security:
  - BearerAuth: []
paths:
  /insights/{id}/query:
    post:
      summary: Run a saved insight
      operationId: runInsight
      description: >
        Execute a saved insight, optionally overriding its date range and
        interval for this run. Results are cached server-side — a window that
        ends before today is reused for hours, one touching today for two
        minutes — and rate-limited per location (120/min across the authed
        Builder paths).


        Readable with an agency key (`ak_`, requires `?location_id=`) or a
        viewer key (`sk_`).
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - name: id
          in: path
          required: true
          description: Insight UUID (must belong to the resolved location).
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsightRunRequest"
      responses:
        "200":
          description: Insight results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightRunResponse"
        "404":
          description: Insight not found for this location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded for this location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Query execution error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryErrorResponse"
  /public/query:
    post:
      summary: Run an embedded insight (public)
      operationId: executePublicQuery
      description: >
        Execute a saved insight for an embedded dashboard or insight without a
        Builder key. Authenticate with a share token in a header:


        - `X-Embed-Token` — an insight's `embed_token` (insight must be
          `is_embeddable = true`). Runs that insight; `insight_id` is ignored.

        - `X-Dashboard-Token` — a dashboard's `public_token` (dashboard must
          be `is_public = true`). Requires `insight_id`, which must be an
          insight on that dashboard.


        A share token can only ever run its own insight against its own
        location. Same cache as the authed runner; public traffic is
        rate-limited on a separate, higher per-location allowance (600/min) so
        a busy public dashboard can't exhaust a tenant's own Builder calls. The
        compiled `sql` is never returned on this endpoint.
      security: []
      parameters:
        - $ref: "#/components/parameters/DashboardToken"
        - $ref: "#/components/parameters/EmbedToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicInsightRunRequest"
      responses:
        "200":
          description: Insight results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightRunResponse"
        "400":
          description: >-
            Invalid JSON, missing `insight_id` (dashboard tokens), or a `sql`
            field was supplied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing `X-Dashboard-Token` and `X-Embed-Token`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            Dashboard/insight not found, sharing disabled, or the insight is
            not part of the dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded for this location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Query execution error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryErrorResponse"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        Builder key as a bearer token. Use an agency key (`Bearer ak_...`) or a
        viewer key (`Bearer sk_...`). Scoped keys (`mcp_`) with `insights:read`
        are accepted too.
  parameters:
    LocationId:
      name: location_id
      in: query
      required: false
      description: >-
        Client location to scope the request to. Required when authenticating
        with an agency key (`ak_`). Ignored for viewer keys (`sk_`).
      schema:
        type: string
        example: acme-retail
    DashboardToken:
      name: X-Dashboard-Token
      in: header
      required: false
      description: >-
        A dashboard's `public_token`. Required unless `X-Embed-Token` is
        supplied.
      schema:
        type: string
    EmbedToken:
      name: X-Embed-Token
      in: header
      required: false
      description: >-
        An insight's `embed_token`. Required unless `X-Dashboard-Token` is
        supplied.
      schema:
        type: string
  schemas:
    DateRange:
      type: object
      description: >-
        Date range override, applied onto `config.query.date_range` for this
        run only. An unknown preset leaves the stored range in place.
      properties:
        preset:
          type: string
          enum: ["24h", "7d", "14d", "30d", "90d", "365d", "custom"]
        from:
          type: string
          format: date
          description: 'YYYY-MM-DD (UTC), with `preset: "custom"`.'
        to:
          type: string
          format: date
          description: 'YYYY-MM-DD inclusive (UTC), with `preset: "custom"`.'
    InsightRunRequest:
      type: object
      properties:
        dateRange:
          $ref: "#/components/schemas/DateRange"
        granularity:
          type: string
          enum: [hour, day, week, month]
          description: >-
            Bucket interval override, applied onto `config.query.interval`.
            Trends only — a funnel never gains an interval.
    PublicInsightRunRequest:
      allOf:
        - $ref: "#/components/schemas/InsightRunRequest"
        - type: object
          properties:
            insight_id:
              type: string
              format: uuid
              description: >-
                Insight to run. Required with `X-Dashboard-Token`; ignored
                with `X-Embed-Token`.
    TrendSeries:
      type: object
      description: >-
        One entry per (spec series × breakdown value). With an `interval`,
        `data` holds one number per bucket and `total` their sum; without one,
        `value` is the single number. `previous`/`previous_value` are present
        with `compare`, aligned by index to `previous_buckets`.
      properties:
        label:
          type: string
        math:
          type: string
        event:
          type: string
          nullable: true
        breakdown_value:
          type: string
        data:
          type: array
          items:
            type: number
        total:
          type: number
        value:
          type: number
        previous:
          type: array
          items:
            type: number
        previous_value:
          type: number
    FunnelStep:
      type: object
      properties:
        step:
          type: integer
        label:
          type: string
        event:
          type: string
        users:
          type: integer
        conversion_from_first:
          type: number
          description: 0..1
        conversion_from_previous:
          type: number
          description: 0..1 (1 for the first step)
    InsightRunResponse:
      type: object
      description: >-
        The explore response for the stored spec: trend fields for a `trend`
        spec, funnel fields for a `funnel` spec. Same shape as `POST
        /client/v1/data/query`.
      properties:
        success:
          type: boolean
          example: true
        insight:
          type: object
          description: The insight's definition (for rendering).
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            insight_type:
              type: string
              enum: [number, line, bar, pie, table, funnel]
            config:
              type: object
        engine:
          type: string
          enum: [tinybird]
        kind:
          type: string
          enum: [trend, funnel]
        buckets:
          type: array
          description: Trend with `interval` — ISO bucket labels (UTC).
          items:
            type: string
        previous_buckets:
          type: array
          description: Trend with `interval` and `compare`.
          items:
            type: string
        series:
          type: array
          description: Trend only.
          items:
            $ref: "#/components/schemas/TrendSeries"
        breakdown_values:
          type: array
          description: Trend with `breakdown` — values in rank order, `$$other` last.
          items:
            type: string
        steps:
          type: array
          description: Funnel only.
          items:
            $ref: "#/components/schemas/FunnelStep"
        breakdown:
          type: array
          description: Funnel with `breakdown` — per-value step rows.
          items:
            type: object
            properties:
              value:
                type: string
              steps:
                type: array
                items:
                  $ref: "#/components/schemas/FunnelStep"
        meta:
          type: object
          description: >-
            Resolved `from`/`to`, `previous` window, `interval`,
            `window_seconds`, `breakdown` settings, and query statistics
            (`sql_ms`, `rows_read`, `bytes_read`).
        config:
          type: object
          description: The stored config, echoed.
        cached:
          type: boolean
          description: True when served from the server-side cache.
        sql:
          type: string
          description: >-
            The compiled query. Returned on the key-authed
            `POST /insights/{id}/query` runner and `/insights/preview`, but NOT
            on the anonymous `POST /public/query` endpoint.
    QueryErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "explore query failed (500): upstream error"
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Insight is not part of this dashboard"
