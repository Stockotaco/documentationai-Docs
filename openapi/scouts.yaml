openapi: "3.0.0"
info:
  version: 1.0.0
  title: Scouts API
  description: >
    Client scouts on `/client/v1/scouts`: scheduled agents that read one
    client's data (errors, logs, events, sessions, links, destinations) with
    the agency's own model key and file one report per finding into that
    client's inbox. Mythic pays for no model calls.


    **Agency key (`ak_`) only**, or an agency-wide `mcp_` key with
    `scouts:read` / `scouts:write`. A location secret key (`sk_`) gets `403
    agency_required`. Every `location_id` must be one of the agency's clients
    (`403 location_not_linked`). Creating, changing or running a scout needs
    the `scouts` plan feature for its client (`402 feature_not_in_plan`) and a
    model key for that client or the agency. 120 requests a minute per agency
    (`429 rate_limited`). No CORS headers: call from a server.
servers:
  - url: https://mythic-analytics.gulp.workers.dev
security:
  - BearerAuth: []
paths:
  /client/v1/scouts/skills:
    get:
      summary: List skills
      operationId: listScoutSkills
      description: "The built-in skills a scout can run, each with the surfaces (`families`) it reads, its default schedule and the full playbook it follows."
      responses:
        "200":
          description: Skills
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { type: array, items: { $ref: "#/components/schemas/Skill" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AgencyRequired" }
  /client/v1/scouts/models:
    get:
      summary: List scout models
      operationId: listScoutModels
      description: >
        Models a scout can run on. `openrouter`: OpenRouter's public catalog
        filtered to models that accept tools, without lite, nano or `:free`
        models (at most 400). `gemini`: the current Gemini Flash models.
        `cloudflare`: a fixed list of tool-capable models, Workers AI `@cf/`
        models plus `google/gemini-3.8-flash` and `google/gemini-3.7-flash`,
        with default `@cf/moonshotai/kimi-k2.6`. Read the list from this
        endpoint rather than hard-coding it.
      parameters:
        - name: provider
          in: query
          required: false
          schema: { type: string, enum: [openrouter, gemini, cloudflare], default: openrouter }
      responses:
        "200":
          description: Models
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  default: { type: string, example: google/gemini-3.8-flash }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, example: google/gemini-3.8-flash }
                        name: { type: string, description: "OpenRouter only." }
                        context_length: { type: integer, nullable: true, description: "OpenRouter only." }
                        prompt_price_per_token: { type: string, nullable: true, description: "OpenRouter only. As OpenRouter reports it." }
                        completion_price_per_token: { type: string, nullable: true, description: "OpenRouter only. As OpenRouter reports it." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502":
          description: "catalog_unavailable: OpenRouter's catalog did not answer."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /client/v1/scouts/usage:
    get:
      summary: Scout model spend
      operationId: getScoutUsage
      description: >
        Reported BYOK spend on scout model calls, counting every provider call
        including failed and repaired ones. Totals plus one row per scout. Calls
        whose cost the provider did not report are counted in
        `unknown_cost_calls`; the provider's bill is authoritative.
      parameters:
        - name: location_id
          in: query
          required: false
          description: Only this client.
          schema: { type: string }
        - name: date_from
          in: query
          required: false
          description: "Inclusive UTC date. Default: the first day of this month."
          schema: { type: string, format: date }
        - name: date_to
          in: query
          required: false
          description: "Inclusive UTC date. Default: today. At most 92 days after date_from."
          schema: { type: string, format: date }
      responses:
        "200":
          description: Usage
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Usage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/AgencyRequired" }
  /client/v1/scouts/reports:
    get:
      summary: List reports (inbox)
      operationId: listScoutReports
      description: >
        The inbox, newest first. One report per finding. List rows carry a
        one-line `headline` instead of the full summary, evidence and history.
        A report built from a surface the caller's key cannot read (or from
        server logs or visitor-derived signals on a HIPAA location) keeps its place in the list with an
        empty `summary_md` and a `restricted` object instead of its text.
      parameters:
        - name: location_id
          in: query
          required: false
          description: Only this client.
          schema: { type: string }
        - name: scout_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          description: "Comma list of open, snoozed, resolved, dismissed, suppressed, or `all`. Default `open,snoozed`."
          schema: { type: string, default: "open,snoozed" }
        - name: priority
          in: query
          required: false
          description: "Comma list of P0, P1, P2, P3, P4."
          schema: { type: string, example: "P0,P1" }
        - name: recheck_status
          in: query
          required: false
          description: "Comma list of scheduled, running, recovered, not_recovered, skipped, failed: the state of the re-check after resolve. Combine with `status=resolved`."
          schema: { type: string, example: "not_recovered" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          description: "The `next_cursor` of the previous page."
          schema: { type: string }
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { type: array, items: { $ref: "#/components/schemas/ReportListItem" } }
                  next_cursor: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/AgencyRequired" }
  /client/v1/scouts/reports/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: Get a report
      operationId: getScoutReport
      description: >
        One report with its summary, actionability explanation, suggested
        action, status history, evidence and the signals it covers. Needs the read scope of every
        surface in `families` (`403 insufficient_scope` with `required`). A
        report that read server logs is refused on HIPAA locations (`403
        hipaa_restricted`) and while the location's privacy mode cannot be
        read (`503 privacy_unknown`).
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Report" }
        "403": { $ref: "#/components/responses/ReportForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      summary: Change a report's status
      operationId: updateScoutReport
      description: >
        Triage a report. Allowed moves: open to resolved, dismissed or
        snoozed; snoozed to open, resolved or dismissed; dismissed to open;
        suppressed to open or dismissed. **Resolved is terminal**: a recurrence
        is filed as a new report. Dismissing needs a `reason`, which the scout
        reads on its next runs (for 30 days) so it stops filing the same
        thing. Snoozing needs `snoozed_until`, a future time within 90 days;
        the report reopens when it passes. Same read rules as GET.
        Resolving schedules one **re-check after resolve**: after
        `recheck_after_days` (1-7; default the scout's suggestion, else 3)
        Mythic checks whether the problem went away. If it did, the report
        records `recheck.status: recovered`; if not, a new report linked by
        `recheck_of` is filed. `recheck: false` skips it. On a resolved
        report with a scheduled re-check, send no `status` and either
        `recheck: false` (cancel it) or `recheck_after_days` (move it, counted
        from the resolve); `409 recheck_not_scheduled` when there is none.
        Nothing else on a resolved report changes.
        Dismissing with `add_note: true` also keeps the reason (at most 500
        characters) as a steering note on the scout that filed the report, in
        the same transaction; the response's `data.note` is that note. `409
        note_scout_gone` when that scout was deleted, `422 note_limit` when it
        already has 20 active notes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status: { type: string, enum: [open, snoozed, resolved, dismissed], description: "Required, except on a resolved report when changing only its re-check." }
                reason: { type: string, maxLength: 1000, description: "Required when dismissing. Optional note otherwise; recorded in history." }
                snoozed_until: { type: string, format: date-time, description: "Required when snoozing; only valid when snoozing." }
                add_note: { type: boolean, description: "Dismiss only: also add the reason (max 500 characters) as a steering note on the scout that filed the report." }
                recheck_after_days: { type: integer, minimum: 1, maximum: 7, description: "When resolving, or alone on a resolved report with a scheduled re-check. Days from the resolve until the re-check. Default the scout's suggestion, else 3." }
                recheck: { type: boolean, description: "false skips the re-check when resolving, or alone cancels a scheduled one on a resolved report. Not combinable with recheck_after_days." }
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Report" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ReportForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /client/v1/scouts/signals:
    get:
      summary: List signals
      operationId: listScoutSignals
      description: >
        Signals are the alerts Mythic detectors raised about each client:
        exceptions, destinations, uptime, contracts, airbyte, sessions, drift
        and replay_vision. The signal_triage scout groups them into reports;
        `attached=false` lists the ones no open or snoozed report covers,
        which for a client without a model key is all of them. Newest first.
        Needs `scouts:read` plus the read scope of each source's family; on a
        key without one, those sources are left out, and naming one in
        `source` is `403 insufficient_scope`. Visitor-derived sources on HIPAA
        locations, or with unreadable privacy configuration, are redacted with
        a restricted reason and no title, detail, payload or report.
      parameters:
        - { name: location_id, in: query, schema: { type: string }, description: "One client. Omit for every client." }
        - { name: status, in: query, schema: { type: string, enum: [open, resolved, all], default: open } }
        - { name: source, in: query, schema: { type: string }, description: "Comma list of sources." }
        - { name: attached, in: query, schema: { type: boolean }, description: "true: on a report. false: on no open or snoozed report." }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string }, description: "next_cursor from the previous page." }
      responses:
        "200":
          description: Signals
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { type: array, items: { $ref: "#/components/schemas/Signal" } }
                  next_cursor: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/AgencyRequired" }
  /client/v1/scouts/signals/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: Get a signal
      operationId: getScoutSignal
      description: >
        One signal with its full payload and the report it is attached to.
        Needs the read scope of its source's family (`403
        insufficient_scope` with `required`). Visitor-derived sources are
        refused on HIPAA locations (403 hipaa_restricted), or when privacy
        configuration is unavailable (503 privacy_unknown, Retry-After).
      responses:
        "200":
          description: Signal
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Signal" }
        "403": { $ref: "#/components/responses/AgencyRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /client/v1/scouts:
    get:
      summary: List scouts
      operationId: listScouts
      parameters:
        - name: location_id
          in: query
          required: false
          description: Only this client's scouts. Omit for every client.
          schema: { type: string }
      responses:
        "200":
          description: Scouts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { type: array, items: { $ref: "#/components/schemas/Scout" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/AgencyRequired" }
    post:
      summary: Create a scout
      operationId: createScout
      description: >
        Create a scout on one client. Unset fields take the skill's defaults:
        name from the skill, schedule daily 08:00 in the client's timezone.
        Needs the `scouts` plan feature for the client (`402
        feature_not_in_plan`), a model key (OpenRouter, Gemini or Cloudflare)
        for the client or agency (`409 no_model_key`), a `model` that key can
        run (`422 model_provider_mismatch`), and on an `mcp_` key the read scope of
        every surface the skill reads (`403 insufficient_scope`). At most 10
        scouts per client (`422 scout_limit`).


        `provider` picks the key. Sent: the client must reach a key for it
        (its own or the agency's), else `409 no_model_key` naming it, and
        `model` must fit it (`422 model_provider_mismatch`). Only `model`
        sent: Mythic picks a provider the client has a key for that fits the
        model and stores it (the provider of the client's default key first,
        else the only one that fits, else OpenRouter, Cloudflare, Gemini); none
        fits gives `422 model_provider_mismatch` listing the providers the
        client has keys for. `null`, or neither sent: the default key, which
        `model` must fit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [location_id, skill]
                  properties:
                    location_id: { type: string, description: "One of the agency's clients." }
                    skill: { type: string, enum: [error_tracking, attribution_drift, conversion_delivery, signal_triage, custom], description: "Cannot change after creation." }
                - $ref: "#/components/schemas/ScoutInput"
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ScoutResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/AgencyRequired" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /client/v1/scouts/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: Get a scout
      operationId: getScout
      responses:
        "200": { description: Scout, content: { application/json: { schema: { $ref: "#/components/schemas/ScoutResponse" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Update a scout
      operationId: updateScout
      description: >
        Merge a change onto the scout. `skill` cannot change. A body of only
        `{"enabled": false}` pauses the scout without any plan, model key or
        scope check, so spend can always be stopped. `{"enabled": true}`
        resumes it and clears a `paused_reason` Mythic set. Every other change is
        checked like a create. Omitting both `provider` and `model` keeps the
        provider; a model-only change keeps the current provider when the
        model fits it, and on a scout whose provider's key was deleted gets
        `409 no_model_key` naming that provider. The update is rejected with `409
        version_conflict` if the scout changed concurrently.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScoutInput" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/ScoutResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/AgencyRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      summary: Delete a scout
      operationId: deleteScout
      description: The scout stops running. Its reports stay in the inbox.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      deleted: { type: boolean, example: true }
                      reports_retained: { type: boolean, example: true }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /client/v1/scouts/{id}/run:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      summary: Run a scout now
      operationId: runScout
      description: >
        Queue a run now. The body is empty, `{}` or `{"dry_run": true}`. The
        scout must be enabled (`409 scout_paused`), except for a dry run, with
        no run pending or running (`409 run_in_progress`). Same plan, model
        key and scope checks as a create, on the scout's stored `provider`.
        Runs start within a minute and usually take 1 to 5 minutes; follow
        them with `GET /scouts/{id}/runs`. `run_only_when` does not apply.

        A **dry run** tests the scout, for example after changing its
        instructions: it runs normally on your key, but the reports it would
        file or edit are kept as `drafts` on the run (`GET
        /scouts/{id}/runs/{runId}`). Nothing reaches the inbox, delivery
        channels or events; it writes no memory, consumes no signals and
        schedules no re-check. Its model calls count toward spend and usage.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                dry_run: { type: boolean, default: false, description: "Test run: reports become drafts on the run. Allowed on a paused scout." }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      run_id: { type: string, format: uuid }
                      status: { type: string, example: pending }
                      dry_run: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/AgencyRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /client/v1/scouts/{id}/runs:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: List runs
      operationId: listScoutRuns
      description: "The scout's last 30 runs, newest first, with the close-out summary, what each filed and reported spend. Dry runs carry `dry_run` and `draft_count`; a scheduled slot skipped by `run_only_when` is a `skipped` run with `skip_reason` and no model calls."
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { type: array, items: { $ref: "#/components/schemas/Run" } }
        "404": { $ref: "#/components/responses/NotFound" }
  /client/v1/scouts/{id}/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get a run
      operationId: getScoutRun
      description: "One run, as in the list. A dry run also returns `drafts`: the reports it would have filed (`kind: new`) and the edits it would have made (`kind: edit`). A run that read surfaces the caller cannot read comes back restricted, without drafts."
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    allOf:
                      - $ref: "#/components/schemas/Run"
                      - type: object
                        properties:
                          drafts: { type: array, items: { $ref: "#/components/schemas/Draft" } }
        "404": { $ref: "#/components/responses/NotFound" }
  /client/v1/scouts/{id}/notes:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: List steering notes
      operationId: listScoutNotes
      description: "The scout's steering notes, oldest first, expired ones included (`active: false`; deleted 30 days after they expire). Every run reads the active ones as agency guidance, after the skill playbook and instructions. A note made from a dismiss reason carries that report's families and is listed only to keys that may read them."
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { type: array, items: { $ref: "#/components/schemas/Note" } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Add a steering note
      operationId: addScoutNote
      description: "Steer the scout with a short note, such as `ignore /docs pages` or `Black Friday sale runs Nov 25-30`. At most 500 characters and 20 active notes per scout (`422 note_limit`)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 500 }
                expires_at: { type: string, format: date-time, nullable: true, description: "When the note stops applying: a future time within 366 days. Null or omitted: no end." }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Note" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /client/v1/scouts/{id}/notes/{noteId}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: noteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      summary: Delete a steering note
      operationId: deleteScoutNote
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      deleted: { type: boolean, example: true }
        "404": { $ref: "#/components/responses/NotFound" }
  /client/v1/scouts/{id}/memory:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: Get scout memory
      operationId: getScoutMemory
      description: >
        What the scout remembers between runs, up to 200 entries by key.
        Prefixes: `pattern:` (what normal looks like), `noise:` (what it
        skips), `dedupe:` (already surfaced), `addressed:` (fixed),
        `report:` (which report tracks what). Entries inherit their writing
        run's families and privacy requirements. Unreadable entries, including
        their keys, are omitted.
      responses:
        "200":
          description: Memory
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, example: "noise:exceptions:abc123" }
                        content: { type: string }
                        created_at: { type: string, format: date-time }
                        updated_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/NotFound" }
  /client/v1/scouts/{id}/memory/{key}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: key
        in: path
        required: true
        description: "A memory key: one of the prefixes above, a colon, then 1 to 100 of a-z 0-9 : _ . / -"
        schema: { type: string, example: "noise:exceptions:abc123" }
    delete:
      summary: Forget a memory entry
      operationId: forgetScoutMemory
      description: "Delete one entry, for example a `noise:` entry that now hides something that matters."
      responses:
        "200":
          description: Forgotten
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      key: { type: string }
                      forgotten: { type: boolean, example: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        Agency key (`ak_`) only; a location secret key (`sk_`) gets `403
        agency_required`. Agency-wide scoped keys (`mcp_`) need `scouts:read`
        or `scouts:write`, plus the read scope of every surface a scout's skill
        reads to create or run it, and of every surface a report's run read to
        open it.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Missing or invalid key
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    AgencyRequired:
      description: "agency_required, location_not_linked, or insufficient_scope (with `required`)."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ReportForbidden:
      description: "insufficient_scope (with `required`, the first missing surface scope) or hipaa_restricted."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    BadRequest:
      description: "Invalid request: invalid_json, invalid_scout, invalid_query, invalid_report_query, invalid_status_change, invalid_provider or invalid_key. `details` lists every problem."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    PaymentRequired:
      description: "feature_not_in_plan: the client's plan does not include Scouts."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: "no_model_key, version_conflict, scout_paused, run_in_progress, status_conflict, report_closed or duplicate_open_report."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unprocessable:
      description: "model_provider_mismatch, invalid_delivery_channel or scout_limit."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unavailable:
      description: "entitlements_unavailable or privacy_unknown; retry after Retry-After seconds."
      headers:
        Retry-After: { schema: { type: integer, example: 30 } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: invalid_scout }
            required: { type: string, description: "The scope to add, on insufficient_scope." }
            message: { type: string }
            details: { type: array, items: { type: string } }
    Schedule:
      type: object
      properties:
        kind: { type: string, enum: [hourly, daily, weekdays, weekly], description: "hourly is only for signal_triage." }
        time: { type: string, example: "08:00", description: "Local HH:mm. For hourly, only the minute counts." }
        day_of_week: { type: integer, minimum: 1, maximum: 7, description: "ISO weekday, Monday = 1. Weekly only." }
        timezone: { type: string, example: America/New_York, description: "IANA zone. Defaults to the client's timezone, else UTC." }
    ScoutInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        instructions: { type: string, nullable: true, maxLength: 8000, description: "Your notes, added after the skill's playbook. Required for the custom skill." }
        schedule: { $ref: "#/components/schemas/Schedule" }
        delivery:
          type: object
          properties:
            channel_ids: { type: array, maxItems: 5, items: { type: string, format: uuid }, description: "Active alert channels of this agency that receive each new report once." }
        enabled: { type: boolean, default: true }
        provider: { type: string, nullable: true, enum: [openrouter, gemini, cloudflare, null], description: "Which key runs the scout: the client's key for this provider, else the agency's. Null runs on the client's default key if it has keys of its own, else the agency's default. Omitted with a `model`: inferred and stored. Omitted without one: unchanged (null on create)." }
        auto_pause: { type: boolean, default: true, description: "Let Mythic pause the scout when it is ignored (5+ open reports, the oldest 14+ days old, and no status change on its reports, note or resume in 30 days) or failing (its last 5 runs since the last resume failed). Checked at most daily. false opts out." }
        run_only_when: { $ref: "#/components/schemas/RunOnlyWhen" }
        model: { type: string, nullable: true, description: "A model the key can run: `google/model` on OpenRouter or Cloudflare, other `vendor/model` on OpenRouter only, `@cf/vendor/model` on Cloudflare only, a bare id on Gemini. Null uses the key's default unless it is a lite or nano model, else google/gemini-3.8-flash (OpenRouter), gemini-3.8-flash (Gemini) or @cf/moonshotai/kimi-k2.6 (Cloudflare). Lite and nano models are refused." }
    Scout:
      type: object
      properties:
        id: { type: string, format: uuid }
        location_id: { type: string }
        name: { type: string }
        skill: { type: string, enum: [error_tracking, attribution_drift, conversion_delivery, signal_triage, custom] }
        instructions: { type: string, nullable: true }
        schedule: { $ref: "#/components/schemas/Schedule" }
        delivery:
          type: object
          properties:
            channel_ids: { type: array, items: { type: string, format: uuid } }
        model: { type: string, nullable: true }
        provider: { type: string, nullable: true, enum: [openrouter, gemini, cloudflare, null], description: "The provider whose key runs the scout, or null for the default key." }
        enabled: { type: boolean }
        version: { type: integer }
        next_run_at: { type: string, format: date-time, nullable: true, description: "The next scheduled slot. For signal_triage, the next hourly check; it runs only if there is a signal to triage." }
        last_run_at: { type: string, format: date-time, nullable: true }
        last_report_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, nullable: true }
        current_run:
          type: object
          nullable: true
          description: The run pending or running, if any.
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [pending, running] }
            scheduled_for: { type: string, format: date-time }
            triggered_by: { type: string, enum: [schedule, on_demand, recheck], description: "recheck: a re-check after resolve of one report." }
            attempts: { type: integer }
        can_run_now: { type: boolean }
        auto_pause: { type: boolean }
        paused_reason: { type: string, nullable: true, enum: [auto_ignored, auto_failing, null], description: "Set only when Mythic paused the scout. The pause is sent once to the scout's delivery channels and as the event $scout_paused. Resuming clears it." }
        paused_at: { type: string, format: date-time, nullable: true }
        run_only_when: { $ref: "#/components/schemas/RunOnlyWhen" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RunOnlyWhen:
      type: object
      nullable: true
      description: "Skip a scheduled run, with no model call, when nothing new happened since the scout's last successful run. The slot is recorded as a skipped run and the next one is scheduled. A scout that never succeeded always runs. Run now and dry runs ignore it. Not allowed for signal_triage, which already runs only on new signals. Null: always run."
      properties:
        kind: { type: string, enum: [signals, events], description: "signals: an open signal from one of `sources`, opened since the last successful run and on no open report. events: at least `min_count` of `event`, counted from the start of the UTC day of the last successful run; when the count cannot be read the scout runs." }
        sources: { type: array, items: { type: string }, description: "signals only: signal sources whose family the skill reads." }
        event: { type: string, maxLength: 200, description: "events only: the event name, e.g. purchase. The skill must read events." }
        min_count: { type: integer, minimum: 1, default: 1, description: "events only." }
    Note:
      type: object
      properties:
        id: { type: string, format: uuid }
        scout_id: { type: string, format: uuid }
        body: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }
        active: { type: boolean, description: "Not expired. Only active notes reach runs." }
        source_report_id: { type: string, format: uuid, nullable: true, description: "Set when the note came from a dismiss reason (add_note)." }
        families: { type: array, items: { type: string }, description: "The surfaces of that report. Empty for notes added directly." }
        created_by: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    Draft:
      type: object
      description: "A dry run's report emit (kind new) or edit (kind edit). Same checks as a real one; nothing outside the run was written."
      properties:
        draft: { type: integer }
        kind: { type: string, enum: [new, edit] }
        at: { type: string, format: date-time }
        title: { type: string }
        summary_md: { type: string }
        priority: { type: string, enum: [P0, P1, P2, P3, P4] }
        actionability: { type: string, enum: [immediately_actionable, requires_human_input, not_actionable] }
        actionability_explanation: { type: string }
        suggested_action: { type: string }
        dedupe_key: { type: string }
        status: { type: string, enum: [open, suppressed], description: "new only: the status the report would have." }
        report_id: { type: string, format: uuid, description: "edit only: the report it would have edited." }
        report_title: { type: string }
        note: { type: string, description: "edit only: the scout's note on the edit." }
        recheck_after_days: { type: integer }
        evidence: { type: array, items: { $ref: "#/components/schemas/Evidence" } }
        signal_ids: { type: array, items: { type: string, format: uuid } }
    ScoutResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/Scout" }
    Skill:
      type: object
      properties:
        id: { type: string, enum: [error_tracking, attribution_drift, conversion_delivery, signal_triage, custom] }
        name: { type: string }
        description: { type: string }
        families:
          type: array
          description: "Data surfaces plus, for signal_triage, the families of the signals it groups."
          items: { type: string, enum: [exceptions, logs, events, sessions, links, destinations, contracts, airbyte, incrementality, alerts, replay_vision] }
        trigger: { type: string, enum: [schedule, signals], description: "signals: a scheduled run starts only when new unattached signals exist." }
        default_schedule: { $ref: "#/components/schemas/Schedule" }
        requires_instructions: { type: boolean }
        version: { type: string, example: "2026-10-19.1" }
        playbook_md: { type: string, description: The standing instructions the scout follows. }
    Restricted:
      type: object
      properties:
        reason: { type: string, enum: [insufficient_scope, hipaa_restricted, privacy_unknown] }
        required: { type: string, description: "The scope to add, on insufficient_scope." }
    ReportBase:
      type: object
      properties:
        id: { type: string, format: uuid }
        location_id: { type: string }
        scout_id: { type: string, format: uuid, nullable: true }
        scout_name: { type: string, nullable: true }
        skill: { type: string, nullable: true }
        run_id: { type: string, format: uuid, nullable: true }
        title: { type: string }
        priority: { type: string, enum: [P0, P1, P2, P3, P4] }
        actionability: { type: string, enum: [immediately_actionable, requires_human_input, not_actionable] }
        status: { type: string, enum: [open, snoozed, resolved, dismissed, suppressed] }
        dedupe_key: { type: string, example: "exceptions:4f2a9c" }
        families:
          type: array
          description: The surfaces the run read. Reading the report needs the read scope of each.
          items: { type: string }
        snoozed_until: { type: string, format: date-time, nullable: true }
        dismiss_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        status_changed_at: { type: string, format: date-time, nullable: true }
        edit_count: { type: integer }
        recheck: { $ref: "#/components/schemas/Recheck" }
        recheck_of: { type: string, format: uuid, nullable: true, description: "On a report filed because a resolved report's problem came back: that resolved report." }
    Recheck:
      type: object
      nullable: true
      description: "Re-check after resolve. Null when no re-check was ever scheduled or suggested. Restricted rows carry the state fields only (no result_md, no evidence). List rows omit evidence."
      properties:
        status: { type: string, nullable: true, enum: [scheduled, running, recovered, not_recovered, skipped, failed], description: "scheduled at resolve; running while a scout checks; recovered; not_recovered (came back, see report_id); skipped (turned off, scout deleted or paused, no model key); failed (the check run failed)." }
        after_days: { type: integer, nullable: true, minimum: 1, maximum: 7 }
        suggested_after_days: { type: integer, nullable: true, minimum: 1, maximum: 7, description: "What the scout that filed it suggested." }
        due_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        run_id: { type: string, format: uuid, nullable: true, description: "The scout run that did the re-check, when a model was needed." }
        report_id: { type: string, format: uuid, nullable: true, description: "On not_recovered: the report filed (or the open report linked) because it came back." }
        result_md: { type: string, nullable: true, description: "One or two sentences: what was checked and what it showed, or why it was skipped." }
        evidence: { type: array, description: "Detail only. Evidence from the re-check run.", items: { $ref: "#/components/schemas/Evidence" } }
    ReportListItem:
      description: "Restricted rows contain only identifiers, skill, priority, actionability, status, families, timestamps, empty summary_md and restricted. Title, scout_name, dedupe_key, dismiss_reason, evidence and history are absent."
      allOf:
        - $ref: "#/components/schemas/ReportBase"
        - type: object
          properties:
            headline: { type: string, description: "First line of the summary, up to 300 characters. Absent on restricted rows." }
            summary_md: { type: string, description: "Empty on restricted rows only." }
            restricted: { $ref: "#/components/schemas/Restricted" }
    Report:
      allOf:
        - $ref: "#/components/schemas/ReportBase"
        - type: object
          properties:
            summary_md: { type: string }
            actionability_explanation: { type: string }
            suggested_action: { type: string }
            evidence: { type: array, items: { $ref: "#/components/schemas/Evidence" } }
            signals: { type: array, description: "The signals attached to this report. Each counts as evidence.", items: { $ref: "#/components/schemas/Signal" } }
            history:
              type: array
              description: "Filed, edited and status entries, oldest first."
              items:
                type: object
                properties:
                  at: { type: string, format: date-time }
                  kind: { type: string, enum: [filed, edited, status, recheck] }
                  run_id: { type: string, format: uuid }
                  scout_id: { type: string, format: uuid }
                  status: { type: string }
                  by: { type: string }
                  note: { type: string }
            provider: { type: string, nullable: true }
            model_used: { type: string, nullable: true }
    Signal:
      type: object
      description: "An alert about one client. Visitor-derived sources are redacted in lists on HIPAA locations or when privacy configuration is unavailable. Detail returns 403 hipaa_restricted or 503 privacy_unknown."
      properties:
        id: { type: string, format: uuid }
        location_id: { type: string }
        source: { type: string, enum: [contracts, uptime, airbyte, drift, quota, sessions, replay_vision, exceptions, destinations] }
        family: { type: string, description: "The scope family reading it needs, e.g. links for uptime." }
        severity: { type: string, enum: [info, warning, critical] }
        title: { type: string }
        detail: { type: string, nullable: true }
        payload: { type: object, additionalProperties: true, description: "The detector's own fields: ids, counts, status codes and a link to the detail route." }
        status: { type: string, enum: [open, resolved] }
        occurrences: { type: integer }
        opened_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        restricted: { $ref: "#/components/schemas/Restricted" }
        report:
          type: object
          nullable: true
          description: "The report it is attached to. Null on a privacy-restricted signal. Titles are withheld here because report access may require additional scopes."
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [open, snoozed, resolved, dismissed, suppressed] }
            title: { type: string, nullable: true, description: Always null. Read report detail for its title. }
    Evidence:
      type: object
      description: Copied by the server from a tool result recorded in the run, not written by the model.
      properties:
        call_id: { type: string, example: c4 }
        run_id: { type: string, format: uuid }
        tool: { type: string, example: get_exception_digest }
        family: { type: string, example: exceptions }
        args: { type: object, additionalProperties: true }
        status: { type: integer, example: 200 }
        truncated: { type: boolean }
        excerpt: { type: string, description: "What the scout read, up to 4000 characters." }
        note: { type: string, description: "The scout's note on what this result shows." }
        added_at: { type: string, format: date-time }
    Run:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, running, succeeded, failed, cancelled, skipped], description: "skipped: a scheduled slot run_only_when skipped, with no model call." }
        triggered_by: { type: string, enum: [schedule, on_demand, recheck], description: "recheck: a re-check after resolve of one report." }
        dry_run: { type: boolean, description: "A test run: its reports are drafts on the run." }
        draft_count: { type: integer }
        skip_reason: { type: string, nullable: true }
        scheduled_for: { type: string, format: date-time }
        attempts: { type: integer }
        provider: { type: string, nullable: true }
        model_used: { type: string, nullable: true }
        skills_version: { type: string }
        steps: { type: integer, description: Model turns. }
        tool_calls: { type: integer }
        reports_filed: { type: integer }
        reports_edited: { type: integer }
        families_read: { type: array, items: { type: string } }
        summary: { type: string, nullable: true, description: "The close-out. Absent when its family scopes or privacy mode restrict the caller." }
        restricted: { $ref: "#/components/schemas/Restricted" }
        error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        model_calls: { type: integer }
        known_cost_usd: { type: number }
        unknown_cost_calls: { type: integer }
    Usage:
      type: object
      properties:
        date_from: { type: string, format: date }
        date_to: { type: string, format: date }
        spend_label: { type: string, example: Reported spend on scout model calls }
        totals:
          type: object
          properties:
            runs: { type: integer }
            dry_runs: { type: integer, description: "Of runs, the dry runs. They count toward spend." }
            calls: { type: integer }
            known_cost_usd: { type: number }
            unknown_cost_calls: { type: integer }
            input_tokens: { type: integer }
            output_tokens: { type: integer }
        scouts:
          type: array
          items:
            type: object
            properties:
              scout_id: { type: string, format: uuid }
              location_id: { type: string }
              runs: { type: integer }
              dry_runs: { type: integer }
              calls: { type: integer }
              known_cost_usd: { type: number }
              unknown_cost_calls: { type: integer }
