openapi: "3.0.0"
info:
  version: 1.0.0
  title: Agency API
  description: >
    Cross-location rollups on `/client/v1/agency` — the roster, per-location
    stats, destination delivery health, event-contract coverage, and the
    agency's own API usage.


    **Agency key (`ak_`) only, and no location parameter** — the agency itself
    is the scope. A location secret key (`sk_`) gets `403 agency_required`.
    The roster is resolved server-side from the agency's linked locations;
    `location_ids` narrows it and is validated as a subset (`403
    location_not_linked` for a foreign id). Rollups are capped at 100
    locations per request (`422 too_many_locations`) — batch with
    `location_ids`, using `/locations` (never capped) as the index.
servers:
  - url: https://mythic-analytics.gulp.workers.dev
security:
  - BearerAuth: []
paths:
  /client/v1/agency/locations:
    get:
      summary: List the agency's locations
      operationId: listAgencyLocations
      description: >
        The roster — every location linked to this agency, oldest first. Never
        capped, so it is the index for batching `location_ids` on the rollup
        routes.
      parameters:
        - $ref: "#/components/parameters/LocationIds"
      responses:
        "200":
          description: The roster
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Location" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AgencyRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /client/v1/agency/stats:
    get:
      summary: Per-location stats
      operationId: getAgencyStats
      description: >
        One row per location: event volume, unique users, and unique sessions
        over the date window, plus the all-time live person count. Rows are
        **zero-filled from the roster** — a location that sent nothing in the
        window appears as a row of zeros, never an omission.
      parameters:
        - $ref: "#/components/parameters/LocationIds"
        - name: date_from
          in: query
          required: false
          description: "ISO date the window starts at. Default: 30 days ago."
          schema: { type: string, format: date }
          example: "2026-08-01"
        - name: date_to
          in: query
          required: false
          description: ISO date the window ends at (inclusive day).
          schema: { type: string, format: date }
          example: "2026-08-28"
      responses:
        "200":
          description: One stats row per roster location
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/StatsRow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NoLocations" }
        "422": { $ref: "#/components/responses/TooManyLocations" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamFailed" }
  /client/v1/agency/destinations/health:
    get:
      summary: Per-location destination health
      operationId: getAgencyDestinationHealth
      description: >
        Delivery health of every location's activation destinations over a
        trailing window — one row per (location, destination action) with
        success rate, failure counts, and the last error. Sorted worst-first
        (lowest success rate, most failures), so the top rows are which
        client's activation is bleeding. Test deliveries are excluded, and
        in-flight retries don't count toward totals.
      parameters:
        - $ref: "#/components/parameters/LocationIds"
        - name: hours_back
          in: query
          required: false
          description: Trailing window in hours (1–720).
          schema: { type: integer, minimum: 1, maximum: 720, default: 24 }
      responses:
        "200":
          description: Destination health rows, worst first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      hours_back: { type: integer, example: 24 }
                      destinations:
                        type: array
                        items: { $ref: "#/components/schemas/DestinationHealthRow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NoLocations" }
        "422": { $ref: "#/components/responses/TooManyLocations" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamFailed" }
  /client/v1/agency/destinations/quality:
    get:
      summary: Per-location Meta dataset quality
      operationId: getAgencyDestinationQuality
      description: >
        Meta's match-quality scoring for every location with a Meta CAPI
        destination, worst first — which clients have bad Meta tracking, in one
        call. One row per location carrying its lowest Event Match Quality, the
        event holding that score, and counts of critical and warning findings.


        **This reads the daily snapshot, not Meta.** Each client's token is
        scoped to its own dataset, so no single live call can span an agency,
        and Meta rate-limits per app. The per-destination endpoint
        (`GET /client/v1/destinations/{id}/quality`) is the live read for one
        client, and the only place per-parameter coverage appears.


        **`no_snapshot` is a finding, not a blank.** It means quality has never
        been read for that client — usually a Conversions API token generated
        without the Dataset Quality option — and it sorts above the healthy
        rows rather than disappearing among them.


        **Testing a destination cannot make a client look broken.** Meta scores
        test events even when `test_event_code` is set, and they score badly.
        Events whose only deliveries were test fires are counted in
        `test_only_events` and never contribute to a location's status or its
        worst score.
      parameters:
        - $ref: "#/components/parameters/LocationIds"
        - name: days_back
          in: query
          required: false
          description: >-
            How far back to look for each location's most recent snapshot
            (1–90). Snapshots are written daily.
          schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
      responses:
        "200":
          description: One row per location, worst first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      days_back: { type: integer, example: 7 }
                      locations:
                        type: array
                        items:
                          type: object
                          properties:
                            location_id: { type: string }
                            name: { type: string }
                            status:
                              type: string
                              enum: [critical, warn, no_snapshot, test_only, no_data, ok]
                              description: >-
                                Sort order is exactly this enum. `no_data` means
                                Meta scored nothing (no traffic); `no_snapshot`
                                means we could not read quality at all;
                                `test_only` means every scored event came from
                                test fires.
                            test_only_events:
                              type: integer
                              description: >-
                                Events excluded from this row because their only
                                deliveries were test fires.
                            min_event_match_quality:
                              type: number
                              nullable: true
                              description: Lowest EMQ (0-10) across the location's scored events.
                            worst_event: { type: string, nullable: true }
                            critical_flags: { type: integer }
                            warning_flags: { type: integer }
                            events: { type: integer }
                            captured_day: { type: string, format: date, nullable: true }
                            dataset_id: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NoLocations" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamFailed" }
  /client/v1/agency/destinations/quality/trend:
    get:
      summary: Per-location Meta dataset quality, day by day
      operationId: getAgencyDestinationQualityTrend
      description: >
        The same roster, over time: one row per (day, location) with that day's
        worst scored event, its match quality, and the findings that stood on
        the day.


        `GET /client/v1/agency/destinations/quality` answers "who is broken
        now". This answers "who got worse, and when" — the read that ties a
        drop to the change that caused it. Meta keeps no history of its own;
        this series exists because Mythic snapshots every connected dataset
        daily.


        **Gaps are real.** A location with no row on a day was not captured
        that day. Nothing is carried forward: a flat line through an outage
        would read as stability.


        Test-only events are held out of each day's headline and counted in
        `test_only_events`, exactly as in the current-state rollup.
      parameters:
        - $ref: "#/components/parameters/LocationIds"
        - name: days_back
          in: query
          required: false
          description: Days of history (1–90). Default 30.
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        "200":
          description: One row per day and location, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      days_back: { type: integer, example: 30 }
                      days:
                        type: array
                        items:
                          type: object
                          properties:
                            day: { type: string, format: date }
                            location_id: { type: string }
                            name: { type: string, nullable: true }
                            dataset_id: { type: string, nullable: true }
                            status:
                              type: string
                              enum: [critical, warn, test_only, no_data, ok]
                              description: >-
                                Derived from that day's findings. There is no
                                `no_snapshot` here: a location with no capture
                                on a day has no row for it.
                            min_event_match_quality: { type: number, nullable: true }
                            worst_event: { type: string, nullable: true }
                            critical_flags: { type: integer }
                            warning_flags: { type: integer }
                            test_only_events: { type: integer }
                            events: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NoLocations" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamFailed" }
        "503": { description: Analytics backend not configured }
  /client/v1/agency/contracts/summary:
    get:
      summary: Per-location contract coverage
      operationId: getAgencyContractsSummary
      description: >
        One row per location: how many event contracts are declared, whether
        the daily contract-alert webhook is configured, whether an agency
        alert rule routes contract alerts for it, and when the last webhook
        alert fired. A location with zero contracts has no event-shape
        monitoring at all; one with contracts but neither a webhook nor a
        routing rule finds out about breakage only when someone runs a check
        by hand.
      parameters:
        - $ref: "#/components/parameters/LocationIds"
      responses:
        "200":
          description: One coverage row per roster location
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ContractsSummaryRow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NoLocations" }
        "422": { $ref: "#/components/responses/TooManyLocations" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /client/v1/agency/usage:
    get:
      summary: The agency's own API usage
      operationId: getAgencyUsage
      description: >
        The agency's own API + MCP usage, daily per location/surface/route —
        request counts, auth failures, rate-limited and error counts,
        and latency. This is the same telemetry Mythic
        meters on. Takes no `location_ids` — usage is already the agency's own
        slice. Returns at most 1000 rows, newest and busiest first; `truncated`
        is true when the cap cut the result. At high volume the location grain
        passes 1000 rows within a week, so pass `group_by=route` to sum
        locations and fit 30 days.
      parameters:
        - name: days_back
          in: query
          required: false
          description: Trailing window in days (1–90).
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
        - name: group_by
          in: query
          required: false
          description: >
            `location` keeps one row per day × location × surface × route.
            `route` sums locations into one row per day × surface × route and
            omits `location_id`.
          schema: { type: string, enum: [location, route], default: location }
      responses:
        "200":
          description: Daily usage rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      days_back: { type: integer, example: 30 }
                      group_by: { type: string, enum: [location, route], example: route }
                      usage:
                        type: array
                        items: { $ref: "#/components/schemas/UsageRow" }
                      truncated:
                        type: boolean
                        example: false
                        description: True when the 1000-row cap cut the result.
        "400":
          description: "`invalid_group_by`: `group_by` is not `location` or `route`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AgencyRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamFailed" }
  /client/v1/agency/quota:
    get:
      summary: Plan, entitlements, and month-to-date event volume
      operationId: getAgencyQuota
      description: >
        The tier this account is on, the features it includes, and how many
        events have been ingested this calendar month against the quota that was
        bought. Measured live at request time rather than served from a cached
        daily sweep, so a check straight after a traffic spike reflects it.


        The quota is a SOFT cap. Being over it is a billing signal, never a
        stop: ingestion continues, no events are dropped, and no endpoint starts
        failing.


        `buckets` holds one entry per quota in force. Normally that is a single
        `agency` bucket that every location draws from. A location placed on its
        own plan is metered separately in its own `location` bucket and its
        events leave the agency pool, so the same events are never counted
        against two quotas.
      parameters:
        - name: month_offset
          in: query
          required: false
          description: 0 = current calendar month (default), 1 = previous, up to 12.
          schema: { type: integer, minimum: 0, maximum: 12, default: 0 }
      responses:
        "200":
          description: Plan and quota state
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      month_offset: { type: integer, example: 0 }
                      plan:
                        type: object
                        nullable: true
                        properties:
                          id: { type: string, example: growth }
                          name: { type: string, example: Growth }
                          features:
                            type: array
                            items: { type: string }
                            description: Feature keys this plan grants. Enabling anything outside this list returns 402 feature_not_in_plan.
                          unlimited: { type: boolean, example: false }
                          monthly_event_quota:
                            type: integer
                            nullable: true
                            example: 10000000
                            description: Null means unmetered. Distinct from 0, which is a real quota of zero.
                      buckets:
                        type: array
                        items: { $ref: "#/components/schemas/QuotaBucket" }
                      locations: { type: integer, example: 12 }
                      soft_cap: { type: boolean, example: true }
        "401": { description: Missing or invalid key, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: Not an agency key, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: Plan or quota lookup failed, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        Agency key (`ak_`) only — a location secret key (`sk_`) gets `403
        agency_required`. Keys are server-side credentials; this surface
        serves no CORS headers on purpose.
        Agency-wide scoped keys (`mcp_` with no fixed location) are accepted too and need `agency:read`; a client-bound `mcp_` key gets `403 agency_key_required`. See [Using an mcp_ key over HTTP](/mcp/authentication).
  parameters:
    LocationIds:
      name: location_ids
      in: query
      required: false
      description: >-
        Comma-separated location ids to narrow the roster. Every id must
        belong to this agency — a foreign id is `403 location_not_linked`,
        never a silent empty result. Required in batches of up to 100 when the
        agency has more than 100 locations.
      schema: { type: string }
      example: "loc_abc123,loc_def456"
  responses:
    Unauthorized:
      description: "`unauthorized` — missing or invalid key."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AgencyRequired:
      description: "`agency_required` — this surface requires an agency key (`ak_`); location secret keys are rejected."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: >-
        `agency_required` (the key is an `sk_`) or `location_not_linked` (a
        `location_ids` entry is not linked to this agency — the message names
        the foreign ids).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoLocations:
      description: "`no_locations` — no locations are linked to this agency."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyLocations:
      description: >-
        `too_many_locations` — more than 100 locations in scope. Fetch the
        roster from `/agency/locations` and pass `location_ids` batches of up
        to 100.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: "`rate_limited` — 60 requests/min per agency. Retry after the `Retry-After` header."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UpstreamFailed:
      description: "`stats_failed`, `health_failed`, or `usage_failed` — the upstream analytics query failed. Retry."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Location:
      type: object
      properties:
        id: { type: string, example: loc_abc123 }
        name: { type: string, example: Acme Dental }
        active:
          type: boolean
          example: true
          description: Whether the location is currently active for ingestion.
        plan_id:
          type: string
          nullable: true
          example: standard
          description: >-
            The client's own billing tier, or `null` meaning it inherits the
            agency default. Deliberately NOT resolved to the effective tier —
            `null` and "explicitly on the agency's tier" are different states,
            and only the second survives a change to the agency default. Use
            `GET /client/v1/locations/plan` for the resolved view and the
            selectable tiers.
        created_at: { type: string, format: date-time }
    StatsRow:
      type: object
      description: >-
        Zero-filled from the roster — a silent location is a row of zeros,
        never an omission.
      properties:
        location_id: { type: string, example: loc_abc123 }
        name: { type: string, example: Acme Dental }
        active: { type: boolean, example: true }
        total_events:
          type: integer
          example: 48210
          description: Events in the date window.
        unique_users:
          type: integer
          example: 6120
          description: Unique users in the date window.
        unique_sessions:
          type: integer
          example: 9344
          description: Unique sessions in the date window.
        people:
          type: integer
          example: 12873
          description: All-time live person count (merge tombstones excluded).
    DestinationHealthRow:
      type: object
      properties:
        location_id: { type: string, example: loc_abc123 }
        action_id: { type: string, example: meta-capi-purchase }
        action_name: { type: string, example: Meta CAPI Purchase }
        destination_type: { type: string, example: meta_capi }
        total:
          type: integer
          example: 1180
          description: Deliveries in the window (in-flight retries excluded).
        successes: { type: integer, example: 1102 }
        failures: { type: integer, example: 78 }
        success_rate:
          type: number
          format: float
          example: 0.9339
          description: "successes / (successes + failures), rounded to 4 decimals."
        last_delivery_at: { type: string, format: date-time }
        last_error:
          type: string
          example: "401 Invalid OAuth access token"
          description: The most recent failure's error, empty if none.
    ContractsSummaryRow:
      type: object
      properties:
        location_id: { type: string, example: loc_abc123 }
        name: { type: string, example: Acme Dental }
        contracts_declared:
          type: integer
          example: 7
          description: Event contracts declared for this location.
        alert_webhook_configured:
          type: boolean
          example: true
          description: Whether the daily contract-alert webhook is set.
        alert_rule_routed:
          type: boolean
          example: true
          description: >-
            Whether an enabled agency alert rule sends this location's
            contract alerts to a channel. See [Alerts](/agency-api/alerts).
        last_alert_at:
          type: string
          format: date-time
          nullable: true
          description: When the last contract alert fired, or null if never.
    UsageRow:
      type: object
      properties:
        day: { type: string, format: date, example: "2026-08-27" }
        agency_id: { type: string, example: ag_xyz789 }
        location_id:
          type: string
          example: loc_abc123
          description: Empty for agency-grain requests with no location bound. Omitted with `group_by=route`.
        surface:
          type: string
          example: data
          description: "Which API surface served the request (e.g. `data`, `agency`, `mcp`)."
        route: { type: string, example: /client/v1/data/events }
        requests: { type: integer, example: 412 }
        auth_failures:
          type: integer
          example: 3
          description: Requests that returned 401 or 403.
        rate_limited:
          type: integer
          example: 0
          description: Requests that returned 429.
        errors:
          type: integer
          example: 1
          description: Requests that returned 5xx.
        avg_duration_ms: { type: integer, example: 84 }
        p95_duration_ms: { type: integer, example: 310 }
    QuotaBucket:
      type: object
      description: One quota in force. scope=agency is the pooled quota; scope=location is a per-location override, metered separately.
      properties:
        scope:
          type: string
          enum: [agency, location]
        plan_id: { type: string, nullable: true, example: growth }
        location_id:
          type: string
          nullable: true
          description: Present only when scope is location.
        locations:
          type: integer
          nullable: true
          description: Present only when scope is agency — how many locations draw from the pooled quota.
        unresolved_plan_id:
          type: string
          nullable: true
          description: Present only when a location declared a plan that could not be resolved. The bucket then fails closed with a zero quota rather than inheriting the agency plan.
        metered: { type: boolean, example: true }
        used: { type: integer, example: 8412663 }
        quota: { type: integer, nullable: true, example: 10000000 }
        ratio:
          type: number
          nullable: true
          example: 0.841
          description: used / quota, rounded to 3 decimals. Null when unmetered or when quota is 0.
        over: { type: boolean, example: false }
        threshold:
          type: number
          nullable: true
          example: 0.8
          description: The highest alert threshold crossed (0.8 or 1.0), or null.
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: too_many_locations }
            message: { type: string }
