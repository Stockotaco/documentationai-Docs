openapi: "3.0.0"
info:
  version: 1.0.0
  title: Destinations
  description: >
    Partner self-serve data activation. Create and manage destinations
    (webhooks, Meta Conversions API, Google Ads), store per-location
    credentials, and inspect delivery logs and health. Client-scoped: an
    agency key (`ak_`) has read-write access to a single named location, and a
    location secret key (`sk_`) is a read-only viewer of its own location.
servers:
  - url: https://mythic-analytics.gulp.workers.dev
security:
  - BearerAuth: []
  - AgencyKeyQuery: []
  - SecretKeyQuery: []
paths:
  /client/v1/destinations:
    get:
      summary: List destinations
      operationId: listDestinations
      description: >
        List the calling location's destinations, newest first. Both agency
        (`ak_`) and viewer (`sk_`) keys may read. For viewer keys, webhook
        `action_config` secrets (`headers` values and `body_template`) are
        redacted to `***`.
      parameters:
        - name: type
          in: query
          description: Filter by destination type.
          required: false
          schema:
            type: string
            enum: [webhook, meta_capi, google_ads, google_analytics]
        - name: enabled
          in: query
          description: Filter by enabled state. Pass `true` or `false`.
          required: false
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: List of destinations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationListResponse"
        "401":
          description: Missing or invalid key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      summary: Create destination
      operationId: createDestination
      description: >
        Create a destination for the calling location. Requires an agency
        (`ak_`) key. The `action_config` shape is validated against
        `action_type`. HIPAA-enabled locations reject `http://` webhook URLs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDestinationRequest"
      responses:
        "201":
          description: Destination created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationResponse"
        "400":
          description: Invalid body, unsupported type, or configuration error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Missing or invalid key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Operation requires an agency (`ak_`) key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /client/v1/destinations/credentials:
    get:
      summary: List credentials
      operationId: listCredentials
      description: >
        List stored credential metadata for the calling location. Requires an
        agency (`ak_`) key. Credential values are never returned.
      responses:
        "200":
          description: Credential metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialListResponse"
        "401":
          description: Missing or invalid key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Operation requires an agency (`ak_`) key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /client/v1/destinations/credentials/{type}:
    put:
      summary: Store or rotate a credential
      operationId: upsertCredential
      description: >
        Store (or rotate, by re-sending) a credential for a credential-backed
        destination type. Requires an agency (`ak_`) key. A given
        `(destination_type, credential_name)` pair is upserted in place.
        `google_ads` and `google_analytics` credential values must be a JSON
        object containing `client_id`, `client_secret`, and `refresh_token`,
        minted against the
        `https://www.googleapis.com/auth/datamanager` OAuth scope.
        The response echoes metadata only — never the credential value.
      parameters:
        - $ref: "#/components/parameters/CredentialType"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertCredentialRequest"
      responses:
        "200":
          description: Credential stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialResponse"
        "400":
          description: Unsupported credential type or invalid value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Missing or invalid key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Operation requires an agency (`ak_`) key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
    delete:
      summary: Delete a credential
      operationId: deleteCredential
      description: >
        Delete a credential for the calling location. Requires an agency
        (`ak_`) key. Omitting `credential_name` deletes all credentials of the
        given type.
      parameters:
        - $ref: "#/components/parameters/CredentialType"
        - name: credential_name
          in: query
          description: Restrict the delete to a single named credential.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Credential deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Unsupported credential type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Operation requires an agency (`ak_`) key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /client/v1/destinations/deliveries:
    get:
      summary: List delivery attempts
      operationId: listDeliveries
      description: >
        List destination delivery attempts for the calling location, newest
        first. Backed by analytics; defaults to the last 7 days when no `since`
        is given. Both agency and viewer keys may read.


        **Associating deliveries with events (profile activity stream).** Every
        delivery records the `event_uuid` of the event that triggered it, which
        is the same value as the `uuid` field on rows from the activity
        endpoints (e.g. `GET /client/v1/data/people/{personId}/activity`). To
        show "this event was sent to a destination" indicators across a page of
        activity, pass that page's event uuids as a comma-separated
        `event_uuid` list (up to 200) in a single call, then group the returned
        rows by `event_uuid` client-side. Widen `since` to cover the activity
        window (the default is only 7 days). For the sent request body and the
        destination's response body, drill into
        `GET /client/v1/destinations/{id}/deliveries/{eventUuid}`.
      parameters:
        - $ref: "#/components/parameters/ActionIdQuery"
        - $ref: "#/components/parameters/DeliveryStatus"
        - $ref: "#/components/parameters/EventUuid"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Until"
        - $ref: "#/components/parameters/DeliveryLimit"
        - $ref: "#/components/parameters/DeliveryOffset"
      responses:
        "200":
          description: Delivery attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryListResponse"
        "400":
          description: Unparseable `since`/`until` timestamp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Missing or invalid key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/AnalyticsNotConfigured"
  /client/v1/destinations/health:
    get:
      summary: Destination health
      operationId: destinationHealth
      description: >
        Per-destination health for the calling location, joining live action
        metadata with delivery aggregates over a rolling window. Both agency
        and viewer keys may read.
      parameters:
        - name: hours
          in: query
          description: Rolling window in hours. Default `24`, min `1`, max `720`.
          required: false
          schema:
            type: integer
            default: 24
            minimum: 1
            maximum: 720
        - $ref: "#/components/parameters/ActionIdQuery"
      responses:
        "200":
          description: Destination health rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "401":
          description: Missing or invalid key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/AnalyticsNotConfigured"
  /client/v1/destinations/{id}:
    get:
      summary: Retrieve destination
      operationId: getDestination
      description: >
        Fetch a single destination by id. Viewer keys receive redacted webhook
        secrets. Returns `404` if the destination does not belong to the
        calling location.
      parameters:
        - $ref: "#/components/parameters/DestinationId"
      responses:
        "200":
          description: Destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationResponse"
        "401":
          description: Missing or invalid key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Destination not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      summary: Update destination
      operationId: updateDestination
      description: >
        Partially update a destination. Requires an agency (`ak_`) key. Only
        include fields you want to change; `action_type` is immutable. When
        `action_config` is supplied it fully replaces the stored config and is
        re-validated against the existing `action_type`.
      parameters:
        - $ref: "#/components/parameters/DestinationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDestinationRequest"
      responses:
        "200":
          description: Destination updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationResponse"
        "400":
          description: Invalid body or configuration error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Missing or invalid key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Operation requires an agency (`ak_`) key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Destination not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
    delete:
      summary: Delete destination
      operationId: deleteDestination
      description: >
        Delete a destination. Requires an agency (`ak_`) key. Idempotent — an
        already-deleted destination still returns success.
      parameters:
        - $ref: "#/components/parameters/DestinationId"
      responses:
        "200":
          description: Destination deleted (or already absent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Missing or invalid key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Operation requires an agency (`ak_`) key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /client/v1/destinations/{id}/deliveries:
    get:
      summary: List delivery attempts for a destination
      operationId: listDestinationDeliveries
      description: >
        Same as the delivery log, pre-filtered to a single destination id.
      parameters:
        - $ref: "#/components/parameters/DestinationId"
        - $ref: "#/components/parameters/DeliveryStatus"
        - $ref: "#/components/parameters/EventUuid"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Until"
        - $ref: "#/components/parameters/DeliveryLimit"
        - $ref: "#/components/parameters/DeliveryOffset"
      responses:
        "200":
          description: Delivery attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryListResponse"
        "400":
          description: Unparseable `since`/`until` timestamp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Missing or invalid key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/AnalyticsNotConfigured"
  /client/v1/destinations/{id}/deliveries/{eventUuid}:
    get:
      summary: Delivery detail (sent payload + destination response)
      operationId: getDestinationDelivery
      description: >
        Fetch the full detail for one delivery — the request payload sent to the
        destination and the raw response it returned — for both successful and
        failed deliveries. The delivery-list rows are lean (metadata only); these
        heavy fields are fetched only on drill-down.


        Keyed by the source `event_uuid` from a list row. There is exactly one
        delivery record per (destination, event), upserted across retry attempts
        (`attempt_count` reflects the latest attempt); the per-attempt stream is
        in the delivery list. `request_body` is returned as a parsed object when
        it is JSON. Bodies are truncated to 8 KB and the row is retained for 30
        days. Secret-bearing request headers are redacted at capture time; for
        webhook rows, `request_body`/`request_headers` are additionally redacted
        to `***` for read-only (`sk_`) keys. HIPAA-enabled locations do not store
        request/response bodies — those fields are `null`, though `fbtrace_id`,
        `response_status`, and `error` remain.


        Test fires (`POST /{id}/test`) are not persisted, so this endpoint
        returns `404 not_found` for a synthetic `test-…` event — expected, not a
        bug.
      parameters:
        - $ref: "#/components/parameters/DestinationId"
        - name: eventUuid
          in: path
          required: true
          description: The `event_uuid` of the source event, taken from a delivery-list row.
          schema:
            type: string
      responses:
        "200":
          description: Delivery detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/DeliveryDetail"
        "401":
          description: Missing or invalid key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >
            Destination not found, or no delivery for this event — including
            synthetic `test-…` events from `POST /{id}/test`, which are not
            persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /client/v1/destinations/{id}/test:
    post:
      summary: Test a destination
      operationId: testDestination
      description: >
        Send a test delivery through the real ad-platform adapter using the
        stored credential. Requires an agency (`ak_`) key. Supported only for
        ad destinations (`meta_capi`, `google_ads`, `google_analytics`) —
        webhooks fire on real events and return `400`.
      parameters:
        - $ref: "#/components/parameters/DestinationId"
      responses:
        "200":
          description: Test result from the destination adapter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestResponse"
        "400":
          description: Destination type does not support testing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Operation requires an agency (`ak_`) key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Destination not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Test delivery failed or the test service was unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Destination testing is not available in this environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >
        Client key as bearer token. Use an agency key (`Bearer ak_...`) for
        read-write access or a location secret key (`Bearer sk_...`) for
        read-only access.
    AgencyKeyQuery:
      type: apiKey
      in: query
      name: ak
      description: Agency key as a query parameter. Prefer the `Authorization` header.
    SecretKeyQuery:
      type: apiKey
      in: query
      name: sk
      description: Secret key as a query parameter. Prefer the `Authorization` header.
  parameters:
    DestinationId:
      name: id
      in: path
      required: true
      description: Destination (action) identifier.
      schema:
        type: string
        format: uuid
    CredentialType:
      name: type
      in: path
      required: true
      description: Credential-backed destination type.
      schema:
        type: string
        enum: [meta_capi, google_ads, google_analytics]
    ActionIdQuery:
      name: action_id
      in: query
      description: Filter to a single destination id.
      required: false
      schema:
        type: string
        format: uuid
    DeliveryStatus:
      name: status
      in: query
      description: Filter by delivery status.
      required: false
      schema:
        type: string
        enum: [success, failed, retrying, skipped, test]
    EventUuid:
      name: event_uuid
      in: query
      description: >
        Filter to deliveries triggered by a source event. Accepts a single
        event uuid, or a comma-separated list (up to 200) to resolve delivery
        status for a whole batch of events in one request — see the endpoint
        description for the profile activity-stream use case. Each value matches
        the `uuid` field on an event returned by the activity endpoints.
      required: false
      schema:
        type: string
    Since:
      name: since
      in: query
      description: >
        Lower time bound. ISO 8601 or `YYYY-MM-DD HH:MM:SS`. Defaults to 7 days
        ago when omitted.
      required: false
      schema:
        type: string
        format: date-time
    Until:
      name: until
      in: query
      description: Upper time bound. ISO 8601 or `YYYY-MM-DD HH:MM:SS`.
      required: false
      schema:
        type: string
        format: date-time
    DeliveryLimit:
      name: limit
      in: query
      description: Maximum rows. Default `50`, min `1`, max `500`.
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 500
    DeliveryOffset:
      name: offset
      in: query
      description: Rows to skip. Default `0`.
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
  responses:
    RateLimited:
      description: >
        Rate limit exceeded (120 requests per 10s per location). A
        `Retry-After` header indicates when to retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UpstreamError:
      description: Upstream data store returned an error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AnalyticsNotConfigured:
      description: Analytics service is not configured in this environment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    TriggerRules:
      type: object
      description: >
        Conditions that gate whether a destination fires for a given event.
        For server-side delivery, the only rule type that filters on the event
        name is `mythic_event` (with an `eventName` and an `operator`). Unknown
        types are rejected with `400 invalid_config`. See the "Trigger rules"
        section of the overview for the full field-by-field contract and how
        this interacts with `event_mapping`.
      required:
        - rules
      properties:
        operator:
          type: string
          enum: [AND, OR]
          description: How to combine `rules`. Defaults to `AND` when omitted.
        rules:
          type: array
          minItems: 1
          description: >
            Non-empty array of rules. Each rule requires a `type` from the
            allowed set (`mythic_event`, `event_property`, `url_pattern`,
            `javascript_variable`, `device`, `query_param`, `cookie`, `time`,
            `custom_js`). Only `mythic_event` and `event_property` are evaluated
            server-side; the rest are client-side hints that pass server-side.
          items:
            type: object
            required:
              - type
            properties:
              type:
                type: string
                enum:
                  - mythic_event
                  - event_property
                  - url_pattern
                  - javascript_variable
                  - device
                  - query_param
                  - cookie
                  - time
                  - custom_js
                description: Rule type. Use `mythic_event` to fire on an event name.
              eventName:
                type: string
                description: >
                  Required when `type` is `mythic_event`. The source event name
                  to match, e.g. `$pageview` or `purchase`.
              operator:
                type: string
                description: >
                  Required for `mythic_event` — use `equals` (or `not_equals`)
                  to match on the event name, or a `property_*` operator to also
                  match an event `property`. Required for `event_property` too.
                example: equals
              property:
                type: string
                description: >
                  Event property path for `event_property` rules, or for a
                  `mythic_event` rule using a `property_*` operator.
              value:
                description: Comparison value for property operators.
          example:
            - type: mythic_event
              eventName: purchase
              operator: equals
    WebhookConfig:
      type: object
      description: "`action_config` for `action_type: webhook`."
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: >
            Fetchable http(s) endpoint. HIPAA-enabled locations require
            `https://`.
          example: https://hooks.example.com/mythic
        method:
          type: string
          example: POST
        headers:
          type: object
          additionalProperties:
            type: string
          description: Request headers. May carry a bearer token; redacted for viewer keys.
        body_template:
          type: string
          description: Request body template. Redacted for viewer keys.
        timeout_ms:
          type: number
          description: Request timeout in milliseconds. Must be positive.
        retry_count:
          type: number
          description: >
            Retry attempts on failure. Must be non-negative. Total BullMQ
            attempts are `retry_count + 1` (default 3).
        enrichment:
          type: object
          description: >
            Merged-profile enrichment, used to fill `{{profile.x}}` tokens in
            `body_template`. On by default — webhooks share the ad destinations'
            delivery pipeline. The former `full_profile` opt-in is ignored.
          properties:
            enabled:
              type: boolean
              default: true
              description: >
                Set false to skip the profile lookup. `{{profile.x}}` tokens are
                then left verbatim rather than blanked.
            attribution_model:
              type: string
              enum: [last_touch, first_touch]
              default: last_touch
    MetaCapiConfig:
      type: object
      description: "`action_config` for `action_type: meta_capi`."
      required:
        - pixel_id
        - event_mapping
      properties:
        pixel_id:
          type: string
          example: "1234567890"
        event_mapping:
          type: object
          description: >
            Maps a source event name to a Meta event name (non-empty string).
            At least one mapping is required.
          additionalProperties:
            type: string
          example:
            purchase: Purchase
            signup: CompleteRegistration
        test_event_code:
          type: string
          description: Meta test event code for the Events Manager test tab.
        action_source:
          type: string
          example: website
        credential_name:
          type: string
          description: Named credential to use. Defaults to `default`.
        default_country_code:
          type: string
          description: >
            Calling code (digits, no `+`) used to expand national phone numbers
            to their country-coded form before hashing — e.g. `1` turns
            `5125550123` into `15125550123`, the form Meta matches against.
            Without it both forms are sent and Meta matches whichever it holds.
          example: "1"
        fbc_subdomain_index:
          type: integer
          description: >
            Subdomain index used only when an `fbc` has to be built from a bare
            `fbclid` (no `_fbc` cookie was observed). Defaults to `1`, which is
            correct for an ordinary `example.com` domain; set `2` for a deeper
            cookie domain such as `example.co.uk`.
          default: 1
        enrichment:
          type: object
          description: Optional enrichment configuration.
    GoogleAdsConfig:
      type: object
      description: "`action_config` for `action_type: google_ads`."
      required:
        - customer_id
        - event_mapping
      properties:
        customer_id:
          type: string
          pattern: "^\\d{10}$"
          description: >
            Google Ads customer id — 10 digits, no dashes. Sent as the Data
            Manager `operatingAccount`.
          example: "1234567890"
        event_mapping:
          type: object
          description: >
            Maps a source event name to a conversion spec. At least one mapping
            is required.
          additionalProperties:
            type: object
            required:
              - conversion_action
            properties:
              conversion_action:
                type: string
                description: >
                  Conversion action **id** (digits only), sent as the Data
                  Manager `productDestinationId`. Not a resource name — do not
                  pass `customers/.../conversionActions/...`. The action must be
                  of type `UPLOAD_CLICKS` or `WEBPAGE`.
                example: "987654321"
              value_property:
                type: string
                description: Event property to read the conversion value from.
              default_value:
                type: number
                description: Fallback conversion value.
              currency:
                type: string
                description: 3-letter currency code.
                example: USD
          example:
            purchase:
              conversion_action: "987654321"
              value_property: revenue
              currency: USD
        enhanced_conversions_for_leads:
          type: boolean
          description: >
            Allow upload of events that have no `gclid`/`gbraid`/`wbraid`,
            matching on hashed user identifiers instead. Hashed identifiers are
            always attached when available, including alongside a click id;
            this flag only governs click-id-less uploads.
        event_source:
          type: string
          enum: [WEB, APP, IN_STORE, PHONE, MESSAGE, OTHER]
          default: WEB
          description: Data Manager `eventSource` for the conversion.
        default_country_code:
          type: string
          description: >
            Country calling code used to build E.164 phone numbers from
            national-format numbers. Google requires E.164; without this a
            10-digit number is dropped from the identifiers rather than hashed
            into a guaranteed non-match.
          example: "1"
        consent:
          type: object
          description: DMA consent signals passed to Google Ads.
          properties:
            ad_user_data:
              type: string
              enum: [GRANTED, DENIED]
            ad_personalization:
              type: string
              enum: [GRANTED, DENIED]
        cart_data:
          $ref: '#/components/schemas/CartDataConfig'
        user_properties:
          $ref: '#/components/schemas/UserPropertiesConfig'
        event_parameters:
          type: object
          additionalProperties:
            type: string
          description: >
            GA4-style event parameters, as `parameterName -> event property
            path`. Values are stringified.
        custom_variables:
          type: object
          additionalProperties:
            type: string
          description: >
            Google Ads conversion custom variables, as `variableName -> event
            property path`. A variable that does not exist on the destination is
            ignored by Google rather than rejected.
        conversion_count_property:
          type: string
          description: >
            Event property holding the conversion quantity, for counting-based
            conversions. Distinct from the monetary value.
        last_updated_property:
          type: string
          description: >
            Event property holding a restatement timestamp (epoch ms or a
            parseable date). Send it when re-uploading a conversion under the
            same `transactionId` after a refund or a price change — without it
            Google cannot distinguish an update from a duplicate and keeps the
            original value. An unparseable value is dropped rather than sent,
            because one bad optional field fails the whole request.
        event_location:
          type: object
          description: Where the event happened. Required for Store Sales.
          properties:
            store_id:
              type: string
            store_id_property:
              type: string
              description: Event property holding the store id.
    CartDataConfig:
      type: object
      description: >
        Line items behind the conversion. Feeds Merchant Center / Shopping
        signals on Google Ads, and is required for most GA4 ecommerce events.
      properties:
        items_property:
          type: string
          description: >
            Dot-path to the array of items in the event's properties. Required
            when `item_mapping` or `item_parameters` is set — without it there
            is nothing to map and the rest of the config is inert.
          example: products
        item_mapping:
          type: object
          description: >
            Maps a Data Manager item field to a key within each item object. The
            key set is closed; an unknown field is rejected at write time,
            because at runtime it would simply never match and the item would
            ship without (say) its price while Google returned 200.
          additionalProperties:
            type: string
          properties:
            itemId:
              type: string
            merchantProductId:
              type: string
            quantity:
              type: string
            unitPrice:
              type: string
            conversionValue:
              type: string
          example:
            itemId: sku
            unitPrice: price
            quantity: qty
        item_parameters:
          type: object
          additionalProperties:
            type: string
          description: >
            Per-item GA4 parameters, as `parameterName -> key within the item`.
          example:
            item_name: name
        merchant_id:
          type: string
        merchant_feed_label:
          type: string
        merchant_feed_language_code:
          type: string
        transaction_discount_property:
          type: string
        coupon_property:
          type: string
          description: >
            Event property holding a coupon code (or an array of them). Only the
            first is sent — Google Analytics ignores additional coupon codes.
    UserPropertiesConfig:
      type: object
      description: >
        The advertiser's own assessment of the customer. `customerType` is what
        Google Ads' new-customer acquisition goal bids against, and most
        tag-based integrations cannot supply it at all — the browser does not
        know whether this person has bought before.
      properties:
        customer_type_property:
          type: string
          description: >
            Event property holding the customer lifecycle stage. This is the
            authoritative source: your commerce platform knows the order count.
            Common spellings (`new_customer`, `repeat`, `lapsed`, ...) are
            mapped onto Google's enum; an unrecognized value is dropped rather
            than guessed, since a wrong value actively misdirects bidding.
        customer_type:
          type: string
          enum: [NEW, RETURNING, REENGAGED]
          description: Static value, used when no property is configured.
        customer_value_bucket_property:
          type: string
        customer_value_bucket:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        derive_customer_type:
          type: boolean
          default: false
          description: >
            Opt-in fallback that infers `NEW`/`RETURNING` from the resolved
            person's session count when no property is configured. **Off by
            default, and deliberately so:** sessions are not purchases, so a
            shopper who browsed three times before their first order is reported
            `RETURNING`. That mislabels a genuinely new customer and suppresses
            the bid uplift the acquisition goal exists to apply. Reasonable for
            lead-gen, wrong for ecommerce — prefer `customer_type_property`.
        additional:
          type: object
          additionalProperties:
            type: string
          description: GA4 user properties, as `propertyName -> event property path`.
    GoogleAnalyticsConfig:
      type: object
      description: >
        `action_config` for `action_type: google_analytics` — GA4 events through
        the Data Manager API's `events:ingest`, the same endpoint and credential
        shape as `google_ads`. This is Google's official replacement for the
        Measurement Protocol: no API secret, and real error reporting instead of
        MP's silent `204`.
      required:
        - property_id
        - event_mapping
      properties:
        property_id:
          type: string
          pattern: "^\\d{6,}$"
          description: Numeric GA4 property id, sent as the `operatingAccount`.
          example: "123456789"
        measurement_id:
          type: string
          description: >
            Web stream measurement id, sent as `productDestinationId`. Set this
            **or** `firebase_app_id`, never both — a stream is web or app, and
            the adapter keys its `clientId`-vs-`appInstanceId` choice off which
            one is present.
          example: G-ABC1234567
        firebase_app_id:
          type: string
          description: App stream Firebase app id, sent as `productDestinationId`.
        event_mapping:
          type: object
          additionalProperties:
            type: string
          description: >
            Maps a source event name to a GA4 event name (a plain string, unlike
            `google_ads`' conversion-spec object). Names must start with a
            letter, contain only letters, digits and underscores, be at most 40
            characters, and avoid the reserved prefixes `ga_`, `google_`,
            `firebase_` and `_`. Invalid names are rejected here because GA4
            accepts them at ingest and drops the event during processing — the
            destination would look healthy while delivering nothing.
          example:
            order_completed: purchase
        batch:
          type: boolean
          default: false
          description: >
            Coalesce events into a single `events:ingest` request. Google's
            quota is **300 requests/min and 100,000/day per Cloud project** and
            we otherwise send one event per request — a hard ceiling of 5
            events/sec, which tagless GA4 (pageview-grade volume) exceeds
            immediately. A request accepts up to 2,000 events.
        batch_size:
          type: integer
          minimum: 2
          maximum: 2000
          default: 200
          description: >
            Events per request. Below Google's 2,000 cap on purpose: the win is
            escaping the requests/min ceiling, and a smaller batch keeps the
            fast-fail blast radius proportionate.
        batch_wait_ms:
          type: integer
          minimum: 0
          maximum: 30000
          default: 1000
          description: >
            How long the first event in a batch waits for company. The window
            starts with that first event, so worst-case added latency is this
            value — not this value per arrival.
        debug_mode:
          type: boolean
          default: false
          description: >
            Route events into GA4 DebugView. The only practical way to verify a
            tagless setup end to end, since there is no tag and no browser
            console. Leave off in production — debug events are excluded from
            reports.
        client_id_strategy:
          type: string
          enum: [auto, ga_cookie, mythic_device_id]
          default: auto
          description: >
            Which identifier becomes the GA4 client id. `auto` uses Google
            Analytics' own `_ga` cookie when the page has one and otherwise
            derives a stable value from Mythic's device id — this is what lets
            you send to GA4 with **no Google tag on the site at all**. The
            derivation is a pure function of the device id (never a clock read),
            so the same browser always produces the same client id; a value that
            drifted would turn one visitor into many while GA4 reported success
            throughout. `ga_cookie` uses only the cookie and skips events
            without one; `mythic_device_id` always derives.
        device_id_property:
          type: string
          description: >
            Event property holding the device id used by the derivation.
            Defaults to `$device_id`. Deliberately not `distinct_id`, which
            flips to the user id on identify() and would hand one browser a
            second client id mid-session.
        send_session_params:
          type: boolean
          default: true
          description: >
            Attach `session_id` and `session_number` event parameters. With no
            Google tag on the page nothing else assembles sessions, so without
            these GA4 treats every server event as its own session. Session ids
            are UUIDv7, so the session start time is read out of the id itself.
        send_campaign_params:
          type: boolean
          default: true
          description: >
            Emit a `campaign_details` event alongside the conversion, carrying
            source/medium/campaign/term/content resolved through the
            destination's attribution model. Without it a tagless event lands as
            `(direct)/(none)` — delivered, and useless for attribution. It rides
            in the same request one millisecond earlier (Google applies it to
            events at or after its own timestamp) and is invisible in GA4
            reports, so it does not inflate event counts.
        client_id_property:
          type: string
          description: >
            Event property holding the GA4 client id. Defaults to
            `$ga_client_id`, which the JavaScript SDK reads from Google
            Analytics' own `_ga` cookie. This is the only identifier that joins
            the event to a session GA already started; without it GA4 does not
            error, it attributes the event to a **new** user, inflating the
            property's user count and detaching the conversion from the traffic
            that produced it.
        app_instance_id_property:
          type: string
          description: >
            App-stream equivalent of the client id (defaults to
            `$app_instance_id`). When present it suppresses `clientId` — sending
            both double-counts the event.
        user_id_property:
          type: string
          description: >
            Your own user id (defaults to `$user_id`). The right identifier for
            a server-only conversion no browser ever saw, provided it is a value
            the GA4 property actually knows.
        use_canonical_user_id:
          type: boolean
          default: false
          description: >
            Fall back to Mythic's resolved canonical person id when no client
            id, app instance id or `user_id_property` is available. **Off by
            default:** that id is ours, not yours, so GA4 would record a User-ID
            that never appears client-side, splitting the visitor from their own
            browser sessions and filling User-ID reporting with values you
            cannot join to anything. Enable it only if you have no user id of
            your own and want reach over cleanliness.
        value_property:
          type: string
        currency:
          type: string
          example: USD
        send_user_data:
          type: boolean
          default: true
          description: >
            Attach hashed user identifiers (up to 10). GA4's `AddressInfo` also
            accepts `addressLine`, `city` and `administrativeArea`, which Google
            Ads ignores.
        event_source:
          type: string
          enum: [WEB, APP, IN_STORE, PHONE, MESSAGE, OTHER]
          description: Defaults to `APP` for a `firebase_app_id` stream, else `WEB`.
        default_country_code:
          type: string
          example: "1"
        consent:
          type: object
          properties:
            ad_user_data:
              type: string
              enum: [GRANTED, DENIED]
            ad_personalization:
              type: string
              enum: [GRANTED, DENIED]
        cart_data:
          $ref: '#/components/schemas/CartDataConfig'
        user_properties:
          $ref: '#/components/schemas/UserPropertiesConfig'
        event_parameters:
          type: object
          additionalProperties:
            type: string
        last_updated_property:
          type: string
        event_location:
          type: object
          properties:
            store_id:
              type: string
            store_id_property:
              type: string
    Destination:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_key:
          type: string
          description: The location id this destination belongs to.
        name:
          type: string
          example: Purchase → Meta
        action_type:
          type: string
          enum: [webhook, meta_capi, google_ads, google_analytics]
        trigger_rules:
          $ref: "#/components/schemas/TriggerRules"
        action_config:
          type: object
          description: >
            Type-specific configuration. See `WebhookConfig`, `MetaCapiConfig`,
            `GoogleAdsConfig`, and `GoogleAnalyticsConfig`. Webhook secrets are
            redacted for viewer keys.
        enabled:
          type: boolean
        rate_limit_max:
          type: integer
          nullable: true
        rate_limit_window_seconds:
          type: integer
          nullable: true
        trigger_count:
          type: integer
        last_triggered_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateDestinationRequest:
      type: object
      required:
        - name
        - action_type
        - trigger_rules
        - action_config
      properties:
        name:
          type: string
          minLength: 1
          description: Human-readable destination name.
          example: Purchase → Meta
        action_type:
          type: string
          enum: [webhook, meta_capi, google_ads, google_analytics]
        trigger_rules:
          $ref: "#/components/schemas/TriggerRules"
        action_config:
          oneOf:
            - $ref: "#/components/schemas/WebhookConfig"
            - $ref: "#/components/schemas/MetaCapiConfig"
            - $ref: "#/components/schemas/GoogleAdsConfig"
            - $ref: "#/components/schemas/GoogleAnalyticsConfig"
        enabled:
          type: boolean
          default: true
        rate_limit_max:
          type: number
          description: >
            Per-destination rate cap. Must be positive. Deliveries beyond the cap
            within the window are dropped (logged as status `skipped`,
            `rate_limited`). Defaults to 10000 when omitted.
          default: 10000
        rate_limit_window_seconds:
          type: number
          description: Rate-limit window in seconds. Must be positive. Defaults to 3600 (1 hour).
          default: 3600
    UpdateDestinationRequest:
      type: object
      description: Partial update — only include fields you want to change. `action_type` cannot be changed.
      properties:
        name:
          type: string
          minLength: 1
        enabled:
          type: boolean
        trigger_rules:
          $ref: "#/components/schemas/TriggerRules"
        action_config:
          type: object
          description: Fully replaces the stored config; re-validated against the existing type.
        rate_limit_max:
          type: number
        rate_limit_window_seconds:
          type: number
    UpsertCredentialRequest:
      type: object
      required:
        - credential_value
      properties:
        credential_value:
          type: string
          description: >
            Secret value, max 8KB. For `google_ads` and `google_analytics` this
            must be a JSON object string containing `client_id`,
            `client_secret`, and `refresh_token` (plus an optional
            `login_customer_id` for Ads manager-account access; GA4 ignores it).
            The refresh token must carry the
            `https://www.googleapis.com/auth/datamanager` OAuth scope.
        credential_name:
          type: string
          default: default
          description: Name for this credential. Defaults to `default`.
    Credential:
      type: object
      properties:
        id:
          type: string
          format: uuid
        destination_type:
          type: string
          enum: [meta_capi, google_ads, google_analytics]
        credential_name:
          type: string
          example: default
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Delivery:
      type: object
      properties:
        ts:
          type: string
          format: date-time
          description: When the delivery attempt occurred.
        action_id:
          type: string
          format: uuid
        action_name:
          type: string
        destination_type:
          type: string
          enum: [webhook, meta_capi, google_ads, google_analytics]
        event_name:
          type: string
          description: Source event name that triggered the delivery.
        event_uuid:
          type: string
        destination_event_name:
          type: string
          description: Mapped event name sent to the destination.
        status:
          type: string
          enum: [success, failed, retrying, skipped, test]
        attempt:
          type: integer
        max_attempts:
          type: integer
        response_status:
          type: integer
          nullable: true
          description: HTTP status returned by the destination.
        error:
          type: string
          nullable: true
        duration_ms:
          type: number
          nullable: true
        queued_at:
          type: string
          format: date-time
          nullable: true
        enrichment_applied:
          type: boolean
    DeliveryDetail:
      type: object
      description: >
        One delivery record with its captured payloads. Returned by the delivery
        detail endpoint.
      properties:
        id:
          type: string
          format: uuid
        action_id:
          type: string
          format: uuid
        event_name:
          type: string
        event_uuid:
          type: string
        destination_type:
          type: string
          enum: [webhook, meta_capi, google_ads, google_analytics]
        destination_event_name:
          type: string
        status:
          type: string
          enum: [success, failed, skipped]
        attempt_count:
          type: integer
        max_attempts:
          type: integer
        response_status:
          type: integer
          nullable: true
        error:
          type: string
          nullable: true
        request_body:
          nullable: true
          description: >
            The payload sent to the destination (Meta CAPI event payload, Google
            Ads conversion, or the rendered webhook body). Parsed to an object
            when JSON. Captured on both successful and failed deliveries — `null`
            for HIPAA locations, and `"***"` for webhook rows read with a viewer
            (`sk_`) key.
        response_body:
          type: string
          nullable: true
          description: >
            Raw response returned by the destination (truncated to 8 KB).
            Captured on both successful and failed deliveries — `null` for HIPAA
            locations.
        request_headers:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: Redacted request headers (webhook only). `Authorization`/`Cookie` are `***`.
        response_headers:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: Redacted response headers.
        fbtrace_id:
          type: string
          nullable: true
          description: Meta trace id parsed from the response — what Meta support asks for. Retained even for HIPAA locations.
        enrichment_applied:
          type: boolean
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
    Health:
      type: object
      properties:
        action_id:
          type: string
          format: uuid
        name:
          type: string
        destination_type:
          type: string
          enum: [webhook, meta_capi, google_ads, google_analytics]
        enabled:
          type: boolean
        trigger_count:
          type: integer
        last_triggered_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
          nullable: true
        credential_ok:
          type: boolean
          nullable: true
          description: >
            `false` when the most recent failure was a 401/403 (credential
            problem), `true` otherwise, `null` when there are no deliveries in
            the window.
        total:
          type: integer
        successes:
          type: integer
        failures:
          type: integer
        skipped:
          type: integer
        success_rate:
          type: number
          nullable: true
        avg_duration_ms:
          type: number
          nullable: true
        p95_duration_ms:
          type: number
          nullable: true
        avg_queue_lag_ms:
          type: number
          nullable: true
        last_delivery_at:
          type: string
          format: date-time
          nullable: true
    DestinationResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/Destination"
    DestinationListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/Destination"
    CredentialResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/Credential"
    CredentialListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/Credential"
    DeliveryListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/Delivery"
        limit:
          type: integer
          example: 50
        offset:
          type: integer
          example: 0
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/Health"
    TestResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          description: Adapter-specific test result returned by the identity processor.
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: invalid_config
            message:
              type: string
              example: Destination configuration is invalid
            details:
              type: array
              description: Per-field validation failures.
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: action_config.url
                  message:
                    type: string
                    example: required for webhook (non-empty string)
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: unauthorized
            message:
              type: string
              example: Missing authorization
