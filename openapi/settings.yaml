openapi: "3.0.0"
info:
  version: 1.0.0
  title: Settings
  description: >-
    Per-location ingestion controls: the **origin allowlist** that bounds which
    sites may send events with a location's publishable key, and the
    **autocapture override** that controls server-side whether the SDK records
    clicks and form submissions, and the **heatmap-capture override** that turns
    click-position and scroll-depth collection on.


    Publishable keys (`pk_`) live in the browser and are public by design — they
    cannot be kept secret, so a copied snippet can send events from anywhere. The
    origin allowlist lets an agency restrict a location's browser ingestion to a
    known set of domains, so a snippet placed on the wrong site is dropped at the
    edge rather than polluting the location's data.
servers:
  - url: https://mythic-analytics.gulp.workers.dev/client/v1/settings
security:
  - BearerAuth: []
  - AgencyKeyQuery: []
  - SecretKeyQuery: []
paths:
  /allowed-origins:
    get:
      summary: Get the ingestion origin allowlist
      operationId: getAllowedOrigins
      description: >
        Return the location's current allowed origins. Readable with an agency
        key (`ak_`, pass `?location_id=`) or a viewer key (`sk_`). An empty array
        means enforcement is off — the location accepts events from any origin.
      responses:
        "200":
          description: The current allowlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowedOriginsResponse"
        "401":
          description: Authorization key missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Replace the ingestion origin allowlist
      operationId: putAllowedOrigins
      description: >
        Replace the location's allowed origins with the supplied list. Requires
        an agency key (`ak_`) and `?location_id=`; viewer keys get `403
        agency_required`.


        Each entry is normalized to a bare, lowercase hostname: full URLs,
        `host:port`, a leading `*.`, and trailing dots are all accepted and
        reduced to the host. Entries must be valid hostnames with at least one
        dot (so `localhost` or a bare label is rejected); up to 50 are allowed.
        Duplicates are removed. **Send an empty array to turn enforcement off.**


        Enforcement semantics once the list is non-empty:

        - Applies only to browser ingestion (`/e`). Server-side ingestion
          (`/ingest` with a Bearer key) is never restricted.
        - A bare domain **covers its subdomains**: `acme.com` matches `acme.com`
          and `app.acme.com`, but not `notacme.com` or `acme.com.evil.com`.
        - **Lenient on a missing origin**: a request that sends no `Origin` or
          `Referer` (server calls, `sendBeacon`, privacy tools) is allowed
          through. Only a *present* host that isn't covered is rejected
          (`403 origin not allowed` from `/e`).
        - `Origin`/`Referer` are spoofable by a non-browser client, so this stops
          casual snippet reuse, not a determined attacker. To disable a key
          entirely, deactivate the location.


        Changes take effect within about a minute (the edge config cache TTL).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllowedOriginsRequest"
      responses:
        "200":
          description: Updated — returns the normalized allowlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowedOriginsResponse"
        "400":
          description: Body isn't JSON, or `allowed_origins` is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Write access requires an agency key (`ak_`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /autocapture:
    get:
      summary: Get the autocapture override
      operationId: getAutocapture
      description: >
        Return the location's autocapture override plus the resulting effective
        behaviour. Readable with an agency key (`ak_`, pass `?location_id=`) or a
        viewer key (`sk_`).


        `autocapture` is the stored override and may be `null`, `false`, `true`,
        or an object. `null` means no override, so the SDK default applies —
        which is **enabled**, capturing links and form submissions. Because
        `null` and `false` mean opposite things, read `effective` when you want
        to know what the location is actually doing.
      responses:
        "200":
          description: The current override and its effective behaviour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutocaptureResponse"
        "401":
          description: Authorization key missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Set the autocapture override
      operationId: putAutocapture
      description: >
        Set the location's autocapture override. Requires an agency key (`ak_`)
        and `?location_id=`; viewer keys get `403 agency_required`.


        Accepted values for `autocapture`:

        - `false` — turn autocapture off for this location. This is the only
          server-side kill switch; it overrides whatever the site's own
          `init()` snippet asks for.
        - `true` — on with SDK defaults (`links` and `forms`).
        - `{ "elements": [...] }` — on, capturing only those element types.
          Valid values: `links`, `forms`, `buttons`, `inputs`, `selects`,
          `textareas`, `changes`. An empty array is rejected — send `false` to
          disable instead. Unknown names are rejected rather than ignored, so a
          typo cannot silently stop capture.
        - `null` — clear the override and fall back to the SDK default (on,
          links + forms).


        Note that `buttons` is **not** in the default set, so `<button>` clicks
        are not captured unless you ask for them. Sites whose calls to action are
        `<a>` elements styled as buttons are covered by `links`.


        The override is served to the SDK via the remote config endpoint and
        wins over the site's `init()` configuration. Browsers pick the change up
        on their next remote-config fetch; already-open pages keep their current
        behaviour until they reload.


        Two cases where the override does **not** apply: a site that sets
        `disable_remote_config: true` never fetches remote config, and HIPAA-mode
        locations always have autocapture off regardless of what is stored here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutocaptureRequest"
      responses:
        "200":
          description: Updated — returns the stored override
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutocaptureUpdateResponse"
        "400":
          description: Body isn't JSON, or `autocapture` is missing/invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Write access requires an agency key (`ak_`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /heatmaps:
    get:
      summary: Get the heatmap-capture override
      operationId: getHeatmapCapture
      description: >
        Return the location's heatmap-capture override plus whether capture is
        effectively on. Readable with an agency key (`ak_`, pass
        `?location_id=`) or a viewer key (`sk_`).


        Unlike `autocapture`, `null` here means **off**: heatmap capture is
        opt-in per location, so an unconfigured location captures nothing.
      responses:
        "200":
          description: The current override and whether capture is on
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatmapCaptureResponse"
        "401":
          description: Authorization key missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Set the heatmap-capture override
      operationId: putHeatmapCapture
      description: >
        Turn heatmap capture on or off for a location. Requires an agency key
        (`ak_`) and `?location_id=`; viewer keys get `403 agency_required`.


        Accepted values for `capture_heatmaps`:

        - `true` — capture click positions and scroll depth with SDK defaults.
        - `{ "flushIntervalMs": 5000, "maxBufferPoints": 200 }` — on, with those
          overrides. `flushIntervalMs` must be 1000–60000 and
          `maxBufferPoints` 10–1000; values outside the range are rejected
          rather than clamped, and unknown keys are rejected rather than
          ignored.
        - `false` / `null` — off. Both mean the same thing here.


        Capture adds one event per click and one per page-scroll, so this is off
        until asked for. The override is served to the SDK via remote config and
        wins over the site's `init()` configuration — which is the point: an
        agency can enable heatmaps on a client site whose install snippet it
        cannot edit. Browsers pick it up on their next remote-config fetch.


        Two cases where it does **not** apply: a site with
        `disable_remote_config: true` never fetches remote config, and
        HIPAA-mode locations never capture heatmaps regardless of what is stored.


        Turning capture on is not retroactive — there is no backfill of past
        traffic. Read the data with the [Heatmaps API](/heatmaps-api/overview).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeatmapCaptureRequest"
      responses:
        "200":
          description: Updated — returns the stored override
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatmapCaptureUpdateResponse"
        "400":
          description: Body isn't JSON, or `capture_heatmaps` is missing/invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Write access requires an agency key (`ak_`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contract-alerts:
    get:
      summary: Get the event-contract alert webhook
      operationId: getContractAlerts
      description: >
        Where the daily [event-contract](/contracts-api/overview) digest is
        delivered, and whether it is signed. Readable with an agency key (`ak_`,
        pass `?location_id=`) or a viewer key (`sk_`).


        The secret itself is never returned — only whether one is set.
      responses:
        "200":
          description: The current webhook configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractAlertsResponse"
        "401":
          description: Authorization key missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Set the event-contract alert webhook
      operationId: putContractAlerts
      description: >
        Turn the daily event-contract digest on or off for a location. Requires
        an agency key (`ak_`) and `?location_id=`; viewer keys get
        `403 agency_required`.


        One webhook **per location**, not per contract, and that is deliberate:
        the most common thing worth alerting about is a tracking outage, which
        breaks every contract on the location at once. Per-contract delivery
        would send thirty alerts for one cause.


        The sweep runs daily at ~08:00 UTC over the previous whole UTC day
        (closed, so late-arriving data has landed). It POSTs only when the
        alertable condition set **changes** — a violation that persists for a
        month is one alert, and the recovery is one more. Delivery must return
        2xx for that state to advance, so a failed POST is retried on the next
        day's sweep.


        Set `secret` (16+ characters) to have each POST carry an
        `X-Mythic-Signature` header: `sha256=` followed by the HMAC-SHA256 of the
        raw request body. Pass `webhook_url: null` to disable, which also clears
        the stored state so re-enabling later reports the current condition
        rather than staying silent about one that broke during the gap.


        Per-event volume thresholds are **not** set here — they live on the
        contract as `min_daily_events`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractAlertsRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractAlertsResponse"
        "400":
          description: >
            `invalid_webhook_url` (not a URL, or not `https://`) or
            `invalid_secret` (under 16 characters).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Write access requires an agency key (`ak_`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        Builder/client key as a bearer token. Agency key for read-write
        (`Bearer ak_...`) or viewer key for read-only (`Bearer sk_...`).
    AgencyKeyQuery:
      type: apiKey
      in: query
      name: ak
      description: "Agency key as a query parameter. Format: `ak_...`."
    SecretKeyQuery:
      type: apiKey
      in: query
      name: sk
      description: "Viewer (secret) key as a query parameter. Format: `sk_...`."
  schemas:
    AllowedOriginsRequest:
      type: object
      required:
        - allowed_origins
      properties:
        allowed_origins:
          type: array
          description: >-
            Bare hostnames to allow (subdomains included). Empty array turns
            enforcement off.
          items:
            type: string
          example:
            - acme.com
            - shop.acme.com
    AllowedOriginsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            allowed_origins:
              type: array
              items:
                type: string
              example:
                - acme.com
                - shop.acme.com
    AutocaptureRequest:
      type: object
      required:
        - autocapture
      properties:
        autocapture:
          description: >-
            `false` to disable, `true` for SDK defaults, an object to choose
            element types, or `null` to clear the override.
          # `nullable: true`, not a `type: "null"` branch — that is OpenAPI 3.1
          # syntax and this document is 3.0.0, where the only allowed `type`
          # values are the six JSON types. The 3.1 form fails schema validation
          # outright, which is what took the whole Settings spec down.
          nullable: true
          oneOf:
            - type: boolean
            - type: object
              properties:
                elements:
                  type: array
                  items:
                    type: string
                    enum: [links, forms, buttons, inputs, selects, textareas, changes]
              additionalProperties: false
          example:
            elements: [links, forms, buttons]
    AutocaptureResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            autocapture:
              description: The stored override; `null` means no override (SDK default applies).
              nullable: true
              example: null
            effective:
              type: object
              description: What the location actually does, with the default resolved.
              properties:
                enabled:
                  type: boolean
                  example: true
                elements:
                  type: array
                  items:
                    type: string
                  example: [links, forms]
            valid_elements:
              type: array
              items:
                type: string
              example: [links, forms, buttons, inputs, selects, textareas, changes]
    AutocaptureUpdateResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            autocapture:
              nullable: true
              example:
                elements: [links, forms, buttons]
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: invalid_allowed_origins
            message:
              type: string
              example: "invalid hostname: localhost"
    HeatmapCaptureResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            capture_heatmaps:
              nullable: true
              description: The stored override — `null`, `false`, `true`, or an options object.
              oneOf:
                - type: boolean
                - type: object
              example: true
            effective:
              type: object
              properties:
                enabled: { type: boolean, example: true }
    HeatmapCaptureRequest:
      type: object
      required:
        - capture_heatmaps
      properties:
        capture_heatmaps:
          nullable: true
          description: "`true`, `false`, `null`, or `{ flushIntervalMs, maxBufferPoints }`."
          oneOf:
            - type: boolean
            - type: object
              properties:
                flushIntervalMs: { type: integer, minimum: 1000, maximum: 60000, example: 5000 }
                maxBufferPoints: { type: integer, minimum: 10, maximum: 1000, example: 200 }
              additionalProperties: false
          example: true
    HeatmapCaptureUpdateResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            capture_heatmaps:
              nullable: true
              oneOf:
                - type: boolean
                - type: object
              example: true
    ContractAlertsRequest:
      type: object
      required:
        - webhook_url
      properties:
        webhook_url:
          type: string
          nullable: true
          description: >
            HTTPS endpoint for the daily digest, or `null` to disable. Plain
            `http://` is rejected — the payload names which of a client's events
            are broken, and a signature does not make plaintext private.
          example: https://hooks.example.com/mythic/contracts
        secret:
          type: string
          nullable: true
          minLength: 16
          description: >
            Shared secret for `X-Mythic-Signature`. Omit to leave the current
            secret untouched; pass `null` to send unsigned. Never returned by a
            GET.
    ContractAlertsResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            webhook_url: { type: string, nullable: true, example: "https://hooks.example.com/mythic/contracts" }
            signed:
              type: boolean
              description: Whether a signing secret is stored. The secret itself is never returned.
              example: true
            enabled: { type: boolean, example: true }
            last_sent_at:
              type: string
              format: date-time
              nullable: true
              description: When a digest was last delivered successfully.
            schedule: { type: string, example: "daily, ~08:00 UTC, for the previous whole UTC day" }
