openapi: "3.0.0"
info:
  version: 1.0.0
  title: Event Contracts
  description: >
    Declared per-event property schemas, and the report of what live traffic does
    about them. A contract names the properties an event is supposed to carry,
    their JSON types, and which are required; `GET /violations` diffs that
    declaration against real events and reports the share that are absent, null,
    or the wrong type.


    Read-only enforcement: nothing on this surface rejects, quarantines, or drops
    an event. Reads accept an agency key (`ak_`, bind a location with
    `location_id` or the `X-Location-Id` header) or a location secret key
    (`sk_`); writes require an agency key.
servers:
  - url: https://mythic-analytics.gulp.workers.dev
security:
  - BearerAuth: []
  - AgencyKeyQuery: []
  - SecretKeyQuery: []
paths:
  /client/v1/contracts:
    get:
      summary: List stored contracts
      operationId: listEventContracts
      description: Every event contract stored for this location, ordered by event name.
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Stored contracts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/StoredContract" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: Create or replace one event's contract
      operationId: putEventContract
      description: >
        Upserts the contract for one event name. **Replaces** the property set:
        a key omitted from `properties` stops being checked. Merge is not offered
        because it has no way to express "stop requiring this field".


        A bare type string is shorthand for `{ "type": <t>, "required": true }`.
        Required is the default because a contract whose every property is
        optional cannot fail, and is indistinguishable from no contract at all.


        `min_daily_events` follows the same replace rule: omit it and the volume
        check is off.


        Agency key (`ak_`) required.
      parameters:
        - $ref: "#/components/parameters/LocationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, properties]
              properties:
                event:
                  type: string
                  maxLength: 200
                  description: Event name the contract applies to.
                  example: order_completed
                properties:
                  type: object
                  minProperties: 1
                  maxProperties: 200
                  description: >
                    Map of property key to type. Value is either a type string
                    (required) or `{ type, required }`. Keys cannot be empty.
                  additionalProperties:
                    oneOf:
                      - type: string
                        enum: [string, number, boolean, object, array]
                      - $ref: "#/components/schemas/PropertySpec"
                  example:
                    value: number
                    currency: string
                    coupon_code: { type: string, required: false }
                note:
                  type: string
                  maxLength: 500
                  nullable: true
                  description: Free text — where the contract came from. Echoed back on read.
                  example: Checkout v3 — value is gross, pre-refund
                min_daily_events:
                  $ref: "#/components/schemas/MinDailyEvents"
      responses:
        "200":
          description: Contract stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/StoredContract" }
        "400":
          description: >
            `invalid_json`, or `invalid_contract` with the specific problem —
            unknown type, empty property key, empty property set, non-boolean
            `required`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AgencyRequired" }
  /client/v1/contracts/{event}:
    delete:
      summary: Delete an event's contract
      operationId: deleteEventContract
      description: Removes the contract. The event keeps flowing — only the check goes away. Agency key (`ak_`) required.
      parameters:
        - name: event
          in: path
          required: true
          description: Event name whose contract should be deleted.
          schema: { type: string }
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Deleted (idempotent — deleting an absent contract also succeeds)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      event: { type: string, example: order_completed }
                      deleted: { type: boolean, example: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AgencyRequired" }
  /client/v1/contracts/violations:
    get:
      summary: Check stored contracts against live traffic
      operationId: getContractViolations
      description: >
        Diffs every stored contract (or one, with `event`) against the events in
        the window and returns the violations, worst first.


        Three violation kinds, kept separate because they have three different
        fixes: `missing_required` (key absent), `null_value` (key present but
        null), `type_mismatch` (key present with a type other than the declared
        one). Keys observed but not declared are reported under `undeclared` and
        are never violations — a growing integration always has some.


        A contract whose event had no traffic returns `status: "no_data"` with no
        violations and is counted in `summary.events_no_data`. An event that
        stopped firing must not read as "every field is missing". `no_data`
        always carries a `no_data_reason` telling you which of its three causes
        applies — a tracking outage, this event alone not firing, or sampling —
        because the fix is different for each. See the `EventReport` schema.


        Every violation carries a `samples` link to
        `GET /client/v1/contracts/violations`'s companion endpoint
        `/client/v1/contracts/samples`, pre-filled with this window: the actual
        offending events, with `session_id` and page URL.


        Cost note: this reads raw events to get the denominator. The window
        defaults to **1 day**; pass `event` to narrow it, and `sample` for wide
        windows on high-volume events.
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - name: event
          in: query
          required: false
          description: Check only this event's contract. Substantially cheaper than checking all.
          schema: { type: string }
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Sample"
      responses:
        "200":
          description: >
            The report. `truncated: true` means the underlying property
            statistics hit their row limit — narrow the window or pass `event`
            before trusting `absent` counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      window: { $ref: "#/components/schemas/Window" }
                      summary:
                        type: object
                        properties:
                          contracts: { type: integer, example: 3 }
                          events_ok: { type: integer, example: 1 }
                          events_with_violations: { type: integer, example: 1 }
                          events_no_data:
                            type: integer
                            example: 1
                            description: Contracted events with no traffic in the window — usually the bigger problem.
                          total_violations: { type: integer, example: 2 }
                          reference:
                            type: object
                            description: >
                              Unsampled event counts for the same window from a
                              separate pre-aggregated source. Present unless that
                              read failed.
                            properties:
                              location_events:
                                type: integer
                                example: 41320
                                description: All events of any name this location sent in the window.
                              source: { type: string, example: client_event_summary (unsampled) }
                              warning:
                                type: string
                                description: >
                                  Present only when `location_events` is 0 — the
                                  location sent nothing at all, so every `no_data`
                                  below is that outage rather than a contract problem.
                      events:
                        type: array
                        items: { $ref: "#/components/schemas/EventReport" }
                      truncated: { type: boolean }
                      warning: { type: string }
                      hint:
                        type: string
                        description: Present when no contracts are stored — points at `/suggest`.
        "400":
          description: >
            `invalid_window` (unparseable `date_from`/`date_to`, or `sample` out
            of range), or `window_too_large` when the window holds more events
            than can be scanned — narrow it, pass `event`, or add `sample`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /client/v1/contracts/samples:
    get:
      summary: Show the events behind one violation
      operationId: getContractViolationSamples
      description: >
        The drill-down for a single violation. `/violations` tells you `value`
        is absent on 4,102 of 10,000 `order_completed`; this returns the most
        recent events that are actually missing it, with `session_id` and page
        URL, so you can see which template or campaign is responsible.


        Every violation in the `/violations` response carries a ready-to-call
        `samples` link with the right parameters already filled in — you rarely
        need to build this URL by hand.


        Deliberately **never sampled**: sampling a search for rare events
        returns a confident empty result. It stays cheap by reading newest-first
        and stopping once it has `limit` rows, so the volume of the event name
        barely matters *when matches exist*. The one slow case is a violation
        with no matching events at all — proving that requires reading every
        event of that name — which returns `window_too_large`.
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - name: event
          in: query
          required: true
          description: Event name the violation is on.
          schema: { type: string }
          example: order_completed
        - name: key
          in: query
          required: true
          description: The violating property key.
          schema: { type: string }
          example: value
        - name: kind
          in: query
          required: false
          description: >
            Which violation to find examples of. `type_mismatch` reads the
            expected type from the stored contract — it cannot be supplied as a
            parameter, so you cannot "find" mismatches against a type you never
            declared.
          schema:
            type: string
            enum: [missing_required, null_value, type_mismatch]
            default: missing_required
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 5 }
      responses:
        "200":
          description: >
            Matching events, most recent first. An empty `samples` array with a
            `note` means this window contained none — the violation counts come
            from the report's window, which may be wider.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      event: { type: string, example: order_completed }
                      key: { type: string, example: value }
                      kind: { type: string, example: missing_required }
                      expected_type:
                        type: string
                        description: Present only for `kind=type_mismatch`; read from the stored contract.
                      window: { $ref: "#/components/schemas/Window" }
                      samples:
                        type: array
                        items:
                          type: object
                          properties:
                            event_id: { type: string, example: 018f2c1a-7b3e-7c9d-a1b2-c3d4e5f60718 }
                            session_id:
                              type: string
                              example: sess_9f2c1a7b
                              description: Use with session replay — "show me the recording where the field went missing".
                            distinct_id: { type: string }
                            timestamp: { type: string, format: date-time }
                            url:
                              type: string
                              example: https://shop.example.com/checkout/thank-you
                              description: The event's `$current_url`, empty when the event did not carry one.
                            observed_type:
                              type: string
                              enum: [absent, string, number, boolean, object, array, "null"]
                            value_sample:
                              type: string
                              description: >
                                The raw property value, truncated to 200
                                characters. Empty for `missing_required`, where
                                there is nothing to show. Properties are
                                PII-masked at ingestion, but this is still raw
                                customer data.
                      note:
                        type: string
                        description: Present only when `samples` is empty.
        "400":
          description: >
            `missing_event`, `missing_key`, `invalid_kind`, `invalid_limit`,
            `invalid_window`, or `window_too_large`. The last one usually means
            there are no matching events in the window — confirm the violation
            still has a non-zero count in `/violations`, and if so **widen** the
            window rather than narrowing it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`not_contracted` — `kind=type_mismatch` on a key the contract does not declare, so there is no expected type to check against."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /client/v1/contracts/suggest:
    get:
      summary: Scaffold a contract from live traffic
      operationId: suggestEventContract
      description: >
        Infers a contract for one event from the window. The response body is
        `PUT`-able to `/client/v1/contracts` as-is.


        Rules: type is the dominant observed JSON type; `required` is true when
        the key is present on at least 99% of events in the window; internal
        `$`-prefixed properties are excluded unless `include_internal=1`; keys
        that are always null or under 1% coverage are returned in `skipped` with
        a reason, so a dead field does not look like a missing one.


        Review `required` before storing — inference from one window is a
        starting point, not a decision.
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - name: event
          in: query
          required: true
          description: Event to infer a contract for.
          schema: { type: string }
          example: order_completed
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Sample"
        - name: include_internal
          in: query
          required: false
          description: Set to `1` to include Mythic's own `$`-prefixed properties.
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: A suggested contract
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      event: { type: string, example: order_completed }
                      properties:
                        type: object
                        additionalProperties: { $ref: "#/components/schemas/PropertySpec" }
                      based_on:
                        type: object
                        properties:
                          total_events: { type: integer, example: 1000 }
                          window: { $ref: "#/components/schemas/Window" }
                      skipped:
                        type: array
                        description: Keys left out, and why.
                        items:
                          type: object
                          properties:
                            key: { type: string, example: legacy_flag }
                            coverage: { type: number, nullable: true, example: 0.04 }
                            reason:
                              type: string
                              enum: [always_null, below_min_coverage]
                      note: { type: string }
        "400":
          description: "`missing_event`, `invalid_window`, or `window_too_large`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`no_data` — no events of that name in the window, so there is nothing to infer from."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/contracts/alert-sweep:
    post:
      summary: Trigger contract alert sweep
      operationId: triggerContractAlertSweep
      description: >
        Manually trigger the daily event-contract alert sweep — the same logic
        that runs automatically at ~08:00 UTC. For each location that has a
        contract-alert webhook configured (see
        `PUT /client/v1/settings/contract-alerts`), the sweep runs contract
        reports, builds webhook payloads, and POSTs them only when the
        alertable condition set has changed since the last delivery.


        Pass `?dry_run=1` to compute everything and POST nothing — the response
        carries the exact payload each location would receive, plus whether it
        would be sent. This is the only way to inspect real payloads without
        waiting for the 08:00 UTC cron.


        Requires an admin key.
      security:
        - AdminKey: []
        - AdminKeyQuery: []
      parameters:
        - name: dry_run
          in: query
          required: false
          description: >-
            Pass `1` to compute all payloads without delivering any webhook.
            Returns the full `results` array. Any other value is treated as
            live mode.
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: >-
            Sweep completed. In live mode, returns aggregate counts. In
            dry-run mode (`?dry_run=1`), also returns a per-location
            `results` array with the payloads that would be sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  locations:
                    type: integer
                    description: Total locations with a contract-alert webhook configured.
                    example: 12
                  sent:
                    type: integer
                    description: >-
                      Locations that received a new webhook delivery this sweep
                      (always `0` in dry-run mode).
                    example: 2
                  dry_run:
                    type: boolean
                    description: Present only when `?dry_run=1` was passed.
                    example: true
                  results:
                    type: array
                    description: >-
                      Per-location outcomes. Present only in dry-run mode
                      (`?dry_run=1`). In live mode, delivery results are not
                      reported — the aggregate `sent` count is the summary.
                    items:
                      type: object
                      properties:
                        location_id:
                          type: string
                        skipped:
                          type: string
                          nullable: true
                          description: >-
                            Why this location was skipped. One of
                            `no_contracts`, `truncated`, or `error`.
                            Present only when the location was skipped.
                        error:
                          type: string
                          nullable: true
                          description: Error message, present when `skipped` is `error`.
                        kind:
                          type: string
                          nullable: true
                          enum: [clean, contract_violations, tracking_outage]
                          description: >-
                            The alertable condition category. Present only
                            when the location was not skipped.
                        fingerprint:
                          type: string
                          nullable: true
                          description: >-
                            Hash of the alertable condition set, used for
                            change detection (de-duplication latch).
                        changed:
                          type: boolean
                          nullable: true
                          description: >-
                            Whether the condition changed since the last
                            delivery. `false` means no new alert is warranted.
                        sent:
                          type: boolean
                          nullable: true
                          description: >-
                            Whether a webhook was delivered. Always `false`
                            in dry-run mode.
                        would_send:
                          type: boolean
                          nullable: true
                          description: >-
                            Whether the webhook WOULD be sent. Present only in
                            dry-run mode, and only when `changed` is true.
                        signed:
                          type: boolean
                          nullable: true
                          description: >-
                            Whether the webhook payload would carry an
                            `X-Mythic-Signature` header. Present only in
                            dry-run mode when `would_send` is true.
                        webhook_url:
                          type: string
                          nullable: true
                          description: >-
                            The webhook URL that would receive the payload.
                            Present only in dry-run mode when `would_send` is
                            true.
                        reason:
                          type: string
                          nullable: true
                          description: >-
                            Human-readable explanation of why no delivery
                            occurred. Present only when `changed` is false.
                        payload:
                          type: object
                          nullable: true
                          description: >-
                            The full webhook payload object that would be
                            POSTed. Present only in dry-run mode.
                          properties:
                            type:
                              type: string
                              description: >-
                                One of `contracts.contract_violations`,
                                `contracts.tracking_outage`, or
                                `contracts.recovered`.
                            location_id:
                              type: string
                            date:
                              type: string
                              description: The UTC day the report covers (YYYY-MM-DD).
                            contracts_affected:
                              type: integer
                            events:
                              type: array
                              description: >-
                                One object per alertable event. Empty for
                                `tracking_outage`.
                              items:
                                type: object
                                properties:
                                  event:
                                    type: string
                                  status:
                                    type: string
                                    enum: [no_data, violations]
                                  no_data_reason:
                                    type: string
                                    nullable: true
                                  detail:
                                    type: string
                                    nullable: true
                                  total_events:
                                    type: integer
                                    nullable: true
                                  reference_events:
                                    type: integer
                                    nullable: true
                                  violations:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        key:
                                          type: string
                                          nullable: true
                                        kind:
                                          type: string
                                          enum: [missing_required, null_value, type_mismatch, low_volume]
                                        count:
                                          type: integer
                                        rate:
                                          type: number
                            report:
                              type: string
                              description: URL to the violations report for this date.
                            checked_at:
                              type: string
                              format: date-time
        "401":
          description: Admin key missing or invalid
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        "500":
          description: Uncaught error during the sweep
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Contract alert sweep failed: ..."
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Agency key (`ak_`) or location secret key (`sk_`).
    AgencyKeyQuery:
      type: apiKey
      in: query
      name: ak
    SecretKeyQuery:
      type: apiKey
      in: query
      name: sk
    AdminKey:
      type: http
      scheme: bearer
      description: "Admin API key as bearer token. Format: `Bearer YOUR_ADMIN_KEY`."
    AdminKeyQuery:
      type: apiKey
      in: query
      name: admin_key
      description: Alternative to the Authorization header for the admin key.
  parameters:
    LocationId:
      name: location_id
      in: query
      required: false
      description: Location to scope to. Required for `ak_` keys (or send the `X-Location-Id` header); ignored for `sk_`.
      schema: { type: string }
    DateFrom:
      name: date_from
      in: query
      required: false
      description: Start of the window, ISO 8601 date or timestamp. Defaults to 1 day ago.
      schema: { type: string, example: "2026-07-27" }
    DateTo:
      name: date_to
      in: query
      required: false
      description: End of the window (inclusive day), ISO 8601. Defaults to now.
      schema: { type: string, example: "2026-08-03" }
    Sample:
      name: sample
      in: query
      required: false
      description: >
        Keep a deterministic 1/N of events. Rates and coverage stay unbiased;
        counts become counts of the sample and are not scaled up. Use for wide
        windows on high-volume events — `sample=10` handles 7 days of a 300k-event
        event name.
      schema: { type: integer, minimum: 1, maximum: 1000, default: 1, example: 10 }
  responses:
    Unauthorized:
      description: Missing or invalid key, or an `ak_` key with no location bound.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AgencyRequired:
      description: "`agency_required` — writes need an agency key (`ak_`), not a location secret key."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: "`rate_limited` — 30 report reads/min per location (120/min for contract CRUD)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    PropertySpec:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [string, number, boolean, object, array]
          description: >
            JSON type on the wire. `null` is not declarable — it is an observed
            state, reported as `null_values`.
        required:
          type: boolean
          default: true
          description: When true, an event missing this key is a `missing_required` violation.
    MinDailyEvents:
      type: integer
      nullable: true
      minimum: 1
      example: 100
      description: >
        Declared minimum events per day for this event name. Below it, the report
        adds a `low_volume` violation. `null` or omitted means the check is off.


        Compared against the **unsampled** reference count and only over an exact
        whole-day window (pass both `date_from` and `date_to`) — a volume
        threshold checked against a sampled scan, or against the fuzzy default
        window, fires on healthy traffic. When either is missing the check is
        skipped and says so under the event's `warnings`, never as a violation.


        This is what makes alerting possible without a volume-baseline engine:
        the threshold is declared rather than inferred.
    StoredContract:
      type: object
      properties:
        event: { type: string, example: order_completed }
        properties:
          type: object
          additionalProperties: { $ref: "#/components/schemas/PropertySpec" }
        note: { type: string, nullable: true }
        min_daily_events: { $ref: "#/components/schemas/MinDailyEvents" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Window:
      type: object
      properties:
        date_from: { type: string, example: "last 1 day" }
        date_to: { type: string, example: now }
        sample:
          type: object
          description: Present only when sampling was applied.
          properties:
            keeping: { type: string, example: 1/10 of events }
            note: { type: string }
    EventReport:
      type: object
      properties:
        event: { type: string, example: order_completed }
        status:
          type: string
          enum: [ok, violations, no_data]
          description: "`no_data` means the event had no traffic in the window — not that its fields are missing."
        total_events:
          type: integer
          example: 1000
          description: Events scanned for properties. Counts of the sample when `sample` is set.
        reference_events:
          type: integer
          nullable: true
          example: 1000
          description: >
            The same event's count in the same window from a separate,
            **unsampled** pre-aggregated source. Reported alongside
            `total_events` rather than replacing it: when the two disagree, that
            disagreement is the signal (sampling, or late-arriving data). `null`
            when the reference read was unavailable.
        no_data_reason:
          type: string
          enum: [no_events_at_all, event_not_firing, sampled_out, source_disagreement, unknown]
          description: >
            Present only on `status: "no_data"`, and the reason that status is
            worth acting on. `no_events_at_all` — the location sent nothing of
            any name, so this is a tracking outage, not a contract problem.
            `event_not_firing` — traffic is alive but this event name is absent,
            the tagging bug worth paging for. `sampled_out` — the reference sees
            the event but `sample` dropped it; re-run without sampling.
            `source_disagreement` — unsampled, and the reference sees events the
            property scan did not, usually late arrival. `unknown` — the
            reference read failed, so none of the above can be distinguished.
        detail:
          type: string
          description: Present alongside `no_data_reason`; plain-English version of it.
        warnings:
          type: array
          items: { type: string }
          description: >
            Checks that were SKIPPED and why — currently only
            `min_daily_events` when it lacks an unsampled reference count or an
            exact whole-day window. Present only when non-empty. A skipped check
            is never reported as a violation: a configuration gap must not read
            as broken data.
        properties:
          type: array
          items:
            type: object
            properties:
              key: { type: string, example: value }
              expected_type: { type: string, example: number }
              required: { type: boolean, example: true }
              present:
                type: integer
                example: 700
                description: Events carrying the key with any non-null type — including the wrong type.
              absent: { type: integer, example: 200, description: "`total_events` minus everything seen." }
              null_values: { type: integer, example: 100 }
              type_mismatches: { type: integer, example: 150 }
              coverage: { type: number, nullable: true, example: 0.7 }
              observed_types:
                type: object
                description: Counts per observed type, excluding the declared one.
                additionalProperties: { type: integer }
        violations:
          type: array
          description: Worst first, by count.
          items:
            type: object
            properties:
              key:
                type: string
                nullable: true
                example: value
                description: The property. `null` for `low_volume`, whose subject is the event itself.
              kind:
                type: string
                enum: [missing_required, null_value, type_mismatch, low_volume]
                description: >
                  The first three are property violations and carry a `samples`
                  link. `low_volume` does not — its offence is the absence of
                  events, so there is nothing to sample.
              count: { type: integer, example: 200 }
              rate: { type: number, nullable: true, example: 0.2 }
              detail: { type: string, example: "`value` is absent on 200 of 1000 events" }
              samples:
                type: string
                example: "/client/v1/contracts/samples?event=order_completed&key=value&kind=missing_required"
                description: >
                  Ready-to-call drill-down for this violation, carrying this
                  report's window. Call it to see the actual offending events.
              samples_note:
                type: string
                description: Present only when the report was sampled — the drill-down is not.
        undeclared:
          type: array
          description: Observed keys with no declaration. Never violations — this is the scaffold for the next contract version.
          items:
            type: object
            properties:
              key: { type: string, example: shipping_tier }
              observed_type: { type: string, example: string }
              occurrences: { type: integer, example: 300 }
              coverage: { type: number, nullable: true, example: 0.3 }
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: window_too_large }
            message: { type: string }
            cause: { type: string }
